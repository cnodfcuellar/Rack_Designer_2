<svg xmlns="http://www.w3.org/2000/svg" width="240" height="48" viewBox="0 0 240 48">
  <defs>
    <linearGradient id="ups2uChassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1916"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <style>
      @keyframes upsPulse2u { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; filter: drop-shadow(0 0 2px #10b981); } }
      .ups2u-on { animation: upsPulse2u 2.5s infinite; }
      @keyframes battCharge { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
      .batt-led { animation: battCharge 1.8s infinite; }
    </style>
  </defs>
  <rect x="0" y="0" width="240" height="48" rx="2" fill="url(#ups2uChassis)" stroke="#443a2b" stroke-width="1"/>
  <!-- Orejas 2U -->
  <rect x="0" y="0" width="12" height="48" fill="#29231b" stroke="#3d3428"/>
  <circle cx="6" cy="12" r="2.5" fill="#080c14" stroke="#5c4e3c"/>
  <circle cx="6" cy="36" r="2.5" fill="#080c14" stroke="#5c4e3c"/>
  <rect x="228" y="0" width="12" height="48" fill="#29231b" stroke="#3d3428"/>
  <circle cx="234" cy="12" r="2.5" fill="#080c14" stroke="#5c4e3c"/>
  <circle cx="234" cy="36" r="2.5" fill="#080c14" stroke="#5c4e3c"/>
  <!-- Display LCD Digital (Izquierda/Centro) -->
  <rect x="18" y="6" width="130" height="20" rx="2" fill="#071220" stroke="#1d4ed8" stroke-width="0.8"/>
  <text x="24" y="14" font-family="'Consolas', monospace" font-size="6" font-weight="bold" fill="#38bdf8">ONLINE UPS 3000VA · PURE SINE</text>
  <text x="24" y="21" font-family="'Consolas', monospace" font-size="5" fill="#93c5fd">IN: 230V │ OUT: 230V │ BATT: 100% │ LOAD: 38%</text>
  <!-- Barra de estado / LEDs -->
  <circle class="ups2u-on" cx="156" cy="11" r="2" fill="#10b981"/>
  <circle class="batt-led" cx="156" cy="18" r="1.5" fill="#38bdf8"/>
  <circle cx="156" cy="24" r="1.5" fill="#ef4444" opacity="0.3"/>
  <!-- Módulo de Baterías Hot-Swap Inferior (Bandeja 2U) -->
  <rect x="18" y="29" width="144" height="14" rx="1" fill="#12100e" stroke="#2e271d" stroke-width="0.8"/>
  <line x1="18" y1="36" x2="162" y2="36" stroke="#241e17" stroke-width="1"/>
  <rect x="24" y="32" width="16" height="8" rx="1" fill="#1f1a14" stroke="#443a2b" stroke-width="0.5"/>
  <rect x="44" y="32" width="16" height="8" rx="1" fill="#1f1a14" stroke="#443a2b" stroke-width="0.5"/>
  <rect x="64" y="32" width="16" height="8" rx="1" fill="#1f1a14" stroke="#443a2b" stroke-width="0.5"/>
  <rect x="84" y="32" width="16" height="8" rx="1" fill="#1f1a14" stroke="#443a2b" stroke-width="0.5"/>
  <text x="108" y="38" font-family="'Consolas', monospace" font-size="5" fill="#786650">BATTERY PACK · 4x 12V 9Ah</text>
  <!-- Tomas frontales / breaker derecho -->
  <g fill="#0c1017" stroke="#64748b" stroke-width="0.8">
    <rect x="174" y="8" width="14" height="14" rx="2"/>
    <rect x="192" y="8" width="14" height="14" rx="2"/>
    <rect x="210" y="8" width="14" height="14" rx="2"/>
    <rect x="174" y="27" width="14" height="14" rx="2"/>
    <rect x="192" y="27" width="14" height="14" rx="2"/>
    <rect x="210" y="27" width="14" height="14" rx="2"/>
  </g>
</svg>
