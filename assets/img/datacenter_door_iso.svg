<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Sombra suave en el suelo -->
    <filter id="shadowDoor" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
    <!-- Vidrio templado cian del datacenter -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- SOMBRA BASE EN EL SUELO -->
  <polygon points="70,330 200,255 330,330 200,405" fill="#000000" opacity="0.12"/>

  <!-- ======================================================== -->
  <!-- 1. MARCO EXTERIOR DE SEGURIDAD (Acero y Concreto)         -->
  <!-- ======================================================== -->
  <g id="door-frame" filter="url(#shadowDoor)">
    <!-- Base inferior del marco / Umbral en el suelo -->
    <polygon points="120,295 140,283 260,352 240,364" fill="#1e293b"/>

    <!-- Columna Izquierda del marco -->
    <polygon points="120,95 140,83 140,283 120,295" fill="#334155"/>
    <polygon points="120,95 125,92 125,292 120,295" fill="#475569"/>

    <!-- Viga Superior / Dintel del marco -->
    <polygon points="120,95 240,164 240,180 120,111" fill="#1e293b"/>
    <polygon points="120,95 140,83 260,152 240,164" fill="#334155"/>

    <!-- Columna Derecha del marco -->
    <polygon points="240,164 260,152 260,352 240,364" fill="#0f172a"/>
    <polygon points="235,178 240,175 240,364 235,367" fill="#1e293b"/>

    <!-- Sensor superior de presencia / Barra de luz infrarroja -->
    <polygon points="170,128 200,145 200,152 170,135" fill="#0f172a"/>
    <circle cx="185" cy="140" r="1.5" fill="#22c55e"/>
  </g>

  <!-- ======================================================== -->
  <!-- 2. HOJA DE PUERTA DE CRISTAL (SEMI-ABIERTA A 45°)         -->
  <!-- ======================================================== -->
  <!-- Hoja girada hacia el exterior que se comprende al instante -->
  <g id="door-leaf" filter="url(#shadowDoor)">
    <!-- Marco de aluminio oscuro de la puerta -->
    <polygon points="140,90 200,155 200,345 140,280" fill="#0f172a"/>

    <!-- PANEL DE VIDRIO TEMPLADO CIAN TRANSLÚCIDO -->
    <polygon points="148,105 192,152 192,330 148,283" fill="url(#glassGrad)"/>

    <!-- Reflejos diagonales de cristal en la puerta -->
    <polygon points="155,120 180,105 165,300 148,300" fill="#ffffff" opacity="0.3"/>
    <polygon points="175,150 188,140 188,260 175,270" fill="#ffffff" opacity="0.2"/>

    <!-- BARRA ANTIPÁNICO / MANIJA TUBULAR DE ACERO INOXIDABLE -->
    <line x1="160" y1="210" x2="190" y2="242" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="160" y1="210" x2="190" y2="242" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ======================================================== -->
  <!-- 3. CONTROL DE ACCESO BIOMÉTRICO / TECLADO RFID (DERECHA) -->
  <!-- ======================================================== -->
  <g id="access-reader" transform="translate(262, 230)" filter="url(#shadowDoor)">
    <!-- Base del panel lector montado en la pared -->
    <polygon points="0,0 16,9 16,36 0,27" fill="#0f172a"/>
    <polygon points="0,0 6,-3 22,6 16,9" fill="#334155"/>
    <polygon points="16,9 22,6 22,33 16,36" fill="#1e293b"/>

    <!-- Pantalla / Sensor con LED de acceso verde -->
    <ellipse cx="8" cy="11" rx="4" ry="2.5" fill="#22c55e"/>
    <ellipse cx="8" cy="11" rx="2" ry="1.2" fill="#86efac"/>

    <!-- Teclado de números / RFID estilizado en blanco -->
    <circle cx="5" cy="18" r="1" fill="#ffffff"/>
    <circle cx="11" cy="21" r="1" fill="#ffffff"/>
    <circle cx="5" cy="23" r="1" fill="#ffffff"/>
    <circle cx="11" cy="26" r="1" fill="#ffffff"/>
  </g>
</svg>
