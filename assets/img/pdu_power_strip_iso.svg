<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#040914" flood-opacity="0.32"/>
    </filter>
  </defs>

  <path d="M 160 340 L 220 305 L 260 330 L 200 365 Z" fill="#000000" opacity="0.14"/>

  <!-- BARRA DE DISTRIBUCIÓN ELÉCTRICA VERTICAL (0U PDU) -->
  <g id="pdu-unit" filter="url(#shadow)">
    <!-- Cara Superior del Cabezal -->
    <polygon points="180,60 215,40 235,52 200,72" fill="#334155"/>
    <!-- Cara Frontal Izquierda (Con Tomas IEC C13 / C19) -->
    <polygon points="180,60 200,72 200,340 180,328" fill="#151d28"/>
    <!-- Cara Lateral Derecha -->
    <polygon points="200,72 235,52 235,320 200,340" fill="#1e2735"/>

    <!-- Disyuntor Térmico / Interruptor Principal (Rojo) -->
    <polygon points="183,75 197,83 197,93 183,85" fill="#ef4444"/>
    <circle cx="190" cy="84" r="1.5" fill="#ffffff"/>

    <!-- Display Digital de Amperaje (LED 7 segmentos verde/azul) -->
    <polygon points="183,100 197,108 197,120 183,112" fill="#0284c7"/>
    <path d="M 186 107 L 194 112" stroke="#ffffff" stroke-width="1.8"/>

    <!-- TOMA IEC 1 (Superior) -->
    <g transform="translate(0, 45)">
      <polygon points="184,90 196,97 196,108 184,101" fill="#0f172a"/>
      <!-- Conectores C13 hembra -->
      <circle cx="190" cy="97" r="1" fill="#e2e8f0"/>
      <circle cx="187" cy="101" r="1" fill="#e2e8f0"/>
      <circle cx="193" cy="103" r="1" fill="#e2e8f0"/>
    </g>

    <!-- TOMA IEC 2 -->
    <g transform="translate(0, 75)">
      <polygon points="184,90 196,97 196,108 184,101" fill="#0f172a"/>
      <circle cx="190" cy="97" r="1" fill="#e2e8f0"/>
      <circle cx="187" cy="101" r="1" fill="#e2e8f0"/>
      <circle cx="193" cy="103" r="1" fill="#e2e8f0"/>
    </g>

    <!-- TOMA IEC 3 -->
    <g transform="translate(0, 105)">
      <polygon points="184,90 196,97 196,108 184,101" fill="#0f172a"/>
      <circle cx="190" cy="97" r="1" fill="#e2e8f0"/>
      <circle cx="187" cy="101" r="1" fill="#e2e8f0"/>
      <circle cx="193" cy="103" r="1" fill="#e2e8f0"/>
    </g>

    <!-- TOMA IEC 4 -->
    <g transform="translate(0, 135)">
      <polygon points="184,90 196,97 196,108 184,101" fill="#0f172a"/>
      <circle cx="190" cy="97" r="1" fill="#e2e8f0"/>
      <circle cx="187" cy="101" r="1" fill="#e2e8f0"/>
      <circle cx="193" cy="103" r="1" fill="#e2e8f0"/>
    </g>

    <!-- TOMA IEC 5 (Inferior) -->
    <g transform="translate(0, 165)">
      <polygon points="184,90 196,97 196,108 184,101" fill="#0f172a"/>
      <circle cx="190" cy="97" r="1" fill="#e2e8f0"/>
      <circle cx="187" cy="101" r="1" fill="#e2e8f0"/>
      <circle cx="193" cy="103" r="1" fill="#e2e8f0"/>
    </g>

    <!-- Cable Industrial de Entrada Trifásica (Inferior Grueso) -->
    <path d="M 190 334 C 190 360, 240 365, 270 345" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
