<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="12" stdDeviation="10" flood-color="#040914" flood-opacity="0.35"/>
    </filter>
  </defs>

  <path d="M 120 280 L 220 220 L 300 265 L 200 325 Z" fill="#000000" opacity="0.14"/>

  <!-- SERVIDOR NAS DE ALMACENAMIENTO (TORRE 4 BAHÍAS HOT-SWAP) -->
  <g id="nas-tower" filter="url(#shadow)">
    <!-- Cara Superior -->
    <polygon points="120,130 190,90 260,130 190,170" fill="#2d3748"/>
    <!-- Cara Frontal Izquierda -->
    <polygon points="120,130 190,170 190,290 120,250" fill="#141c28"/>
    <!-- Cara Lateral Derecha -->
    <polygon points="190,170 260,130 260,250 190,290" fill="#1c2533"/>

    <!-- BOTÓN DE ENCENDIDO Y STATUS LEDS -->
    <circle cx="132" cy="148" r="3" fill="#38bdf8"/>
    <circle cx="140" cy="153" r="2" fill="#22c55e"/> <!-- Status -->
    <circle cx="148" cy="158" r="2" fill="#22c55e"/> <!-- LAN -->

    <!-- BAHÍAS DE DISCOS DUROS (HOT-SWAP 1 AL 4) -->
    <!-- Bahía 1 -->
    <polygon points="135,160 180,185 180,205 135,180" fill="#243042"/>
    <polygon points="138,164 177,186 177,192 138,170" fill="#0f172a"/>
    <circle cx="144" cy="174" r="1.5" fill="#22c55e"/>
    <polygon points="160,186 172,193 172,198 160,191" fill="#475569"/> <!-- Pestillo -->

    <!-- Bahía 2 -->
    <polygon points="135,185 180,210 180,230 135,205" fill="#243042"/>
    <polygon points="138,189 177,211 177,217 138,195" fill="#0f172a"/>
    <circle cx="144" cy="199" r="1.5" fill="#22c55e"/>
    <polygon points="160,211 172,218 172,223 160,216" fill="#475569"/>

    <!-- Bahía 3 -->
    <polygon points="135,210 180,235 180,255 135,230" fill="#243042"/>
    <polygon points="138,214 177,236 177,242 138,220" fill="#0f172a"/>
    <circle cx="144" cy="224" r="1.5" fill="#22c55e"/>
    <polygon points="160,236 172,243 172,248 160,241" fill="#475569"/>

    <!-- Bahía 4 -->
    <polygon points="135,235 180,260 180,280 135,255" fill="#243042"/>
    <polygon points="138,239 177,261 177,267 138,245" fill="#0f172a"/>
    <circle cx="144" cy="249" r="1.5" fill="#22c55e"/>
    <polygon points="160,261 172,268 172,273 160,266" fill="#475569"/>

    <!-- Rejilla de ventilación del ventilador trasero (Cara Derecha) -->
    <ellipse cx="225" cy="205" rx="18" ry="25" fill="#0f172a" transform="rotate(30 225 205)"/>
  </g>
</svg>
