<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Sombra proyectada suave -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="12" stdDeviation="9" flood-color="#040914" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- SOMBRA BASE ISOMÉTRICA EN EL SUELO -->
  <path d="M 120 280 L 220 220 L 320 280 L 220 340 Z" fill="#000000" opacity="0.14"/>

  <!-- ========================================== -->
  <!-- RACK / GABINETE DE SERVIDORES ISOMÉTRICO   -->
  <!-- ========================================== -->
  <g id="server-rack" filter="url(#shadow)">
    <!-- TECHO DEL RACK (Cara Superior) -->
    <!-- Coordenadas: Left-top (120, 110), Back-top (220, 50), Right-top (320, 110), Front-top (220, 170) -->
    <polygon points="120,110 220,50 320,110 220,170" fill="#2d3748"/>

    <!-- Bisel interior del techo (Bandeja superior / Salida de cables) -->
    <polygon points="140,110 220,62 300,110 220,158" fill="#1a202c"/>

    <!-- LATERAL DERECHO DEL GABINETE (Panel Sólido Sombra Media) -->
    <polygon points="220,170 320,110 320,280 220,340" fill="#18202c"/>

    <!-- LATERAL IZQUIERDO TRASERO / MARCO -->
    <polygon points="120,110 220,170 220,340 120,280" fill="#10151f"/>

    <!-- ========================================== -->
    <!-- BAHÍAS DE SERVIDORES INTERNAS (SLOTS U)    -->
    <!-- ========================================== -->
    <!-- Servidor U1 (Superior) -->
    <g transform="translate(0, 0)">
      <polygon points="125,120 215,174 215,190 125,136" fill="#1e293b"/>
      <!-- Bisel frontal con LEDs -->
      <polygon points="130,126 210,174 210,186 130,138" fill="#0f172a"/>
      <circle cx="140" cy="135" r="2" fill="#22c55e"/>
      <circle cx="146" cy="138" r="1.5" fill="#38bdf8"/>
      <!-- Ranuras de ventilación -->
      <path d="M 160 148 L 200 172 M 160 152 L 200 176" stroke="#475569" stroke-width="1.8"/>
    </g>

    <!-- Servidor U2 -->
    <g transform="translate(0, 24)">
      <polygon points="125,120 215,174 215,190 125,136" fill="#1e293b"/>
      <polygon points="130,126 210,174 210,186 130,138" fill="#0f172a"/>
      <circle cx="140" cy="135" r="2" fill="#22c55e"/>
      <circle cx="146" cy="138" r="1.5" fill="#22c55e"/>
      <path d="M 160 148 L 200 172 M 160 152 L 200 176" stroke="#475569" stroke-width="1.8"/>
    </g>

    <!-- Servidor U3 -->
    <g transform="translate(0, 48)">
      <polygon points="125,120 215,174 215,190 125,136" fill="#1e293b"/>
      <polygon points="130,126 210,174 210,186 130,138" fill="#0f172a"/>
      <circle cx="140" cy="135" r="2" fill="#38bdf8"/>
      <circle cx="146" cy="138" r="1.5" fill="#ef4444"/>
      <path d="M 160 148 L 200 172 M 160 152 L 200 176" stroke="#475569" stroke-width="1.8"/>
    </g>

    <!-- Servidor U4 (Base SAN / Almacenamiento Pesado 2U) -->
    <g transform="translate(0, 72)">
      <polygon points="125,120 215,174 215,205 125,151" fill="#1e293b"/>
      <polygon points="130,126 210,174 210,201 130,153" fill="#0f172a"/>
      <!-- Bahías de discos duros frontales -->
      <polygon points="135,134 165,152 165,162 135,144" fill="#334155"/>
      <polygon points="135,147 165,165 165,175 135,157" fill="#334155"/>
      <polygon points="172,156 202,174 202,184 172,166" fill="#334155"/>
      <polygon points="172,169 202,187 202,197 172,179" fill="#334155"/>
      <circle cx="140" cy="170" r="1.8" fill="#22c55e"/>
      <circle cx="146" cy="173" r="1.8" fill="#22c55e"/>
    </g>

    <!-- PUERTA FRONTAL ABIERTA A 90 GRADOS (Izquierda) -->
    <!-- Carcasa de la puerta batiente abierta -->
    <polygon points="65,150 120,117 120,287 65,320" fill="#1c2432"/>
    <polygon points="65,150 72,146 72,316 65,320" fill="#2a364a"/>
    <!-- Panel de rejilla/vidrio de la puerta -->
    <polygon points="75,160 115,136 115,274 75,298" fill="#0f172a"/>
    <path d="M 85 168 L 105 156 M 85 188 L 105 176 M 85 208 L 105 196 M 85 228 L 105 216 M 85 248 L 105 236 M 85 268 L 105 256" 
          stroke="#334155" stroke-width="2"/>
  </g>
</svg>
