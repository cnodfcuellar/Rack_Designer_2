<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#040914" flood-opacity="0.32"/>
    </filter>
  </defs>

  <path d="M 110 260 L 220 200 L 310 250 L 200 310 Z" fill="#000000" opacity="0.14"/>

  <!-- DECODIFICADOR DE VIDEO / TV / STREAMING (SET-TOP BOX) -->
  <g id="decoder-box" filter="url(#shadow)">
    <!-- Cara Superior (Negro piano / Sombra suave) -->
    <polygon points="110,210 220,150 310,200 200,260" fill="#1e293b"/>
    <!-- Cara Frontal Izquierda -->
    <polygon points="110,210 200,260 200,285 110,235" fill="#0f172a"/>
    <!-- Cara Lateral Derecha (Puertos HDMI / Audio) -->
    <polygon points="200,260 310,200 310,225 200,285" fill="#141c28"/>

    <!-- PANTALLA DIGITAL FRONTAL / DISPLAY DE CANAL (Verde/Cian) -->
    <polygon points="125,222 155,238 155,248 125,232" fill="#0284c7"/>
    <text x="135" y="242" font-size="8" font-family="monospace" font-weight="bold" fill="#ffffff" transform="rotate(30 135 242)">CH 04</text>

    <!-- RECEPTOR INFRARROJO (IR BLASTER) Y LED DE ESTADO -->
    <circle cx="168" cy="246" r="2.5" fill="#ef4444"/>
    <circle cx="178" cy="251" r="2" fill="#22c55e"/>

    <!-- LÍNEA DE BISEL LUMINOSO DECORATIVO -->
    <path d="M 115 228 L 195 272" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- PUERTOS HDMI Y SALIDAS DE AUDIO EN EL LATERAL DERECHO -->
    <polygon points="215,263 227,256 227,264 215,271" fill="#eab308"/> <!-- HDMI 1 -->
    <polygon points="235,252 247,245 247,253 235,260" fill="#eab308"/> <!-- HDMI 2 -->
    <circle cx="265" cy="235" r="2.5" fill="#cbd5e1"/> <!-- Jack Optical -->
  </g>
</svg>
