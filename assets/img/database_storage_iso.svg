<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Sombra proyectada suave -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="12" stdDeviation="10" flood-color="#040914" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- SOMBRA BASE ISOMÉTRICA EN EL SUELO -->
  <ellipse cx="200" cy="340" rx="95" ry="35" fill="#000000" opacity="0.14"/>

  <!-- ========================================== -->
  <!-- PILA 1: DISCOS DE BASE DE DATOS ROJO / CORAL (IZQUIERDA) -->
  <!-- ========================================== -->
  <g id="db-stack-red" transform="translate(130, 260)" filter="url(#shadow)">
    <!-- Disco 1 (Inferior) -->
    <path d="M -30 -10 C -30 6, 30 6, 30 -10 L 30 10 C 30 26, -30 26, -30 10 Z" fill="#e11d48"/>
    <ellipse cx="0" cy="-10" rx="30" ry="16" fill="#fb7185"/>

    <!-- Disco 2 (Medio) -->
    <path d="M -30 -30 C -30 -14, 30 -14, 30 -30 L 30 -10 C 30 6, -30 6, -30 -10 Z" fill="#e11d48"/>
    <ellipse cx="0" cy="-30" rx="30" ry="16" fill="#fb7185"/>

    <!-- Disco 3 (Superior) -->
    <path d="M -30 -50 C -30 -34, 30 -34, 30 -50 L 30 -30 C 30 -14, -30 -14, -30 -30 Z" fill="#e11d48"/>
    <ellipse cx="0" cy="-50" rx="30" ry="16" fill="#fda4af"/>
    <!-- LED / Indicador de lectura de disco -->
    <ellipse cx="12" cy="-45" rx="3" ry="1.8" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- ========================================== -->
  <!-- PILA 2: DISCOS DE BASE DE DATOS AZUL MARINO (CENTRO) -->
  <!-- ========================================== -->
  <g id="db-stack-navy" transform="translate(195, 290)" filter="url(#shadow)">
    <!-- Disco 1 (Inferior) -->
    <path d="M -32 -10 C -32 6, 32 6, 32 -10 L 32 10 C 32 26, -32 26, -32 10 Z" fill="#0f172a"/>
    <ellipse cx="0" cy="-10" rx="32" ry="17" fill="#1e293b"/>

    <!-- Disco 2 -->
    <path d="M -32 -30 C -32 -14, 32 -14, 32 -30 L 32 -10 C 32 6, -32 6, -32 -10 Z" fill="#0f172a"/>
    <ellipse cx="0" cy="-30" rx="32" ry="17" fill="#1e293b"/>

    <!-- Disco 3 -->
    <path d="M -32 -50 C -32 -34, 32 -34, 32 -50 L 32 -30 C 32 -14, -32 -14, -32 -30 Z" fill="#0f172a"/>
    <ellipse cx="0" cy="-50" rx="32" ry="17" fill="#1e293b"/>

    <!-- Disco 4 (Superior) -->
    <path d="M -32 -70 C -32 -54, 32 -54, 32 -70 L 32 -50 C 32 -34, -32 -34, -32 -50 Z" fill="#0f172a"/>
    <ellipse cx="0" cy="-70" rx="32" ry="17" fill="#334155"/>
    <ellipse cx="12" cy="-65" rx="3.5" ry="2" fill="#38bdf8"/>
  </g>

  <!-- ========================================== -->
  <!-- PILA 3: DISCOS DE BASE DE DATOS CIAN / TURQUESA (DERECHA) -->
  <!-- ========================================== -->
  <g id="db-stack-cyan" transform="translate(260, 260)" filter="url(#shadow)">
    <!-- Disco 1 (Inferior) -->
    <path d="M -30 -10 C -30 6, 30 6, 30 -10 L 30 10 C 30 26, -30 26, -30 10 Z" fill="#0e7490"/>
    <ellipse cx="0" cy="-10" rx="30" ry="16" fill="#06b6d4"/>

    <!-- Disco 2 -->
    <path d="M -30 -30 C -30 -14, 30 -14, 30 -30 L 30 -10 C 30 6, -30 6, -30 -10 Z" fill="#0e7490"/>
    <ellipse cx="0" cy="-30" rx="30" ry="16" fill="#06b6d4"/>

    <!-- Disco 3 (Superior) -->
    <path d="M -30 -50 C -30 -34, 30 -34, 30 -50 L 30 -30 C 30 -14, -30 -14, -30 -30 Z" fill="#0e7490"/>
    <ellipse cx="0" cy="-50" rx="30" ry="16" fill="#22d3ee"/>
    <ellipse cx="12" cy="-45" rx="3" ry="1.8" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
