<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#040914" flood-opacity="0.32"/>
    </filter>
  </defs>

  <path d="M 90 260 L 220 185 L 320 240 L 190 315 Z" fill="#000000" opacity="0.14"/>

  <!-- GRABADOR DE VIDEO EN RED (NVR CCTV 2U) -->
  <g id="nvr-unit" filter="url(#shadow)">
    <!-- Cara Superior -->
    <polygon points="90,195 220,120 320,175 190,250" fill="#2d3748"/>
    <!-- Cara Frontal Izquierda -->
    <polygon points="90,195 190,250 190,285 90,230" fill="#151d28"/>
    <!-- Cara Lateral Derecha (Puertos PoE traseros/laterales) -->
    <polygon points="190,250 320,175 320,210 190,285" fill="#1c2533"/>

    <!-- BOTÓN DE ENERGÍA Y LOGO CCTV -->
    <circle cx="106" cy="212" r="3" fill="#38bdf8"/>
    <circle cx="116" cy="217" r="2" fill="#ef4444"/> <!-- LED REC Grabando -->
    <circle cx="124" cy="221" r="2" fill="#22c55e"/> <!-- LED Red -->

    <!-- PUERTO USB FRONTAL PARA EXTRACCIÓN DE VIDEO -->
    <polygon points="103,222 112,227 112,233 103,228" fill="#475569"/>

    <!-- BAHÍAS DE DISCOS DUROS DE VIGILANCIA (SATA / WD PURPLE) -->
    <g transform="translate(30, 20)">
      <polygon points="105,200 150,225 150,238 105,213" fill="#0f172a"/>
      <polygon points="107,202 148,225 148,235 107,212" fill="#334155"/>
      <circle cx="112" cy="210" r="1.5" fill="#22c55e"/>
    </g>
    <g transform="translate(30, 36)">
      <polygon points="105,200 150,225 150,238 105,213" fill="#0f172a"/>
      <polygon points="107,202 148,225 148,235 107,212" fill="#334155"/>
      <circle cx="112" cy="210" r="1.5" fill="#22c55e"/>
    </g>

    <!-- BANCO DE PUERTOS PoE PARA CÁMARAS (Cara Derecha) -->
    <!-- 8 Puertos PoE integrados -->
    <path d="M 205,248 L 295,198" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-dasharray="5 3"/>
    <path d="M 205,248 L 295,198" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
  </g>
</svg>
