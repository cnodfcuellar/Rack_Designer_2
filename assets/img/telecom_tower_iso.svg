<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Sombra proyectada suave -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="12" stdDeviation="10" flood-color="#040914" flood-opacity="0.35"/>
    </filter>
    <!-- Brillo de las ondas Wi-Fi -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- SOMBRA BASE ISOMÉTRICA EN EL SUELO -->
  <polygon points="130,350 200,310 270,350 200,390" fill="#000000" opacity="0.15"/>

  <!-- ========================================== -->
  <!-- 1. ONDAS DE SEÑAL DE RADIO (SUPERIOR)      -->
  <!-- ========================================== -->
  <g id="signal-waves">
    <!-- Onda 1 (Inferior pequeña) -->
    <path d="M 175 75 A 35 35 0 0 1 225 75" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Onda 2 (Media) -->
    <path d="M 162 60 A 50 50 0 0 1 238 60" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Onda 3 (Superior grande) -->
    <path d="M 150 45 A 65 65 0 0 1 250 45" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Baliza Roja / Luz de Señalización Aeronáutica -->
    <circle cx="200" cy="88" r="4.5" fill="#ef4444"/>
    <circle cx="200" cy="88" r="2" fill="#fca5a5"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. MÁSTIL Y ANTENA SUPERIOR                -->
  <!-- ========================================== -->
  <g id="mast" filter="url(#shadow)">
    <!-- Barra vertical central de transmisión -->
    <line x1="200" y1="90" x2="200" y2="135" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="192" y1="120" x2="208" y2="120" stroke="#64748b" stroke-width="3"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. ESTRUCTURA METÁLICA RETICULADA (TORRE)  -->
  <!-- ========================================== -->
  <g id="tower-lattice" filter="url(#shadow)">
    <!-- Patas Principales de la Torre (Pirámide Truncada Isométrica) -->
    <!-- Pata Frontal -->
    <line x1="200" y1="135" x2="200" y2="350" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <!-- Pata Izquierda -->
    <line x1="200" y1="135" x2="135" y2="320" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <!-- Pata Derecha -->
    <line x1="200" y1="135" x2="265" y2="320" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>

    <!-- VIGAS HORIZONTALES POR NIVELES -->
    <!-- Nivel 1 (Superior) -->
    <line x1="185" y1="180" x2="200" y2="187" stroke="#475569" stroke-width="2.5"/>
    <line x1="200" y1="187" x2="215" y2="180" stroke="#1e293b" stroke-width="2.5"/>

    <!-- Nivel 2 -->
    <line x1="172" y1="225" x2="200" y2="238" stroke="#475569" stroke-width="3"/>
    <line x1="200" y1="238" x2="228" y2="225" stroke="#1e293b" stroke-width="3"/>

    <!-- Nivel 3 -->
    <line x1="158" y1="270" x2="200" y2="289" stroke="#475569" stroke-width="3.5"/>
    <line x1="200" y1="289" x2="242" y2="270" stroke="#1e293b" stroke-width="3.5"/>

    <!-- Nivel 4 (Base) -->
    <line x1="145" y1="315" x2="200" y2="340" stroke="#475569" stroke-width="4"/>
    <line x1="200" y1="340" x2="255" y2="315" stroke="#1e293b" stroke-width="4"/>

    <!-- CRUCETAS DIAGONALES RETICULADAS (X) -->
    <!-- Tramo 1 -->
    <line x1="200" y1="135" x2="185" y2="180" stroke="#64748b" stroke-width="1.8"/>
    <line x1="193" y1="150" x2="200" y2="187" stroke="#64748b" stroke-width="1.8"/>
    <line x1="200" y1="135" x2="215" y2="180" stroke="#334155" stroke-width="1.8"/>

    <!-- Tramo 2 -->
    <line x1="185" y1="180" x2="200" y2="238" stroke="#64748b" stroke-width="2"/>
    <line x1="200" y1="187" x2="172" y2="225" stroke="#64748b" stroke-width="2"/>
    <line x1="200" y1="187" x2="228" y2="225" stroke="#334155" stroke-width="2"/>
    <line x1="215" y1="180" x2="200" y2="238" stroke="#334155" stroke-width="2"/>

    <!-- Tramo 3 -->
    <line x1="172" y1="225" x2="200" y2="289" stroke="#64748b" stroke-width="2.2"/>
    <line x1="200" y1="238" x2="158" y2="270" stroke="#64748b" stroke-width="2.2"/>
    <line x1="200" y1="238" x2="242" y2="270" stroke="#334155" stroke-width="2.2"/>
    <line x1="228" y1="225" x2="200" y2="289" stroke="#334155" stroke-width="2.2"/>

    <!-- Tramo 4 (Base ancha) -->
    <line x1="158" y1="270" x2="200" y2="340" stroke="#64748b" stroke-width="2.5"/>
    <line x1="200" y1="289" x2="145" y2="315" stroke="#64748b" stroke-width="2.5"/>
    <line x1="200" y1="289" x2="255" y2="315" stroke="#334155" stroke-width="2.5"/>
    <line x1="242" y1="270" x2="200" y2="340" stroke="#334155" stroke-width="2.5"/>

    <!-- Zapatas de Anclaje de Concreto en el Suelo -->
    <polygon points="128,322 138,316 142,324 132,330" fill="#94a3b8"/>
    <polygon points="194,352 206,345 210,353 198,360" fill="#94a3b8"/>
    <polygon points="258,322 268,316 272,324 262,330" fill="#94a3b8"/>
  </g>
</svg>
