<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Sombra suave en el suelo -->
    <filter id="shadowPC" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
    <!-- Gradiente de pantalla activa -->
    <linearGradient id="pcScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- SOMBRA BASE EN EL SUELO -->
  <polygon points="50,290 200,205 350,290 200,375" fill="#000000" opacity="0.12"/>

  <!-- ======================================================== -->
  <!-- 1. TORRE / CASE (Lado derecho, robusto y bien proporcionado) -->
  <!-- ======================================================== -->
  <g id="tower" filter="url(#shadowPC)">
    <!-- Techo de la torre -->
    <polygon points="230,120 280,90 320,113 270,143" fill="#334155"/>
    <!-- Cara lateral derecha (sombra media) -->
    <polygon points="270,143 320,113 320,243 270,273" fill="#1e293b"/>
    <!-- Cara frontal izquierda (sombra oscura / frente del gabinete) -->
    <polygon points="230,120 270,143 270,273 230,250" fill="#0f172a"/>

    <!-- Bahías frontales superiores -->
    <polygon points="236,134 264,150 264,158 236,142" fill="#1e293b"/>
    <polygon points="236,146 264,162 264,170 236,154" fill="#1e293b"/>

    <!-- Botón de encendido circular con luz cian -->
    <ellipse cx="242" cy="177" rx="3" ry="2" fill="#38bdf8"/>
    <!-- LED de disco duro verde -->
    <ellipse cx="248" cy="181" rx="2" ry="1.2" fill="#22c55e"/>

    <!-- Rejilla frontal de ventilación inferior -->
    <path d="M 238 200 L 262 214 M 238 208 L 262 222 M 238 216 L 262 230 M 238 224 L 262 238" 
          stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ======================================================== -->
  <!-- 2. MONITOR SLIM (Lado izquierdo, con pie y bisel claro)   -->
  <!-- ======================================================== -->
  <g id="monitor" filter="url(#shadowPC)">
    <!-- Base del pie en la mesa -->
    <polygon points="120,265 155,245 175,257 140,277" fill="#334155"/>
    <polygon points="120,265 140,277 140,282 120,270" fill="#1e293b"/>
    <polygon points="140,277 175,257 175,262 140,282" fill="#0f172a"/>

    <!-- Brazo / Columna de soporte -->
    <polygon points="144,235 152,230 152,255 144,260" fill="#1e293b"/>
    <polygon points="152,230 158,233 158,258 152,255" fill="#334155"/>

    <!-- CARCASA DEL MONITOR (Marco trasero y bordes) -->
    <!-- Borde superior -->
    <polygon points="70,110 180,47 186,51 76,114" fill="#334155"/>
    <!-- Borde lateral derecho -->
    <polygon points="180,47 186,51 186,174 180,170" fill="#1e293b"/>
    <!-- Marco frontal oscuro -->
    <polygon points="70,110 180,47 180,170 70,233" fill="#0f172a"/>

    <!-- PANTALLA LCD ACTIVA (Cian brillante homogéneo) -->
    <polygon points="76,115 174,59 174,162 76,218" fill="url(#pcScreenGrad)"/>

    <!-- Reflejo diagonal de cristal (estilo idéntico a la imagen) -->
    <polygon points="115,80 145,63 115,165 95,165" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- ======================================================== -->
  <!-- 3. TECLADO (Frente al monitor, plano y limpio)           -->
  <!-- ======================================================== -->
  <g id="keyboard" filter="url(#shadowPC)">
    <!-- Superficie del teclado -->
    <polygon points="110,275 195,226 220,240 135,289" fill="#1e293b"/>
    <!-- Borde frontal izquierdo -->
    <polygon points="110,275 135,289 135,294 110,280" fill="#0f172a"/>
    <!-- Borde frontal derecho -->
    <polygon points="135,289 220,240 220,245 135,294" fill="#0f172a"/>

    <!-- Bloques de teclas estilizadas en blanco (alto contraste y nitidez) -->
    <!-- Fila 1 -->
    <path d="M 120 270 L 195 227" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 3.5"/>
    <!-- Fila 2 -->
    <path d="M 124 274 L 199 231" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 3.5"/>
    <!-- Fila 3 -->
    <path d="M 128 278 L 203 235" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 3.5"/>
    <!-- Fila 4 con barra espaciadora -->
    <path d="M 132 282 L 175 257" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 3.5"/>
    <line x1="180" y1="254" x2="200" y2="242" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
