<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580">
  <defs>
    <style>
      .flow2 { animation: flow2 2s infinite linear; stroke-dasharray: 10 5; }
      @keyframes flow2 { from{stroke-dashoffset:30} to{stroke-dashoffset:0} }
      .blink-dot { animation: blinkDot 1.2s infinite; }
      @keyframes blinkDot { 0%,100%{opacity:1} 50%{opacity:0.15} }
    </style>
    <marker id="aB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#38bdf8"/>
    </marker>
    <marker id="aG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#10b981"/>
    </marker>
    <marker id="aP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#8b5cf6"/>
    </marker>
    <marker id="aA" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#f59e0b"/>
    </marker>
    <marker id="aR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ef4444"/>
    </marker>
    <marker id="aC" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#06b6d4"/>
    </marker>
    <filter id="glowStore">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="920" height="580" fill="#090d17" rx="18"/>
  <text x="460" y="34" text-anchor="middle" fill="#94a3b8" font-size="15" font-family="monospace" font-weight="bold">⚙️ Ciclo de Vida del Store — De la acción al guardado</text>
  <text x="460" y="52" text-anchor="middle" fill="#475569" font-size="10" font-family="monospace">Proxy ES6 intercepta cada mutación y persiste automáticamente en localStorage</text>

  <!-- ══ PASO 1: USUARIO ══ -->
  <rect x="18" y="72" width="140" height="80" rx="10" fill="#0f2a4a" stroke="#38bdf8" stroke-width="2" filter="url(#glowStore)"/>
  <text x="88" y="100" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">① USER</text>
  <text x="88" y="118" text-anchor="middle" fill="#93c5fd" font-size="10" font-family="monospace">Drag &amp; Drop</text>
  <text x="88" y="132" text-anchor="middle" fill="#93c5fd" font-size="10" font-family="monospace">Editar Modal</text>

  <!-- Flecha 1→2 -->
  <line x1="158" y1="112" x2="222" y2="112" stroke="#38bdf8" stroke-width="2" marker-end="url(#aB)" class="flow2"/>

  <!-- ══ PASO 2: snapshot() ══ -->
  <rect x="222" y="72" width="165" height="80" rx="10" fill="#1e1040" stroke="#8b5cf6" stroke-width="2"/>
  <text x="304" y="96" text-anchor="middle" fill="#a78bfa" font-size="12" font-family="monospace" font-weight="bold">② snapshot()</text>
  <text x="304" y="112" text-anchor="middle" fill="#7060a8" font-size="9.5" font-family="monospace">deepClone(_raw)</text>
  <text x="304" y="126" text-anchor="middle" fill="#7060a8" font-size="9.5" font-family="monospace">→ undoStack.push(clon)</text>
  <text x="304" y="140" text-anchor="middle" fill="#7060a8" font-size="9.5" font-family="monospace">redoStack = [ ]</text>

  <!-- Flecha 2 → undoStack (hacia abajo) -->
  <line x1="304" y1="152" x2="304" y2="192" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#aP)" stroke-dasharray="5,3"/>

  <!-- undoStack -->
  <rect x="222" y="192" width="165" height="110" rx="8" fill="#130d2e" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="304" y="212" text-anchor="middle" fill="#7c3aed" font-size="11" font-family="monospace" font-weight="bold">undoStack [ ]</text>
  <text x="304" y="228" text-anchor="middle" fill="#3a2a6a" font-size="9.5" font-family="monospace">max 30 snapshots en RAM</text>
  <rect x="234" y="236" width="34" height="14" rx="2" fill="#1e1040" stroke="#4a3a8a" stroke-width="0.8"/>
  <rect x="274" y="236" width="34" height="14" rx="2" fill="#1e1040" stroke="#4a3a8a" stroke-width="0.8"/>
  <rect x="314" y="236" width="34" height="14" rx="2" fill="#2a1a5a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="331" y="247" text-anchor="middle" fill="#a78bfa" font-size="8" font-family="monospace">NEW</text>
  <circle cx="264" cy="243" r="3" fill="#3a3a3a" class="blink-dot"/>
  <circle cx="304" cy="243" r="3" fill="#3a3a3a" class="blink-dot"/>

  <text x="304" y="272" text-anchor="middle" fill="#3a2a6a" font-size="9" font-family="monospace">Ctrl+Z → undo() restaura</text>
  <text x="304" y="286" text-anchor="middle" fill="#3a2a6a" font-size="9" font-family="monospace">Ctrl+Y → redo() avanza</text>
  <text x="304" y="300" text-anchor="middle" fill="#3a2a6a" font-size="9" font-family="monospace">Max 30, luego .shift() borra el más viejo</text>

  <!-- Flecha 2→3 -->
  <line x1="387" y1="112" x2="451" y2="112" stroke="#38bdf8" stroke-width="2" marker-end="url(#aB)" class="flow2"/>

  <!-- ══ PASO 3: Mutación _raw ══ -->
  <rect x="451" y="72" width="185" height="80" rx="10" fill="#0f2a1a" stroke="#10b981" stroke-width="2"/>
  <text x="543" y="96" text-anchor="middle" fill="#10b981" font-size="12" font-family="monospace" font-weight="bold">③ Mutación _raw</text>
  <text x="543" y="112" text-anchor="middle" fill="#3d7059" font-size="9.5" font-family="monospace">dev.rackId = newRackId</text>
  <text x="543" y="126" text-anchor="middle" fill="#3d7059" font-size="9.5" font-family="monospace">_raw.devices.push(newDev)</text>
  <text x="543" y="140" text-anchor="middle" fill="#3d7059" font-size="9.5" font-family="monospace">Object.assign(rack, props)</text>

  <!-- Flecha 3 → Proxy (hacia abajo) -->
  <line x1="543" y1="152" x2="543" y2="192" stroke="#10b981" stroke-width="1.5" marker-end="url(#aG)" class="flow2"/>

  <!-- ══ Proxy ES6 ══ -->
  <rect x="451" y="192" width="185" height="130" rx="8" fill="#0a1f14" stroke="#10b981" stroke-width="1.8"/>
  <text x="543" y="214" text-anchor="middle" fill="#10b981" font-size="12" font-family="monospace" font-weight="bold">🛡 Proxy ES6</text>
  <text x="543" y="230" text-anchor="middle" fill="#2a5a3a" font-size="9" font-family="monospace">set(target, key, value) {</text>
  <text x="543" y="246" text-anchor="middle" fill="#3d7059" font-size="9" font-family="monospace">  target[key] = value;</text>
  <text x="543" y="262" text-anchor="middle" fill="#4a9a70" font-size="9" font-family="monospace">  this._save();   ← AUTOMÁTICO</text>
  <text x="543" y="278" text-anchor="middle" fill="#4a9a70" font-size="9" font-family="monospace">  this._emit('change');</text>
  <text x="543" y="294" text-anchor="middle" fill="#2a5a3a" font-size="9" font-family="monospace">}</text>
  <text x="543" y="312" text-anchor="middle" fill="#1a3a28" font-size="8.5" font-family="monospace">⚠ BUG-04: crea nuevo Proxy en cada get (memory leak)</text>

  <!-- Flecha Proxy → _save() -->
  <line x1="636" y1="257" x2="686" y2="257" stroke="#10b981" stroke-width="1.5" marker-end="url(#aG)" class="flow2"/>

  <!-- ══ PASO 4: _save() ══ -->
  <rect x="686" y="192" width="210" height="130" rx="8" fill="#1a1200" stroke="#f59e0b" stroke-width="2"/>
  <text x="791" y="216" text-anchor="middle" fill="#f59e0b" font-size="12" font-family="monospace" font-weight="bold">④ _save()</text>
  <text x="791" y="234" text-anchor="middle" fill="#6a4a00" font-size="9" font-family="monospace">localStorage.setItem(</text>
  <text x="791" y="250" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">  'RACK_DESIGNER_STATE',</text>
  <text x="791" y="266" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">  JSON.stringify(_raw)</text>
  <text x="791" y="282" text-anchor="middle" fill="#6a4a00" font-size="9" font-family="monospace">)</text>
  <text x="791" y="300" text-anchor="middle" fill="#4a3000" font-size="8.5" font-family="monospace">Ocurre tras CADA mutación.</text>
  <text x="791" y="314" text-anchor="middle" fill="#4a3000" font-size="8.5" font-family="monospace">En hot paths: memory leak por Proxy</text>

  <!-- Flecha _emit → renderAll (hacia abajo desde Proxy) -->
  <line x1="543" y1="322" x2="543" y2="372" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#aB)" class="flow2"/>

  <!-- ══ PASO 5: renderAll() ══ -->
  <rect x="350" y="372" width="385" height="68" rx="10" fill="#0f1d2e" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="542" y="398" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">⑤ _emit('change') → renderAll()</text>
  <text x="542" y="416" text-anchor="middle" fill="#3a5a7a" font-size="9.5" font-family="monospace">Notifica a todos los listeners de main.js</text>
  <text x="542" y="432" text-anchor="middle" fill="#3a5a7a" font-size="9.5" font-family="monospace">Decide qué renderizar según el campo source:</text>

  <!-- Sub-renders row -->
  <rect x="50" y="468" width="140" height="44" rx="8" fill="#0d1a2e" stroke="#6366f1" stroke-width="1.2"/>
  <text x="120" y="486" text-anchor="middle" fill="#818cf8" font-size="9.5" font-family="monospace" font-weight="bold">renderPhysical()</text>
  <text x="120" y="500" text-anchor="middle" fill="#3a3a7a" font-size="8.5" font-family="monospace">rack.js / faceplates.js</text>

  <rect x="207" y="468" width="140" height="44" rx="8" fill="#0d1a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="277" y="486" text-anchor="middle" fill="#fbbf24" font-size="9.5" font-family="monospace" font-weight="bold">renderRoomTabs()</text>
  <text x="277" y="500" text-anchor="middle" fill="#5a4a00" font-size="8.5" font-family="monospace">catalog.js</text>

  <rect x="364" y="468" width="140" height="44" rx="8" fill="#0d1a2e" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="434" y="486" text-anchor="middle" fill="#22d3ee" font-size="9.5" font-family="monospace" font-weight="bold">renderStats()</text>
  <text x="434" y="500" text-anchor="middle" fill="#1a5a6a" font-size="8.5" font-family="monospace">main.js</text>

  <rect x="521" y="468" width="150" height="44" rx="8" fill="#0d1a2e" stroke="#ef4444" stroke-width="1.2"/>
  <text x="596" y="486" text-anchor="middle" fill="#f87171" font-size="9.5" font-family="monospace" font-weight="bold">renderBottomPanel()</text>
  <text x="596" y="500" text-anchor="middle" fill="#5a1a1a" font-size="8.5" font-family="monospace">tables.js</text>

  <rect x="688" y="468" width="148" height="44" rx="8" fill="#0d1a2e" stroke="#10b981" stroke-width="1.2"/>
  <text x="762" y="486" text-anchor="middle" fill="#34d399" font-size="9.5" font-family="monospace" font-weight="bold">drawTopo() @60fps</text>
  <text x="762" y="500" text-anchor="middle" fill="#1a4a3a" font-size="8.5" font-family="monospace">topology.js rAF loop</text>

  <!-- Arrows renderAll → sub-renders -->
  <line x1="377" y1="440" x2="120" y2="468" stroke="#6366f1" stroke-width="1" marker-end="url(#aP)"/>
  <line x1="440" y1="440" x2="277" y2="468" stroke="#f59e0b" stroke-width="1" marker-end="url(#aA)"/>
  <line x1="543" y1="440" x2="434" y2="468" stroke="#06b6d4" stroke-width="1" marker-end="url(#aC)"/>
  <line x1="660" y1="440" x2="596" y2="468" stroke="#ef4444" stroke-width="1" marker-end="url(#aR)"/>
  <line x1="720" y1="440" x2="762" y2="468" stroke="#10b981" stroke-width="1" marker-end="url(#aG)"/>

  <!-- Caja de carga inicial (izquierda) -->
  <rect x="18" y="192" width="165" height="110" rx="8" fill="#0d1520" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="100" y="212" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold">Carga Inicial</text>
  <text x="100" y="230" text-anchor="middle" fill="#2a4a6a" font-size="9" font-family="monospace">new Store() {</text>
  <text x="100" y="246" text-anchor="middle" fill="#2a4a6a" font-size="9" font-family="monospace">  _raw = _load()</text>
  <text x="100" y="262" text-anchor="middle" fill="#2a4a6a" font-size="9" font-family="monospace">}</text>
  <text x="100" y="278" text-anchor="middle" fill="#1a3a5a" font-size="9" font-family="monospace">localStorage.getItem()</text>
  <text x="100" y="292" text-anchor="middle" fill="#1a3a5a" font-size="9" font-family="monospace">→ JSON.parse() || default</text>
  <line x1="100" y1="152" x2="100" y2="192" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aB)"/>

  <!-- Etiqueta de paso en fondo (watermark) -->
  <text x="88" y="545" text-anchor="middle" fill="#38bdf8" font-size="32" font-family="monospace" font-weight="bold" opacity="0.08">①</text>
  <text x="304" y="545" text-anchor="middle" fill="#8b5cf6" font-size="32" font-family="monospace" font-weight="bold" opacity="0.08">②</text>
  <text x="543" y="545" text-anchor="middle" fill="#10b981" font-size="32" font-family="monospace" font-weight="bold" opacity="0.08">③</text>
  <text x="791" y="545" text-anchor="middle" fill="#f59e0b" font-size="32" font-family="monospace" font-weight="bold" opacity="0.08">④</text>
</svg>
