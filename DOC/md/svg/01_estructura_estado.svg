<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560">
  <defs>
    <style>
      .pulse-border { animation: pulseBorder 2.5s infinite; }
      @keyframes pulseBorder { 0%,100%{stroke-opacity:1} 50%{stroke-opacity:0.35} }
      .flow-arrow { animation: flowAnim 1.8s infinite linear; stroke-dasharray: 8 4; }
      @keyframes flowAnim { from{stroke-dashoffset:24} to{stroke-dashoffset:0} }
    </style>
    <marker id="arr1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#10b981"/>
    </marker>
    <marker id="arrA" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#f59e0b"/>
    </marker>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d17"/>
    </linearGradient>
  </defs>

  <rect width="920" height="560" fill="url(#bg1)" rx="18"/>

  <!-- Título -->
  <text x="460" y="38" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="'Courier New',monospace" font-weight="bold">📦 store._raw — Estructura Completa del Estado JSON</text>
  <text x="460" y="58" text-anchor="middle" fill="#475569" font-size="11" font-family="monospace">RACK Designer 2 · Todo el proyecto vive en este único objeto JavaScript</text>

  <!-- ══ ROOMS ══ -->
  <rect x="20" y="76" width="190" height="155" rx="10" fill="#0c1929" stroke="#38bdf8" stroke-width="2" class="pulse-border"/>
  <rect x="20" y="76" width="190" height="28" rx="10" fill="#0a2a4a"/>
  <text x="115" y="95" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">🏢  rooms [ ]</text>
  <line x1="20" y1="104" x2="210" y2="104" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="32" y="122" fill="#64748b" font-size="9.5" font-family="monospace">id:    "a1b2c3d4"</text>
  <text x="32" y="138" fill="#64748b" font-size="9.5" font-family="monospace">name:  "Sala A: CDP"</text>
  <line x1="32" y1="146" x2="198" y2="146" stroke="#1e293b" stroke-width="0.8"/>
  <text x="32" y="162" fill="#4a5a78" font-size="9.5" font-family="monospace">id:    "d4e5f6g7"</text>
  <text x="32" y="178" fill="#4a5a78" font-size="9.5" font-family="monospace">name:  "Sala B: Backup"</text>
  <text x="115" y="218" text-anchor="middle" fill="#1e4a7a" font-size="9" font-family="monospace">← sala activa: currentRoomId</text>

  <!-- FK arrow ROOMS → RACKS -->
  <line x1="210" y1="146" x2="245" y2="146" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr1)" class="flow-arrow"/>
  <text x="226" y="139" text-anchor="middle" fill="#38bdf8" font-size="9" font-family="monospace">1:N</text>

  <!-- ══ RACKS ══ -->
  <rect x="245" y="76" width="205" height="175" rx="10" fill="#0c2018" stroke="#10b981" stroke-width="2" class="pulse-border"/>
  <rect x="245" y="76" width="205" height="28" rx="10" fill="#0a2a1a"/>
  <text x="347" y="95" text-anchor="middle" fill="#10b981" font-size="13" font-family="monospace" font-weight="bold">🗄️  racks [ ]</text>
  <line x1="245" y1="104" x2="450" y2="104" stroke="#10b981" stroke-width="0.8"/>
  <text x="257" y="122" fill="#64748b" font-size="9.5" font-family="monospace">id:      "rack001"</text>
  <text x="257" y="138" fill="#64748b" font-size="9.5" font-family="monospace">roomId:  "a1b2c3d4" ←FK</text>
  <text x="257" y="154" fill="#64748b" font-size="9.5" font-family="monospace">name:    "Rack Principal"</text>
  <text x="257" y="170" fill="#64748b" font-size="9.5" font-family="monospace">height:  24         (U)</text>
  <text x="257" y="186" fill="#64748b" font-size="9.5" font-family="monospace">color:   "#0ea5e9"</text>
  <line x1="257" y1="194" x2="438" y2="194" stroke="#1e293b" stroke-width="0.8"/>
  <text x="257" y="210" fill="#3a6a5a" font-size="9.5" font-family="monospace">id: "rack002" | roomId | ...</text>

  <!-- FK arrow RACKS → DEVICES -->
  <line x1="450" y1="146" x2="485" y2="146" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG)" class="flow-arrow"/>
  <text x="466" y="139" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace">1:N</text>

  <!-- ══ DEVICES ══ -->
  <rect x="485" y="55" width="220" height="265" rx="10" fill="#1a1300" stroke="#f59e0b" stroke-width="2" class="pulse-border"/>
  <rect x="485" y="55" width="220" height="28" rx="10" fill="#2a2000"/>
  <text x="595" y="74" text-anchor="middle" fill="#f59e0b" font-size="13" font-family="monospace" font-weight="bold">📦  devices [ ]</text>
  <line x1="485" y1="83" x2="705" y2="83" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="497" y="101" fill="#64748b" font-size="9.5" font-family="monospace">id:        "dev001"</text>
  <text x="497" y="117" fill="#64748b" font-size="9.5" font-family="monospace">rackId:    "rack001" ←FK</text>
  <text x="497" y="133" fill="#64748b" font-size="9.5" font-family="monospace">roomId:    null</text>
  <text x="497" y="149" fill="#f59e0b" font-size="9.5" font-family="monospace">category:  "rack" | "floor"</text>
  <text x="497" y="165" fill="#64748b" font-size="9.5" font-family="monospace">name:      "Switch Cisco 48P"</text>
  <text x="497" y="181" fill="#64748b" font-size="9.5" font-family="monospace">type:      "switch"</text>
  <text x="497" y="197" fill="#64748b" font-size="9.5" font-family="monospace">slotStart: 1   size: 1</text>
  <text x="497" y="213" fill="#64748b" font-size="9.5" font-family="monospace">mountSide: "front" | "rear"</text>
  <text x="497" y="229" fill="#64748b" font-size="9.5" font-family="monospace">ip / mac / serial</text>
  <text x="497" y="245" fill="#ef4444" font-size="9.5" font-family="monospace">user / pass  ← 🔴 texto plano</text>
  <text x="497" y="261" fill="#64748b" font-size="9.5" font-family="monospace">power / plugs / plugsOut</text>
  <text x="497" y="277" fill="#64748b" font-size="9.5" font-family="monospace">brand / model / notes</text>
  <text x="497" y="293" fill="#4a3800" font-size="9.5" font-family="monospace">floorX / floorY  (solo floor)</text>

  <!-- FK arrow DEVICES → CONNECTIONS -->
  <line x1="705" y1="165" x2="740" y2="165" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrA)" class="flow-arrow"/>
  <text x="721" y="158" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">N:M</text>

  <!-- ══ CONNECTIONS ══ -->
  <rect x="740" y="76" width="165" height="188" rx="10" fill="#1a0d2e" stroke="#8b5cf6" stroke-width="2" class="pulse-border"/>
  <rect x="740" y="76" width="165" height="28" rx="10" fill="#2a1040"/>
  <text x="822" y="95" text-anchor="middle" fill="#8b5cf6" font-size="13" font-family="monospace" font-weight="bold">🔌  connections</text>
  <line x1="740" y1="104" x2="905" y2="104" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="752" y="122" fill="#64748b" font-size="9.5" font-family="monospace">id:             "conn01"</text>
  <text x="752" y="138" fill="#64748b" font-size="9.5" font-family="monospace">sourceDeviceId  ←FK</text>
  <text x="752" y="154" fill="#64748b" font-size="9.5" font-family="monospace">sourcePort:     "Eth0/1"</text>
  <text x="752" y="170" fill="#64748b" font-size="9.5" font-family="monospace">targetDeviceId  ←FK</text>
  <text x="752" y="186" fill="#64748b" font-size="9.5" font-family="monospace">targetPort:     "Port1"</text>
  <text x="752" y="202" fill="#64748b" font-size="9.5" font-family="monospace">cableType:      "Fibra SM"</text>
  <text x="752" y="218" fill="#64748b" font-size="9.5" font-family="monospace">color:          "#ef4444"</text>
  <text x="752" y="234" fill="#4a1a7a" font-size="9.5" font-family="monospace">─ ─ ─ segundo registro ─ ─ ─</text>
  <text x="752" y="250" fill="#3a1060" font-size="9.5" font-family="monospace">sourceDeviceId / target...</text>

  <!-- ══ TOPOLOGY ══ -->
  <rect x="20" y="260" width="215" height="165" rx="10" fill="#0c1a2a" stroke="#06b6d4" stroke-width="2" class="pulse-border"/>
  <rect x="20" y="260" width="215" height="28" rx="10" fill="#0a2030"/>
  <text x="127" y="279" text-anchor="middle" fill="#06b6d4" font-size="13" font-family="monospace" font-weight="bold">🗺️  topology { }</text>
  <line x1="20" y1="288" x2="235" y2="288" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="32" y="306" fill="#64748b" font-size="9.5" font-family="monospace">nodePositions: {</text>
  <text x="42" y="322" fill="#4a7a8a" font-size="9.5" font-family="monospace">devId → {x, y}</text>
  <text x="32" y="338" fill="#64748b" font-size="9.5" font-family="monospace">rackPositions: { rackId→{x,y} }</text>
  <text x="32" y="354" fill="#64748b" font-size="9.5" font-family="monospace">rackSizes:     { rackId→{w,h} }</text>
  <text x="32" y="370" fill="#64748b" font-size="9.5" font-family="monospace">roomPositions: { roomId→{x,y} }</text>
  <text x="32" y="386" fill="#64748b" font-size="9.5" font-family="monospace">roomSizes:     { roomId→{w,h} }</text>
  <text x="127" y="414" text-anchor="middle" fill="#1a5a7a" font-size="9" font-family="monospace">Canvas 2D (topología visual)</text>

  <!-- ══ META / UI ══ -->
  <rect x="255" y="275" width="210" height="150" rx="10" fill="#1a0a1a" stroke="#f472b6" stroke-width="1.5"/>
  <rect x="255" y="275" width="210" height="28" rx="10" fill="#2a0a28"/>
  <text x="360" y="294" text-anchor="middle" fill="#f472b6" font-size="13" font-family="monospace" font-weight="bold">⚙️  meta / ui state</text>
  <line x1="255" y1="303" x2="465" y2="303" stroke="#f472b6" stroke-width="0.8"/>
  <text x="267" y="321" fill="#64748b" font-size="9.5" font-family="monospace">currentRoomId:    "a1b2c3"</text>
  <text x="267" y="337" fill="#64748b" font-size="9.5" font-family="monospace">selectedDeviceId: null</text>
  <text x="267" y="353" fill="#64748b" font-size="9.5" font-family="monospace">topoZoom:         1.0</text>
  <text x="267" y="369" fill="#64748b" font-size="9.5" font-family="monospace">topoPanX:         0</text>
  <text x="267" y="385" fill="#64748b" font-size="9.5" font-family="monospace">topoPanY:         0</text>
  <text x="360" y="413" text-anchor="middle" fill="#7a1a6a" font-size="9" font-family="monospace">Vista actual del canvas</text>

  <!-- ══ NOTAS ══ -->
  <rect x="487" y="340" width="418" height="180" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="696" y="362" text-anchor="middle" fill="#475569" font-size="12" font-family="monospace" font-weight="bold">📌 Notas de Diseño</text>
  <line x1="510" y1="370" x2="885" y2="370" stroke="#1e293b" stroke-width="0.6"/>

  <circle cx="506" cy="390" r="5" fill="#10b981"/>
  <text x="517" y="394" fill="#94a3b8" font-size="10.5" font-family="monospace">No hay base de datos. Todo vive en RAM.</text>

  <circle cx="506" cy="412" r="5" fill="#38bdf8"/>
  <text x="517" y="416" fill="#94a3b8" font-size="10.5" font-family="monospace">Persiste en localStorage bajo la clave:</text>
  <text x="517" y="432" fill="#38bdf8" font-size="10.5" font-family="monospace">  "RACK_DESIGNER_STATE"</text>

  <circle cx="506" cy="450" r="5" fill="#ef4444"/>
  <text x="517" y="454" fill="#94a3b8" font-size="10.5" font-family="monospace">user/pass se guardan SIN cifrado (BUG-01/02).</text>

  <circle cx="506" cy="472" r="5" fill="#f59e0b"/>
  <text x="517" y="476" fill="#94a3b8" font-size="10.5" font-family="monospace">Todas las FK son strings uid() base-36 de 8 chars.</text>

  <circle cx="506" cy="494" r="5" fill="#8b5cf6"/>
  <text x="517" y="498" fill="#94a3b8" font-size="10.5" font-family="monospace">devices puede estar en rack (rackId) o en piso (roomId).</text>
</svg>
