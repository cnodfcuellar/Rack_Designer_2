<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" style="background-color: #0f111a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="dragGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="modalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a855f7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.5">ESTRUCTURA Y FUNCIONAMIENTO DEL CATÁLOGO</text>
  <text x="475" y="50" text-anchor="middle" fill="#64748b" font-size="11">Flujo de datos de las plantillas de equipos, búsqueda y métodos de instalación</text>

  <!-- GRID / BACKGROUND AESTHETICS -->
  <rect x="15" y="70" width="920" height="460" rx="12" fill="#141721" stroke="#232733" stroke-width="1.5" />

  <!-- ==================== COLUMN 1: DATOS Y FILTRADO ==================== -->
  <g transform="translate(35, 90)">
    <rect x="0" y="0" width="260" height="420" rx="8" fill="#1e293b" fill-opacity="0.2" stroke="#334155" stroke-width="1" />
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">1. ORIGEN DE DATOS &amp; FILTROS</text>

    <!-- CATALOG Array -->
    <rect x="15" y="45" width="230" height="155" rx="6" fill="url(#darkGrad)" stroke="#1e293b" />
    <text x="25" y="65" fill="#38bdf8" font-size="12" font-weight="bold" font-family="monospace">let CATALOG = [...]</text>
    <text x="25" y="85" fill="#64748b" font-size="9">Colección de objetos plantilla:</text>
    
    <!-- Code block representation -->
    <rect x="25" y="95" width="210" height="90" rx="4" fill="#0f111a" stroke="#334155" />
    <text x="35" y="110" fill="#a855f7" font-size="9" font-family="monospace">{ id: 'c1',</text>
    <text x="35" y="123" fill="#cbd5e1" font-size="9" font-family="monospace">  name: 'Server HP DL380',</text>
    <text x="35" y="136" fill="#fb923c" font-size="9" font-family="monospace">  type: 'server', size: 2,</text>
    <text x="35" y="149" fill="#22c55e" font-size="9" font-family="monospace">  power: 460, plugs: 2,</text>
    <text x="35" y="162" fill="#e2e8f0" font-size="9" font-family="monospace">  icon: '🖥️', color: '#0ea5e9' }</text>

    <!-- Controls UI -->
    <rect x="15" y="215" width="230" height="190" rx="6" fill="url(#darkGrad)" stroke="#1e293b" />
    <text x="25" y="235" fill="#f8fafc" font-size="12" font-weight="bold">Control de Búsqueda</text>
    
    <!-- Search Bar -->
    <rect x="25" y="247" width="210" height="28" rx="4" fill="#0f111a" stroke="#334155" />
    <text x="35" y="265" fill="#64748b" font-size="10">🔍 catalog-search (Filtro Texto)</text>
    
    <!-- Filter Tabs -->
    <text x="25" y="300" fill="#f8fafc" font-size="11" font-weight="bold">Pestañas de Categoría</text>
    <rect x="25" y="312" width="95" height="20" rx="3" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" />
    <text x="72" y="325" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="bold">Todos / Racks</text>
    
    <rect x="130" y="312" width="105" height="20" rx="3" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" />
    <text x="182" y="325" text-anchor="middle" fill="#22c55e" font-size="9" font-weight="bold">Servers / Red / Storage</text>

    <rect x="25" y="340" width="210" height="20" rx="3" fill="#fb923c" fill-opacity="0.1" stroke="#fb923c" />
    <text x="130" y="353" text-anchor="middle" fill="#fb923c" font-size="9" font-weight="bold">Piso (Periféricos sin Rack)</text>

    <!-- Custom templates addition -->
    <rect x="25" y="372" width="210" height="22" rx="4" fill="#0c1d30" stroke="#0284c7" />
    <text x="130" y="386" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="bold">+ Plantilla Personalizada</text>
  </g>

  <!-- ==================== COLUMN 2: RENDER Y COMPONENTE ==================== -->
  <g transform="translate(340, 90)">
    <rect x="0" y="0" width="270" height="420" rx="8" fill="#1e293b" fill-opacity="0.2" stroke="#334155" stroke-width="1" />
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">2. PROCESADOR DE RENDER &amp; UI</text>

    <!-- renderCatalog() Logic -->
    <rect x="15" y="45" width="240" height="110" rx="6" fill="#0f172a" stroke="#0284c7" />
    <text x="25" y="68" fill="#38bdf8" font-size="12" font-weight="bold">renderCatalog()</text>
    <text x="25" y="88" fill="#cbd5e1" font-size="10">1. Aplica filtros activos y query</text>
    <text x="25" y="103" fill="#cbd5e1" font-size="10">2. Genera items HTML estructurados</text>
    <text x="25" y="118" fill="#cbd5e1" font-size="10">3. Inyecta en div id="catalog"</text>
    <text x="25" y="133" fill="#cbd5e1" font-size="10">4. Asigna Listeners de eventos</text>

    <!-- Generated DOM Card -->
    <rect x="15" y="170" width="240" height="235" rx="6" fill="url(#darkGrad)" stroke="#1e293b" />
    <text x="25" y="192" fill="#f8fafc" font-size="11" font-weight="bold">Representación DOM (.catalog-item)</text>
    <text x="25" y="205" fill="#64748b" font-size="8">Estructura del item dentro del listado sidebar</text>

    <!-- Catalog Item Card Mockup -->
    <g transform="translate(25, 215)">
      <rect x="0" y="0" width="190" height="45" rx="4" fill="#0f111a" stroke="#10b981" stroke-width="1.5" />
      <!-- Left Border Type accent -->
      <rect x="0" y="0" width="4" height="45" fill="#10b981" />
      <rect x="10" y="10" width="25" height="25" rx="3" fill="#10b981" fill-opacity="0.1" />
      <text x="22" y="27" text-anchor="middle" fill="#10b981" font-size="12">🔀</text>
      <text x="45" y="20" fill="#f8fafc" font-size="10" font-weight="bold">Switch Cisco 48P</text>
      <text x="45" y="32" fill="#64748b" font-size="8">SWITCH │ 180W</text>
      <text x="175" y="25" text-anchor="end" fill="#10b981" font-size="10" font-weight="bold">1U</text>
      <text x="182" y="10" fill="#64748b" font-size="8">⋮</text>
    </g>

    <!-- Drag handlers binding -->
    <rect x="25" y="275" width="215" height="115" rx="4" fill="#0f111a" stroke="#334155" />
    <text x="35" y="292" fill="#38bdf8" font-size="10" font-weight="bold">Controladores de Eventos:</text>
    <text x="35" y="312" fill="#e2e8f0" font-size="9" font-family="monospace">· dragstart</text>
    <text x="105" y="312" fill="#94a3b8" font-size="9">Inicia arrastre visual</text>
    <text x="35" y="327" fill="#e2e8f0" font-size="9" font-family="monospace">· dragend</text>
    <text x="105" y="327" fill="#94a3b8" font-size="9">Limpia estado / sombras</text>
    <text x="35" y="342" fill="#e2e8f0" font-size="9" font-family="monospace">· dblclick</text>
    <text x="105" y="342" fill="#94a3b8" font-size="9">Ubicación rápida (Modal)</text>
    <text x="35" y="357" fill="#e2e8f0" font-size="9" font-family="monospace">· click [⋮]</text>
    <text x="105" y="357" fill="#94a3b8" font-size="9">Edición / Borrado plantilla</text>
  </g>

  <!-- ==================== COLUMN 3: MÉTODOS DE INSTALACIÓN ==================== -->
  <g transform="translate(650, 90)">
    <rect x="0" y="0" width="265" height="420" rx="8" fill="#1e293b" fill-opacity="0.2" stroke="#334155" stroke-width="1" />
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">3. CANALES DE INSTALACIÓN</text>

    <!-- Ruta A: Drag and Drop -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="235" height="150" rx="6" fill="url(#dragGrad)" fill-opacity="0.08" stroke="#a855f7" stroke-width="1" />
      <text x="10" y="20" fill="#c084fc" font-size="11" font-weight="bold">Canal A: Arrastre Físico (D&amp;D)</text>
      
      <!-- drag-ghost representation -->
      <rect x="15" y="35" width="205" height="45" rx="4" fill="#0f111a" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 2" />
      <text x="25" y="52" fill="#a855f7" font-size="10" font-weight="bold">Visualización (#drag-ghost)</text>
      <text x="25" y="68" fill="#94a3b8" font-size="8">Sigue la punta del ratón (e.setDragImage)</text>

      <rect x="15" y="90" width="205" height="45" rx="4" fill="#0f111a" stroke="#334155" />
      <text x="25" y="106" fill="#cbd5e1" font-size="9" font-family="monospace">dragState = { type: 'catalog',</text>
      <text x="25" y="121" fill="#cbd5e1" font-size="9" font-family="monospace">              item: clone(item) }</text>
    </g>

    <!-- Ruta B: Ubicación Asistida -->
    <g transform="translate(15, 215)">
      <rect x="0" y="0" width="235" height="190" rx="6" fill="url(#modalGrad)" fill-opacity="0.08" stroke="#10b981" stroke-width="1" />
      <text x="10" y="20" fill="#34d399" font-size="11" font-weight="bold">Canal B: Asistente Paso a Paso</text>
      
      <rect x="15" y="35" width="205" height="45" rx="4" fill="#0c201a" stroke="#10b981" />
      <text x="25" y="52" fill="#10b981" font-size="10" font-weight="bold">⚡ Ubicación Rápida</text>
      <text x="25" y="67" fill="#88af9c" font-size="8">Doble click en el catálogo para abrir</text>

      <!-- Steps inside Modal -->
      <rect x="15" y="90" width="205" height="85" rx="4" fill="#0f111a" stroke="#334155" />
      <text x="25" y="106" fill="#e2e8f0" font-size="9" font-weight="bold">Cuestionario guiado:</text>
      <text x="25" y="122" fill="#94a3b8" font-size="8">1. Seleccionar Rack de destino</text>
      <text x="25" y="137" fill="#94a3b8" font-size="8">2. Elegir unidad U de montaje</text>
      <text x="25" y="152" fill="#94a3b8" font-size="8">3. Determinar lado (Frente / Atrás)</text>
    </g>
  </g>

  <!-- FLOW INTER-CONNECTORS (ARROWS) -->
  <!-- 1. Catalog array rendering -->
  <path d="M 295,190 L 340,190" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="318" y="182" text-anchor="middle" fill="#38bdf8" font-size="8" font-weight="bold">Dibuja</text>

  <!-- 2. Interactive action choices -->
  <path d="M 610,230 L 650,150" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" />
  <text x="635" y="172" text-anchor="end" fill="#c084fc" font-size="8" font-weight="bold">Arrastre</text>

  <path d="M 610,245 L 650,280" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="635" y="278" text-anchor="end" fill="#34d399" font-size="8" font-weight="bold">Click/Menú</text>
</svg>
