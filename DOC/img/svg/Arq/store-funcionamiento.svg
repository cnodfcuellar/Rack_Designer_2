<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" style="background-color: #0f111a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.5">DETALLE DE CAPA: ALMACÉN REACTIVO (js/store.js)</text>
  <text x="475" y="50" text-anchor="middle" fill="#64748b" font-size="11">Intercepción de mutaciones mediante Proxy ES6, Auto-Save e Historial</text>

  <!-- GRID / BACKGROUND AESTHETICS -->
  <rect x="15" y="70" width="920" height="460" rx="12" fill="#141721" stroke="#232733" stroke-width="1.5" />

  <!-- ==================== COLUMN 1: MUTACIONES E INPUTS ==================== -->
  <g transform="translate(35, 90)">
    <rect x="0" y="0" width="240" height="420" rx="8" fill="#1e293b" fill-opacity="0.2" stroke="#334155" stroke-width="1" />
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">1. ORIGEN DE MUTACIÓN</text>

    <!-- Block A: UI Actions -->
    <rect x="15" y="45" width="210" height="350" rx="6" fill="url(#cardGrad)" stroke="#334155" />
    <text x="25" y="70" fill="#fb923c" font-size="11" font-weight="bold">Modificación del Estado (DOM)</text>
    <text x="25" y="85" fill="#64748b" font-size="8.5">Eventos desencadenados por modales/UI</text>

    <g transform="translate(25, 115)" fill="#cbd5e1" font-size="9.5">
      <text x="0" y="0" font-weight="bold" fill="#38bdf8">Agregar Sala:</text>
      <text x="10" y="16" font-family="monospace" fill="#94a3b8">store.addRoom(name)</text>
      
      <text x="0" y="46" font-weight="bold" fill="#38bdf8">Agregar/Mover Equipo:</text>
      <text x="10" y="62" font-family="monospace" fill="#94a3b8">store.state.devices.push(...)</text>
      
      <text x="0" y="92" font-weight="bold" fill="#38bdf8">Editar Puertos de Enlace:</text>
      <text x="10" y="108" font-family="monospace" fill="#94a3b8">conn.type = "fiber";</text>

      <text x="0" y="138" font-weight="bold" fill="#38bdf8">Borrar Gabinete:</text>
      <text x="10" y="154" font-family="monospace" fill="#94a3b8">store.deleteRack(rackId)</text>

      <!-- Visual instruction -->
      <path d="M 10,185 L 170,185" fill="none" stroke="#334155" stroke-dasharray="3,3" />
      <text x="0" y="210" fill="#f8fafc" font-weight="bold">Operación Directa de Escritura:</text>
      <text x="0" y="226" fill="#fb923c" font-size="9" font-family="monospace">state.property = value</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: CORE REACTIVO (PROXY) ==================== -->
  <g transform="translate(310, 90)">
    <rect x="0" y="0" width="310" height="420" rx="8" fill="#0c2540" fill-opacity="0.2" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="0" y="0" width="310" height="45" rx="8" fill="url(#blueGrad)" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="15" y="27" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="0.5">🛡️ NÚCLEO (js/store.js)</text>

    <!-- Proxy wrapper diagram -->
    <rect x="15" y="60" width="280" height="345" rx="6" fill="#0f111a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="30" y="85" fill="#f8fafc" font-size="11" font-weight="bold">Proxy Handler: set(target, key, value)</text>
    <text x="30" y="100" fill="#64748b" font-size="8.5">Intercepta todas las escrituras en store.state</text>

    <!-- Step 1: Deep clone for Undo stack -->
    <g transform="translate(30, 130)">
      <rect x="0" y="0" width="250" height="65" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="10" y="18" fill="#cbd5e1" font-size="9.5" font-weight="bold">1. Generación de Snapshot</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8.5">Clona el estado previo y limpia la pila Rehacer</text>
      <text x="10" y="46" fill="#38bdf8" font-size="8.5" font-family="monospace">_undoStack.push(deepClone(state))</text>
    </g>

    <!-- Step 2: Mutate state in memory -->
    <g transform="translate(30, 210)">
      <rect x="0" y="0" width="250" height="50" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="10" y="18" fill="#cbd5e1" font-size="9.5" font-weight="bold">2. Modificación en Memoria</text>
      <text x="10" y="34" fill="#fb923c" font-size="8.5" font-family="monospace">Reflect.set(target, key, value)</text>
    </g>

    <!-- Step 3: LocalStorage Auto-Save -->
    <g transform="translate(30, 275)">
      <rect x="0" y="0" width="250" height="65" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="10" y="18" fill="#cbd5e1" font-size="9.5" font-weight="bold">3. Auto-Guardado Síncrono</text>
      <text x="10" y="32" fill="#94a3b8" font-size="8.5">Escribe la serialización en el disco local</text>
      <text x="10" y="48" fill="#22c55e" font-size="8.5" font-family="monospace">localStorage.setItem(KEY, JSON.stringify(state))</text>
    </g>

    <!-- Step 4: Emit event -->
    <text x="30" y="372" fill="#f8fafc" font-size="9.5" font-weight="bold">4. Notificación al Orquestador</text>
    <text x="30" y="386" fill="#cbd5e1" font-size="8.5" font-family="monospace">store.emit('change', { source: key })</text>
  </g>

  <!-- ==================== COLUMN 3: PERSISTENCIA Y PILAS ==================== -->
  <g transform="translate(655, 90)">
    <rect x="0" y="0" width="260" height="420" rx="8" fill="#1e293b" fill-opacity="0.2" stroke="#334155" stroke-width="1" />
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">3. PERSISTENCIA / PILAS</text>

    <!-- Memory DB state representation -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="230" height="75" rx="4" fill="url(#cardGrad)" stroke="#334155" />
      <text x="12" y="20" fill="#f8fafc" font-size="10" font-weight="bold">Memoria RAM (store.state)</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="8.5">Esquema en memoria del proyecto:</text>
      <text x="12" y="52" fill="#38bdf8" font-size="8.5" font-family="monospace">state: { rooms, racks, devices, ... }</text>
      <text x="12" y="65" fill="#38bdf8" font-size="8.5" font-family="monospace">connections, selectedId }</text>
    </g>

    <!-- localStorage block -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="230" height="60" rx="4" fill="#091e13" stroke="#22c55e" />
      <text x="12" y="20" fill="#22c55e" font-size="10" font-weight="bold">Disco Local (localStorage)</text>
      <text x="12" y="36" fill="#88af9c" font-size="8.5">Persistencia síncrona en navegador</text>
      <text x="12" y="48" fill="#88af9c" font-size="8.5" font-family="monospace">Clave: "RACK_DESIGNER_STATE"</text>
    </g>

    <!-- Undo/Redo stack -->
    <g transform="translate(15, 220)">
      <rect x="0" y="0" width="230" height="175" rx="4" fill="url(#cardGrad)" stroke="#334155" />
      <text x="12" y="20" fill="#f8fafc" font-size="10" font-weight="bold">Pila Historial (Undo/Redo)</text>
      <text x="12" y="35" fill="#cbd5e1" font-size="8.5">Almacena hasta 30 copias previas</text>

      <!-- Visual Stack -->
      <g transform="translate(12, 50)" font-family="monospace" font-size="8">
        <!-- Redo stack -->
        <rect x="0" y="0" width="206" height="20" rx="2" fill="#1e293b" stroke="#e11d48" stroke-dasharray="2,2" />
        <text x="8" y="12" fill="#e11d48">_redoStack [Pila de Rehacer]</text>

        <!-- Undo Stack items -->
        <rect x="0" y="28" width="206" height="20" rx="2" fill="#1e293b" stroke="#38bdf8" />
        <text x="8" y="40" fill="#cbd5e1">Estado t (Actual)</text>

        <rect x="0" y="54" width="206" height="20" rx="2" fill="#0f172a" stroke="#475569" />
        <text x="8" y="66" fill="#64748b">Estado t-1 (Anterior)</text>

        <rect x="0" y="80" width="206" height="20" rx="2" fill="#0f172a" stroke="#475569" />
        <text x="8" y="92" fill="#64748b">Estado t-2</text>
      </g>
    </g>
  </g>

  <!-- FLOW INTER-CONNECTORS (ARROWS) -->
  <!-- Write to store.js -->
  <path d="M 280,275 L 310,275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- store.js to RAM memory -->
  <path d="M 620,115 L 655,115" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- store.js to LocalStorage -->
  <path d="M 620,230 L 655,230" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- store.js to Undo/Redo stack (snapshot) -->
  <path d="M 620,310 L 655,310" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="637" y="303" text-anchor="middle" fill="#38bdf8" font-size="7.5" font-weight="bold">snapshot</text>

  <!-- Emits change event up to main.js -->
  <path d="M 465,85 L 465,70" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="465" y="63" text-anchor="middle" fill="#38bdf8" font-size="8" font-weight="bold">2. Emite evento 'change'</text>
</svg>
