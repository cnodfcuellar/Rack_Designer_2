<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380">
<defs>
  <style>
    @keyframes slide-in { from{transform:translateX(280px);opacity:0} to{transform:translateX(0);opacity:1} }
    .slide-panel { animation: slide-in 0.4s ease-out forwards; }
    @keyframes tab-underline { from{width:0} to{width:100%} }
  </style>
</defs>
<rect width="1100" height="380" fill="#060a14" rx="12"/>
<text x="550" y="18" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#475569">PROPUESTA — Inspector de Propiedades Lateral</text>

<!-- Main rack area (dimmed) -->
<rect x="20" y="28" width="760" height="340" rx="10" fill="#0d1428" stroke="#1e2d4e" opacity="0.7"/>
<text x="400" y="200" text-anchor="middle" font-family="Space Grotesk" font-size="14" fill="#1e2d4e">Vista del Rack (permanece visible)</text>

<!-- Selected device highlight in rack -->
<rect x="60" y="120" width="300" height="48" rx="4" fill="#38bdf820" stroke="#38bdf8" stroke-width="2"/>
<text x="80" y="146" font-family="Space Grotesk" font-size="12" font-weight="700" fill="#38bdf8">Switch Cisco 48P</text>
<text x="80" y="162" font-family="JetBrains Mono" font-size="9" fill="#64748b">1U · U3 · 180W</text>
<!-- Selection indicator -->
<rect x="56" y="120" width="4" height="48" rx="2" fill="#38bdf8"/>

<!-- INSPECTOR PANEL -->
<rect x="784" y="28" width="296" height="340" rx="12" fill="#0d1428" stroke="#38bdf8" stroke-width="1.5" class="slide-panel"/>

<!-- Panel header -->
<rect x="784" y="28" width="296" height="50" rx="12" fill="#0f2035"/>
<rect x="784" y="60" width="296" height="18" fill="#0f2035"/>
<text x="800" y="50" font-family="Space Grotesk" font-size="13" font-weight="700" fill="#e2e8f0">Switch Cisco 48P</text>
<text x="800" y="64" font-family="JetBrains Mono" font-size="9" fill="#64748b">switch · U3 · Rack Principal</text>
<!-- Close button -->
<circle cx="1060" cy="48" r="10" fill="#1e2d4e" stroke="#243655"/>
<text x="1060" y="53" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#64748b">✕</text>
<!-- Type badge -->
<rect x="960" y="40" width="52" height="16" rx="4" fill="#10b98120" stroke="#10b98150"/>
<text x="986" y="52" text-anchor="middle" font-family="JetBrains Mono" font-size="8" fill="#34d399">switch</text>

<!-- Tabs -->
<rect x="784" y="78" width="296" height="28" fill="#080c18"/>
<rect x="784" y="78" width="74" height="28" fill="#0f2035"/><!-- active tab -->
<text x="821" y="96" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="700" fill="#38bdf8">Info</text>
<rect x="784" y="104" width="74" height="2" fill="#38bdf8"/><!-- active underline -->
<text x="895" y="96" text-anchor="middle" font-family="Space Grotesk" font-size="10" fill="#475569">Red</text>
<text x="969" y="96" text-anchor="middle" font-family="Space Grotesk" font-size="10" fill="#475569">Acceso</text>
<text x="1043" y="96" text-anchor="middle" font-family="Space Grotesk" font-size="10" fill="#475569">Cables</text>

<!-- Form fields -->
<text x="800" y="126" font-family="JetBrains Mono" font-size="9" fill="#475569">NOMBRE</text>
<rect x="800" y="130" width="264" height="28" rx="6" fill="#111827" stroke="#243655"/>
<text x="812" y="149" font-family="Space Grotesk" font-size="11" fill="#e2e8f0">Switch Cisco 48P</text>
<!-- edit cursor -->
<rect x="930" y="136" width="1" height="14" fill="#38bdf8"/>

<text x="800" y="174" font-family="JetBrains Mono" font-size="9" fill="#475569">MARCA</text>
<rect x="800" y="178" width="126" height="28" rx="6" fill="#111827" stroke="#243655"/>
<text x="812" y="197" font-family="Space Grotesk" font-size="11" fill="#64748b">Cisco</text>
<text x="936" y="174" font-family="JetBrains Mono" font-size="9" fill="#475569">MODELO</text>
<rect x="936" y="178" width="128" height="28" rx="6" fill="#111827" stroke="#243655"/>
<text x="948" y="197" font-family="Space Grotesk" font-size="11" fill="#64748b">Catalyst 2960</text>

<text x="800" y="222" font-family="JetBrains Mono" font-size="9" fill="#475569">SERIE</text>
<rect x="800" y="226" width="264" height="28" rx="6" fill="#111827" stroke="#243655"/>
<text x="812" y="245" font-family="JetBrains Mono" font-size="10" fill="#64748b">CSW-001-XA4</text>

<text x="800" y="270" font-family="JetBrains Mono" font-size="9" fill="#475569">NOTAS</text>
<rect x="800" y="274" width="264" height="52" rx="6" fill="#111827" stroke="#243655"/>
<text x="812" y="292" font-family="Space Grotesk" font-size="10" fill="#64748b">Switch de distribución</text>
<text x="812" y="307" font-family="Space Grotesk" font-size="10" fill="#64748b">piso 3 — sala principal</text>

<!-- Action buttons -->
<rect x="800" y="338" width="120" height="22" rx="6" fill="#38bdf8"/>
<text x="860" y="353" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="700" fill="#0f172a">💾 Guardar</text>
<rect x="930" y="338" width="134" height="22" rx="6" fill="#ef444420" stroke="#ef444460"/>
<text x="997" y="353" text-anchor="middle" font-family="Space Grotesk" font-size="10" fill="#f87171">🗑 Eliminar</text>

<!-- Annotation arrows -->
<line x1="760" y1="144" x2="784" y2="144" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="400" y="340" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">El rack permanece visible y operable mientras se edita — sin modal bloqueante</text>
</svg>