<rect x="706" y="142" width="86" height="20" rx="4" fill="#f59e0b15" stroke="#f59e0b40"/>
<text x="714" y="156" font-family="JetBrains Mono" font-size="10" fill="#fde68a">dell456</text>
<rect x="800" y="142" width="22" height="20" rx="4" fill="#f59e0b30" stroke="#f59e0b60"/>
<text x="811" y="156" text-anchor="middle" font-size="10">👁</text>
<!-- HIGH POWER -->
<rect x="832" y="142" width="52" height="20" rx="4" fill="#ef444420" stroke="#ef444460"/>
<text x="858" y="156" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#f87171">⚡ 550W</text>

<!-- Filter popup on IP column -->
<rect x="308" y="35" width="120" height="28" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
<text x="320" y="48" font-family="JetBrains Mono" font-size="9" fill="#38bdf8">192.</text>
<rect x="408" y="39" width="1" height="16" fill="#38bdf8" class="cursor"/>
