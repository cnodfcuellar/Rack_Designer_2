<text x="965" y="124" text-anchor="middle" font-family="Space Grotesk" font-size="8" fill="#64748b">Cancelar</text>

<line x1="20" y1="132" x2="1080" y2="132" stroke="#1e2d4e" stroke-width="0.5"/>

<!-- Row 3 — Password revealed -->
<rect x="20" y="132" width="1060" height="36" fill="#0d1428"/>
