  <rect x="910" y="46" width="70" height="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="945" y="64" fill="#57606a" font-size="11" text-anchor="middle">⛶ Expandir</text>

