  <text x="420" y="64" fill="#0969da" font-size="11" font-weight="bold" text-anchor="middle">🏢 ECA_Matriz</text>

  <rect x="475" y="46" width="90" height="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="520" y="64" fill="#57606a" font-size="11" text-anchor="middle">🏢 ECA_bodega</text>

  <rect x="575" y="46" width="28" height="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="589" y="64" fill="#57606a" font-size="11" text-anchor="middle">+</text>

