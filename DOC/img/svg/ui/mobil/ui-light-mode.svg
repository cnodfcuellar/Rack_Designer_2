  <rect x="730" y="386" width="120" height="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="740" y="405" fill="#8c959f" font-size="11">🔍 Filtrar tabla...</text>

