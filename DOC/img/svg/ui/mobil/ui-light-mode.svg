<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" style="background-color: #f6f8fa; font-family: -apple-system, sans-serif;">
  
  <!-- Sidebar Background -->
  <rect x="0" y="0" width="220" height="380" fill="#ffffff"/>
  <line x1="220" y1="0" x2="220" y2="380" stroke="#d0d7de" stroke-width="1"/>

  <!-- Logo Area -->
  <rect x="10" y="10" width="160" height="30" fill="transparent"/>
  <text x="15" y="32" fill="#0969da" font-size="18" font-weight="bold">RACK Designer</text>
  <rect x="180" y="10" width="30" height="30" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="195" y="30" fill="#24292f" font-size="16" text-anchor="middle">☰</text>
  
  <line x1="0" y1="50" x2="220" y2="50" stroke="#d0d7de" stroke-width="1"/>

  <!-- Stats Header -->
  <text x="15" y="70" fill="#57606a" font-size="11" font-weight="bold">ESTADÍSTICAS</text>
  <text x="200" y="70" fill="#57606a" font-size="11">▶</text>

  <line x1="0" y1="80" x2="220" y2="80" stroke="#d0d7de" stroke-width="1"/>

  <!-- Add Buttons -->
  <rect x="15" y="95" width="90" height="28" fill="#ffffff" stroke="#0969da" stroke-width="1" rx="4"/>
  <text x="60" y="114" fill="#0969da" font-size="11" font-weight="bold" text-anchor="middle">+ Rack</text>

  <rect x="115" y="95" width="90" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="160" y="114" fill="#57606a" font-size="11" text-anchor="middle">+ Equipo</text>

  <!-- Search Box -->
  <rect x="15" y="135" width="190" height="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="25" y="153" fill="#8c959f" font-size="11">Buscar por nombre o tipo...</text>

  <!-- Filters -->
  <rect x="5" y="175" width="40" height="22" fill="#ddf4ff" stroke="#0969da" stroke-width="1" rx="11"/>
  <text x="25" y="190" fill="#0969da" font-size="10" text-anchor="middle">Todos</text>
  
  <rect x="50" y="175" width="45" height="22" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="11"/>
  <text x="72" y="190" fill="#57606a" font-size="10" text-anchor="middle">Servers</text>
  
  <rect x="100" y="175" width="35" height="22" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="11"/>
  <text x="117" y="190" fill="#57606a" font-size="10" text-anchor="middle">Red</text>
  
  <rect x="140" y="175" width="45" height="22" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="11"/>
  <text x="162" y="190" fill="#57606a" font-size="10" text-anchor="middle">Storage</text>
  
  <rect x="190" y="175" width="30" height="22" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="11"/>
  <text x="205" y="190" fill="#57606a" font-size="10" text-anchor="middle">Piso</text>

  <!-- Sidebar Items Mockup -->
  <rect x="15" y="210" width="190" height="40" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <rect x="15" y="210" width="4" height="40" fill="#0969da" rx="2"/>
  <text x="30" y="235" fill="#0969da" font-size="16">💾</text>
  <text x="55" y="227" fill="#24292f" font-size="11" font-weight="bold">NAS 2U</text>
  <text x="55" y="240" fill="#57606a" font-size="9">STORAGE | 150W</text>
  <rect x="175" y="222" width="20" height="16" fill="#f3f4f6" rx="2"/>
  <text x="185" y="234" fill="#57606a" font-size="9" text-anchor="middle">2U</text>

  <rect x="15" y="260" width="190" height="40" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <rect x="15" y="260" width="4" height="40" fill="#0969da" rx="2"/>
  <text x="30" y="285" fill="#0969da" font-size="16">💻</text>
  <text x="55" y="277" fill="#24292f" font-size="11" font-weight="bold">PC Desktop</text>
  <text x="55" y="290" fill="#57606a" font-size="9">PC | 250W</text>
  <rect x="165" y="272" width="30" height="16" fill="#f3f4f6" rx="2"/>
  <text x="180" y="284" fill="#57606a" font-size="9" text-anchor="middle">Piso</text>

  <!-- Main Canvas -->
  <rect x="221" y="0" width="779" height="380" fill="#f6f8fa"/>
  <pattern id="dots_light" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="#d0d7de" cx="10" cy="10" r="1"></circle>
  </pattern>
  <rect x="221" y="0" width="779" height="380" fill="url(#dots_light)"/>

  <!-- Top Toolbar -->
  <rect x="221" y="0" width="779" height="40" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <rect x="235" y="6" width="160" height="28" fill="#f3f4f6" rx="4"/>
  <rect x="237" y="8" width="80" height="24" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="277" y="24" fill="#0969da" font-size="11" font-weight="bold" text-anchor="middle">Vista Física</text>
  <text x="357" y="24" fill="#57606a" font-size="11" text-anchor="middle">Topología</text>

  <rect x="750" y="6" width="150" height="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="760" y="24" fill="#8c959f" font-size="11">🔍 Buscar equipo, IP, MAC</text>

  <!-- Breadcrumbs / Zoom Bar -->
  <rect x="221" y="40" width="779" height="40" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <rect x="235" y="46" width="20" height="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="245" y="64" fill="#57606a" font-size="12" text-anchor="middle">-</text>
  
  <text x="270" y="64" fill="#57606a" font-size="11" text-anchor="middle">48%</text>

  <rect x="290" y="46" width="20" height="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="300" y="64" fill="#57606a" font-size="12" text-anchor="middle">+</text>

  <rect x="320" y="46" width="40" height="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="340" y="64" fill="#57606a" font-size="11" text-anchor="middle">⏱ 1:1</text>

