  <rect x="250" y="100" width="120" height="150" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <rect x="250" y="100" width="120" height="20" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="255" y="114" fill="#24292f" font-size="9" font-weight="bold">Rack_principal</text>
  
  <rect x="260" y="130" width="100" height="30" fill="#0d1117" rx="2"/>
  <rect x="260" y="165" width="100" height="30" fill="#0d1117" rx="2"/>
