  <text x="10" y="440" fill="#57606a" font-size="10" font-weight="bold" letter-spacing="1">SALA/RACK ORIGEN</text>
  <text x="200" y="440" fill="#57606a" font-size="10" font-weight="bold" letter-spacing="1">ORIGEN</text>
  <text x="320" y="440" fill="#57606a" font-size="10" font-weight="bold" letter-spacing="1">PUERTO ORIGEN</text>
  <text x="420" y="440" fill="#57606a" font-size="10" font-weight="bold" letter-spacing="1">SALA/RACK DESTINO</text>
  <text x="610" y="440" fill="#57606a" font-size="10" font-weight="bold" letter-spacing="1">DESTINO</text>
  <text x="730" y="440" fill="#57606a" font-size="10" font-weight="bold" letter-spacing="1">PUERTO DESTINO</text>
  <text x="830" y="440" fill="#57606a" font-size="10" font-weight="bold" letter-spacing="1">TIPO CABLE</text>
  <text x="910" y="440" fill="#57606a" font-size="10" font-weight="bold" letter-spacing="1">COLOR</text>

  <!-- Row 1 -->
  <line x1="0" y1="480" x2="1000" y2="480" stroke="#d0d7de" stroke-width="1"/>
  <text x="10" y="465" fill="#57606a" font-size="11">ECA_Matriz - Rack_principal</text>
  <rect x="200" y="452" width="75" height="18" fill="#fff8c5" rx="2"/>
  <text x="237" y="465" fill="#9a6700" font-size="9" font-weight="bold" text-anchor="middle">ROUTER CORE</text>
  <text x="320" y="465" fill="#24292f" font-size="11">Eth0/1</text>
  <text x="420" y="465" fill="#57606a" font-size="11">ECA_bodega - cheque cosina</text>
  <rect x="610" y="452" width="105" height="18" fill="#dafbe1" rx="2"/>
  <text x="662" y="465" fill="#1a7f37" font-size="9" font-weight="bold" text-anchor="middle">SWITCH MANAGED 24P</text>
  <text x="730" y="465" fill="#24292f" font-size="11">Eth0/2</text>
  <text x="830" y="465" fill="#57606a" font-size="11">Fibra SM</text>
  <circle cx="915" cy="461" r="5" fill="#d4a72c"/>
  <text x="925" y="465" fill="#57606a" font-size="11">#f7f13b</text>
  <rect x="970" y="454" width="18" height="18" fill="#ffffff" stroke="#d0d7de" rx="2"/>
  <text x="979" y="466" fill="#0969da" font-size="10" text-anchor="middle">✎</text>

  <!-- Row 2 -->
  <line x1="0" y1="510" x2="1000" y2="510" stroke="#d0d7de" stroke-width="1"/>
  <text x="10" y="495" fill="#57606a" font-size="11">ECA_Matriz - Rack_principal</text>
  <rect x="200" y="482" width="90" height="18" fill="#dafbe1" rx="2"/>
  <text x="245" y="495" fill="#1a7f37" font-size="9" font-weight="bold" text-anchor="middle">SWITCH POE 24P</text>
  <text x="320" y="495" fill="#24292f" font-size="11">Eth0/1</text>
  <text x="420" y="495" fill="#57606a" font-size="11">ECA_Matriz - PISO</text>
  <text x="610" y="495" fill="#57606a" font-size="11">CÁMARA IP</text>
  <text x="730" y="495" fill="#24292f" font-size="11">Eth0/2</text>
  <text x="830" y="495" fill="#57606a" font-size="11">Cobre</text>
  <circle cx="915" cy="491" r="5" fill="#412a01"/>
  <text x="925" y="495" fill="#57606a" font-size="11">#412a01</text>
  <rect x="970" y="484" width="18" height="18" fill="#ffffff" stroke="#d0d7de" rx="2"/>
  <text x="979" y="496" fill="#0969da" font-size="10" text-anchor="middle">✎</text>

  <!-- Row 3 -->
  <line x1="0" y1="540" x2="1000" y2="540" stroke="#d0d7de" stroke-width="1"/>
  <text x="10" y="525" fill="#57606a" font-size="11">ECA_Matriz - PISO</text>
  <text x="200" y="525" fill="#57606a" font-size="11">IMPRESORA RED</text>
  <text x="320" y="525" fill="#24292f" font-size="11">Eth0/1</text>
  <text x="420" y="525" fill="#57606a" font-size="11">ECA_Matriz - Rack_principal</text>
  <rect x="610" y="512" width="75" height="18" fill="#dafbe1" rx="2"/>
  <text x="647" y="525" fill="#1a7f37" font-size="9" font-weight="bold" text-anchor="middle">SWITCH 24P</text>
  <text x="730" y="525" fill="#24292f" font-size="11">Eth0/2</text>
  <text x="830" y="525" fill="#57606a" font-size="11">Cobre</text>
  <circle cx="915" cy="521" r="5" fill="#cd0a68"/>
  <text x="925" y="525" fill="#57606a" font-size="11">#cd0a68</text>
  <rect x="970" y="514" width="18" height="18" fill="#ffffff" stroke="#d0d7de" rx="2"/>
  <text x="979" y="526" fill="#0969da" font-size="10" text-anchor="middle">✎</text>

</svg>
