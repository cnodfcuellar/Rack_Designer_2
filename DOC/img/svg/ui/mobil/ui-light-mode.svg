  <text x="280" y="315" fill="#24292f" font-size="8" font-weight="bold">Cámara IP</text>
  
  <rect x="360" y="305" width="90" height="24" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="4"/>
