<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 680" width="100%" style="background-color: #0d1117; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Patterns -->
    <pattern id="dot-grid" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#475569" />
    </pattern>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="blueCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <!-- ==================== BACKGROUND: BLURRED APP VISTA FÍSICA ==================== -->
  <rect x="0" y="0" width="450" height="680" fill="#f1f5f9" />
  <rect x="0" y="0" width="450" height="680" fill="url(#dot-grid)" opacity="0.3" />
  
  <!-- Blurred Racks in the background -->
  <rect x="360" y="80" width="80" height="520" rx="4" fill="#090d16" fill-opacity="0.15" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="370" y="140" width="60" height="40" fill="#1e293b" fill-opacity="0.2" rx="2" />
  <rect x="370" y="190" width="60" height="40" fill="#1e293b" fill-opacity="0.2" rx="2" />
  <rect x="370" y="240" width="60" height="40" fill="#1e293b" fill-opacity="0.2" rx="2" />
  
  <!-- Dark overlay representing off-canvas backdrop -->
  <rect x="0" y="0" width="450" height="680" fill="#090d16" fill-opacity="0.6" />


  <!-- ==================== MOBILE OFF-CANVAS CATALOG PANEL ==================== -->
  <!-- White Sidebar Panel (covers left part of the screen) -->
  <rect x="0" y="0" width="370" height="680" fill="#ffffff" rx="0" />
  <line x1="370" y1="0" x2="370" y2="680" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- 1. Header Toolbar -->
  <rect x="0" y="0" width="370" height="55" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
  <text x="20" y="34" fill="#64748b" font-size="13" font-weight="800" letter-spacing="0.5">ESTADÍSTICAS</text>
  
  <!-- Down Arrow Dropdown -->
  <polygon points="315,26 320,32 325,26" fill="#64748b" />
  <!-- Close Button (X) -->
  <line x1="340" y1="24" x2="350" y2="34" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="350" y1="24" x2="340" y2="34" stroke="#64748b" stroke-width="2" stroke-linecap="round" />


  <!-- 2. Core Stats Cards (4 items Grid) -->
  <!-- Card 1: Racks -->
  <rect x="20" y="70" width="72" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="36" y="80" width="40" height="40" rx="8" fill="#e0f2fe" />
  <!-- Rack Icon -->
  <rect x="49" y="88" width="14" height="24" rx="1" fill="none" stroke="#0284c7" stroke-width="1.5" />
  <line x1="49" y1="94" x2="63" y2="94" stroke="#0284c7" stroke-width="1" />
  <line x1="49" y1="100" x2="63" y2="100" stroke="#0284c7" stroke-width="1" />
  <line x1="49" y1="106" x2="63" y2="106" stroke="#0284c7" stroke-width="1" />
  <text x="56" y="140" fill="#22c55e" font-size="18" font-weight="900" text-anchor="middle">4</text>

  <!-- Card 2: Devices -->
  <rect x="104" y="70" width="72" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="120" y="80" width="40" height="40" rx="8" fill="#faf5ff" />
  <!-- Server Icon -->
  <rect x="130" y="92" width="20" height="16" rx="2" fill="none" stroke="#a855f7" stroke-width="1.5" />
  <line x1="130" y1="100" x2="150" y2="100" stroke="#a855f7" stroke-width="1" />
  <circle cx="135" cy="96" r="1" fill="#a855f7" />
  <circle cx="145" cy="96" r="1" fill="#22c55e" />
  <text x="140" y="140" fill="#cbd5e1" font-size="18" font-weight="900" text-anchor="middle">32</text>

  <!-- Card 3: Height Us -->
  <rect x="188" y="70" width="80" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="208" y="80" width="40" height="40" rx="8" fill="#fff7ed" />
  <!-- 'U' Symbol -->
  <text x="228" y="106" fill="#ea580c" font-size="18" font-weight="800" text-anchor="middle">U</text>
  <text x="228" y="140" fill="#ea580c" font-size="12" font-weight="900" text-anchor="middle">54/168</text>

  <!-- Card 4: Connections -->
  <rect x="280" y="70" width="70" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="295" y="80" width="40" height="40" rx="8" fill="#f0fdf4" />
  <!-- Net/Connection Node Icon -->
  <circle cx="315" cy="95" r="3" fill="none" stroke="#22c55e" stroke-width="1.5" />
  <circle cx="308" cy="106" r="3" fill="none" stroke="#22c55e" stroke-width="1.5" />
  <circle cx="322" cy="106" r="3" fill="none" stroke="#22c55e" stroke-width="1.5" />
  <line x1="315" y1="98" x2="310" y2="103" stroke="#22c55e" stroke-width="1" />
  <line x1="315" y1="98" x2="320" y2="103" stroke="#22c55e" stroke-width="1" />
  <text x="315" y="140" fill="#cbd5e1" font-size="18" font-weight="900" text-anchor="middle">83</text>


  <!-- 3. Progress bars -->
  <!-- Rack capacity -->
  <text x="20" y="174" fill="#94a3b8" font-size="9" font-weight="bold" letter-spacing="0.5">RACK CAPACITY</text>
  <text x="350" y="174" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="end">32%</text>
  <rect x="20" y="181" width="330" height="7" rx="3" fill="#f1f5f9" />
  <rect x="20" y="181" width="105" height="7" rx="3" fill="#0284c7" />

  <!-- Power -->
  <text x="20" y="208" fill="#94a3b8" font-size="9" font-weight="bold" letter-spacing="0.5">POWER</text>
  <text x="350" y="208" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="end">25565 W</text>
  <rect x="20" y="215" width="330" height="7" rx="3" fill="#f1f5f9" />
  <rect x="20" y="215" width="330" height="7" rx="3" fill="url(#powerGrad)" />

  <line x1="20" y1="238" x2="350" y2="238" stroke="#f1f5f9" stroke-width="1.5" />


  <!-- 4. Quick buttons -->
  <rect x="20" y="254" width="160" height="38" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <text x="100" y="278" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">+ Rack</text>

  <rect x="190" y="254" width="160" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="270" y="278" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle">+ Equipo</text>


  <!-- 5. Search Input -->
  <rect x="20" y="307" width="330" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="32" y="330" fill="#94a3b8" font-size="12">Buscar por nombre o tipo...</text>


  <!-- 6. Filter Tabs -->
  <!-- Todos -->
  <rect x="20" y="360" width="65" height="26" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="52" y="377" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="middle">Todos</text>

  <!-- Servers -->
  <rect x="91" y="360" width="70" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="126" y="376" fill="#64748b" font-size="11" text-anchor="middle">Servers</text>

  <!-- Red -->
  <rect x="167" y="360" width="50" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="192" y="376" fill="#64748b" font-size="11" text-anchor="middle">Red</text>

  <!-- Storage -->
  <rect x="223" y="360" width="75" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="260" y="376" fill="#64748b" font-size="11" text-anchor="middle">Storage</text>

  <!-- Piso -->
  <rect x="304" y="360" width="50" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="329" y="376" fill="#64748b" font-size="11" text-anchor="middle">Piso</text>


  <!-- ==================== 7. DEVICES CATALOG LIST ==================== -->
  <!-- Device Card 1 -->
  <g transform="translate(20, 403)">
    <rect x="0" y="0" width="330" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="0" y="0" width="5" height="60" rx="2" fill="#38bdf8" />
    
    <!-- Mini Device Icon Box -->
    <rect x="15" y="10" width="40" height="40" rx="6" fill="#f0f9ff" />
    <!-- Server icon path -->
    <rect x="27" y="20" width="16" height="20" rx="1.5" fill="none" stroke="#0284c7" stroke-width="1.2" />
    <line x1="27" y1="28" x2="43" y2="28" stroke="#0284c7" stroke-width="1" />
    <circle cx="31" cy="24" r="0.8" fill="#0284c7" />
    
    <text x="68" y="27" fill="#1e293b" font-size="12" font-weight="bold">Server HP ProLiant</text>
    <text x="68" y="42" fill="#94a3b8" font-size="9.5" font-weight="bold">SERVER | 460W</text>
    
    <!-- Size Badge -->
    <rect x="252" y="18" width="30" height="24" rx="4" fill="#f1f5f9" />
    <text x="267" y="34" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">2U</text>
    
    <!-- Context Menu Options (Triple dot) -->
    <circle cx="312" cy="24" r="1.5" fill="#94a3b8" />
    <circle cx="312" cy="30" r="1.5" fill="#94a3b8" />
    <circle cx="312" cy="36" r="1.5" fill="#94a3b8" />
  </g>

  <!-- Device Card 2 -->
  <g transform="translate(20, 473)">
    <rect x="0" y="0" width="330" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="0" y="0" width="5" height="60" rx="2" fill="#38bdf8" />
    
    <rect x="15" y="10" width="40" height="40" rx="6" fill="#f0f9ff" />
    <rect x="27" y="20" width="16" height="20" rx="1.5" fill="none" stroke="#0284c7" stroke-width="1.2" />
    <line x1="27" y1="28" x2="43" y2="28" stroke="#0284c7" stroke-width="1" />
    <circle cx="31" cy="24" r="0.8" fill="#0284c7" />
    
    <text x="68" y="27" fill="#1e293b" font-size="12" font-weight="bold">Server Dell R740</text>
    <text x="68" y="42" fill="#94a3b8" font-size="9.5" font-weight="bold">SERVER | 550W</text>
    
    <rect x="252" y="18" width="30" height="24" rx="4" fill="#f1f5f9" />
    <text x="267" y="34" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">2U</text>
    
    <circle cx="312" cy="24" r="1.5" fill="#94a3b8" />
    <circle cx="312" cy="30" r="1.5" fill="#94a3b8" />
    <circle cx="312" cy="36" r="1.5" fill="#94a3b8" />
  </g>

  <!-- Device Card 3 -->
  <g transform="translate(20, 543)">
    <rect x="0" y="0" width="330" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="0" y="0" width="5" height="60" rx="2" fill="#38bdf8" />
    
    <rect x="15" y="10" width="40" height="40" rx="6" fill="#f0f9ff" />
    <rect x="27" y="22" width="16" height="16" rx="1.5" fill="none" stroke="#0284c7" stroke-width="1.2" />
    <line x1="27" y1="30" x2="43" y2="30" stroke="#0284c7" stroke-width="1" />
    
    <text x="68" y="27" fill="#1e293b" font-size="12" font-weight="bold">Server 1U</text>
    <text x="68" y="42" fill="#94a3b8" font-size="9.5" font-weight="bold">SERVER | 200W</text>
    
    <rect x="252" y="18" width="30" height="24" rx="4" fill="#f1f5f9" />
    <text x="267" y="34" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">1U</text>
    
    <circle cx="312" cy="24" r="1.5" fill="#94a3b8" />
    <circle cx="312" cy="30" r="1.5" fill="#94a3b8" />
    <circle cx="312" cy="36" r="1.5" fill="#94a3b8" />
  </g>

  <!-- Device Card 4 -->
  <g transform="translate(20, 613)">
    <rect x="0" y="0" width="330" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="0" y="0" width="5" height="60" rx="2" fill="#34d399" />
    
    <rect x="15" y="10" width="40" height="40" rx="6" fill="#ecfdf5" />
    <!-- Switch icon -->
    <rect x="26" y="22" width="18" height="16" rx="1.5" fill="none" stroke="#10b981" stroke-width="1.2" />
    <path d="M 29,30 L 41,30" stroke="#10b981" stroke-width="1" />
    <path d="M 32,27 L 29,30 L 32,33" fill="none" stroke="#10b981" stroke-width="1" />
    <path d="M 38,27 L 41,30 L 38,33" fill="none" stroke="#10b981" stroke-width="1" />
    
    <text x="68" y="27" fill="#1e293b" font-size="12" font-weight="bold">Switch Cisco 48P</text>
    <text x="68" y="42" fill="#94a3b8" font-size="9.5" font-weight="bold">SWITCH | 180W</text>
    
    <rect x="252" y="18" width="30" height="24" rx="4" fill="#f1f5f9" />
    <text x="267" y="34" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">1U</text>
    
    <circle cx="312" cy="24" r="1.5" fill="#94a3b8" />
    <circle cx="312" cy="30" r="1.5" fill="#94a3b8" />
    <circle cx="312" cy="36" r="1.5" fill="#94a3b8" />
  </g>
</svg>
