<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 568" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base App Background (Dimmed) -->
  <rect width="320" height="568" fill="url(#bgGrad)" />
  <rect width="320" height="568" fill="#000000" opacity="0.6" />

  <!-- Mobile Modal -->
  <g transform="translate(20, 100)" filter="url(#shadow)">
    <!-- Modal Container -->
    <rect x="0" y="0" width="280" height="280" rx="16" fill="#282a36" stroke="#44475a" stroke-width="1"/>
    
    <!-- Modal Header -->
    <rect x="0" y="0" width="280" height="50" fill="#21222c" rx="16" />
    <!-- Square bottom corners for header -->
    <rect x="0" y="30" width="280" height="20" fill="#21222c" />
    <line x1="0" y1="50" x2="280" y2="50" stroke="#44475a" stroke-width="1" />
    
    <text x="140" y="32" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Nueva Sala</text>
    
    <!-- Close X -->
    <path d="M 250 18 L 260 28 M 260 18 L 250 28" stroke="#ff5555" stroke-width="2.5" stroke-linecap="round" />

    <!-- Form Body -->
    <!-- Input 1: Nombre de Sala -->
    <text x="20" y="80" fill="#6272a4" font-family="sans-serif" font-size="12" font-weight="bold">NOMBRE DE LA SALA</text>
    <rect x="20" y="90" width="240" height="40" rx="6" fill="#1e1e24" stroke="#bd93f9" stroke-width="2" />
    <text x="35" y="115" fill="#f8f8f2" font-family="sans-serif" font-size="14">Sala Eléctrica B</text>

    <!-- Input 2: Descripción -->
    <text x="20" y="155" fill="#6272a4" font-family="sans-serif" font-size="12" font-weight="bold">DESCRIPCIÓN (Opcional)</text>
    <rect x="20" y="165" width="240" height="40" rx="6" fill="#191a21" stroke="#44475a" stroke-width="1" />
    <text x="35" y="190" fill="#6272a4" font-family="sans-serif" font-size="14">Ej. Planta baja, sector sur</text>

    <!-- Action Buttons -->
    <rect x="20" y="225" width="115" height="40" rx="6" fill="#44475a" />
    <text x="77" y="250" fill="#f8f8f2" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cancelar</text>

    <rect x="145" y="225" width="115" height="40" rx="6" fill="#50fa7b" />
    <text x="202" y="250" fill="#282a36" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Crear Sala</text>
  </g>
</svg>
