<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" style="background-color: transparent; font-family: -apple-system, sans-serif;">
  
  <!-- Modal Background Shadow -->
  <rect x="0" y="0" width="500" height="220" fill="transparent"/>
  
  <!-- Modal Container -->
  <rect x="10" y="10" width="480" height="200" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="30" y="44" fill="#ffffff" font-size="16">📷</text>
  <text x="55" y="44" fill="#ffffff" font-size="18" font-weight="bold">Exportar Rack a PNG</text>
  <text x="30" y="65" fill="#8b949e" font-size="12">Selecciona el gabinete que deseas exportar</text>

  <!-- Button / Selection Item -->
  <rect x="30" y="95" width="440" height="40" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="45" y="120" fill="#c9d1d9" font-size="13">📷 Exportar: Rack_principal (12U)</text>

  <!-- Footer Button -->
  <rect x="380" y="160" width="90" height="32" fill="transparent" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="425" y="180" fill="#c9d1d9" font-size="12" text-anchor="middle">Cancelar</text>

</svg>
