<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460">
  <defs>
    <style>
      .lflow { animation: lflow 2.5s infinite linear; stroke-dasharray: 12 6; }
      @keyframes lflow { from{stroke-dashoffset:36} to{stroke-dashoffset:0} }
      .lflowR { animation: lflowR 2.5s infinite linear; stroke-dasharray: 8 5; }
      @keyframes lflowR { from{stroke-dashoffset:0} to{stroke-dashoffset:26} }
      .glow-em { animation: glowEm 3s infinite ease-in-out; }
      @keyframes glowEm { 0%,100%{opacity:1;font-size:30px} 50%{opacity:0.6;font-size:32px} }
    </style>
    <marker id="mB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#94a3b8"/>
    </marker>
    <marker id="mBr" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0,0 3,8 6" fill="#94a3b8"/>
    </marker>
    <marker id="mG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#10b981"/>
    </marker>
    <marker id="mGr" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0,0 3,8 6" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="920" height="460" fill="#090d17" rx="18"/>
  <text x="460" y="36" text-anchor="middle" fill="#94a3b8" font-size="15" font-family="monospace" font-weight="bold">💾 Las 3 Capas de Persistencia de RACK Designer 2</text>
  <text x="460" y="54" text-anchor="middle" fill="#475569" font-size="10" font-family="monospace">Datos recorren estas capas: RAM ↔ localStorage ↔ Archivo .rack en disco</text>

  <!-- ══ CAPA 1: RAM ══ -->
  <rect x="22" y="74" width="255" height="165" rx="12" fill="#0c1929" stroke="#38bdf8" stroke-width="2"/>
  <rect x="22" y="74" width="255" height="32" rx="12" fill="#0a2244"/>
  <text x="149" y="97" text-anchor="middle" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">CAPA 1 — VOLÁTIL</text>

  <text x="149" y="130" text-anchor="middle" font-size="32">🧠</text>
  <text x="149" y="158" text-anchor="middle" fill="#38bdf8" font-size="14" font-family="monospace" font-weight="bold">Memoria RAM</text>
  <text x="149" y="176" text-anchor="middle" fill="#3a5a7a" font-size="10" font-family="monospace">store._raw  (objeto JS vivo)</text>
  <text x="149" y="192" text-anchor="middle" fill="#3a5a7a" font-size="10" font-family="monospace">undoStack[] / redoStack[]</text>
  <text x="149" y="208" text-anchor="middle" fill="#3a5a7a" font-size="10" font-family="monospace">Listeners registrados (callbacks)</text>
  <text x="149" y="228" text-anchor="middle" fill="#1e3a6a" font-size="9.5" font-family="monospace">⚡ Perdido al cerrar la pestaña</text>

  <!-- Flecha RAM → localStorage (guardar) arriba -->
  <line x1="277" y1="142" x2="333" y2="142" stroke="#94a3b8" stroke-width="2" class="lflow" marker-end="url(#mB)"/>
  <text x="305" y="132" text-anchor="middle" fill="#475569" font-size="8.5" font-family="monospace">JSON.stringify()</text>
  <text x="305" y="142" text-anchor="middle" fill="#475569" font-size="8.5" font-family="monospace">+ setItem()</text>

  <!-- Flecha localStorage → RAM (cargar) abajo -->
  <line x1="333" y1="162" x2="277" y2="162" stroke="#475569" stroke-width="1.2" class="lflowR" marker-end="url(#mBr)"/>
  <text x="305" y="180" text-anchor="middle" fill="#2a3a4a" font-size="8.5" font-family="monospace">JSON.parse()</text>
  <text x="305" y="190" text-anchor="middle" fill="#2a3a4a" font-size="8.5" font-family="monospace">+ getItem()</text>

  <!-- ══ CAPA 2: localStorage ══ -->
  <rect x="333" y="74" width="255" height="165" rx="12" fill="#1a1200" stroke="#f59e0b" stroke-width="2"/>
  <rect x="333" y="74" width="255" height="32" rx="12" fill="#2a1f00"/>
  <text x="460" y="97" text-anchor="middle" fill="#f59e0b" font-size="12" font-family="monospace" font-weight="bold">CAPA 2 — SEMI-PERSISTENTE</text>

  <text x="460" y="130" text-anchor="middle" font-size="32">💾</text>
  <text x="460" y="158" text-anchor="middle" fill="#f59e0b" font-size="14" font-family="monospace" font-weight="bold">localStorage</text>
  <text x="460" y="176" text-anchor="middle" fill="#8a6a00" font-size="10" font-family="monospace">Clave: "RACK_DESIGNER_STATE"</text>
  <text x="460" y="192" text-anchor="middle" fill="#8a6a00" font-size="10" font-family="monospace">Valor: JSON.stringify(store._raw)</text>
  <text x="460" y="208" text-anchor="middle" fill="#8a6a00" font-size="10" font-family="monospace">Tamaño máximo: ~5 MB (límite browser)</text>
  <text x="460" y="228" text-anchor="middle" fill="#4a3800" font-size="9.5" font-family="monospace">🟡 Sobrevive F5 / cierre de pestaña</text>

  <!-- Flecha localStorage → .rack (exportar) arriba -->
  <line x1="588" y1="142" x2="644" y2="142" stroke="#10b981" stroke-width="2" class="lflow" marker-end="url(#mG)"/>
  <text x="616" y="132" text-anchor="middle" fill="#1a6a3a" font-size="8.5" font-family="monospace">exportJSON()</text>
  <text x="616" y="142" text-anchor="middle" fill="#1a6a3a" font-size="8.5" font-family="monospace">Blob + click</text>

  <!-- Flecha .rack → localStorage (importar) abajo -->
  <line x1="644" y1="162" x2="588" y2="162" stroke="#0a4a2a" stroke-width="1.2" class="lflowR" marker-end="url(#mGr)"/>
  <text x="616" y="180" text-anchor="middle" fill="#0a4a2a" font-size="8.5" font-family="monospace">importJSON()</text>
  <text x="616" y="190" text-anchor="middle" fill="#0a4a2a" font-size="8.5" font-family="monospace">FileReader + JSON.parse()</text>

  <!-- ══ CAPA 3: Archivo .rack ══ -->
  <rect x="644" y="74" width="255" height="165" rx="12" fill="#061a10" stroke="#10b981" stroke-width="2"/>
  <rect x="644" y="74" width="255" height="32" rx="12" fill="#0a2a18"/>
  <text x="771" y="97" text-anchor="middle" fill="#10b981" font-size="12" font-family="monospace" font-weight="bold">CAPA 3 — PERMANENTE</text>

  <text x="771" y="130" text-anchor="middle" font-size="32">📁</text>
  <text x="771" y="158" text-anchor="middle" fill="#10b981" font-size="14" font-family="monospace" font-weight="bold">Archivo .rack</text>
  <text x="771" y="176" text-anchor="middle" fill="#3d7059" font-size="10" font-family="monospace">JSON puro (extensión renombrada)</text>
  <text x="771" y="192" text-anchor="middle" fill="#3d7059" font-size="10" font-family="monospace">Descarga automática del navegador</text>
  <text x="771" y="208" text-anchor="middle" fill="#3d7059" font-size="10" font-family="monospace">Contiene TODO el store._raw completo</text>
  <text x="771" y="228" text-anchor="middle" fill="#1a4a2a" font-size="9.5" font-family="monospace">✅ Permanente. El user lo controla.</text>

  <!-- ══ Fila inferior: Exportaciones extras ══ -->
  <line x1="30" y1="265" x2="890" y2="265" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="6,4"/>
  <text x="460" y="285" text-anchor="middle" fill="#475569" font-size="12" font-family="monospace">— Exportaciones adicionales (solo lectura — no re-importables) —</text>

  <!-- CSV -->
  <rect x="22" y="300" width="200" height="140" rx="10" fill="#0c1929" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="122" y="320" text-anchor="middle" fill="#22d3ee" font-size="12" font-family="monospace" font-weight="bold">📊 CSV / Excel</text>
  <text x="122" y="338" text-anchor="middle" fill="#1a5a7a" font-size="9" font-family="monospace">modals.js → exportCSV()</text>
  <text x="122" y="355" text-anchor="middle" fill="#2a7a9a" font-size="9" font-family="monospace">Rack, U, Lado, Nombre</text>
  <text x="122" y="371" text-anchor="middle" fill="#2a7a9a" font-size="9" font-family="monospace">Marca, Modelo, Tipo, IP</text>
  <text x="122" y="387" text-anchor="middle" fill="#2a7a9a" font-size="9" font-family="monospace">MAC, Serie, Usuario</text>
  <text x="122" y="403" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace">✅ Seguro XSS. Modo Dios censura pass.</text>
  <text x="122" y="428" text-anchor="middle" fill="#1a3a5a" font-size="8.5" font-family="monospace">❌ No re-importable</text>

  <!-- PNG Rack -->
  <rect x="240" y="300" width="200" height="140" rx="10" fill="#0c1929" stroke="#6366f1" stroke-width="1.5"/>
  <text x="340" y="320" text-anchor="middle" fill="#818cf8" font-size="12" font-family="monospace" font-weight="bold">🖼️ PNG Rack</text>
  <text x="340" y="338" text-anchor="middle" fill="#3a3a7a" font-size="9" font-family="monospace">modals.js → exportRackToPNG()</text>
  <text x="340" y="355" text-anchor="middle" fill="#4a4a9a" font-size="9" font-family="monospace">Canvas offscreen 2x resolución</text>
  <text x="340" y="371" text-anchor="middle" fill="#4a4a9a" font-size="9" font-family="monospace">Dibuja vista Frontal + Trasera</text>
  <text x="340" y="387" text-anchor="middle" fill="#4a4a9a" font-size="9" font-family="monospace">toDataURL('image/png')</text>
  <text x="340" y="403" text-anchor="middle" fill="#4a4a9a" font-size="9" font-family="monospace">Sin contraseñas en la imagen</text>
  <text x="340" y="428" text-anchor="middle" fill="#1a1a5a" font-size="8.5" font-family="monospace">❌ No re-importable</text>

  <!-- PNG Topología -->
  <rect x="458" y="300" width="210" height="140" rx="10" fill="#0c1929" stroke="#f472b6" stroke-width="1.5"/>
  <text x="563" y="320" text-anchor="middle" fill="#f472b6" font-size="12" font-family="monospace" font-weight="bold">🗺️ PNG Topología</text>
  <text x="563" y="338" text-anchor="middle" fill="#7a3a6a" font-size="9" font-family="monospace">topology.js → exportTopologyToPNG()</text>
  <text x="563" y="355" text-anchor="middle" fill="#9a4a8a" font-size="9" font-family="monospace">Canvas offscreen temporal</text>
  <text x="563" y="371" text-anchor="middle" fill="#9a4a8a" font-size="9" font-family="monospace">Resetea zoom=1 / pan=0</text>
  <text x="563" y="387" text-anchor="middle" fill="#9a4a8a" font-size="9" font-family="monospace">Restaura el ctx original al final</text>
  <text x="563" y="403" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace">✅ Sistema try/finally evita cuelgues</text>
  <text x="563" y="428" text-anchor="middle" fill="#4a1a3a" font-size="8.5" font-family="monospace">❌ No re-importable</text>

  <!-- Tablas UI -->
  <rect x="686" y="300" width="210" height="140" rx="10" fill="#0c1929" stroke="#10b981" stroke-width="1.5"/>
  <text x="791" y="320" text-anchor="middle" fill="#10b981" font-size="12" font-family="monospace" font-weight="bold">📋 Tablas UI (HTML)</text>
  <text x="791" y="338" text-anchor="middle" fill="#2a6a4a" font-size="9" font-family="monospace">tables.js</text>
  <text x="791" y="355" text-anchor="middle" fill="#2a6a4a" font-size="9" font-family="monospace">renderInventoryTable()</text>
  <text x="791" y="371" text-anchor="middle" fill="#2a6a4a" font-size="9" font-family="monospace">Solo visualización HTML</text>
  <text x="791" y="387" text-anchor="middle" fill="#2a6a4a" font-size="9" font-family="monospace">Edición inline → store.updateDevice()</text>
  <text x="791" y="403" text-anchor="middle" fill="#2a6a4a" font-size="9" font-family="monospace">Se regenera en cada renderAll()</text>
  <text x="791" y="428" text-anchor="middle" fill="#1a4a2a" font-size="8.5" font-family="monospace">🔁 Reactivo al Store</text>
</svg>
