<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="180" style="background:#090d16; border-radius:8px; border:1px solid #242f41;">
  <g transform="translate(40, 20)">
    <!-- Rack Header -->
    <rect x="0" y="0" width="220" height="30" rx="4" fill="#141a24" stroke="#38bdf8"/>
    <circle cx="15" cy="15" r="5" fill="#10b981"/>
    <text x="30" y="20" fill="#f1f5f9" font-family="'Outfit'" font-size="12" font-weight="600">Rack A01</text>
    
    <rect x="160" y="5" width="30" height="20" rx="3" fill="#1e293b" stroke="#475569"/>
    <text x="175" y="18" fill="#cbd5e1" font-family="'Outfit'" font-size="10" text-anchor="middle">🔄</text>
    
    <rect x="195" y="5" width="18" height="20" rx="3" fill="#3b82f6" stroke="#60a5fa"/>
    <text x="204" y="18" fill="#fff" font-family="'Outfit'" font-size="12" font-weight="bold" text-anchor="middle">⋮</text>

    <!-- Dropdown Menu -->
    <rect x="115" y="32" width="120" height="100" rx="4" fill="#1e293b" stroke="#475569" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>
    
    <text x="125" y="50" fill="#f8fafc" font-family="'Outfit'" font-size="10">⚡ Agregar Equipo</text>
    <text x="125" y="68" fill="#f8fafc" font-family="'Outfit'" font-size="10">🧹 Limpiar Gabinete</text>
    
    <line x1="120" y1="78" x2="230" y2="78" stroke="#334155" stroke-width="1"/>
    
    <text x="125" y="93" fill="#f8fafc" font-family="'Outfit'" font-size="10">✎ Editar Gabinete</text>
    <text x="125" y="113" fill="#ef4444" font-family="'Outfit'" font-size="10">🗑 Eliminar Gabinete</text>

    <path d="M 245 40 C 275 40, 295 10, 275 -5" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow)"/>
    <text x="285" y="-15" fill="#10b981" font-family="'Outfit'" font-size="9" font-weight="600" text-anchor="middle">Agrupa acciones críticas</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#10b981"/>
    </marker>
  </defs>
</svg>
