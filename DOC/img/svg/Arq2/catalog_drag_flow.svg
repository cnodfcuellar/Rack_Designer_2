<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="200" style="background:#090d16; border-radius:8px; border:1px solid #242f41;">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Catalog Panel -->
  <rect x="20" y="30" width="140" height="140" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="90" y="55" fill="#f1f5f9" font-family="'Outfit'" font-size="13" font-weight="700" text-anchor="middle">Catálogo Lateral</text>
  
  <rect x="30" y="70" width="120" height="25" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="2,2"/>
  <text x="90" y="86" fill="#38bdf8" font-family="'Outfit'" font-size="10" text-anchor="middle">🌐 Network Switch</text>
  
  <rect x="30" y="100" width="120" height="25" rx="4" fill="#0f172a" stroke="#10b981" stroke-dasharray="2,2"/>
  <text x="90" y="116" fill="#10b981" font-family="'Outfit'" font-size="10" text-anchor="middle">💻 Server</text>

  <rect x="30" y="130" width="120" height="25" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-dasharray="2,2"/>
  <text x="90" y="146" fill="#f59e0b" font-family="'Outfit'" font-size="10" text-anchor="middle">🗄️ Storage</text>

  <path d="M 160 100 L 250 100" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="205" y="90" fill="#cbd5e1" font-family="'Outfit'" font-size="10" font-weight="600" text-anchor="middle">Arrastrar</text>
  <text x="205" y="115" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="9" text-anchor="middle">(dragstart)</text>

  <!-- Payload -->
  <rect x="260" y="60" width="130" height="80" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="325" y="85" fill="#a78bfa" font-family="'Outfit'" font-size="12" font-weight="700" text-anchor="middle">JSON Payload</text>
  <text x="325" y="105" fill="#e0e7ff" font-family="'JetBrains Mono'" font-size="9" text-anchor="middle">{ type: "SERVER",</text>
  <text x="325" y="120" fill="#e0e7ff" font-family="'JetBrains Mono'" font-size="9" text-anchor="middle">  height: 2U }</text>

  <path d="M 390 100 L 460 100" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Rack Slot -->
  <rect x="470" y="40" width="100" height="120" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <text x="520" y="60" fill="#94a3b8" font-family="'Outfit'" font-size="11" font-weight="600" text-anchor="middle">Rack U-Slot</text>
  <rect x="480" y="85" width="80" height="30" rx="2" fill="#064e3b" stroke="#10b981"/>
  <text x="520" y="104" fill="#34d399" font-family="'JetBrains Mono'" font-size="10" text-anchor="middle">Drop / Instalado</text>
</svg>
