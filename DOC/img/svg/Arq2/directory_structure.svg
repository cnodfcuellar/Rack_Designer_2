<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 750" width="100%" height="750" style="background:#090d16; border-radius:8px; border:1px solid #242f41;">
  <g transform="translate(40, 30)">
    <!-- Root -->
    <rect x="0" y="0" width="160" height="30" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="20" fill="#f1f5f9" font-family="'Outfit'" font-size="14" font-weight="600" text-anchor="middle">📁 Rack_Designer_2/</text>

    <!-- Main trunk -->
    <path d="M 80 30 L 80 700" stroke="#334155" stroke-width="2" fill="none"/>

    <!-- /js -->
    <path d="M 80 60 L 110 60" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="45" width="80" height="30" rx="4" fill="#1e293b" stroke="#f59e0b"/>
    <text x="150" y="65" fill="#fef3c7" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">📁 js/</text>
    <path d="M 150 75 L 150 320" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    
    <!-- /js/ui -->
    <path d="M 150 100 L 170 100" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <rect x="170" y="85" width="120" height="30" rx="4" fill="#1e1b4b" stroke="#8b5cf6"/>
    <text x="230" y="105" fill="#e0e7ff" font-family="'Outfit'" font-size="12" font-weight="600" text-anchor="middle">📁 ui/</text>
    
    <path d="M 230 115 L 230 185" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    
    <!-- inside /js/ui -->
    <path d="M 230 135 L 250 135" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="255" y="139" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">rack.js, fileManager.js, catalog.js...</text>

    <!-- /js/ui/modals -->
    <path d="M 230 160 L 250 160" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="255" y="164" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 modals/ (ExportModal.js, RackModal.js)</text>

