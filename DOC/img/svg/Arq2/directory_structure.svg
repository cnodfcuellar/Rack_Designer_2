    <path d="M 150 295 L 170 295" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="299" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 core/ (export.js)</text>

