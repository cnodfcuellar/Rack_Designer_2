    <path d="M 80 440 L 110 440" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="425" width="80" height="30" rx="4" fill="#1e293b" stroke="#ec4899"/>
    <text x="150" y="445" fill="#fce7f3" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">📁 css/</text>
    <path d="M 150 455 L 150 490" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <path d="M 150 475 L 170 475" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="479" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 components/ (buttons.css, modals.css)</text>
    <path d="M 150 490 L 170 490" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="494" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">style.css, layout.css</text>

    <!-- /doc -->
    <path d="M 80 530 L 110 530" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="515" width="80" height="30" rx="4" fill="#1e293b" stroke="#10b981"/>
    <text x="150" y="535" fill="#d1fae5" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">📁 doc/</text>
    <path d="M 150 545 L 150 580" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
