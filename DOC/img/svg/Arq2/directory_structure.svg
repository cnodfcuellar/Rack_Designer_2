    <path d="M 80 690 L 110 690" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="675" width="220" height="30" rx="4" fill="#0f172a" stroke="#64748b"/>
    <text x="220" y="695" fill="#f1f5f9" font-family="'Outfit'" font-size="12" text-anchor="middle">index.html, package.json, sw.js</text>

    <!-- Info Box -->
    <rect x="480" y="620" width="180" height="80" rx="6" fill="#0d1b2a" stroke="#38bdf8" stroke-dasharray="4,4"/>
    <text x="570" y="645" fill="#38bdf8" font-family="'Outfit'" font-size="12" font-weight="600" text-anchor="middle">Modularización v2.2</text>
    <text x="570" y="665" fill="#cbd5e1" font-family="'Outfit'" font-size="10" text-anchor="middle">El código está desagregado en</text>
    <text x="570" y="680" fill="#cbd5e1" font-family="'Outfit'" font-size="10" text-anchor="middle">sub-carpetas lógicas para</text>
    <text x="570" y="695" fill="#cbd5e1" font-family="'Outfit'" font-size="10" text-anchor="middle">escalabilidad masiva.</text>
