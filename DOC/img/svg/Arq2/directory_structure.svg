    <text x="175" y="569" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 html/ (manual.html, arquitectura_2.html)</text>
    <path d="M 150 580 L 170 580" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="584" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 log/ (CHANGELOG.md)</text>

    <!-- /tests -->
    <path d="M 80 620 L 110 620" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="605" width="80" height="30" rx="4" fill="#1e293b" stroke="#a855f7"/>
    <text x="150" y="625" fill="#f3e8ff" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">📁 tests/</text>
    <path d="M 150 635 L 150 655" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <path d="M 150 655 L 170 655" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="659" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">Rack.test.js</text>

