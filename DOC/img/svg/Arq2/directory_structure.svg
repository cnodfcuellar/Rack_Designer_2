<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="100%" height="550" style="background:#090d16; border-radius:8px; border:1px solid #242f41;">
  <g transform="translate(40, 30)">
    <!-- Root -->
    <rect x="0" y="0" width="160" height="30" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="20" fill="#f1f5f9" font-family="'Outfit'" font-size="14" font-weight="600" text-anchor="middle">📁 Rack_Designer_2/</text>

    <!-- Main trunk -->
    <path d="M 80 30 L 80 500" stroke="#334155" stroke-width="2" fill="none"/>

    <!-- /js -->
    <path d="M 80 60 L 110 60" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="45" width="80" height="30" rx="4" fill="#1e293b" stroke="#f59e0b"/>
    <text x="150" y="65" fill="#fef3c7" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">📁 js/</text>
    <path d="M 150 75 L 150 250" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    
    <!-- /js/ui -->
    <path d="M 150 100 L 170 100" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <rect x="170" y="85" width="120" height="30" rx="4" fill="#1e1b4b" stroke="#8b5cf6"/>
    <text x="230" y="105" fill="#e0e7ff" font-family="'Outfit'" font-size="12" font-weight="600" text-anchor="middle">📁 ui/</text>
    
    <path d="M 230 115 L 230 185" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    
    <!-- inside /js/ui -->
    <path d="M 230 135 L 250 135" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="255" y="139" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">rack.js, fileManager.js, catalog.js...</text>

    <!-- /js/ui/modals -->
    <path d="M 230 160 L 250 160" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="255" y="164" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 modals/ (ExportModal.js, RackModal.js)</text>

    <!-- /js/ui/topology -->
    <path d="M 230 185 L 250 185" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="255" y="189" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 topology/ (TopologyEvents.js, Renderer.js)</text>

    <!-- /js/service -->
    <path d="M 150 220 L 170 220" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="224" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 service/ (service-worker.js)</text>

    <!-- /js core files -->
    <path d="M 150 250 L 170 250" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="254" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">main.js, store.js, utils.js, demoData.js</text>

    <!-- /css -->
    <path d="M 80 290 L 110 290" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="275" width="80" height="30" rx="4" fill="#1e293b" stroke="#ec4899"/>
    <text x="150" y="295" fill="#fce7f3" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">📁 css/</text>
    <path d="M 150 305 L 150 340" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <path d="M 150 325 L 170 325" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="329" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 components/ (buttons.css, modals.css)</text>
    <path d="M 150 340 L 170 340" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="344" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">style.css, layout.css</text>

    <!-- /doc -->
    <path d="M 80 380 L 110 380" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="365" width="80" height="30" rx="4" fill="#1e293b" stroke="#10b981"/>
    <text x="150" y="385" fill="#d1fae5" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">📁 doc/</text>
    
    <path d="M 150 395 L 150 430" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <path d="M 150 415 L 170 415" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="419" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 html/ (manual.html, arquitectura_2.html)</text>
    <path d="M 150 430 L 170 430" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="434" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 log/ (CHANGELOG.md)</text>

    <!-- Root files -->
    <path d="M 80 470 L 110 470" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="455" width="220" height="30" rx="4" fill="#0f172a" stroke="#64748b"/>
    <text x="220" y="475" fill="#f1f5f9" font-family="'Outfit'" font-size="12" text-anchor="middle">index.html, package.json, sw.js</text>

    <!-- Info Box -->
    <rect x="480" y="400" width="180" height="80" rx="6" fill="#0d1b2a" stroke="#38bdf8" stroke-dasharray="4,4"/>
    <text x="570" y="425" fill="#38bdf8" font-family="'Outfit'" font-size="12" font-weight="600" text-anchor="middle">Modularización v2.1</text>
    <text x="570" y="445" fill="#cbd5e1" font-family="'Outfit'" font-size="10" text-anchor="middle">El código está desagregado en</text>
    <text x="570" y="460" fill="#cbd5e1" font-family="'Outfit'" font-size="10" text-anchor="middle">sub-carpetas lógicas para</text>
    <text x="570" y="475" fill="#cbd5e1" font-family="'Outfit'" font-size="10" text-anchor="middle">escalabilidad masiva.</text>
  </g>
</svg>
