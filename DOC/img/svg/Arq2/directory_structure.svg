    <path d="M 230 185 L 250 185" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="255" y="189" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 topology/ (TopologyEvents.js, Renderer.js)</text>

    <!-- /js/service -->
    <path d="M 150 220 L 170 220" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="224" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 service/ (service-worker.js)</text>

    <!-- /js/models -->
    <path d="M 150 245 L 170 245" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="249" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 models/ (Rack.js, Device.js, Cable.js)</text>

    <!-- /js/api -->
    <path d="M 150 270 L 170 270" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="274" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">📁 api/ (apiClient.js)</text>

