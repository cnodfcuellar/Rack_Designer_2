<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="100%" height="180" style="background:#090d16; border-radius:8px; border:1px solid #242f41;">
  <defs>
    <marker id="arrow-sw" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="20" y="60" width="100" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="70" y="85" fill="#f1f5f9" font-family="'Outfit'" font-size="14" font-weight="600" text-anchor="middle">Navegador</text>
  <text x="70" y="105" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10" text-anchor="middle">Pide Scope "/"</text>

  <path d="M 120 90 L 170 90" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-sw)"/>

  <!-- Root SW -->
  <rect x="180" y="45" width="140" height="90" rx="8" fill="#0d1f2d" stroke="#0ea5e9" stroke-width="2"/>
  <text x="250" y="70" fill="#38bdf8" font-family="'Outfit'" font-size="12" font-weight="700" text-anchor="middle">service-worker.js</text>
  <text x="250" y="85" fill="#bae6fd" font-family="'Outfit'" font-size="10" font-weight="600" text-anchor="middle">(En la Raíz)</text>
  
  <rect x="190" y="95" width="120" height="25" rx="4" fill="#1e293b"/>
  <text x="250" y="112" fill="#f59e0b" font-family="'JetBrains Mono'" font-size="9" text-anchor="middle">importScripts(...)</text>

  <path d="M 320 90 L 350 90" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-sw)"/>

  <!-- Actual SW Logic -->
  <rect x="360" y="55" width="120" height="70" rx="8" fill="#162e24" stroke="#10b981" stroke-width="2"/>
  <text x="420" y="80" fill="#f1f5f9" font-family="'Outfit'" font-size="12" font-weight="600" text-anchor="middle">js/service/</text>
  <text x="420" y="95" fill="#f1f5f9" font-family="'Outfit'" font-size="12" font-weight="600" text-anchor="middle">service-worker.js</text>
  <text x="420" y="112" fill="#34d399" font-family="'JetBrains Mono'" font-size="9" text-anchor="middle">Lógica Real Cache</text>

</svg>
