<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="240" style="background:#090d16; border-radius:8px; border:1px solid #242f41;">
  <defs>
    <marker id="arrow-util" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Central Utils Node -->
  <rect x="200" y="90" width="100" height="60" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="125" fill="#f8fafc" font-family="'Outfit'" font-size="16" font-weight="700" text-anchor="middle">🛠️ utils.js</text>

  <!-- Branches -->
  <path d="M 250 90 L 250 50 L 350 50" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-util)"/>
  <path d="M 200 120 L 140 120" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-util)"/>
  <path d="M 300 120 L 360 120" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-util)"/>
  <path d="M 250 150 L 250 190 L 350 190" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow-util)"/>

  <!-- Helpers -->
  <!-- Top Right: UUID -->
  <rect x="360" y="30" width="120" height="40" rx="4" fill="#0f172a" stroke="#8b5cf6"/>
  <text x="420" y="49" fill="#a78bfa" font-family="'JetBrains Mono'" font-size="11" font-weight="700" text-anchor="middle">uuidv4()</text>
  <text x="420" y="63" fill="#cbd5e1" font-family="'Outfit'" font-size="9" text-anchor="middle">Generador de IDs</text>

  <!-- Left: Toast -->
  <rect x="10" y="100" width="120" height="40" rx="4" fill="#0f172a" stroke="#10b981"/>
  <text x="70" y="119" fill="#34d399" font-family="'JetBrains Mono'" font-size="11" font-weight="700" text-anchor="middle">showToast()</text>
  <text x="70" y="133" fill="#cbd5e1" font-family="'Outfit'" font-size="9" text-anchor="middle">Notificaciones UI</text>

  <!-- Right: escapeHTML -->
  <rect x="370" y="100" width="120" height="40" rx="4" fill="#0f172a" stroke="#f59e0b"/>
  <text x="430" y="119" fill="#fcd34d" font-family="'JetBrains Mono'" font-size="11" font-weight="700" text-anchor="middle">escapeHTML()</text>
  <text x="430" y="133" fill="#cbd5e1" font-family="'Outfit'" font-size="9" text-anchor="middle">Prevención XSS</text>

  <!-- Bottom Right: Export -->
  <rect x="360" y="170" width="120" height="40" rx="4" fill="#0f172a" stroke="#ec4899"/>
  <text x="420" y="189" fill="#f472b6" font-family="'JetBrains Mono'" font-size="11" font-weight="700" text-anchor="middle">downloadData()</text>
  <text x="420" y="203" fill="#cbd5e1" font-family="'Outfit'" font-size="9" text-anchor="middle">Exportar JSON Blob</text>

</svg>
