    <text x="160" y="45" fill="#64748b" font-family="'Outfit'" font-size="28" text-anchor="middle">🗄️</text>
    <text x="160" y="65" fill="#94a3b8" font-family="'Outfit'" font-size="12" text-anchor="middle">No hay gabinetes en esta sala.</text>
    
    <rect x="100" y="85" width="55" height="24" rx="4" fill="#0284c7" stroke="#0ea5e9"/>
