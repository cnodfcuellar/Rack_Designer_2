<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="700" style="background:#090d16; border-radius:12px; border:2px solid #2a3441; font-family:'Outfit', sans-serif;">
  
  <defs>
    <!-- Patrón sutil para el Canvas Principal -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#151c2e" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Sidebar Toggle (Izquierda) -->
  <rect x="0" y="0" width="70" height="60" fill="#1e293b" stroke="#2a3441" stroke-width="1"/>
  <text x="35" y="36" fill="#f0f4ff" font-size="20" font-weight="bold" text-anchor="middle">☰</text>
  <text x="35" y="52" fill="#8b9ab8" font-size="9" text-anchor="middle">Sidebar</text>

  <!-- 2. Logo (Derecha) -->
  <rect x="70" y="0" width="330" height="60" fill="#0f1524" stroke="#2a3441" stroke-width="1"/>
  <text x="235" y="36" fill="#f0f4ff" font-size="16" font-weight="700" text-anchor="middle">1. Logo / Identidad</text>

  <!-- 3. Top Header -->
  <rect x="0" y="60" width="400" height="50" fill="#151c2e" stroke="#2a3441" stroke-width="1"/>
  <text x="200" y="90" fill="#8b9ab8" font-size="14" font-weight="500" text-anchor="middle">2. Top Header (Perfil, Alertas, Opciones)</text>

  <!-- 4. Toolbar y Tabs -->
  <rect x="0" y="110" width="400" height="50" fill="#1e293b" stroke="#2a3441" stroke-width="1"/>
  <rect x="10" y="118" width="80" height="34" rx="4" fill="#0b0f19" stroke="#38bdf8"/>
  <rect x="95" y="118" width="80" height="34" rx="4" fill="#0f1524"/>
  <rect x="180" y="118" width="80" height="34" rx="4" fill="#0f1524"/>
  <text x="200" y="140" fill="#f0f4ff" font-size="14" font-weight="500" text-anchor="middle" style="letter-spacing: 1px;">3. Toolbar / View Tabs</text>

  <!-- 5. Main Canvas -->
  <rect x="0" y="160" width="400" height="490" fill="url(#grid)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Elemento simulado en el canvas para dar contexto -->
  <rect x="40" y="220" width="320" height="360" rx="8" fill="#151c2e" stroke="#2a3441" stroke-dasharray="4,4"/>
  <text x="200" y="390" fill="#38bdf8" font-size="20" font-weight="700" text-anchor="middle" filter="url(#glow)">4. Main Canvas</text>
  <text x="200" y="415" fill="#8b9ab8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">(Vista Física de Racks / Topología)</text>

  <!-- 6. Status / Bottom Bar -->
  <rect x="0" y="650" width="400" height="50" fill="#0f1524" stroke="#2a3441" stroke-width="1"/>
  <text x="200" y="680" fill="#8b9ab8" font-size="14" font-weight="500" text-anchor="middle">5. Status / Bottom Bar (Consola)</text>

</svg>
