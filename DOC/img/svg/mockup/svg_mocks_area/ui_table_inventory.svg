<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <style>
      .bg { fill: #0b1121; }
      .bg-panel { fill: #0f172a; border-top: 1px solid #1e293b; }
      .text-normal { fill: #94a3b8; font-family: 'Inter', sans-serif; font-size: 13px; }
      .text-cyan { fill: #0ea5e9; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; }
      .text-purple { fill: #c084fc; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; }
      .text-th { fill: #94a3b8; font-family: monospace, sans-serif; font-size: 11px; font-weight: bold; }
      .text-td { fill: #64748b; font-family: monospace, sans-serif; font-size: 12px; }
      .text-white { fill: #cbd5e1; font-family: monospace, sans-serif; font-size: 12px; }
      .btn { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .row-bg { fill: #0f172a; }
      .row-border { stroke: #1e293b; stroke-width: 1; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" />

  <!-- Top Bar Area -->
  <g transform="translate(0, 0)">
    <rect width="1200" height="60" class="bg-panel" />
    
    <g transform="translate(30, 15)">
      <!-- Tabs -->
      <rect x="0" y="0" width="90" height="30" rx="6" fill="#1e293b" />
      <text x="45" y="19" class="text-cyan" text-anchor="middle">Inventario</text>
      <text x="140" y="19" class="text-normal" text-anchor="middle">Conexiones</text>
      
      <!-- Right Side Actions -->
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="80" height="30" rx="6" fill="none" stroke="#0ea5e9" stroke-width="1" />
        <text x="40" y="19" class="text-cyan" text-anchor="middle">+ Equipo</text>
        
        <rect x="90" y="0" width="130" height="30" rx="6" fill="rgba(139, 92, 246, 0.1)" stroke="#8b5cf6" stroke-width="1" />
        <path d="M105 10L102 16H105L103 20L108 14H105L105 10Z" fill="#fb923c" />
        <text x="115" y="19" class="text-purple">Agregar Equipo</text>

        <rect x="230" y="0" width="90" height="30" rx="6" fill="none" stroke="#0ea5e9" stroke-width="1" />
        <text x="275" y="19" class="text-cyan" text-anchor="middle">+ Conexión</text>

        <rect x="330" y="0" width="150" height="30" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1"/>
        <text x="340" y="19" class="text-td">Filtrar tabla...</text>

        <rect x="490" y="0" width="60" height="30" rx="6" class="btn" />
        <text x="520" y="19" class="text-normal" text-anchor="middle">↓ CSV</text>
        
        <rect x="560" y="0" width="70" height="30" rx="6" class="btn" />
        <text x="595" y="19" class="text-normal" text-anchor="middle">↓ Excel</text>
        
        <rect x="640" y="0" width="80" height="30" rx="6" class="btn" />
        <text x="680" y="19" class="text-normal" text-anchor="middle">⛶ Expandir</text>
        
        <rect x="730" y="0" width="30" height="30" rx="6" class="btn" />
        <path d="M740 13 L745 18 L750 13" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Table Header -->
  <g transform="translate(0, 60)">
    <line x1="0" y1="0" x2="1200" y2="0" class="row-border" />
    <g transform="translate(15, 20)">
      <text x="0" y="0" class="text-th">Rack</text>
      <text x="70" y="0" class="text-th">U</text>
      <text x="110" y="0" class="text-th">Lado</text>
      <text x="180" y="0" class="text-th">Nombre</text>
      <text x="360" y="0" class="text-th">Marca</text>
      <text x="430" y="0" class="text-th">Modelo</text>
      <text x="550" y="0" class="text-th">Tipo</text>
      <text x="630" y="0" class="text-th">IP</text>
      <text x="730" y="0" class="text-th">MAC</text>
      <text x="860" y="0" class="text-th">Serie</text>
      <text x="940" y="0" class="text-th">Usuario</text>
      <text x="1000" y="0" class="text-th">Contraseña</text>
      <text x="1080" y="0" class="text-th">Consumo (W)</text>
      <text x="1160" y="0" class="text-th">Tomas</text>
    </g>
  </g>

  <!-- Row 1 Switch -->
  <g transform="translate(0, 95)">
    <line x1="0" y1="0" x2="1200" y2="0" class="row-border" />
    <g transform="translate(15, 25)">
      <text x="0" y="0" class="text-td">Rack 101</text>
      <text x="70" y="0" class="text-white">40</text>
      
      <!-- Lado Pill -->
      <rect x="110" y="-12" width="60" height="20" rx="10" fill="none" stroke="#334155" stroke-width="1" />
      <text x="140" y="2" class="text-td" text-anchor="middle">Frontal</text>
      
      <text x="180" y="0" class="text-white">Switch Rack 101</text>
      <text x="360" y="0" class="text-td">Cisco</text>
      <text x="430" y="0" class="text-td">Catalyst 9300</text>
      
      <!-- Tipo Pill (switch) -->
      <rect x="550" y="-12" width="48" height="20" rx="4" fill="#064e3b" />
      <text x="574" y="2" class="text-white" fill="#34d399" text-anchor="middle">switch</text>
      
      <text x="630" y="0" class="text-white">10.10.10.101</text>
      <text x="730" y="0" class="text-white">00:11:22:33:10:65</text>
      <text x="860" y="0" class="text-td">SW-101</text>
      <text x="940" y="0" class="text-td">admin</text>
      <text x="1000" y="0" class="text-td">********</text>
      <text x="1080" y="0" class="text-white">250</text>
      <text x="1160" y="0" class="text-white">1</text>
    </g>
  </g>

  <!-- Row 2 UPS -->
  <g transform="translate(0, 140)">
    <line x1="0" y1="0" x2="1200" y2="0" class="row-border" />
    <g transform="translate(15, 25)">
      <text x="0" y="0" class="text-td">Rack 101</text>
      <text x="70" y="0" class="text-white">1</text>
      <rect x="110" y="-12" width="60" height="20" rx="10" fill="none" stroke="#334155" stroke-width="1" />
      <text x="140" y="2" class="text-td" text-anchor="middle">Frontal</text>
      <text x="180" y="0" class="text-td">UPS Rack 101</text>
      <text x="360" y="0" class="text-td">APC</text>
      <text x="430" y="0" class="text-td">Smart-UPS X 3000</text>
      
      <!-- Tipo Pill (ups) -->
      <rect x="550" y="-12" width="35" height="20" rx="4" fill="#4c1d95" />
      <text x="567" y="2" class="text-white" fill="#c084fc" text-anchor="middle">ups</text>
      
      <text x="630" y="0" class="text-td">10.10.20.101</text>
      <text x="730" y="0" class="text-td">00:11:22:33:20:65</text>
      <text x="860" y="0" class="text-td">UPS-101</text>
      <text x="940" y="0" class="text-td">admin</text>
      <text x="1000" y="0" class="text-td">********</text>
      <text x="1080" y="0" class="text-white">3000</text>
      <text x="1160" y="0" class="text-white">8</text>
    </g>
  </g>

  <!-- Row 3 Server 1 -->
  <g transform="translate(0, 185)">
    <line x1="0" y1="0" x2="1200" y2="0" class="row-border" />
    <g transform="translate(15, 25)">
      <text x="0" y="0" class="text-td">Rack 101</text>
      <text x="70" y="0" class="text-white">3</text>
      <rect x="110" y="-12" width="60" height="20" rx="10" fill="none" stroke="#334155" stroke-width="1" />
      <text x="140" y="2" class="text-td" text-anchor="middle">Frontal</text>
      <text x="180" y="0" class="text-white">Servidor Nodo 1 - Rack 101</text>
      <text x="360" y="0" class="text-td">Dell</text>
      <text x="430" y="0" class="text-td">PowerEdge R740</text>
      
      <!-- Tipo Pill (server) -->
      <rect x="550" y="-12" width="50" height="20" rx="4" fill="#0c4a6e" />
      <text x="575" y="2" class="text-white" fill="#38bdf8" text-anchor="middle">server</text>
      
      <text x="630" y="0" class="text-white">10.10.30.11</text>
      <text x="730" y="0" class="text-white">AA:BB:CC:00:30:b</text>
      <text x="860" y="0" class="text-td">SRV-101-1</text>
      <text x="940" y="0" class="text-td">root</text>
      <text x="1000" y="0" class="text-td">********</text>
      <text x="1080" y="0" class="text-white">600</text>
      <text x="1160" y="0" class="text-white">2</text>
    </g>
  </g>

  <!-- Row 4 Server 2 -->
  <g transform="translate(0, 230)">
    <line x1="0" y1="0" x2="1200" y2="0" class="row-border" />
    <g transform="translate(15, 25)">
      <text x="0" y="0" class="text-td">Rack 101</text>
      <text x="70" y="0" class="text-white">6</text>
      <rect x="110" y="-12" width="60" height="20" rx="10" fill="none" stroke="#334155" stroke-width="1" />
      <text x="140" y="2" class="text-td" text-anchor="middle">Frontal</text>
      <text x="180" y="0" class="text-white">Servidor Nodo 2 - Rack 101</text>
      <text x="360" y="0" class="text-td">Dell</text>
      <text x="430" y="0" class="text-td">PowerEdge R740</text>
      
      <!-- Tipo Pill (server) -->
      <rect x="550" y="-12" width="50" height="20" rx="4" fill="#0c4a6e" />
      <text x="575" y="2" class="text-white" fill="#38bdf8" text-anchor="middle">server</text>
      
      <text x="630" y="0" class="text-white">10.10.30.12</text>
      <text x="730" y="0" class="text-white">AA:BB:CC:00:30:c</text>
      <text x="860" y="0" class="text-td">SRV-101-2</text>
      <text x="940" y="0" class="text-td">root</text>
      <text x="1000" y="0" class="text-td">********</text>
      <text x="1080" y="0" class="text-white">600</text>
      <text x="1160" y="0" class="text-white">2</text>
    </g>
    <line x1="0" y1="45" x2="1200" y2="45" class="row-border" />
  </g>
</svg>
