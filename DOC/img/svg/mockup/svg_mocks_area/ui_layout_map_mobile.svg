<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%">
  <defs>
    <style>
      .text-light { fill: #ffffff; font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .text-dark { fill: #0f172a; font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .subtext-light { fill: rgba(255,255,255,0.75); font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 10px; text-anchor: middle; dominant-baseline: middle; }
      .subtext-dark { fill: rgba(15,23,42,0.75); font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 10px; text-anchor: middle; dominant-baseline: middle; }
      .block { stroke: #1e293b; stroke-width: 4; rx: 6; }
    </style>
  </defs>

  <rect width="400" height="700" fill="#0f172a" />

  <!-- 4. Sidebar Toggle (Gris Lateral en Desktop) -->
  <rect x="4" y="4" width="56" height="56" fill="#334155" class="block" />
  <text x="32" y="32" class="text-light">☰</text>

  <!-- 1. Logo / Top Left (Pizarra Oscuro) -->
  <rect x="64" y="4" width="332" height="56" fill="#1e293b" class="block" />
  <text x="230" y="25" class="text-light">1. Logo / Header</text>
  <text x="230" y="40" class="subtext-light">ui_app_header.svg</text>

  <!-- 2. Top Header (Celeste) -->
  <rect x="4" y="64" width="392" height="56" fill="#0ea5e9" class="block" />
  <text x="200" y="85" class="text-light">2. Top Header</text>
  <text x="200" y="100" class="subtext-light">ui_top_bar.svg</text>

  <!-- 3. Toolbar / Tabs (Violeta) -->
  <rect x="4" y="124" width="392" height="56" fill="#8b5cf6" class="block" />
  <text x="200" y="145" class="text-light">3. Toolbar / Tabs</text>
  <text x="200" y="160" class="subtext-light">ui_zoom_controls.svg</text>

  <!-- 5. Main Canvas (Gris Claro) -->
  <rect x="4" y="184" width="392" height="442" fill="#cbd5e1" class="block" />
  <text x="200" y="395" class="text-dark">5. Main Canvas</text>
  <text x="200" y="410" class="subtext-dark">ui_main_canvas.svg</text>

  <!-- 6. Bottom Bar (Rosa Oscuro / Rojo) -->
  <rect x="4" y="630" width="392" height="66" fill="#f43f5e" class="block" />
  <text x="200" y="655" class="text-light">6. Bottom Bar / Consola</text>
  <text x="200" y="670" class="subtext-light">ui_bottom_bar.svg</text>

</svg>
