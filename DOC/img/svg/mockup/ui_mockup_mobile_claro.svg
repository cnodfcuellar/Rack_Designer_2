<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Outfit', 'Segoe UI', sans-serif;">
  <defs>
    <pattern id="dotPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#cbd5e1"/>
    </pattern>
    <filter id="shadowMd" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- MAIN GRID -->
  <rect width="400" height="800" fill="url(#dotPattern)"/>
  
  <!-- HEADER ROW 1 -->
  <rect width="400" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Left Button -->
  <rect x="12" y="10" width="40" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="32" y="34" fill="#334155" font-size="18" text-anchor="middle">☰</text>
  
  <!-- Logo -->
  <rect x="68" y="14" width="32" height="32" rx="6" fill="#e0f2fe"/>
  <text x="108" y="28" fill="#0ea5e9" font-size="14" font-weight="800">RACK Designer</text>
  <text x="108" y="44" fill="#64748b" font-size="11">Nuevo Proyecto</text>
  
  <!-- Right Button -->
  <rect x="348" y="10" width="40" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="368" y="34" fill="#334155" font-size="18" text-anchor="middle">☰</text>
  
  <!-- HEADER ROW 2 (Tabs and Search) -->
  <rect y="60" width="400" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(12, 68)">
    <rect width="140" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <rect x="2" y="2" width="68" height="28" rx="4" fill="#e0f2fe"/>
    <rect x="10" y="12" width="10" height="10" rx="2" fill="#334155"/> <!-- Icon -->
    <text x="24" y="21" fill="#0ea5e9" font-size="11" font-weight="bold">Vista Física</text>
    <text x="105" y="21" fill="#64748b" font-size="11" text-anchor="middle">◎ Topología</text>
    
    <rect x="150" y="0" width="238" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="160" y="21" fill="#94a3b8" font-size="12">Buscar equipo, IP, MAC...</text>
  </g>
  
  <!-- HEADER ROW 3 (Controls) -->
  <rect y="108" width="400" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(12, 116)">
    <rect x="0" y="0" width="28" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="14" y="21" fill="#64748b" font-size="16" font-weight="bold" text-anchor="middle">-</text>
    
    <text x="44" y="21" fill="#64748b" font-size="12" font-weight="500">100%</text>
    
    <rect x="64" y="0" width="28" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="78" y="21" fill="#64748b" font-size="16" font-weight="bold" text-anchor="middle">+</text>
    
    <rect x="100" y="0" width="54" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="127" y="21" fill="#64748b" font-size="12" text-anchor="middle">⊙ 1:1</text>
    
    <rect x="162" y="0" width="60" height="32" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="192" y="21" fill="#0ea5e9" font-size="11" font-weight="bold" text-anchor="middle">🏢 Sala A1</text>
    
    <rect x="230" y="0" width="28" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2"/>
    <text x="244" y="22" fill="#64748b" font-size="16" text-anchor="middle">+</text>
    
    <rect x="266" y="0" width="60" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="296" y="21" fill="#64748b" font-size="11" text-anchor="middle">📸 PNG</text>
    
    <rect x="334" y="0" width="54" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="361" y="21" fill="#64748b" font-size="11" text-anchor="middle">⛶</text>
  </g>
  
  <!-- MAIN AREA (No gabinetes) -->
  <g transform="translate(200, 270)">
    <rect x="-16" y="-30" width="32" height="40" fill="#cbd5e1" rx="4"/>
    <line x1="-10" y1="-22" x2="10" y2="-22" stroke="#ffffff" stroke-width="3"/>
    <line x1="-10" y1="-12" x2="10" y2="-12" stroke="#ffffff" stroke-width="3"/>
    
    <text x="0" y="30" fill="#64748b" font-size="13" font-family="monospace" text-anchor="middle">No hay gabinetes en esta sala.</text>
    
    <rect x="-40" y="50" width="80" height="32" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="0" y="70" fill="#0ea5e9" font-size="12" font-weight="bold" text-anchor="middle">+ Rack</text>
  </g>

  <!-- EQUIPOS DE PISO BOX -->
  <g transform="translate(15, 500)">
    <rect width="370" height="150" rx="12" fill="#ffffff" filter="url(#shadowMd)"/>
    
    <!-- Title Left -->
    <text x="16" y="26" fill="#1e293b" font-size="12" font-weight="bold">Equipos de Piso /</text>
    <text x="16" y="42" fill="#1e293b" font-size="12" font-weight="bold">Periféricos</text>
    
    <!-- Quick Placement Button (Purple) -->
    <rect x="150" y="16" width="70" height="36" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="185" y="10" fill="#f97316" font-size="16" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="185" y="30" fill="#9333ea" font-size="11" font-weight="bold" text-anchor="middle">Agregar</text>
    <text x="185" y="44" fill="#9333ea" font-size="11" font-weight="bold" text-anchor="middle">Equipo</text>
    
    <!-- Dispositivos Text Right -->
    <text x="240" y="26" fill="#64748b" font-size="11" font-family="monospace">0</text>
    <text x="240" y="42" fill="#64748b" font-size="11" font-family="monospace">dispositivos</text>

    <!-- Drop area -->
    <rect x="16" y="66" width="338" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6"/>
    <text x="185" y="98" fill="#64748b" font-size="13" text-anchor="middle" font-family="monospace">Arrastra periféricos o equipos aquí</text>
    <text x="185" y="118" fill="#64748b" font-size="13" text-anchor="middle" font-family="monospace">para ubicarlos en la sala</text>
  </g>
  
  <!-- BOTTOM AREA -->
  <rect y="740" width="400" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(10, 755)">
    <rect x="0" y="0" width="100" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="10" y="19" fill="#64748b" font-size="12">Filtrar tabla...</text>
    
    <rect x="110" y="0" width="70" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="145" y="19" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">⬇ CSV</text>
    
    <rect x="190" y="0" width="70" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="225" y="19" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">⬇ Excel</text>
    
    <rect x="270" y="0" width="110" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="325" y="19" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">⛶ Expandir</text>
  </g>
</svg>
