<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a"/>
      <stop offset="100%" style="stop-color:#0a1520"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/></filter>
    <filter id="glowSun"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowMoon"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
    <marker id="arrowY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="1100" height="780" fill="url(#bg)"/>
  <rect width="1100" height="780" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="40" y="28" width="480" height="52" rx="6" fill="#0d1f30" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="40" y1="28" x2="40" y2="80" stroke="#818cf8" stroke-width="3"/>
  <text x="60" y="49" font-family="'Segoe UI', sans-serif" font-size="9" fill="#818cf8" letter-spacing="3" font-weight="600">RACK DESIGNER 2  ·  UI SYSTEM</text>
  <text x="60" y="68" font-family="'Segoe UI', sans-serif" font-size="20" fill="#f0f6ff" font-weight="700">THEME ENGINE  ·  DARK / LIGHT SWITCHER</text>

  <!-- User Click bubble -->
  <rect x="440" y="110" width="220" height="60" rx="30" fill="#0d1f30" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="138" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a5b4fc" font-weight="600">Click Theme Toggle 🔄</text>
  <text x="550" y="156" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">button#theme-toggle</text>

  <!-- Down Arrow -->
  <line x1="550" y1="170" x2="550" y2="210" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowI)"/>

  <!-- Central: JS Toggle Logic -->
  <rect x="320" y="214" width="460" height="90" rx="10" fill="#0f0f1e" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="320" y="214" width="460" height="6" rx="3" fill="url(#moonGrad)"/>
  <text x="550" y="240" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#818cf8" letter-spacing="2" font-weight="600">JavaScript TOGGLE LOGIC  ·  main.js</text>
  <text x="550" y="264" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#c7d2fe">document.documentElement.setAttribute('data-theme', theme)</text>
  <text x="550" y="284" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#64748b">localStorage.setItem('theme', theme)  →  persist preference</text>

  <!-- Branch arrows -->
  <line x1="440" y1="304" x2="220" y2="370" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowY)"/>
  <line x1="660" y1="304" x2="880" y2="370" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowI)"/>
  <circle cx="550" cy="304" r="5" fill="#a5b4fc"/>

  <!-- data-theme="light" -->
  <text x="310" y="366" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#fbbf24">data-theme="light"</text>

  <!-- data-theme="dark" (default) -->
  <text x="900" y="366" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#818cf8">data-theme="dark"</text>

  <!-- LIGHT THEME CARD -->
  <rect x="60" y="380" width="440" height="300" rx="14" fill="#fefce8" fill-opacity="0.04" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="380" width="440" height="8" rx="4" fill="url(#sunGrad)"/>
  <!-- Sun -->
  <circle cx="130" cy="420" r="28" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5" filter="url(#glowSun)"/>
  <circle cx="130" cy="420" r="14" fill="#fbbf24" fill-opacity="0.5"/>
  <text x="200" y="415" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fde68a" font-weight="700">LIGHT MODE</text>
  <text x="200" y="433" font-family="'Segoe UI', sans-serif" font-size="10" fill="#92400e">data-theme="light"</text>

  <line x1="80" y1="450" x2="480" y2="450" stroke="#fbbf24" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Light vars tokens -->
  <g font-family="'Segoe UI', monospace" font-size="11">
    <rect x="80" y="460" width="400" height="26" rx="4" fill="#fbbf24" fill-opacity="0.06"/>
    <text x="100" y="477" fill="#fde68a">--bg-base:</text>
    <text x="200" y="477" fill="#e2e8f0">#ffffff</text>
    <rect x="330" y="465" width="60" height="14" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/>

    <rect x="80" y="492" width="400" height="26" rx="4" fill="#fbbf24" fill-opacity="0.06"/>
    <text x="100" y="509" fill="#fde68a">--bg-card1:</text>
    <text x="200" y="509" fill="#e2e8f0">#f1f5f9</text>
    <rect x="330" y="497" width="60" height="14" rx="3" fill="#f1f5f9" stroke="#ddd" stroke-width="0.5"/>

    <rect x="80" y="524" width="400" height="26" rx="4" fill="#fbbf24" fill-opacity="0.06"/>
    <text x="100" y="541" fill="#fde68a">--text-main:</text>
    <text x="200" y="541" fill="#e2e8f0">#0f172a</text>
    <rect x="330" y="529" width="60" height="14" rx="3" fill="#0f172a" stroke="#ddd" stroke-width="0.5"/>

    <rect x="80" y="556" width="400" height="26" rx="4" fill="#fbbf24" fill-opacity="0.06"/>
    <text x="100" y="573" fill="#fde68a">--accent:</text>
    <text x="200" y="573" fill="#e2e8f0">#0ea5e9</text>
    <rect x="330" y="561" width="60" height="14" rx="3" fill="#0ea5e9" stroke="#ddd" stroke-width="0.5"/>

    <rect x="80" y="588" width="400" height="26" rx="4" fill="#fbbf24" fill-opacity="0.06"/>
    <text x="100" y="605" fill="#fde68a">--border:</text>
    <text x="200" y="605" fill="#e2e8f0">#e2e8f0</text>
    <rect x="330" y="593" width="60" height="14" rx="3" fill="#e2e8f0" stroke="#ddd" stroke-width="0.5"/>
  </g>
  <text x="280" y="656" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#92400e">CSS Custom Props applied to :root[data-theme='light']</text>
  <text x="280" y="672" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#78350f">Rack chassis, UI, topology all adapt automatically</text>

  <!-- DARK THEME CARD -->
  <rect x="600" y="380" width="440" height="300" rx="14" fill="#0d0f20" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="600" y="380" width="440" height="8" rx="4" fill="url(#moonGrad)"/>
  <!-- Moon -->
  <circle cx="670" cy="420" r="28" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1.5" filter="url(#glowMoon)"/>
  <text x="670" y="427" text-anchor="middle" font-size="22">🌙</text>
  <text x="740" y="415" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c7d2fe" font-weight="700">DARK MODE</text>
  <text x="740" y="433" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6366f1">data-theme="dark" (default)</text>

  <line x1="620" y1="450" x2="1020" y2="450" stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.3"/>

  <g font-family="'Segoe UI', monospace" font-size="11">
    <rect x="620" y="460" width="400" height="26" rx="4" fill="#818cf8" fill-opacity="0.06"/>
    <text x="640" y="477" fill="#c7d2fe">--bg-base:</text>
    <text x="740" y="477" fill="#e2e8f0">#060d1a</text>
    <rect x="870" y="465" width="60" height="14" rx="3" fill="#060d1a" stroke="#334155" stroke-width="0.8"/>

    <rect x="620" y="492" width="400" height="26" rx="4" fill="#818cf8" fill-opacity="0.06"/>
    <text x="640" y="509" fill="#c7d2fe">--bg-card1:</text>
    <text x="740" y="509" fill="#e2e8f0">#0d1f30</text>
    <rect x="870" y="497" width="60" height="14" rx="3" fill="#0d1f30" stroke="#334155" stroke-width="0.8"/>

    <rect x="620" y="524" width="400" height="26" rx="4" fill="#818cf8" fill-opacity="0.06"/>
    <text x="640" y="541" fill="#c7d2fe">--text-main:</text>
    <text x="740" y="541" fill="#e2e8f0">#f0f6ff</text>
    <rect x="870" y="529" width="60" height="14" rx="3" fill="#f0f6ff" stroke="#334155" stroke-width="0.8"/>

    <rect x="620" y="556" width="400" height="26" rx="4" fill="#818cf8" fill-opacity="0.06"/>
    <text x="640" y="573" fill="#c7d2fe">--accent:</text>
    <text x="740" y="573" fill="#e2e8f0">#00d4ff</text>
    <rect x="870" y="561" width="60" height="14" rx="3" fill="#00d4ff" stroke="#334155" stroke-width="0.8"/>

    <rect x="620" y="588" width="400" height="26" rx="4" fill="#818cf8" fill-opacity="0.06"/>
    <text x="640" y="605" fill="#c7d2fe">--border:</text>
    <text x="740" y="605" fill="#e2e8f0">#1e3a5f</text>
    <rect x="870" y="593" width="60" height="14" rx="3" fill="#1e3a5f" stroke="#334155" stroke-width="0.8"/>
  </g>
  <text x="820" y="656" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6366f1">CSS Custom Props applied to :root[data-theme='dark']</text>
  <text x="820" y="672" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4f46e5">Default theme. Stored in localStorage for session persistence</text>

  <!-- Footer -->
  <line x1="40" y1="748" x2="1060" y2="748" stroke="#fff" stroke-width="0.3" stroke-opacity="0.1"/>
  <text x="48" y="764" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">RACK Designer 2  ·  Theme Switcher Engine</text>
  <text x="1052" y="764" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">doc_img/doc_svg/theme_switcher.svg</text>
</svg>
