<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a"/>
      <stop offset="100%" style="stop-color:#0a1525"/>
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5a0;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="135deg">
      <stop offset="0%" style="stop-color:#1a2a3a"/>
      <stop offset="100%" style="stop-color:#0d1f2d"/>
    </linearGradient>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#00f5a0" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00f5a0"/>
    </marker>
    <marker id="arrowY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1000" height="900" fill="url(#bg)"/>
  <rect width="1000" height="900" fill="url(#dots)"/>

  <!-- Header -->
  <rect x="40" y="28" width="450" height="52" rx="6" fill="#0d1f30" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="40" y1="28" x2="40" y2="80" stroke="#00d4ff" stroke-width="3"/>
  <text x="60" y="49" font-family="'Segoe UI', sans-serif" font-size="9" fill="#00d4ff" letter-spacing="3" font-weight="600">RACK DESIGNER 2  ·  REACTIVE ARCHITECTURE</text>
  <text x="60" y="68" font-family="'Segoe UI', sans-serif" font-size="20" fill="#f0f6ff" font-weight="700">STORE REACTIVITY FLOW</text>

  <!-- ===== STEP 1: USER ACTION ===== -->
  <rect x="350" y="120" width="300" height="78" rx="10" fill="#0d1a2a" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="350" y="120" width="300" height="5" rx="3" fill="#00d4ff"/>
  <!-- Icon circle -->
  <circle cx="390" cy="159" r="18" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-width="1"/>
  <text x="390" y="164" text-anchor="middle" font-size="16">👤</text>
  <text x="480" y="152" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00d4ff" font-weight="700" letter-spacing="1">USER ACTION</text>
  <text x="480" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Drag · Click · Edit · Type</text>
  <text x="480" y="188" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">DOM Event triggers store mutation</text>

  <!-- Arrow 1 -->
  <line x1="500" y1="198" x2="500" y2="236" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowC)"/>
  <rect x="440" y="212" width="120" height="18" rx="4" fill="#00d4ff" fill-opacity="0.08"/>
  <text x="500" y="224" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#00d4ff">store.data.prop = value</text>

  <!-- ===== STEP 2: PROXY INTERCEPT ===== -->
  <!-- Big proxy block -->
  <rect x="100" y="240" width="800" height="180" rx="12" fill="url(#proxyGrad)" stroke="#00f5a0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="100" y="240" width="800" height="6" rx="3" fill="#00f5a0"/>

  <text x="500" y="265" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#00f5a0" letter-spacing="3" font-weight="700">ES6 PROXY  ·  INTERCEPT LAYER</text>

  <!-- Proxy inner cards -->
  <rect x="120" y="278" width="200" height="120" rx="8" fill="#051f14" stroke="#1a6b45" stroke-width="1"/>
  <text x="220" y="300" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00f5a0" font-weight="700">set() TRAP</text>
  <text x="220" y="320" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#e2e8f0">Intercepts mutation</text>
  <text x="220" y="340" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Validates new value</text>
  <text x="220" y="358" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Updates raw target</text>
  <text x="220" y="376" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Returns true/false</text>

  <rect x="350" y="278" width="200" height="120" rx="8" fill="#051f14" stroke="#1a6b45" stroke-width="1"/>
  <text x="450" y="300" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00f5a0" font-weight="700">WeakMap CACHE</text>
  <text x="450" y="320" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#e2e8f0">Recycles Proxy objects</text>
  <text x="450" y="340" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Prevents memory leaks</text>
  <text x="450" y="358" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">60fps safe pool</text>

  <rect x="580" y="278" width="300" height="120" rx="8" fill="#051f14" stroke="#1a6b45" stroke-width="1"/>
  <text x="730" y="300" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00f5a0" font-weight="700">ACTIONS DISPATCHED</text>
  <text x="730" y="320" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#e2e8f0">① Debounce timer (3s) → autosave</text>
  <text x="730" y="340" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">② snapshot() push to history stack</text>
  <text x="730" y="360" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">③ dispatchEvent('store-updated')</text>

  <!-- Arrow 2 -->
  <line x1="500" y1="420" x2="500" y2="456" stroke="#00f5a0" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="380" y="432" width="240" height="18" rx="4" fill="#00f5a0" fill-opacity="0.08"/>
  <text x="500" y="444" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#00f5a0">window.dispatchEvent('store-updated')</text>

  <!-- ===== STEP 3: BRANCHED OUTPUTS ===== -->
  <line x1="500" y1="460" x2="200" y2="510" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,3"/>
  <line x1="500" y1="460" x2="500" y2="510" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,3"/>
  <line x1="500" y1="460" x2="800" y2="510" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,3"/>

  <!-- Branch nodes -->
  <circle cx="500" cy="460" r="6" fill="#fbbf24" filter="url(#glowCyan)"/>
  <circle cx="200" cy="510" r="4" fill="#fbbf24"/>
  <circle cx="500" cy="510" r="4" fill="#fbbf24"/>
  <circle cx="800" cy="510" r="4" fill="#fbbf24"/>

  <!-- Output 1: localStorage -->
  <rect x="60" y="520" width="280" height="100" rx="10" fill="#0d1a2a" stroke="#fbbf24" stroke-width="1" filter="url(#shadow)"/>
  <rect x="60" y="520" width="280" height="4" rx="2" fill="#fbbf24"/>
  <text x="200" y="542" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fbbf24" font-weight="700" letter-spacing="1">LOCALSTORAGE PERSIST</text>
  <text x="200" y="564" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">JSON.stringify(state)</text>
  <text x="200" y="582" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Key: "rackDesignerData"</text>
  <text x="200" y="600" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Auto on every mutation</text>
  <text x="200" y="612" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#f59e0b">⚡ Debounced 3 seconds</text>

  <!-- Output 2: History -->
  <rect x="360" y="520" width="280" height="100" rx="10" fill="#0d1a2a" stroke="#fbbf24" stroke-width="1" filter="url(#shadow)"/>
  <rect x="360" y="520" width="280" height="4" rx="2" fill="#fbbf24"/>
  <text x="500" y="542" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fbbf24" font-weight="700" letter-spacing="1">UNDO / REDO HISTORY</text>
  <text x="500" y="564" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">history[] deep clone stack</text>
  <text x="500" y="582" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Ctrl+Z / Ctrl+Y support</text>
  <text x="500" y="600" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Max 50 snapshots</text>
  <text x="500" y="612" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#f59e0b">Toolbar counter badge</text>

  <!-- Output 3: UI Updates -->
  <rect x="660" y="520" width="280" height="100" rx="10" fill="#0d1a2a" stroke="#fbbf24" stroke-width="1" filter="url(#shadow)"/>
  <rect x="660" y="520" width="280" height="4" rx="2" fill="#fbbf24"/>
  <text x="800" y="542" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fbbf24" font-weight="700" letter-spacing="1">UI MODULES REACT</text>
  <text x="800" y="564" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">rack.js → re-render</text>
  <text x="800" y="582" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">tables.js → update rows</text>
  <text x="800" y="600" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">topology.js → redraw</text>
  <text x="800" y="612" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#f59e0b">Selective · No full reload</text>

  <!-- Step arrows down -->
  <line x1="200" y1="620" x2="200" y2="656" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowC)"/>
  <line x1="800" y1="620" x2="800" y2="656" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowC)"/>

  <!-- Final state -->
  <rect x="60" y="660" width="280" height="60" rx="8" fill="#060d1a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="200" y="686" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#00d4ff">On Page Reload:</text>
  <text x="200" y="706" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">JSON.parse → hydrate store</text>

  <rect x="660" y="660" width="280" height="60" rx="8" fill="#060d1a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="800" y="686" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#00d4ff">Zero full-page reloads:</text>
  <text x="800" y="706" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">SPA architecture maintained</text>

  <!-- Step numbers -->
  <circle cx="120" cy="159" r="16" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-width="1"/>
  <text x="120" y="164" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#00d4ff" font-weight="700">1</text>
  <circle cx="120" cy="340" r="16" fill="#00f5a0" fill-opacity="0.1" stroke="#00f5a0" stroke-width="1"/>
  <text x="120" y="345" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#00f5a0" font-weight="700">2</text>
  <circle cx="36" cy="570" r="16" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="1"/>
  <text x="36" y="575" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fbbf24" font-weight="700">3</text>

  <!-- Footer -->
  <line x1="40" y1="862" x2="960" y2="862" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1"/>
  <text x="48" y="878" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">RACK Designer 2  ·  Store Reactivity</text>
  <text x="952" y="878" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">doc_img/doc_svg/store_reactivity.svg</text>
</svg>
