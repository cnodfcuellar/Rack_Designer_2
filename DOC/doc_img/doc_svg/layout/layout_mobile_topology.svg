<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #f0f4ff; letter-spacing: 0.5px; }
      .subtitle { font-size: 13px; fill: #8b9ab8; }
    </style>

    <!-- Malla de puntos de topología Canvas 2D -->
    <pattern id="dotGridMob" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#38bdf8" opacity="0.15"/>
    </pattern>

    <!-- Filtros de sombra -->
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowCable" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- FONDO GENERAL DE LA GUÍA -->
  <rect width="1280" height="840" fill="#070a12"/>

  <!-- CABECERA -->
  <g transform="translate(60, 40)">
    <rect width="1160" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="32" cy="30" r="14" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="32" y="35" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">🌐</text>
    <text x="60" y="28" class="title">RACK DESIGNER NEXT — VISTA DE TOPOLOGÍA EN MODO MÓVIL</text>
    <text x="60" y="48" class="subtitle">Interacción táctil en Canvas 2D: Gestos Pinch/Pan, Nodos Arrastrables, Enlaces Bézier y Matriz de Conexiones</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- VISTA 1: TOPOLOGÍA EN PANTALLA COMPLETA (CANVAS 2D ACTIVO)     -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(100, 125)">
    <rect x="0" y="0" width="370" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="185" y="18" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">1. CANVAS DE TOPOLOGÍA (INTERACCIÓN TÁCTIL)</text>

    <!-- Marco Smartphone -->
    <g transform="translate(15, 38)" filter="url(#phoneShadow)">
      <rect width="340" height="610" rx="36" fill="#0f172a" stroke="#334155" stroke-width="3"/>
      <rect x="8" y="8" width="324" height="594" rx="28" fill="#0b0f19"/>
      <rect x="120" y="14" width="100" height="12" rx="6" fill="#1e293b"/>

      <!-- Header con pestaña Topología Activa -->
      <g transform="translate(8, 32)">
        <rect width="324" height="46" fill="#111827" stroke="#1f2937" stroke-width="0.8"/>
        <rect x="10" y="8" width="30" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="25" y="27" text-anchor="middle" fill="#38bdf8" font-size="16">☰</text>

        <!-- View Tabs activando Topología -->
        <g transform="translate(50, 10)">
          <rect width="70" height="26" rx="4" fill="#0f172a"/>
          <text x="35" y="17" text-anchor="middle" fill="#8b9ab8" font-size="10.5">Física</text>
          
          <rect x="74" width="86" height="26" rx="4" fill="#0284c7"/>
          <text x="117" y="17" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700">🌐 Topología</text>
        </g>

        <!-- Botón Ajustes / Salir -->
        <rect x="282" y="10" width="32" height="26" rx="4" fill="#1e293b"/>
        <text x="298" y="27" text-anchor="middle" fill="#94a3b8" font-size="12">⚙</text>
      </g>

      <!-- Toolbar móvil de Topología -->
      <g transform="translate(14, 84)">
        <rect width="312" height="34" rx="6" fill="#1e293b" fill-opacity="0.95" stroke="#334155" stroke-width="0.8"/>
        
        <!-- Zoom -->
        <rect x="6" y="5" width="22" height="24" rx="4" fill="#0f172a"/>
        <text x="17" y="21" text-anchor="middle" fill="#8b9ab8" font-size="12">−</text>
        <rect x="30" y="5" width="36" height="24" rx="4" fill="#0f172a"/>
        <text x="48" y="21" text-anchor="middle" fill="#38bdf8" font-size="10" class="mono">85%</text>
        <rect x="68" y="5" width="22" height="24" rx="4" fill="#0f172a"/>
        <text x="79" y="21" text-anchor="middle" fill="#8b9ab8" font-size="12">+</text>

        <!-- Botón Auto-orden -->
        <rect x="96" y="5" width="58" height="24" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="0.6"/>
        <text x="125" y="21" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">⚡ Auto</text>

        <!-- Selector de Estilo de Nodos -->
        <rect x="158" y="5" width="68" height="24" rx="4" fill="#0f172a"/>
        <text x="192" y="21" text-anchor="middle" fill="#8b9ab8" font-size="9.5">🔲 Tarjetas</text>

        <!-- Botón Inspector Sticky -->
        <rect x="272" y="4" width="34" height="26" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="289" y="21" text-anchor="middle" fill="#ffffff" font-size="12">👁</text>
      </g>

      <!-- CANVAS 2D DE TOPOLOGÍA (GRAFO DE RED) -->
      <g transform="translate(14, 126)">
        <rect width="312" height="428" rx="6" fill="#070c17" stroke="#1f2937" stroke-width="1"/>
        <rect width="312" height="428" fill="url(#dotGridMob)"/>

        <!-- Líneas Bézier de Conexiones (Cables con resplandor) -->
        <!-- Enlace Router a Switch Core -->
        <path d="M 156 50 C 156 90, 85 85, 85 130" stroke="#0ea5e9" stroke-width="2" fill="none" filter="url(#glowCable)"/>
        <!-- Enlace Switch Core a Servidor DB -->
        <path d="M 85 165 C 85 210, 60 215, 60 260" stroke="#10b981" stroke-width="2" fill="none" filter="url(#glowCable)"/>
        <!-- Enlace Switch Core a Servidor Web -->
        <path d="M 85 165 C 85 210, 160 215, 160 260" stroke="#10b981" stroke-width="2" fill="none" filter="url(#glowCable)"/>
        <!-- Enlace Switch Core a Firewall / Backup -->
        <path d="M 85 165 C 85 210, 240 215, 240 260" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3" fill="none"/>

        <!-- NODO 1: ROUTER DE BORDE (Nivel 1) -->
        <g transform="translate(110, 25)">
          <rect width="92" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
          <text x="46" y="16" text-anchor="middle" fill="#f0f4ff" font-size="9" font-weight="700">ROUTER-EDGE-01</text>
          <text x="46" y="27" text-anchor="middle" fill="#38bdf8" font-size="8" class="mono">10.0.0.1 (WAN)</text>
          <circle cx="8" cy="8" r="3" fill="#10b981"/>
        </g>

        <!-- NODO 2: SWITCH CORE CISCO (Nivel 2) -->
        <g transform="translate(35, 130)">
          <rect width="100" height="36" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
          <text x="50" y="16" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="700">SW-CORE-48P</text>
          <text x="50" y="28" text-anchor="middle" fill="#94a3b8" font-size="8" class="mono">192.168.1.1 (VLAN 1)</text>
          <circle cx="8" cy="8" r="3" fill="#10b981"/>
        </g>

        <!-- NODO 3: SERVIDOR DB (Nivel 3) -->
        <g transform="translate(15, 260)">
          <rect width="90" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="45" y="15" text-anchor="middle" fill="#f0f4ff" font-size="9" font-weight="600">SRV-DB-01</text>
          <text x="45" y="26" text-anchor="middle" fill="#10b981" font-size="7.5" class="mono">192.168.1.50</text>
        </g>

        <!-- NODO 4: SERVIDOR WEB (Nivel 3) -->
        <g transform="translate(115, 260)">
          <rect width="90" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="45" y="15" text-anchor="middle" fill="#f0f4ff" font-size="9" font-weight="600">SRV-WEB-01</text>
          <text x="45" y="26" text-anchor="middle" fill="#10b981" font-size="7.5" class="mono">192.168.1.60</text>
        </g>

        <!-- NODO 5: BACKUP NAS (Nivel 3) -->
        <g transform="translate(215, 260)">
          <rect width="84" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="42" y="15" text-anchor="middle" fill="#f0f4ff" font-size="9" font-weight="600">NAS-STORAGE</text>
          <text x="42" y="26" text-anchor="middle" fill="#f59e0b" font-size="7.5" class="mono">192.168.1.200</text>
        </g>

        <!-- Gestos Táctiles Indicados (Pinch to Zoom & Drag) -->
        <g transform="translate(100, 345)">
          <rect width="112" height="22" rx="11" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
          <text x="56" y="15" text-anchor="middle" fill="#94a3b8" font-size="9">👆 Arrastrar • 🤏 Pellizcar</text>
        </g>
      </g>

      <!-- Bottom Bar compacta -->
      <g transform="translate(8, 558)">
        <rect width="324" height="38" fill="#111827" stroke="#1f2937" stroke-width="1"/>
        <rect x="142" y="4" width="40" height="3.5" rx="2" fill="#475569"/>
        <g transform="translate(10, 10)">
          <rect x="0" y="2" width="22" height="20" rx="3" fill="#1e293b"/>
          <text x="11" y="16" text-anchor="middle" fill="#38bdf8" font-size="11">▲</text>
          <rect x="30" y="2" width="80" height="20" rx="4" fill="#0f172a"/>
          <text x="70" y="15" text-anchor="middle" fill="#8b9ab8" font-size="10">Nodos (5)</text>
          <rect x="116" y="2" width="94" height="20" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="0.6"/>
          <text x="163" y="15" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">⚡ Enlaces (4)</text>
          <rect x="216" y="2" width="84" height="20" rx="4" fill="#0f172a"/>
          <text x="258" y="15" text-anchor="middle" fill="#8b9ab8" font-size="10">VLANs</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- VISTA 2: INSPECTOR CONTEXTUAL AL TOCAR UN NODO DE RED          -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(680, 125)">
    <rect x="0" y="0" width="370" height="28" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="0.8"/>
    <text x="185" y="18" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700">2. DETALLE DE ENLACE / NODO (INSPECTOR)</text>

    <!-- Marco Smartphone -->
    <g transform="translate(15, 38)" filter="url(#phoneShadow)">
      <rect width="340" height="610" rx="36" fill="#0f172a" stroke="#334155" stroke-width="3"/>
      <rect x="8" y="8" width="324" height="594" rx="28" fill="#0b0f19"/>
      <rect x="120" y="14" width="100" height="12" rx="6" fill="#1e293b"/>

      <!-- Fondo atenuado por overlay -->
      <rect x="8" y="32" width="324" height="564" fill="#000000" fill-opacity="0.75"/>

      <!-- Drawer Lateral Derecho del Nodo de Red -->
      <g transform="translate(42, 32)">
        <rect width="290" height="564" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <rect width="290" height="46" fill="#1e293b"/>
        <rect x="10" y="8" width="30" height="30" rx="6" fill="#0f172a" stroke="#374151" stroke-width="0.8"/>
        <text x="25" y="28" text-anchor="middle" fill="#f43f5e" font-size="16" font-weight="bold">✕</text>
        <text x="48" y="28" fill="#38bdf8" font-size="13" font-weight="700">NODO DE TOPOLOGÍA</text>

        <!-- Tarjeta del Equipo -->
        <g transform="translate(14, 58)">
          <rect width="262" height="48" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
          <text x="12" y="20" fill="#f0f4ff" font-size="12" font-weight="700">SW-CORE-48P</text>
          <text x="12" y="36" fill="#38bdf8" font-size="10" class="mono">Switch L3 • Cisco Catalyst</text>
          <rect x="195" y="12" width="55" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
          <text x="222" y="26" text-anchor="middle" fill="#10b981" font-size="9" font-weight="bold">RAÍZ (CORE)</text>
        </g>

        <!-- Lista de Enlaces Activos del Nodo -->
        <g transform="translate(14, 120)">
          <text x="2" y="10" fill="#8b9ab8" font-size="11" font-weight="700">ENLACES DE RED ACTIVOS (4)</text>

          <!-- Enlace 1 -->
          <g transform="translate(0, 20)">
            <rect width="262" height="46" rx="5" fill="#131c31" stroke="#334155" stroke-width="0.8"/>
            <text x="10" y="18" fill="#f0f4ff" font-size="10.5" font-weight="600">Port 48 ➔ ROUTER-EDGE-01</text>
            <text x="10" y="34" fill="#38bdf8" font-size="9" class="mono">10 Gbps SFP+ • Fibra OM4 • VLAN 99</text>
            <circle cx="248" cy="23" r="4" fill="#10b981"/>
          </g>

          <!-- Enlace 2 -->
          <g transform="translate(0, 72)">
            <rect width="262" height="46" rx="5" fill="#131c31" stroke="#334155" stroke-width="0.8"/>
            <text x="10" y="18" fill="#f0f4ff" font-size="10.5" font-weight="600">Port 01 ➔ SRV-DB-01</text>
            <text x="10" y="34" fill="#10b981" font-size="9" class="mono">1 Gbps RJ45 • Cat6A • VLAN 10</text>
            <circle cx="248" cy="23" r="4" fill="#10b981"/>
          </g>

          <!-- Enlace 3 -->
          <g transform="translate(0, 124)">
            <rect width="262" height="46" rx="5" fill="#131c31" stroke="#334155" stroke-width="0.8"/>
            <text x="10" y="18" fill="#f0f4ff" font-size="10.5" font-weight="600">Port 02 ➔ SRV-WEB-01</text>
            <text x="10" y="34" fill="#10b981" font-size="9" class="mono">1 Gbps RJ45 • Cat6A • VLAN 20</text>
            <circle cx="248" cy="23" r="4" fill="#10b981"/>
          </g>

          <!-- Enlace 4 -->
          <g transform="translate(0, 176)">
            <rect width="262" height="46" rx="5" fill="#131c31" stroke="#334155" stroke-width="0.8"/>
            <text x="10" y="18" fill="#f0f4ff" font-size="10.5" font-weight="600">Port 10 ➔ NAS-STORAGE</text>
            <text x="10" y="34" fill="#f59e0b" font-size="9" class="mono">1 Gbps RJ45 • Cat6 • VLAN 30</text>
            <circle cx="248" cy="23" r="4" fill="#10b981"/>
          </g>
        </g>

        <!-- Acciones Rápidas -->
        <g transform="translate(14, 380)">
          <rect width="262" height="34" rx="5" fill="#0284c7"/>
          <text x="131" y="21" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">+ Trazar Nuevo Enlace</text>

          <rect y="42" width="262" height="34" rx="5" fill="#1e293b" stroke="#374151" stroke-width="0.8"/>
          <text x="131" y="63" text-anchor="middle" fill="#8b9ab8" font-size="11">Ver en Vista Física (Rack)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- PIE DE NOTAS TÉCNICAS -->
  <g transform="translate(60, 785)">
    <rect width="1160" height="36" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="22" fill="#38bdf8" font-size="11" font-weight="700">CARACTERÍSTICAS DE TOPOLOGÍA EN MÓVIL:</text>
    <text x="290" y="22" fill="#cbd5e1" font-size="11">1. Canvas 2D fluido con gestos multitáctiles (Pinch-to-zoom y Pan con 1 dedo).</text>
    <text x="760" y="22" fill="#cbd5e1" font-size="11">2. Auto-orden con 1 toque.</text>
    <text x="960" y="22" fill="#10b981" font-size="11" font-weight="600">3. Auditoría de cables por Drawer lateral.</text>
  </g>
</svg>
