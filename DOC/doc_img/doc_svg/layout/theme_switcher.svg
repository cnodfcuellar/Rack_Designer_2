<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d1a"/>
      <stop offset="100%" stop-color="#0b1320"/>
    </linearGradient>
    <filter id="shadowBox">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowSepia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1100" height="780" fill="url(#bgCanvas)"/>
  <rect width="1100" height="780" fill="url(#gridPattern)"/>

  <!-- Encabezado -->
  <g transform="translate(40, 24)">
    <rect width="520" height="54" rx="6" fill="#0d1f30" stroke="#818cf8" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="0" y2="54" stroke="#818cf8" stroke-width="3"/>
    <text x="20" y="22" font-size="9" fill="#818cf8" letter-spacing="3" font-weight="700" class="mono">RACK DESIGNER NEXT · SISTEMA VISUAL M-18</text>
    <text x="20" y="42" font-size="18" fill="#f0f6ff" font-weight="700">MOTOR DE TEMAS TRI-ESTADO · OSCURO / CLARO / SEPIA</text>
  </g>

  <!-- Boton Interactivo / Disparador del Usuario -->
  <g transform="translate(440, 100)" filter="url(#shadowBox)">
    <rect width="220" height="54" rx="27" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="26" text-anchor="middle" font-size="12" fill="#f0f6ff" font-weight="700">Alternar Tema 🔄</text>
    <text x="110" y="42" text-anchor="middle" font-size="10" fill="#38bdf8" class="mono">#btn-theme-toggle (Ciclo 1→2→3)</text>
  </g>

  <!-- Flecha hacia el despachador de logica -->
  <line x1="550" y1="154" x2="550" y2="190" stroke="#38bdf8" stroke-width="2"/>

  <!-- Bloque Logica JavaScript Central -->
  <g transform="translate(260, 192)" filter="url(#shadowBox)">
    <rect width="580" height="84" rx="8" fill="#0f172a" stroke="#25304b" stroke-width="1.2"/>
    <rect width="580" height="4" rx="2" fill="#38bdf8"/>
    <text x="290" y="24" text-anchor="middle" font-size="10.5" fill="#38bdf8" letter-spacing="2" font-weight="700" class="mono">LÓGICA DE CONMUTACIÓN REACTIVA · js/main.js</text>
    <text x="290" y="46" text-anchor="middle" font-size="12" fill="#e2e8f0" class="mono">document.documentElement.setAttribute('data-theme', nextTheme)</text>
    <text x="290" y="66" text-anchor="middle" font-size="10.5" fill="#94a3b8" class="mono">localStorage.setItem('RACK_DESIGNER_THEME', nextTheme)  →  Persistencia F5</text>
  </g>

  <!-- Flechas hacia los 3 estados -->
  <!-- A Oscuro -->
  <path d="M 360 276 L 200 340" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowDark)"/>
  <!-- A Claro -->
  <line x1="550" y1="276" x2="550" y2="340" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowLight)"/>
  <!-- A Sepia -->
  <path d="M 740 276 L 900 340" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowSepia)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TARJETA 1: MODO OSCURO (Default Datacenter) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(40, 350)" filter="url(#shadowBox)">
    <rect width="320" height="360" rx="10" fill="#0d111a" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="320" height="6" rx="3" fill="#818cf8"/>
    <circle cx="40" cy="40" r="18" fill="#818cf8" fill-opacity="0.2"/>
    <text x="40" y="46" text-anchor="middle" font-size="18">🌙</text>
    <text x="70" y="36" font-size="14" fill="#f0f6ff" font-weight="700">MODO OSCURO</text>
    <text x="70" y="52" font-size="10.5" fill="#818cf8" class="mono">data-theme="dark" (Default)</text>

    <line x1="20" y1="70" x2="300" y2="70" stroke="#25304b" stroke-width="0.8"/>

    <!-- Variables CSS Dark -->
    <g transform="translate(20, 85)" font-size="10.5" class="mono">
      <rect width="280" height="26" rx="4" fill="#151c2e"/>
      <text x="10" y="17" fill="#818cf8">--bg-base:</text>
      <text x="130" y="17" fill="#e2e8f0">#0b0f19</text>
      <rect x="235" y="6" width="35" height="14" rx="2" fill="#0b0f19" stroke="#334155" stroke-width="0.6"/>

      <rect y="32" width="280" height="26" rx="4" fill="#151c2e"/>
      <text x="10" y="49" fill="#818cf8">--bg-card:</text>
      <text x="130" y="49" fill="#e2e8f0">#151c2e</text>
      <rect x="235" y="38" width="35" height="14" rx="2" fill="#151c2e" stroke="#334155" stroke-width="0.6"/>

      <rect y="64" width="280" height="26" rx="4" fill="#151c2e"/>
      <text x="10" y="81" fill="#818cf8">--text-primary:</text>
      <text x="130" y="81" fill="#e2e8f0">#f0f4ff</text>
      <rect x="235" y="70" width="35" height="14" rx="2" fill="#f0f4ff" stroke="#334155" stroke-width="0.6"/>

      <rect y="96" width="280" height="26" rx="4" fill="#151c2e"/>
      <text x="10" y="113" fill="#818cf8">--accent:</text>
      <text x="130" y="113" fill="#38bdf8">#0ea5e9</text>
      <rect x="235" y="102" width="35" height="14" rx="2" fill="#0ea5e9"/>

      <rect y="128" width="280" height="26" rx="4" fill="#151c2e"/>
      <text x="10" y="145" fill="#818cf8">--border:</text>
      <text x="130" y="145" fill="#e2e8f0">#25304b</text>
      <rect x="235" y="134" width="35" height="14" rx="2" fill="#25304b"/>
    </g>

    <text x="160" y="275" text-anchor="middle" font-size="10" fill="#94a3b8">Optimizado para centros de datos NOC</text>
    <text x="160" y="292" text-anchor="middle" font-size="9.5" fill="#64748b" class="mono">Máximo contraste y fatiga visual nula</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TARJETA 2: MODO CLARO (Auditoría / Documentación) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(390, 350)" filter="url(#shadowBox)">
    <rect width="320" height="360" rx="10" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="320" height="6" rx="3" fill="#f59e0b"/>
    <circle cx="40" cy="40" r="18" fill="#fef3c7"/>
    <text x="40" y="46" text-anchor="middle" font-size="18">☀️</text>
    <text x="70" y="36" font-size="14" fill="#0f172a" font-weight="700">MODO CLARO</text>
    <text x="70" y="52" font-size="10.5" fill="#b45309" class="mono">data-theme="light"</text>

    <line x1="20" y1="70" x2="300" y2="70" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Variables CSS Light -->
    <g transform="translate(20, 85)" font-size="10.5" class="mono">
      <rect width="280" height="26" rx="4" fill="#f1f5f9"/>
      <text x="10" y="17" fill="#b45309">--bg-base:</text>
      <text x="130" y="17" fill="#0f172a">#f8fafc</text>
      <rect x="235" y="6" width="35" height="14" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>

      <rect y="32" width="280" height="26" rx="4" fill="#f1f5f9"/>
      <text x="10" y="49" fill="#b45309">--bg-card:</text>
      <text x="130" y="49" fill="#0f172a">#ffffff</text>
      <rect x="235" y="38" width="35" height="14" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>

      <rect y="64" width="280" height="26" rx="4" fill="#f1f5f9"/>
      <text x="10" y="81" fill="#b45309">--text-primary:</text>
      <text x="130" y="81" fill="#0f172a">#0f172a</text>
      <rect x="235" y="70" width="35" height="14" rx="2" fill="#0f172a"/>

      <rect y="96" width="280" height="26" rx="4" fill="#f1f5f9"/>
      <text x="10" y="113" fill="#b45309">--accent:</text>
      <text x="130" y="113" fill="#0284c7">#0284c7</text>
      <rect x="235" y="102" width="35" height="14" rx="2" fill="#0284c7"/>

      <rect y="128" width="280" height="26" rx="4" fill="#f1f5f9"/>
      <text x="10" y="145" fill="#b45309">--border:</text>
      <text x="130" y="145" fill="#0f172a">#e2e8f0</text>
      <rect x="235" y="134" width="35" height="14" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.8"/>
    </g>

    <text x="160" y="275" text-anchor="middle" font-size="10" fill="#475569">Ideal para impresión, exportaciones y memorias</text>
    <text x="160" y="292" text-anchor="middle" font-size="9.5" fill="#64748b" class="mono">Ambientes con luz ambiental alta</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TARJETA 3: MODO SEPIA (Lectura Confortable M-18) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(740, 350)" filter="url(#shadowBox)">
    <rect width="320" height="360" rx="10" fill="#2d241e" stroke="#d97706" stroke-width="1.5"/>
    <rect width="320" height="6" rx="3" fill="#d97706"/>
    <circle cx="40" cy="40" r="18" fill="#453227"/>
    <text x="40" y="46" text-anchor="middle" font-size="18">☕</text>
    <text x="70" y="36" font-size="14" fill="#fef3c7" font-weight="700">MODO SEPIA (M-18)</text>
    <text x="70" y="52" font-size="10.5" fill="#fbbf24" class="mono">data-theme="sepia"</text>

    <line x1="20" y1="70" x2="300" y2="70" stroke="#453227" stroke-width="1"/>

    <!-- Variables CSS Sepia -->
    <g transform="translate(20, 85)" font-size="10.5" class="mono">
      <rect width="280" height="26" rx="4" fill="#3d322a"/>
      <text x="10" y="17" fill="#fbbf24">--bg-base:</text>
      <text x="130" y="17" fill="#fef3c7">#2d241e</text>
      <rect x="235" y="6" width="35" height="14" rx="2" fill="#2d241e" stroke="#523e32" stroke-width="0.8"/>

      <rect y="32" width="280" height="26" rx="4" fill="#3d322a"/>
      <text x="10" y="49" fill="#fbbf24">--bg-card:</text>
      <text x="130" y="49" fill="#fef3c7">#3d322a</text>
      <rect x="235" y="38" width="35" height="14" rx="2" fill="#3d322a" stroke="#523e32" stroke-width="0.8"/>

      <rect y="64" width="280" height="26" rx="4" fill="#3d322a"/>
      <text x="10" y="81" fill="#fbbf24">--text-primary:</text>
      <text x="130" y="81" fill="#fef3c7">#fef3c7</text>
      <rect x="235" y="70" width="35" height="14" rx="2" fill="#fef3c7"/>

      <rect y="96" width="280" height="26" rx="4" fill="#3d322a"/>
      <text x="10" y="113" fill="#fbbf24">--accent:</text>
      <text x="130" y="113" fill="#f59e0b">#d97706</text>
      <rect x="235" y="102" width="35" height="14" rx="2" fill="#d97706"/>

      <rect y="128" width="280" height="26" rx="4" fill="#3d322a"/>
      <text x="10" y="145" fill="#fbbf24">--border:</text>
      <text x="130" y="145" fill="#fef3c7">#523e32</text>
      <rect x="235" y="134" width="35" height="14" rx="2" fill="#523e32" stroke="#6b5344" stroke-width="0.8"/>
    </g>

    <text x="160" y="275" text-anchor="middle" font-size="10" fill="#fde68a">Tono cálido de bajo contraste fotofóbico</text>
    <text x="160" y="292" text-anchor="middle" font-size="9.5" fill="#d97706" class="mono">Diseñado para sesiones prolongadas de diseño</text>
  </g>

  <!-- Pie de pagina -->
  <line x1="40" y1="740" x2="1060" y2="740" stroke="#fff" stroke-width="0.3" stroke-opacity="0.1"/>
  <text x="48" y="758" font-size="10" fill="#64748b" class="mono">RACK Designer Next · doc/doc_img/doc_svg/theme_switcher.svg · Soporte 100% Nativo CSS Tokens</text>

</svg>
