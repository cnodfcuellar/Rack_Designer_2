<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 145" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="hdrBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#151c2e"/>
    </linearGradient>
    <filter id="shadowSm" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1100" height="145" fill="#0b0f19" rx="8"/>
  <text x="550" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">Header Layout — #header (56px height, navegación multi-sala, selector de temas y control de estado)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- HEADER BAR PRINCIPAL -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="10" y="32" width="1080" height="56" rx="6" fill="url(#hdrBg)" stroke="#25304b" stroke-width="1" filter="url(#shadowSm)"/>

  <!-- A. header-logo-area (260px) -->
  <rect x="10" y="32" width="250" height="56" rx="6" fill="#0b0f19" stroke="#25304b" stroke-width="1"/>
  
  <!-- Logo RD Badge 24x24 -->
  <rect x="22" y="48" width="24" height="24" rx="5" fill="#0ea5e9" opacity="0.2" stroke="#0ea5e9" stroke-width="0.8"/>
  <text x="34" y="64" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="800">RD</text>
  
  <!-- Titulo y subtitulo del proyecto -->
  <text x="54" y="60" fill="#f0f6ff" font-size="12.5" font-weight="700">RACK Designer Next</text>
  <text x="54" y="74" fill="#38bdf8" font-size="9.5" class="mono" font-weight="500">Campus Central UTN</text>
  
  <!-- Boton Menu Hamburguesa #btn-main-menu -->
  <rect x="222" y="48" width="26" height="24" rx="5" fill="#151c2e" stroke="#25304b" stroke-width="1"/>
  <line x1="228" y1="55" x2="242" y2="55" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="228" y1="60" x2="242" y2="60" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="228" y1="65" x2="242" y2="65" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Divisor Vertical -->
  <line x1="265" y1="42" x2="265" y2="78" stroke="#25304b" stroke-width="1"/>

  <!-- B. header-main-area -->
  
  <!-- Dropdown de Salas #room-dropdown-wrapper -->
  <g transform="translate(275, 48)">
    <rect width="112" height="24" rx="5" fill="#1a2235" stroke="#25304b" stroke-width="1"/>
    <!-- Icono Building -->
    <rect x="6" y="5" width="14" height="14" rx="2" fill="#38bdf8" opacity="0.2"/>
    <text x="13" y="15" text-anchor="middle" fill="#38bdf8" font-size="9">🏢</text>
    <text x="26" y="16" fill="#f0f4ff" font-size="10.5" font-weight="500">Data Center</text>
    <text x="100" y="16" fill="#64748b" font-size="8">▾</text>
    <!-- Botón + Sala -->
    <rect x="116" y="0" width="20" height="24" rx="5" fill="transparent" stroke="#25304b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="126" y="16" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">+</text>
  </g>

  <!-- Dropdown de Racks #rack-dropdown-wrapper -->
  <g transform="translate(420, 48)">
    <rect width="90" height="24" rx="5" fill="#1a2235" stroke="#25304b" stroke-width="1"/>
    <!-- Icono Server -->
    <rect x="6" y="5" width="14" height="14" rx="2" fill="#38bdf8" opacity="0.2"/>
    <text x="13" y="15" text-anchor="middle" fill="#38bdf8" font-size="9">🗄️</text>
    <text x="26" y="16" fill="#f0f4ff" font-size="10.5" font-weight="500">Racks (3)</text>
    <text x="78" y="16" fill="#64748b" font-size="8">▾</text>
    <!-- Botón + Rack -->
    <rect x="94" y="0" width="20" height="24" rx="5" fill="transparent" stroke="#25304b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="104" y="16" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">+</text>
  </g>

  <!-- Divisor Vertical -->
  <line x1="544" y1="42" x2="544" y2="78" stroke="#25304b" stroke-width="1"/>

  <!-- Segmented View Tabs (.view-tabs) -->
  <g transform="translate(554, 48)">
    <rect width="186" height="24" rx="6" fill="#0b0f19" stroke="#25304b" stroke-width="1"/>
    <!-- Tab Fisica (Activa) -->
    <rect x="1" y="1" width="98" height="22" rx="5" fill="#1a2235" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="12" cy="12" r="3.5" fill="#38bdf8"/>
    <text x="22" y="15" fill="#38bdf8" font-size="10.5" font-weight="600">Vista Física</text>
    <!-- Tab Topologia -->
    <text x="110" y="15" fill="#8b9ab8" font-size="10.5" font-weight="500">🕸️ Topología</text>
  </g>

  <!-- Buscador Rapido #global-search -->
  <g transform="translate(750, 48)">
    <rect width="130" height="24" rx="5" fill="#1a2235" stroke="#25304b" stroke-width="1"/>
    <text x="8" y="16" fill="#475569" font-size="9" class="mono">🔍 Buscar IP, equipo…</text>
  </g>

  <!-- Grupo Undo / Redo #btn-undo #btn-redo (M-03) -->
  <g transform="translate(888, 48)">
    <rect width="44" height="24" rx="5" fill="#1a2235" stroke="#25304b" stroke-width="1"/>
    <line x1="22" y1="0" x2="22" y2="24" stroke="#25304b" stroke-width="1"/>
    <text x="11" y="16" text-anchor="middle" fill="#94a3b8" font-size="11">↩</text>
    <text x="33" y="16" text-anchor="middle" fill="#94a3b8" font-size="11">↪</text>
  </g>

  <!-- Selector de Temas #btn-theme-toggle (M-18: Oscuro / Claro / Sepia) -->
  <g transform="translate(938, 48)">
    <rect width="68" height="24" rx="5" fill="#1a2235" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="8" y="16" font-size="10">🌙</text>
    <text x="24" y="16" fill="#f0f6ff" font-size="10" font-weight="600">Oscuro</text>
  </g>

  <!-- Punto de Estado Operativo .status-dot -->
  <circle cx="1018" cy="60" r="4.5" fill="#22c55e" filter="url(#shadowSm)"/>

  <!-- Badge de Sesion / Rol #user-badge (RBAC) -->
  <g transform="translate(1028, 48)">
    <rect width="54" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
    <text x="27" y="16" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">Admin</text>
  </g>

  <!-- ═══════════════════════════════════════ -->
  <!-- ANOTACIONES Y COTAS -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Cota de Altura: 56px -->
  <line x1="1092" y1="32" x2="1092" y2="88" stroke="#475569" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="1084" y="63" fill="#475569" font-size="8.5" class="mono" text-anchor="end">56px</text>

  <!-- Rotulos de areas -->
  <line x1="10" y1="94" x2="260" y2="94" stroke="#475569" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="135" y="106" text-anchor="middle" fill="#475569" font-size="9" class="mono">.header-logo-area (250px) + Menú Hamburguesa</text>

  <line x1="275" y1="94" x2="1080" y2="94" stroke="#475569" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="677" y="106" text-anchor="middle" fill="#475569" font-size="9" class="mono">.header-main-area (Salas + Racks + Vistas + Buscador + Undo/Redo M-03 + Tema M-18 + RBAC)</text>

  <!-- Legend de Variables CSS -->
  <rect x="10" y="116" width="1080" height="22" rx="4" fill="#1e293b" opacity="0.6"/>
  <text x="20" y="131" fill="#94a3b8" font-size="8.5" font-weight="700">CSS TOKENS:</text>
  <text x="95" y="131" fill="#64748b" font-size="8.5" class="mono">--header-h: 56px</text>
  <text x="210" y="131" fill="#64748b" font-size="8.5" class="mono">--bg-card: #151c2e</text>
  <text x="340" y="131" fill="#64748b" font-size="8.5" class="mono">--border: #25304b</text>
  <text x="470" y="131" fill="#64748b" font-size="8.5" class="mono">--accent: #0ea5e9</text>
  <text x="600" y="131" fill="#64748b" font-size="8.5" class="mono">--green: #22c55e</text>
  <text x="730" y="131" fill="#64748b" font-size="8.5" class="mono">data-theme: dark | light | sepia (M-18)</text>
  <text x="965" y="131" fill="#64748b" font-size="8.5" class="mono">ctrl-h: 24px</text>

</svg>