<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <pattern id="canvasDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#38bdf8" opacity="0.15"/>
    </pattern>
    <filter id="shadowCanvas" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="760" height="620" fill="#0b0f19" rx="8"/>
  <text x="380" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">Lienzo Físico — #main &gt; #view-physical (Bicanalidad Techo/Piso M-41, gap 72px inter-rack y redibujado granular M-04)</text>

  <!-- LIENZO PRINCIPAL -->
  <rect x="12" y="32" width="736" height="570" fill="#0b0f19" stroke="#25304b" stroke-width="1" rx="6"/>
  <rect x="12" y="32" width="736" height="570" fill="url(#canvasDots)"/>

  <!-- BARRA DE HERRAMIENTAS FLOTANTE DEL LIENZO (.main-toolbar) -->
  <g transform="translate(24, 40)">
    <rect width="712" height="30" rx="6" fill="#1e293b" fill-opacity="0.95" stroke="#25304b" stroke-width="0.8"/>
    
    <!-- Zoom -->
    <rect x="8" y="4" width="22" height="22" rx="4" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
    <text x="19" y="19" text-anchor="middle" fill="#8b9ab8" font-size="12">−</text>
    <text x="38" y="19" fill="#38bdf8" font-size="10" font-weight="600" class="mono">100%</text>
    <rect x="72" y="4" width="22" height="22" rx="4" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
    <text x="83" y="19" text-anchor="middle" fill="#8b9ab8" font-size="12">+</text>
    <rect x="100" y="4" width="34" height="22" rx="4" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
    <text x="117" y="19" text-anchor="middle" fill="#94a3b8" font-size="9" class="mono">⊙ 1:1</text>

    <!-- Toggle de Cables Físicos -->
    <g transform="translate(148, 5)">
      <rect width="70" height="20" rx="10" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="0.8"/>
      <circle cx="12" cy="10" r="6" fill="#38bdf8"/>
      <text x="26" y="14" fill="#38bdf8" font-size="9.5" font-weight="600">Cables ON</text>
    </g>

    <!-- Indicador de Redibujado Selectivo M-04 -->
    <text x="430" y="20" text-anchor="middle" fill="#64748b" font-size="9.5" class="mono">Redibujado Selectivo Granular: O(1) Activo</text>

    <!-- Botones de Acción -->
    <g transform="translate(565, 4)">
      <rect width="64" height="22" rx="4" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
      <text x="32" y="15" text-anchor="middle" fill="#94a3b8" font-size="9.5">📷 PNG</text>
      <rect x="70" width="70" height="22" rx="4" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
      <text x="105" y="15" text-anchor="middle" fill="#94a3b8" font-size="9.5">⤢ Expandir</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BICANALIDAD SUPERIOR: BANDEJA AÉREA / CANASTILLO TECHO -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(34, 82)">
    <rect width="692" height="18" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="6,3" stroke-width="1"/>
    <text x="10" y="13" fill="#38bdf8" font-size="8.5" font-weight="700" class="mono">⬆️ BANDEJA AÉREA SUPERIOR (Canastillo Portacables de Red / Datos / Fibra)</text>
    <!-- Cables en Canastillo Superior -->
    <path d="M 170 12 L 530 12" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <path d="M 170 7 L 530 7" stroke="#10b981" stroke-width="2" fill="none"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- GABINETE 1: RACK-01 (Ancho 300px, 42U) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(34, 110)" filter="url(#shadowCanvas)">
    <rect width="300" height="400" rx="8" fill="#151c2e" stroke="#25304b" stroke-width="1.2"/>
    
    <!-- Encabezado del Rack -->
    <rect width="300" height="34" rx="8" fill="#1a2235"/>
    <circle cx="16" cy="17" r="4.5" fill="#0ea5e9"/>
    <text x="28" y="21" fill="#f0f6ff" font-size="11.5" font-weight="700" class="mono">Rack 01 — Core</text>
    <text x="175" y="21" fill="#94a3b8" font-size="9" class="mono">42U · 840W</text>
    <!-- Botón Flip 3D (Cara Posterior) -->
    <rect x="245" y="6" width="22" height="22" rx="4" fill="#151c2e" stroke="#25304b" stroke-width="0.6"/>
    <text x="256" y="21" text-anchor="middle" fill="#38bdf8" font-size="10" title="Rotar cara (Frente / Posterior)">🔄</text>
    <!-- Menú Gabinete -->
    <rect x="272" y="6" width="22" height="22" rx="4" fill="#151c2e" stroke="#25304b" stroke-width="0.6"/>
    <text x="283" y="21" text-anchor="middle" fill="#94a3b8" font-size="11">⋮</text>

    <!-- Riel Izquierdo -->
    <rect x="0" y="34" width="20" height="366" fill="#0b0f19" stroke="#25304b" stroke-width="0.5"/>
    <text x="10" y="52" text-anchor="middle" fill="#64748b" font-size="7.5" class="mono">42</text>
    <text x="10" y="100" text-anchor="middle" fill="#64748b" font-size="7.5" class="mono">40</text>
    <text x="10" y="172" text-anchor="middle" fill="#64748b" font-size="7.5" class="mono">24</text>
    <text x="10" y="380" text-anchor="middle" fill="#64748b" font-size="7.5" class="mono">01</text>

    <!-- Riel Derecho -->
    <rect x="280" y="34" width="20" height="366" fill="#0b0f19" stroke="#25304b" stroke-width="0.5"/>
    <text x="290" y="52" text-anchor="middle" fill="#64748b" font-size="7.5" class="mono">42</text>
    <text x="290" y="380" text-anchor="middle" fill="#64748b" font-size="7.5" class="mono">01</text>

    <!-- Ranuras y Equipos Instalados -->
    <!-- Patch Panel 1U (U42) -->
    <rect x="20" y="38" width="260" height="24" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="28" cy="50" r="3" fill="#38bdf8"/>
    <text x="36" y="54" fill="#38bdf8" font-size="9.5" font-weight="600">Patch Panel 24P Cat6A</text>
    <text x="272" y="54" text-anchor="end" fill="#64748b" font-size="8" class="mono">1U</text>

    <!-- Switch Core 1U (U41) -->
    <rect x="20" y="64" width="260" height="24" rx="2" fill="#1e293b" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="28" cy="76" r="3" fill="#10b981"/>
    <text x="36" y="80" fill="#34d399" font-size="9.5" font-weight="600">SW-CORE-01 (48P + 4 SFP+)</text>
    <text x="272" y="80" text-anchor="end" fill="#64748b" font-size="8" class="mono">1U</text>

    <!-- Organizador de Cables 1U (U40) -->
    <rect x="20" y="90" width="260" height="24" rx="2" fill="#0f172a" stroke="#25304b" stroke-width="0.6"/>
    <text x="36" y="105" fill="#64748b" font-size="9">Organizador Horizontal 1U</text>

    <!-- Servidor Producción 2U (U38-U37) -->
    <rect x="20" y="116" width="260" height="48" rx="2" fill="#181a1f" stroke="#0ea5e9" stroke-width="1"/>
    <rect x="24" y="120" width="40" height="12" rx="1" fill="#0b0f19" stroke="#334155" stroke-width="0.5"/>
    <circle cx="70" cy="126" r="2.5" fill="#38bdf8"/>
    <text x="80" y="130" fill="#f0f6ff" font-size="9.5" font-weight="700">SRV-PROD-01 (Dell R740)</text>
    <text x="80" y="145" fill="#94a3b8" font-size="8.5" class="mono">192.168.10.15 · 450W</text>
    <text x="272" y="145" text-anchor="end" fill="#38bdf8" font-size="8.5" class="mono">2U</text>

    <!-- Ranuras vacías intermedias -->
    <rect x="20" y="166" width="260" height="180" rx="1" fill="transparent" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="0.5"/>
    <text x="150" y="255" text-anchor="middle" fill="#334155" font-size="10" class="mono">Slots Vacíos (U36 .. U05)</text>

    <!-- UPS Smart 3000 3U (U01-U03 Base gravitacional TIA-942) -->
    <rect x="20" y="348" width="260" height="50" rx="2" fill="#181a1f" stroke="#eab308" stroke-width="1"/>
    <circle cx="32" cy="365" r="3.5" fill="#eab308"/>
    <text x="42" y="369" fill="#facc15" font-size="9.5" font-weight="700">UPS Smart-UPS 3000 RT</text>
    <text x="42" y="385" fill="#94a3b8" font-size="8.5" class="mono">Batería Pesada Base (TIA-942)</text>
    <text x="272" y="385" text-anchor="end" fill="#eab308" font-size="8.5" class="mono">3U</text>
  </g>

  <!-- COTA SEPARACIÓN INTER-RACK: 72px (3U) -->
  <g transform="translate(334, 300)">
    <line x1="0" y1="0" x2="72" y2="0" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="2.5" fill="#f59e0b"/>
    <circle cx="72" cy="0" r="2.5" fill="#f59e0b"/>
    <text x="36" y="-6" text-anchor="middle" fill="#f59e0b" font-size="8.5" font-weight="700" class="mono">GAP: 72px (3U)</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- GABINETE 2: RACK-02 (Ancho 300px, 42U) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(406, 110)" filter="url(#shadowCanvas)">
    <rect width="300" height="400" rx="8" fill="#151c2e" stroke="#25304b" stroke-width="1.2"/>
    <rect width="300" height="34" rx="8" fill="#1a2235"/>
    <circle cx="16" cy="17" r="4.5" fill="#10b981"/>
    <text x="28" y="21" fill="#f0f6ff" font-size="11.5" font-weight="700" class="mono">Rack 02 — Distribución</text>
    <text x="180" y="21" fill="#94a3b8" font-size="9" class="mono">42U · 620W</text>
    <rect x="245" y="6" width="22" height="22" rx="4" fill="#151c2e" stroke="#25304b" stroke-width="0.6"/>
    <text x="256" y="21" text-anchor="middle" fill="#38bdf8" font-size="10">🔄</text>
    <rect x="272" y="6" width="22" height="22" rx="4" fill="#151c2e" stroke="#25304b" stroke-width="0.6"/>
    <text x="283" y="21" text-anchor="middle" fill="#94a3b8" font-size="11">⋮</text>

    <!-- Rieles -->
    <rect x="0" y="34" width="20" height="366" fill="#0b0f19" stroke="#25304b" stroke-width="0.5"/>
    <rect x="280" y="34" width="20" height="366" fill="#0b0f19" stroke="#25304b" stroke-width="0.5"/>

    <!-- Patch Panel 1U (U42) -->
    <rect x="20" y="38" width="260" height="24" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="36" y="54" fill="#38bdf8" font-size="9.5" font-weight="600">Patch Panel Distribución</text>

    <!-- Switch Access 1U (U41) -->
    <rect x="20" y="64" width="260" height="24" rx="2" fill="#1e293b" stroke="#10b981" stroke-width="0.8"/>
    <text x="36" y="80" fill="#34d399" font-size="9.5" font-weight="600">SW-ACCESS-02</text>

    <!-- Router Borde 1U (U40) -->
    <rect x="20" y="90" width="260" height="24" rx="2" fill="#181a1f" stroke="#f59e0b" stroke-width="1"/>
    <text x="36" y="105" fill="#fbbf24" font-size="9.5" font-weight="700">RTR-BORDER-01 (WAN)</text>

    <!-- Storage SAN 3U (U34-U36) -->
    <rect x="20" y="120" width="260" height="70" rx="2" fill="#181a1f" stroke="#0ea5e9" stroke-width="1"/>
    <text x="36" y="145" fill="#f0f6ff" font-size="10" font-weight="700">SAN Storage Array 24TB</text>
    <text x="36" y="162" fill="#94a3b8" font-size="8.5" class="mono">Fibre Channel Dual · 4U</text>

    <!-- Ranuras vacías -->
    <rect x="20" y="195" width="260" height="150" rx="1" fill="transparent" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="0.5"/>

    <!-- PDU Vertical / UPS Base -->
    <rect x="20" y="348" width="260" height="50" rx="2" fill="#181a1f" stroke="#eab308" stroke-width="1"/>
    <text x="36" y="375" fill="#facc15" font-size="9.5" font-weight="700">UPS APC SMT2200RM2U</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BICANALIDAD INFERIOR: CANALETA BAJO PISO TÉCNICO (M-41) -->
  <!-- Cota: maxRackBottom + 14 = 524px -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(34, 520)">
    <rect width="692" height="20" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-dasharray="6,3" stroke-width="1"/>
    <text x="10" y="14" fill="#fbbf24" font-size="8.5" font-weight="700" class="mono">⬇️ CANALETA BAJO PISO TÉCNICO (Cota maxRackBottom+14 · Potencia y Equipos de Piso)</text>
    <!-- Cables en Canaleta Inferior -->
    <path d="M 160 10 L 550 10" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
    <path d="M 160 15 L 550 15" stroke="#ef4444" stroke-width="1.8" fill="none"/>
  </g>

  <!-- SECCIÓN DE DISPOSITIVOS DE PISO (M-39) -->
  <g transform="translate(34, 550)">
    <rect width="692" height="42" rx="6" fill="#151c2e" stroke="#25304b" stroke-width="0.8"/>
    <text x="14" y="24" fill="#94a3b8" font-size="10" font-weight="600">Dispositivos en Suelo Técnico (Afinidad Proximidad M-39):</text>
    
    <!-- Chip Equipo Piso 1 -->
    <rect x="280" y="10" width="125" height="22" rx="4" fill="#1a2235" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="342" y="24" text-anchor="middle" fill="#fbbf24" font-size="9" class="mono">CONSOLE-PC-01</text>

    <!-- Chip Equipo Piso 2 -->
    <rect x="415" y="10" width="125" height="22" rx="4" fill="#1a2235" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="477" y="24" text-anchor="middle" fill="#fbbf24" font-size="9" class="mono">PRINTER-ADMIN</text>

    <!-- Boton Agregar Piso -->
    <rect x="550" y="10" width="130" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="0.8"/>
    <text x="615" y="24" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600">+ Equipo de Piso</text>
  </g>

</svg>