<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; }
      .step-title { font-weight: 700; fill: #38bdf8; font-size: 18px; }
      .step-desc { font-weight: 400; fill: #94a3b8; font-size: 13px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="400" fill="#0b0f19" rx="16"/>
  <text x="40" y="40" font-weight="800" fill="#38bdf8" font-size="20">FLUJO DE TRABAJO BÁSICO EN 3 PASOS</text>

  <!-- Step 1 -->
  <g transform="translate(60, 120)">
    <rect width="200" height="150" fill="#0f172a" rx="12" stroke="#25304b" stroke-width="2"/>
    <circle cx="100" cy="50" r="25" fill="#151c2e" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="58" text-anchor="middle" font-size="24">🖱️</text>
    <text x="100" y="100" text-anchor="middle" class="step-title">1. SELECCIONA</text>
    <text x="100" y="120" text-anchor="middle" class="step-desc">Elige un equipo del Catálogo</text>
  </g>

  <!-- Arrow -->
  <path d="M 275 195 L 365 195" stroke="#475569" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(380, 120)">
    <rect width="200" height="150" fill="#0f172a" rx="12" stroke="#25304b" stroke-width="2"/>
    <circle cx="100" cy="50" r="25" fill="#151c2e" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="58" text-anchor="middle" font-size="24">🤚</text>
    <text x="100" y="100" text-anchor="middle" class="step-title" fill="#10b981">2. ARRASTRA</text>
    <text x="100" y="120" text-anchor="middle" class="step-desc">Suéltalo en un Rack vacío</text>
  </g>

  <!-- Arrow -->
  <path d="M 595 195 L 685 195" stroke="#475569" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(700, 120)">
    <rect width="200" height="150" fill="#0f172a" rx="12" stroke="#25304b" stroke-width="2"/>
    <circle cx="100" cy="50" r="25" fill="#151c2e" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="58" text-anchor="middle" font-size="24">✏️</text>
    <text x="100" y="100" text-anchor="middle" class="step-title" fill="#f59e0b">3. EDITA</text>
    <text x="100" y="120" text-anchor="middle" class="step-desc">Ponle nombre en el Inspector</text>
  </g>

</svg>
