<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .title { font-weight: 800; fill: #38bdf8; font-size: 24px; letter-spacing: 0.5px; }
      .desc { font-weight: 400; fill: #94a3b8; font-size: 14px; }
      .badge { fill: #0b0f19; font-weight: 800; font-size: 18px; text-anchor: middle; }
      .panel-label { font-weight: 700; fill: #f0f4ff; font-size: 15px; }
      .panel-sub { font-weight: 400; fill: #94a3b8; font-size: 12px; }
    </style>
    <filter id="shadowWindow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="860" fill="#0b0f19" rx="16"/>

  <!-- Encabezado Principal -->
  <text x="40" y="48" class="title">MAPA DE LA INTERFAZ PRINCIPAL — RACK DESIGNER NEXT</text>
  <text x="40" y="72" class="desc">Guía de orientación visual de los 5 cuadrantes operativos de la consola de datacenter</text>

  <!-- VENTANA MOCKUP DE LA APLICACIÓN -->
  <g transform="translate(40, 95)" filter="url(#shadowWindow)">
    <!-- Contenedor Base -->
    <rect width="1120" height="610" rx="8" fill="#151c2e" stroke="#25304b" stroke-width="2"/>
    
    <!-- 1. BARRA SUPERIOR (HEADER 56px) -->
    <rect x="0" y="0" width="1120" height="58" fill="#0f172a" rx="8" stroke="#25304b" stroke-width="1"/>
    <circle cx="560" cy="29" r="15" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="560" y="35" class="badge">1</text>
    <text x="24" y="34" class="panel-label">BARRA SUPERIOR</text>
    <text x="160" y="34" fill="#38bdf8" font-size="12" class="mono">(Salas, Racks, Vistas Física/Topología, 3 Temas Oscuro/Claro/Sepia M-18, Undo/Redo M-03 y RBAC)</text>

    <!-- 2. SIDEBAR LATERAL IZQUIERDO (CATÁLOGO) -->
    <rect x="0" y="58" width="240" height="392" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <circle cx="120" cy="220" r="15" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="120" y="226" class="badge">2</text>
    <text x="120" y="256" text-anchor="middle" class="panel-label">CATÁLOGO Y PLANTILLAS</text>
    <text x="120" y="276" text-anchor="middle" class="panel-sub">Servidores, Switches, Routers, Patch Panels</text>
    <text x="120" y="294" text-anchor="middle" fill="#38bdf8" font-size="11">Arrastra hacia los gabinetes</text>

    <!-- 3. LIENZO CENTRAL (ÁREA DE TRABAJO DUAL) -->
    <rect x="240" y="58" width="630" height="392" fill="#0b0f19" stroke="#25304b" stroke-width="1"/>
    <circle cx="555" cy="220" r="15" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="555" y="226" class="badge">3</text>
    <text x="555" y="256" text-anchor="middle" class="panel-label">LIENZO CENTRAL (ÁREA DE TRABAJO DUAL)</text>
    <text x="555" y="278" text-anchor="middle" class="panel-sub">• Vista Física: Gabinetes 42U, Bicanalidad Techo/Piso (M-41), Flip 3D y gap 72px</text>
    <text x="555" y="296" text-anchor="middle" class="panel-sub">• Topología: Canvas 2D, Skins Hardware (M-28), Enlaces Bezier y 5 Slots (M-40)</text>

    <!-- 4. PANEL LATERAL DERECHO (INSPECTOR & OUTLINER) -->
    <rect x="870" y="58" width="250" height="392" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <circle cx="995" cy="220" r="15" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="995" y="226" class="badge">4</text>
    <text x="995" y="256" text-anchor="middle" class="panel-label">OUTLINER &amp; PROPIEDADES</text>
    <text x="995" y="278" text-anchor="middle" class="panel-sub">Árbol jerárquico ordenable (U/Nombre)</text>
    <text x="995" y="296" text-anchor="middle" class="panel-sub">Edición instantánea de IP, MAC y potencia</text>

    <!-- 5. PANEL INFERIOR (TABLAS MODULARES DE DATOS) -->
    <rect x="0" y="450" width="1120" height="160" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <circle cx="560" cy="515" r="15" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="560" y="521" class="badge">5</text>
    <text x="560" y="550" text-anchor="middle" class="panel-label">TABLAS DE DATOS MODULARES (Inventario y Conexiones)</text>
    <text x="560" y="570" text-anchor="middle" class="panel-sub">Selector de Columnas Visibles (Propuesta 3) · Importación Masiva Excel/CSV (M-21/M-22) · Inversión Swap ⇄ y Canaleta Techo/Piso (M-41)</text>
  </g>

  <!-- LEYENDA INFERIOR DETALLADA -->
  <g transform="translate(40, 725)">
    <!-- Columna 1 -->
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="12" fill="#f59e0b"/>
      <text x="12" y="17" class="badge" font-size="14">1</text>
      <text x="32" y="12" font-size="13" font-weight="700" fill="#f0f4ff">Barra Superior:</text>
      <text x="32" y="28" font-size="11.5" fill="#94a3b8">Cambio de sala activa, selección de racks, alternancia de vistas, ciclo de 3 temas (🌙 Oscuro / ☀️ Claro / ☕ Sepia), Deshacer/Rehacer e inicio de sesión RBAC.</text>
    </g>

    <g transform="translate(0, 48)">
      <circle cx="12" cy="12" r="12" fill="#f59e0b"/>
      <text x="12" y="17" class="badge" font-size="14">2</text>
      <text x="32" y="12" font-size="13" font-weight="700" fill="#f0f4ff">Catálogo de Equipos:</text>
      <text x="32" y="28" font-size="11.5" fill="#94a3b8">Biblioteca agrupada de hardware certificado con especificaciones de altura en U, consumo en Watts y tipos de conectividad para arrastre directo al gabinete.</text>
    </g>

    <!-- Columna 2 -->
    <g transform="translate(580, 0)">
      <circle cx="12" cy="12" r="12" fill="#f59e0b"/>
      <text x="12" y="17" class="badge" font-size="14">3</text>
      <text x="32" y="12" font-size="13" font-weight="700" fill="#f0f4ff">Lienzo Central:</text>
      <text x="32" y="28" font-size="11.5" fill="#94a3b8">Espacio interactivo con zoom infinito, renderizado O(1) selectivo, bicanalidad física de cables y motor de topología Canvas 2D con skins fotorrealistas y 5 memorias.</text>
    </g>

    <g transform="translate(580, 48)">
      <circle cx="12" cy="12" r="12" fill="#f59e0b"/>
      <text x="12" y="17" class="badge" font-size="14">4</text>
      <text x="32" y="12" font-size="13" font-weight="700" fill="#f0f4ff">Inspector &amp; Outliner:</text>
      <text x="32" y="28" font-size="11.5" fill="#94a3b8">Árbol estructurado de la infraestructura y formulario reactivo para configuración de IPs, credenciales cifradas (AES-GCM), lados de montaje y métricas de peso TIA-942.</text>
    </g>

    <!-- Fila inferior ancha para el punto 5 -->
    <g transform="translate(0, 96)">
      <circle cx="12" cy="12" r="12" fill="#f59e0b"/>
      <text x="12" y="17" class="badge" font-size="14">5</text>
      <text x="32" y="12" font-size="13" font-weight="700" fill="#f0f4ff">Tablas de Datos:</text>
      <text x="145" y="12" font-size="11.5" fill="#94a3b8">Gestión masiva tabular con selector configurable de columnas, importación de planillas XLSX/CSV, inversión de origen/destino y exportación técnica.</text>
    </g>
  </g>

</svg>
