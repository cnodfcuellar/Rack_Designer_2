<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#0b0f19" rx="12"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="700">RACK Designer Next — Project Areas</text>
  <text x="600" y="72" text-anchor="middle" fill="#64748b" font-size="13">100% Vanilla JS PWA · No build step · Reactive Proxy Architecture</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ROW 1: Core Architecture -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- index.html (Entry Point) -->
  <rect x="30" y="100" width="220" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="30" y="100" width="220" height="28" rx="8" fill="#0f172a"/>
  <text x="140" y="119" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">HTML</text>
  <text x="140" y="148" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">index.html</text>
  <text x="140" y="166" text-anchor="middle" fill="#94a3b8" font-size="10">Entry Point · DOM Skeleton</text>
  <text x="140" y="180" text-anchor="middle" fill="#64748b" font-size="9">script tags · CSS links</text>

  <!-- store.js (State Brain) -->
  <rect x="310" y="100" width="220" height="90" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="310" y="100" width="220" height="28" rx="8" fill="#0f172a"/>
  <text x="420" y="119" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="700">STATE</text>
  <text x="420" y="148" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">js/store.js</text>
  <text x="420" y="166" text-anchor="middle" fill="#94a3b8" font-size="10">ES6 Proxy · localStorage</text>
  <text x="420" y="180" text-anchor="middle" fill="#64748b" font-size="9">Event emitter · undo/redo</text>

  <!-- main.js (Orchestrator) -->
  <rect x="590" y="100" width="220" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="590" y="100" width="220" height="28" rx="8" fill="#0f172a"/>
  <text x="700" y="119" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">ORCHESTRATOR</text>
  <text x="700" y="148" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">js/main.js</text>
  <text x="700" y="166" text-anchor="middle" fill="#94a3b8" font-size="10">renderAll() · Event binding</text>
  <text x="700" y="180" text-anchor="middle" fill="#64748b" font-size="9">Init · Auth · Routing</text>

  <!-- Auth -->
  <rect x="870" y="100" width="160" height="90" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="870" y="100" width="160" height="28" rx="8" fill="#0f172a"/>
  <text x="950" y="119" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700">AUTH</text>
  <text x="950" y="148" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">auth/roles.js</text>
  <text x="950" y="166" text-anchor="middle" fill="#94a3b8" font-size="10">SHA-256 PIN</text>
  <text x="950" y="180" text-anchor="middle" fill="#64748b" font-size="9">Admin/Editor/Viewer</text>

