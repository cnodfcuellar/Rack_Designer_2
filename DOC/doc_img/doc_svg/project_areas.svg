  <line x1="810" y1="145" x2="870" y2="145" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="870,145 863,140 863,150" fill="#475569"/>

  <!-- Data Flow Label -->
  <text x="420" y="208" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">User Action → Store Mutate → Event → renderAll() → DOM Update</text>

