  <polygon points="310,145 303,140 303,150" fill="#475569"/>
  <line x1="530" y1="145" x2="590" y2="145" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="590,145 583,140 583,150" fill="#475569"/>
