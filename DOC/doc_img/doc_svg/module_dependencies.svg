  <line x1="560" y1="320" x2="640" y2="138" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowC)"/>
  <circle cx="660" cy="118" r="42" fill="#05050e" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="112" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#a5b4fc" font-weight="700">demoData.js</text>
  <text x="660" y="128" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Lazy inject</text>

