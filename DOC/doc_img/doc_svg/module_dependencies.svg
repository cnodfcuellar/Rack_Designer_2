  <line x1="490" y1="360" x2="180" y2="360" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowC)"/>
  <circle cx="128" cy="360" r="42" fill="#080510" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="128" y="354" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#fca5a5" font-weight="700">roles.js</text>
  <text x="128" y="370" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">RBAC Auth</text>

  <!-- rack.js -->
  <line x1="510" y1="430" x2="230" y2="560" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowC)"/>
  <circle cx="190" cy="582" r="44" fill="#050d08" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="577" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#6ee7b7" font-weight="700">rack.js</text>
  <text x="190" y="593" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">DOM Renderer</text>

  <!-- catalog.js -->
  <line x1="540" y1="438" x2="400" y2="642" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowC)"/>
  <circle cx="390" cy="668" r="42" fill="#050d08" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="663" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#86efac" font-weight="700">catalog.js</text>
  <text x="390" y="679" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">DnD · Filters</text>

  <!-- tables.js -->
  <line x1="565" y1="440" x2="570" y2="648" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowC)"/>
  <circle cx="570" cy="672" r="40" fill="#050a12" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="667" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#93c5fd" font-weight="700">tables.js</text>
  <text x="570" y="683" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Inventory</text>

  <!-- topology/ -->
  <line x1="590" y1="440" x2="750" y2="622" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowC)"/>
  <circle cx="770" cy="648" r="44" fill="#050a10" stroke="#22d3ee" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770" y="643" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#a5f3fc" font-weight="700">topology/</text>
  <text x="770" y="659" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Canvas Engine</text>

