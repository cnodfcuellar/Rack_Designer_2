<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a"/>
      <stop offset="100%" style="stop-color:#0a1520"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/></filter>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1100" height="800" fill="url(#bg)"/>
  <rect width="1100" height="800" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="40" y="28" width="480" height="52" rx="6" fill="#0d1f30" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="40" y1="28" x2="40" y2="80" stroke="#a855f7" stroke-width="3"/>
  <text x="60" y="49" font-family="'Segoe UI', sans-serif" font-size="9" fill="#a855f7" letter-spacing="3" font-weight="600">RACK DESIGNER 2  ·  MODULE ARCHITECTURE</text>
  <text x="60" y="68" font-family="'Segoe UI', sans-serif" font-size="20" fill="#f0f6ff" font-weight="700">MODULE DEPENDENCIES  ·  DEPENDENCY MAP</text>

  <!-- Central node: main.js -->
  <circle cx="550" cy="380" r="60" fill="#0a0a18" stroke="#a855f7" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="550" cy="380" r="60" fill="url(#bg)" fill-opacity="0.8"/>
  <text x="550" y="373" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c4b5fd" font-weight="700" letter-spacing="1">ORCHESTRATOR</text>
  <text x="550" y="392" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="14" fill="#f0f6ff" font-weight="700">main.js</text>
  <circle cx="550" cy="380" r="62" fill="none" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Satellite nodes & edges -->
  <!-- store.js -->
  <line x1="490" y1="340" x2="260" y2="200" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowC)"/>
  <circle cx="220" cy="178" r="46" fill="#050e1a" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="173" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#7dd3fc" font-weight="700">store.js</text>
  <text x="220" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">State Engine</text>

  <!-- utils.js -->
  <line x1="540" y1="320" x2="450" y2="148" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowC)"/>
  <circle cx="450" cy="122" r="40" fill="#0d0e05" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="117" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#fde68a" font-weight="700">utils.js</text>
  <text x="450" y="132" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Helpers · uuid()</text>

