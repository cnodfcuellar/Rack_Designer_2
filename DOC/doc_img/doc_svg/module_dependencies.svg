  <line x1="610" y1="430" x2="870" y2="560" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowP)"/>
  <circle cx="910" cy="582" r="44" fill="#0a050e" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="910" y="577" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#e9d5ff" font-weight="700">modals/</text>
  <text x="910" y="593" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">UI Popups</text>

  <!-- fileManager.js -->
  <line x1="610" y1="360" x2="952" y2="360" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowP)"/>
  <circle cx="968" cy="360" r="42" fill="#0d0d05" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="968" y="354" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#fde68a" font-weight="700">file</text>
  <text x="968" y="368" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#fde68a" font-weight="700">Manager.js</text>
  <text x="968" y="384" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#64748b">FS API</text>

  <!-- export.js -->
  <line x1="610" y1="340" x2="870" y2="200" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,4" marker-end="url(#arrowP)"/>
  <circle cx="902" cy="180" r="42" fill="#0d0805" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="902" y="174" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#fdba74" font-weight="700">export.js</text>
  <text x="902" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">CSV/PNG/JSON</text>

  <!-- Legend -->
  <rect x="60" y="720" width="980" height="52" rx="10" fill="#0d1520" stroke="#334155" stroke-width="1"/>
  <text x="90" y="742" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b" font-weight="600">LEGEND:</text>
  <line x1="150" y1="740" x2="180" y2="740" stroke="#00d4ff" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="188" y="744" font-family="'Segoe UI', sans-serif" font-size="9" fill="#7dd3fc">Core modules</text>
  <line x1="280" y1="740" x2="310" y2="740" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="318" y="744" font-family="'Segoe UI', sans-serif" font-size="9" fill="#c4b5fd">UI modules</text>
  <line x1="400" y1="740" x2="430" y2="740" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="438" y="744" font-family="'Segoe UI', sans-serif" font-size="9" fill="#6ee7b7">Render modules</text>
  <text x="90" y="762" font-family="'Segoe UI', monospace" font-size="9" fill="#334155">All modules register 'store-updated' listeners · No direct cross-module coupling · main.js is the sole orchestrator</text>

  <!-- Footer -->
  <line x1="40" y1="782" x2="1060" y2="782" stroke="#fff" stroke-width="0.3" stroke-opacity="0.1"/>
  <text x="48" y="798" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">RACK Designer 2  ·  Module Dependencies</text>
  <text x="1052" y="798" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">doc_img/doc_svg/module_dependencies.svg</text>
</svg>
