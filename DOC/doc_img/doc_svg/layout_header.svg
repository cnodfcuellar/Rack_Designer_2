<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 140" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <rect width="1100" height="140" fill="#0b0f19" rx="8"/>
  <text x="550" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Header Layout — #header (56px height)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- HEADER BAR -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="10" y="30" width="1080" height="56" rx="0" fill="#151c2e" stroke="#25304b" stroke-width="1"/>

  <!-- A. header-logo-area (280px) -->
  <rect x="10" y="30" width="280" height="56" rx="0" fill="#0b0f19" stroke="#25304b" stroke-width="1"/>
  <!-- Logo icon 24x24 -->
  <rect x="26" y="46" width="24" height="24" rx="4" fill="#0ea5e9" opacity="0.15"/>
  <text x="38" y="62" text-anchor="middle" fill="#0ea5e9" font-size="10" font-weight="700">RD</text>
  <!-- Title -->
  <text x="58" y="59" fill="#0ea5e9" font-size="13" font-weight="700">RACK Designer Next</text>
  <text x="58" y="74" fill="#94a3b8" font-size="10" class="mono">Nuevo Proyecto</text>
  <!-- Menu button (24x24) -->
  <rect x="266" y="48" width="24" height="24" rx="6" fill="#0b0f19" stroke="#25304b" stroke-width="1"/>
  <line x1="272" y1="57" x2="284" y2="57" stroke="#8b9ab8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="272" y1="62" x2="284" y2="62" stroke="#8b9ab8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="272" y1="67" x2="284" y2="67" stroke="#8b9ab8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="290" y1="38" x2="290" y2="78" stroke="#25304b" stroke-width="1"/>

  <!-- B. header-main-area (flex:1) -->
  <rect x="292" y="30" width="798" height="56" rx="0" fill="#151c2e"/>

  <!-- Room Dropdown -->
  <rect x="304" y="44" width="130" height="24" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="1"/>
  <!-- Building icon 14x14 -->
  <rect x="312" y="50" width="10" height="10" rx="2" fill="#38bdf8" opacity="0.3"/>
  <text x="317" y="58" text-anchor="middle" fill="#38bdf8" font-size="7">▸</text>
  <text x="328" y="60" fill="#f0f4ff" font-size="11">Data Center</text>
  <!-- Chevron -->
  <text x="424" y="60" fill="#64748b" font-size="8">▾</text>
  <!-- + button -->
  <rect x="440" y="44" width="24" height="24" rx="6" fill="transparent" stroke="#25304b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="452" y="60" text-anchor="middle" fill="#64748b" font-size="12">+</text>

  <!-- Divider -->
  <line x1="476" y1="38" x2="476" y2="78" stroke="#25304b" stroke-width="1"/>

  <!-- Rack Dropdown -->
  <rect x="488" y="44" width="110" height="24" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="1"/>
  <rect x="496" y="50" width="10" height="10" rx="2" fill="#38bdf8" opacity="0.3"/>
  <text x="501" y="58" text-anchor="middle" fill="#38bdf8" font-size="7">▸</text>
  <text x="512" y="60" fill="#f0f4ff" font-size="11">Racks (3)</text>
  <text x="588" y="60" fill="#64748b" font-size="8">▾</text>
  <!-- + button -->
  <rect x="604" y="44" width="24" height="24" rx="6" fill="transparent" stroke="#25304b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="616" y="60" text-anchor="middle" fill="#64748b" font-size="12">+</text>

  <!-- Divider -->
  <line x1="640" y1="38" x2="640" y2="78" stroke="#25304b" stroke-width="1"/>

  <!-- View Tabs -->
  <rect x="652" y="44" width="100" height="24" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="1"/>
  <rect x="660" y="50" width="10" height="10" rx="2" fill="#0ea5e9" opacity="0.3"/>
  <text x="676" y="60" fill="#0ea5e9" font-size="11" font-weight="500">Vista Fisica</text>
  <rect x="758" y="44" width="82" height="24" rx="6" fill="transparent" stroke="#25304b" stroke-width="1"/>
  <rect x="766" y="50" width="10" height="10" rx="2" fill="#8b9ab8" opacity="0.3"/>
  <text x="782" y="60" fill="#8b9ab8" font-size="11">Topologia</text>

  <!-- Spacer -->
  <rect x="848" y="44" width="60" height="24" fill="transparent"/>

  <!-- Search -->
  <rect x="916" y="44" width="160" height="24" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="1"/>
  <text x="926" y="60" fill="#475569" font-size="10" class="mono">Buscar equipo, IP...</text>

  <!-- Undo/Redo -->
  <rect x="1084" y="44" width="24" height="24" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="1"/>
  <text x="1096" y="60" text-anchor="middle" fill="#8b9ab8" font-size="10">↩</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ANNOTATIONS -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Dimension: 56px -->
  <line x1="1096" y1="30" x2="1096" y2="86" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="1088" y="62" fill="#475569" font-size="8" class="mono" text-anchor="end">56px</text>

  <!-- Area labels -->
  <line x1="10" y1="92" x2="290" y2="92" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="150" y="104" text-anchor="middle" fill="#475569" font-size="9" class="mono">.header-logo-area (280px)</text>

  <line x1="292" y1="92" x2="1090" y2="92" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="690" y="104" text-anchor="middle" fill="#475569" font-size="9" class="mono">.header-main-area (flex: 1, gap: 12px, padding: 0 16px)</text>

  <!-- CSS variables legend -->
  <rect x="10" y="112" width="1080" height="22" rx="4" fill="#1e293b" opacity="0.5"/>
  <text x="20" y="127" fill="#475569" font-size="8" font-weight="600">VARS:</text>
  <text x="70" y="127" fill="#64748b" font-size="8" class="mono">--header-h: 56px</text>
  <text x="190" y="127" fill="#64748b" font-size="8" class="mono">--bg-card: #151c2e</text>
  <text x="340" y="127" fill="#64748b" font-size="8" class="mono">--border: #25304b</text>
  <text x="490" y="127" fill="#64748b" font-size="8" class="mono">--accent: #0ea5e9</text>
  <text x="640" y="127" fill="#64748b" font-size="8" class="mono">--text-sm: 11px</text>
  <text x="780" y="127" fill="#64748b" font-size="8" class="mono">--radius: 6px</text>
  <text x="910" y="127" fill="#64748b" font-size="8" class="mono">height: 24px (all controls)</text>

</svg>