<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <rect width="1100" height="360" fill="#0b0f19" rx="8"/>
  <text x="550" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Bottom Panel Layout — #bottom (220px height, full width)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- BOTTOM PANEL -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="10" y="30" width="1080" height="290" fill="#151c2e" stroke="#25304b" stroke-width="1"/>

  <!-- A. bottom-header (38px) -->
  <rect x="10" y="30" width="1080" height="38" fill="#0f172a"/>
  <line x1="10" y1="68" x2="1090" y2="68" stroke="#25304b" stroke-width="1"/>

  <!-- Tab pills -->
  <rect x="22" y="38" width="80" height="22" rx="6" fill="#0ea5e933" stroke="#0ea5e9" stroke-width="0.5"/>
  <!-- Server icon 12x12 -->
  <rect x="30" y="43" width="10" height="10" rx="2" fill="#0ea5e9" opacity="0.4"/>
  <text x="35" y="51" text-anchor="middle" fill="#0ea5e9" font-size="6">▸</text>
  <text x="48" y="53" fill="#0ea5e9" font-size="10" font-weight="500">Inventario</text>

  <rect x="108" y="38" width="88" height="22" rx="6" fill="transparent" stroke="#25304b" stroke-width="0.5"/>
  <rect x="116" y="43" width="10" height="10" rx="2" fill="#8b9ab8" opacity="0.3"/>
  <text x="121" y="51" text-anchor="middle" fill="#8b9ab8" font-size="6">▸</text>
  <text x="136" y="53" fill="#8b9ab8" font-size="10">Conexiones</text>

  <!-- Spacer -->
  <rect x="204" y="38" width="100" height="22" fill="transparent"/>

  <!-- + Equipo button (context) -->
  <rect x="310" y="38" width="70" height="22" rx="6" fill="#0ea5e933" stroke="#0ea5e9" stroke-width="0.5"/>
  <text x="345" y="53" text-anchor="middle" fill="#0ea5e9" font-size="10">+ Equipo</text>

  <!-- Table search -->
  <rect x="580" y="38" width="160" height="22" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <text x="590" y="53" fill="#475569" font-size="9" class="mono">Filtrar tabla...</text>

  <!-- Export dropdown -->
  <rect x="750" y="38" width="70" height="22" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <text x="785" y="53" text-anchor="middle" fill="#8b9ab8" font-size="9">⬇ Exportar ▾</text>

  <!-- Expand -->
  <rect x="830" y="38" width="60" height="22" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <text x="860" y="53" text-anchor="middle" fill="#8b9ab8" font-size="9">Expandir</text>

  <!-- Collapse -->
  <rect x="896" y="38" width="22" height="22" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <text x="907" y="53" text-anchor="middle" fill="#64748b" font-size="9">▾</text>

  <!-- B. Table Header -->
  <rect x="10" y="68" width="1080" height="24" fill="#0b0f19"/>
  <line x1="10" y1="92" x2="1090" y2="92" stroke="#25304b" stroke-width="0.5"/>

  <!-- Column headers -->
  <text x="30" y="84" fill="#94a3b8" font-size="10" font-weight="600" class="mono">NOMBRE</text>
  <text x="160" y="84" fill="#94a3b8" font-size="10" font-weight="600" class="mono">TIPO</text>
  <text x="260" y="84" fill="#94a3b8" font-size="10" font-weight="600" class="mono">TAM</text>
  <text x="340" y="84" fill="#94a3b8" font-size="10" font-weight="600" class="mono">UBICACION</text>
  <text x="510" y="84" fill="#94a3b8" font-size="10" font-weight="600" class="mono">IP</text>
  <text x="650" y="84" fill="#94a3b8" font-size="10" font-weight="600" class="mono">MAC</text>
  <text x="810" y="84" fill="#94a3b8" font-size="10" font-weight="600" class="mono">ESTADO</text>
  <text x="910" y="84" fill="#94a3b8" font-size="10" font-weight="600" class="mono">W</text>
  <text x="1020" y="84" fill="#94a3b8" font-size="10" font-weight="600" class="mono">ACCIONES</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- TABLE ROWS -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Row 1: Server -->
  <rect x="10" y="92" width="1080" height="28" fill="#0b0f19"/>
  <line x1="10" y1="120" x2="1090" y2="120" stroke="#25304b" stroke-width="0.5"/>
  <text x="30" y="110" fill="#f0f4ff" font-size="10" class="mono">SRV-001</text>
  <!-- Type badge -->
  <rect x="160" y="100" width="52" height="16" rx="3" fill="#0ea5e922"/>
  <text x="186" y="111" text-anchor="middle" fill="#0ea5e9" font-size="9" font-weight="700" class="mono">server</text>
  <text x="260" y="110" fill="#94a3b8" font-size="10" class="mono">2U</text>
  <text x="340" y="110" fill="#94a3b8" font-size="10" class="mono">Rack-A1 / U1-U2</text>
  <text x="510" y="110" fill="#94a3b8" font-size="10" class="mono">192.168.1.10</text>
  <text x="650" y="110" fill="#475569" font-size="10" class="mono">AA:BB:CC:DD:EE:FF</text>
  <!-- Status dot -->
  <circle cx="820" cy="106" r="4" fill="#22c55e"/>
  <text x="830" y="110" fill="#22c55e" font-size="10">activo</text>
  <text x="910" y="110" fill="#94a3b8" font-size="10" class="mono">460</text>
  <!-- Actions -->
  <text x="1020" y="110" fill="#38bdf8" font-size="10">✎</text>
  <text x="1040" y="110" fill="#ef4444" font-size="10">🗑</text>
  <text x="1060" y="110" fill="#64748b" font-size="10">⋮</text>

