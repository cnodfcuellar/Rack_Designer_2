  <rect x="10" y="120" width="1080" height="28" fill="#151c2e"/>
  <line x1="10" y1="148" x2="1090" y2="148" stroke="#25304b" stroke-width="0.5"/>
  <text x="30" y="138" fill="#f0f4ff" font-size="10" class="mono">SW-001</text>
  <rect x="160" y="128" width="48" height="16" rx="3" fill="#10b98122"/>
  <text x="184" y="139" text-anchor="middle" fill="#10b981" font-size="9" font-weight="700" class="mono">switch</text>
  <text x="260" y="138" fill="#94a3b8" font-size="10" class="mono">1U</text>
  <text x="340" y="138" fill="#94a3b8" font-size="10" class="mono">Rack-A1 / U3</text>
  <text x="510" y="138" fill="#94a3b8" font-size="10" class="mono">192.168.1.1</text>
  <text x="650" y="138" fill="#475569" font-size="10" class="mono">AA:BB:CC:DD:EE:01</text>
  <circle cx="820" cy="134" r="4" fill="#22c55e"/>
  <text x="830" y="138" fill="#22c55e" font-size="10">activo</text>
  <text x="910" y="138" fill="#94a3b8" font-size="10" class="mono">180</text>
  <text x="1020" y="138" fill="#38bdf8" font-size="10">✎</text>
  <text x="1040" y="138" fill="#ef4444" font-size="10">🗑</text>
  <text x="1060" y="138" fill="#64748b" font-size="10">⋮</text>

  <!-- Row 3: Router -->
  <rect x="10" y="148" width="1080" height="28" fill="#0b0f19"/>
  <line x1="10" y1="176" x2="1090" y2="176" stroke="#25304b" stroke-width="0.5"/>
  <text x="30" y="166" fill="#f0f4ff" font-size="10" class="mono">RTR-001</text>
  <rect x="160" y="156" width="50" height="16" rx="3" fill="#f59e0b22"/>
  <text x="185" y="167" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700" class="mono">router</text>
  <text x="260" y="166" fill="#94a3b8" font-size="10" class="mono">1U</text>
  <text x="340" y="166" fill="#94a3b8" font-size="10" class="mono">Rack-A1 / U4</text>
  <text x="510" y="166" fill="#94a3b8" font-size="10" class="mono">192.168.1.254</text>
  <text x="650" y="166" fill="#475569" font-size="10" class="mono">AA:BB:CC:DD:EE:FE</text>
  <circle cx="820" cy="162" r="4" fill="#22c55e"/>
  <text x="830" y="166" fill="#22c55e" font-size="10">activo</text>
  <text x="910" y="166" fill="#94a3b8" font-size="10" class="mono">90</text>
  <text x="1020" y="166" fill="#38bdf8" font-size="10">✎</text>
  <text x="1040" y="166" fill="#ef4444" font-size="10">🗑</text>
  <text x="1060" y="166" fill="#64748b" font-size="10">⋮</text>

