<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .glow-tray { filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4)); }
      .glow-cable-blue { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.7)); }
      .glow-cable-purple { filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.7)); }
    </style>

    <!-- Patrón de puntos de fondo (Datacenter grid) -->
    <pattern id="grid-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.7" fill="#22324e" opacity="0.6"/>
    </pattern>

    <!-- Patrón de rejilla de la escalerilla porta-cables (Overhead Cable Tray) -->
    <pattern id="cable-tray-pattern" width="16" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="16" y2="0" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
      <line x1="0" y1="28" x2="16" y2="28" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
      <line x1="8" y1="0" x2="8" y2="28" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="16" y2="28" stroke="#d97706" stroke-width="0.7" opacity="0.25"/>
    </pattern>

    <!-- Gradientes -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="card-rack1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0f1523"/>
    </linearGradient>

    <linearGradient id="card-rack2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122026"/>
      <stop offset="100%" stop-color="#0c171c"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fondo Principal -->
  <rect width="960" height="560" fill="url(#bg-grad)" rx="10"/>
  <rect width="960" height="560" fill="url(#grid-dots)" rx="10"/>
  <rect width="960" height="560" fill="none" stroke="#1e293b" stroke-width="1.5" rx="10"/>

  <!-- Encabezado de la Propuesta -->
  <rect x="24" y="16" width="912" height="50" rx="8" fill="url(#header-grad)" stroke="#334155" stroke-width="1"/>
  <rect x="34" y="24" width="8" height="34" rx="4" fill="#38bdf8"/>
  <text x="52" y="38" fill="#f8fafc" font-size="15" font-weight="700">PROPUESTA 1: CANASTILLO SUPERIOR (OVERHEAD TRAY) + SALIDA INTELIGENTE</text>
  <text x="52" y="55" fill="#94a3b8" font-size="11">Enrutamiento aéreo tipo Data Center real con salida por el lateral más cercano al destino</text>
  
  <rect x="800" y="26" width="124" height="28" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <text x="862" y="44" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">★ RECOMENDADA</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- CANASTILLO SUPERIOR AÉREO (OVERHEAD CABLE TRAY) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g class="glow-tray">
    <rect x="50" y="80" width="860" height="28" rx="4" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="50" y="80" width="860" height="28" fill="url(#cable-tray-pattern)"/>
  </g>
  <rect x="360" y="84" width="240" height="20" rx="4" fill="#0f172a" opacity="0.9" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="480" y="98" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle" class="mono">▲ BANDEJA SUPERIOR PORTA-CABLES (OVERHEAD TRAY)</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- GABINETES (RACKS) -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- RACK 101 (42U - Principal) -->
  <g id="rack-101">
    <rect x="60" y="130" width="200" height="380" rx="6" fill="url(#card-rack1)" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Header Rack -->
    <rect x="60" y="130" width="200" height="26" rx="6" fill="#0f2744"/>
    <circle cx="74" cy="143" r="4" fill="#38bdf8"/>
    <text x="84" y="147" fill="#f8fafc" font-size="11" font-weight="700">Rack 101 (42U Principal)</text>
    
    <!-- Equipos en Rack 101 -->
    <!-- U42 Firewall -->
    <rect x="74" y="162" width="172" height="18" rx="3" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="82" y="175" fill="#c7d2fe" font-size="9" font-weight="600">Firewall Edge</text>

    <!-- U41 Core Switch (Destino principal) -->
    <rect x="74" y="184" width="172" height="20" rx="3" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="236" cy="194" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="82" y="198" fill="#e0f2fe" font-size="9" font-weight="700">Core Switch 24P (Te1/0/10)</text>

    <!-- Servidores -->
    <rect x="74" y="212" width="172" height="26" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="82" y="228" fill="#94a3b8" font-size="9">Servidor Storage 2U</text>
    <rect x="74" y="244" width="172" height="26" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="82" y="260" fill="#94a3b8" font-size="9">Servidor Virtualización 2U</text>

    <!-- Slots vacíos ilustrados -->
    <line x1="74" y1="280" x2="246" y2="280" stroke="#1e293b" stroke-dasharray="2,2"/>
    <text x="160" y="340" fill="#334155" font-size="11" text-anchor="middle" class="mono">[ 32U Disponibles ]</text>
    <line x1="74" y1="480" x2="246" y2="480" stroke="#1e293b" stroke-dasharray="2,2"/>

    <!-- UPS Base -->
    <rect x="74" y="484" width="172" height="22" rx="3" fill="#271a0c" stroke="#f59e0b" stroke-width="1"/>
    <text x="82" y="498" fill="#fde68a" font-size="8" font-weight="600">UPS Online 3000VA</text>
  </g>

  <!-- RACK 102 (12U - Distribución) -->
  <g id="rack-102">
    <rect x="332" y="130" width="200" height="170" rx="6" fill="url(#card-rack2)" stroke="#059669" stroke-width="1.5"/>
    <!-- Header Rack -->
    <rect x="332" y="130" width="200" height="26" rx="6" fill="#064e3b"/>
    <circle cx="346" cy="143" r="4" fill="#10b981"/>
    <text x="356" y="147" fill="#f8fafc" font-size="11" font-weight="700">Rack 102 (12U)</text>

    <!-- U12 Switch 102 (Origen Cable Azul) -->
    <rect x="346" y="162" width="172" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="356" cy="172" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="368" y="176" fill="#d1fae5" font-size="9" font-weight="700">Switch Rack 102</text>

    <!-- Patch Panel & Servidores -->
    <rect x="346" y="188" width="172" height="16" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="354" y="200" fill="#94a3b8" font-size="8">Patch Panel Cat6A 24P</text>
    <rect x="346" y="210" width="172" height="26" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="354" y="226" fill="#94a3b8" font-size="8">Servidor Aplicaciones 2U</text>
    <rect x="346" y="270" width="172" height="22" rx="3" fill="#271a0c" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="354" y="284" fill="#fde68a" font-size="8">UPS Rack 1500VA</text>

    <!-- Zona libre debajo de Rack 102 -->
    <rect x="332" y="306" width="200" height="204" rx="6" fill="#0b111e" stroke="#1e293b" stroke-dasharray="4,4" opacity="0.6"/>
    <text x="432" y="410" fill="#475569" font-size="10" text-anchor="middle">Zona inferior despejada</text>
    <text x="432" y="426" fill="#334155" font-size="9" text-anchor="middle">(Sin cables invasores)</text>
  </g>

  <!-- RACK 103 (12U - Distribución) -->
  <g id="rack-103">
    <rect x="604" y="130" width="200" height="170" rx="6" fill="url(#card-rack1)" stroke="#7c3aed" stroke-width="1.5"/>
    <!-- Header Rack -->
    <rect x="604" y="130" width="200" height="26" rx="6" fill="#4c1d95"/>
    <circle cx="618" cy="143" r="4" fill="#a855f7"/>
    <text x="628" y="147" fill="#f8fafc" font-size="11" font-weight="700">Rack 103 (12U)</text>

    <!-- U12 Switch 103 (Origen Cable Púrpura) -->
    <rect x="618" y="162" width="172" height="20" rx="3" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="628" cy="172" r="3.5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
    <text x="640" y="176" fill="#f3e8ff" font-size="9" font-weight="700">Switch Rack 103</text>

    <rect x="618" y="188" width="172" height="16" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="626" y="200" fill="#94a3b8" font-size="8">Bandeja ODF Fibra 24P</text>
    <rect x="618" y="210" width="172" height="26" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="626" y="226" fill="#94a3b8" font-size="8">NVR Seguridad 2U</text>
    <rect x="618" y="270" width="172" height="22" rx="3" fill="#271a0c" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="626" y="284" fill="#fde68a" font-size="8">UPS Rack 1500VA</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- TRAZADO DE CABLES INTELIGENTE POR CANASTILLO SUPERIOR -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Cable 1: Switch 102 -> Core Switch (Azul Cyan) -->
  <!-- Origen: x=356, y=172 (Rack 102). Sale a la IZQUIERDA (x=305), sube a y=94, viaja a x=270, baja a x=236, y=194 -->
  <g class="glow-cable-blue">
    <path d="M 356 172
             L 310 172
             Q 302 172 302 164
             L 302 102
             Q 302 94 294 94
             L 272 94
             Q 264 94 264 102
             L 264 186
             Q 264 194 256 194
             L 236 194"
          stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- Puntos terminales -->
  <circle cx="356" cy="172" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="236" cy="194" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Indicador con flecha Cable Azul -->
  <rect x="278" y="58" width="136" height="18" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <text x="346" y="70" fill="#ffffff" font-size="8.5" font-weight="700" text-anchor="middle">Enlace Fibra 10G (Azul)</text>
  <path d="M 346 76 L 346 88" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Cable 2: Switch 103 -> Core Switch (Púrpura) -->
  <!-- Origen: x=628, y=172 (Rack 103). Sale a la IZQUIERDA (x=575), sube a y=88, viaja sobre la bandeja, baja a x=275 -> Core Switch -->
  <g class="glow-cable-purple">
    <path d="M 628 172
             L 580 172
             Q 572 172 572 164
             L 572 96
             Q 572 88 564 88
             L 285 88
             Q 276 88 276 96
             L 276 186
             Q 276 194 268 194
             L 236 194"
          stroke="#c084fc" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <circle cx="628" cy="172" r="3.5" fill="#c084fc" stroke="#ffffff" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- BENEFICIOS CLAVE Y METADATOS -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g id="callouts">
    <!-- Callout 1: Salida inteligente -->
    <rect x="330" y="320" width="220" height="65" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="342" y="338" fill="#34d399" font-size="10" font-weight="700">✓ Salida por el lado más cercano</text>
    <text x="342" y="354" fill="#cbd5e1" font-size="9">Como el Core Switch está a la izquierda,</text>
    <text x="342" y="368" fill="#cbd5e1" font-size="9">el cable sale a la izquierda (no cruza el rack).</text>

    <!-- Callout 2: Cero cruces con racks pequeños -->
    <rect x="590" y="320" width="225" height="65" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="602" y="338" fill="#38bdf8" font-size="10" font-weight="700">✓ Inmune a diferencias de altura</text>
    <text x="602" y="354" fill="#cbd5e1" font-size="9">Al viajar aéreo por el canastillo superior,</text>
    <text x="602" y="368" fill="#cbd5e1" font-size="9">no importa si los gabinetes son 12U o 42U.</text>

    <!-- Callout 3: Equipos de piso seguros -->
    <rect x="60" y="522" width="744" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="74" y="540" fill="#f8fafc" font-size="10" font-weight="600">Equipos de piso:</text>
    <text x="165" y="540" fill="#94a3b8" font-size="9.5">Quedan totalmente libres y despejados debajo de los racks, sin cables pasando por encima.</text>
  </g>
</svg>
