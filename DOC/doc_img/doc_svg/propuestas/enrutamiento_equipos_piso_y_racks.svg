<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .glow-blue { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.7)); }
      .glow-green { filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.7)); }
      .glow-amber { filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.7)); }
      .glow-tray { filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.35)); }
    </style>

    <pattern id="grid-dots-floor" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.7" fill="#22324e" opacity="0.6"/>
    </pattern>

    <pattern id="tray-pattern" width="16" height="26" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="16" y2="0" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
      <line x1="0" y1="26" x2="16" y2="26" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
      <line x1="8" y1="0" x2="8" y2="26" stroke="#f59e0b" stroke-width="1" opacity="0.35"/>
      <line x1="0" y1="0" x2="16" y2="26" stroke="#d97706" stroke-width="0.7" opacity="0.2"/>
    </pattern>

    <linearGradient id="bg-grad-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="header-grad-floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fondo Principal -->
  <rect width="1020" height="700" fill="url(#bg-grad-floor)" rx="10"/>
  <rect width="1020" height="700" fill="url(#grid-dots-floor)" rx="10"/>
  <rect width="1020" height="700" fill="none" stroke="#1e293b" stroke-width="1.5" rx="10"/>

  <!-- Encabezado Principal -->
  <rect x="24" y="16" width="972" height="52" rx="8" fill="url(#header-grad-floor)" stroke="#334155" stroke-width="1"/>
  <rect x="34" y="24" width="8" height="36" rx="4" fill="#10b981"/>
  <text x="52" y="38" fill="#f8fafc" font-size="15" font-weight="700">ARQUITECTURA INTEGRAL: ENRUTAMIENTO DE EQUIPOS DE PISO Y GABINETES</text>
  <text x="52" y="55" fill="#94a3b8" font-size="11">Solución de Doble Canaleta: Canastillo Aéreo (Inter-Rack) + Canaleta Perimetral de Piso (Periféricos)</text>
  
  <rect x="850" y="26" width="134" height="30" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="917" y="45" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">✓ INTEGRACIÓN TOTAL</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- NIVEL 1: BANDEJA SUPERIOR PORTA-CABLES (INTER-RACK) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g class="glow-tray">
    <rect x="50" y="82" width="600" height="26" rx="4" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="50" y="82" width="600" height="26" fill="url(#tray-pattern)"/>
  </g>
  <text x="350" y="99" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle" class="mono">▲ CANASTILLO AÉREO SUPERIOR (TRONCAL ENTRE RACKS)</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- NIVEL 2: GABINETES RACK 101 Y RACK 102 -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- RACK 101 (42U - Principal) -->
  <g id="full-rack-101">
    <rect x="50" y="125" width="210" height="320" rx="6" fill="#141c2e" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Header -->
    <rect x="50" y="125" width="210" height="24" rx="6" fill="#0f2744"/>
    <circle cx="64" cy="137" r="3.5" fill="#38bdf8"/>
    <text x="74" y="141" fill="#f8fafc" font-size="10.5" font-weight="700">Rack 101 (42U)</text>

    <!-- U41 Core Switch (Destino de fibra y cobre) -->
    <rect x="62" y="156" width="186" height="22" rx="3" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="236" cy="167" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="70" y="171" fill="#e0f2fe" font-size="9" font-weight="700">Core Switch 24P</text>

    <!-- U40 Switch Acceso 101 (Conexión de Piso) -->
    <rect x="62" y="182" width="186" height="22" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="236" cy="193" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="224" cy="193" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="70" y="197" fill="#d1fae5" font-size="9" font-weight="700">Switch Rack 101 (Puertos PoE)</text>

    <!-- Servidores -->
    <rect x="62" y="210" width="186" height="24" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="70" y="226" fill="#94a3b8" font-size="8.5">Servidor Nodo 1</text>
    <rect x="62" y="238" width="186" height="24" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="70" y="254" fill="#94a3b8" font-size="8.5">Servidor Nodo 2</text>

    <line x1="62" y1="272" x2="248" y2="272" stroke="#1e293b" stroke-dasharray="2,2"/>
    <text x="155" y="340" fill="#334155" font-size="9.5" text-anchor="middle" class="mono">[ 32U Disponibles ]</text>

    <!-- UPS Base -->
    <rect x="62" y="415" width="186" height="22" rx="2" fill="#271a0c" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="70" y="429" fill="#fde68a" font-size="8" font-weight="600">UPS 3000VA</text>
  </g>

  <!-- CANALETA VERTICAL INTER-RACK (72px) -->
  <rect x="260" y="125" width="72" height="320" fill="#0e1726" opacity="0.5" stroke="#1e293b" stroke-dasharray="2,2"/>
  <text x="296" y="280" fill="#38bdf8" opacity="0.6" font-size="8.5" text-anchor="middle" class="mono">CANALETA</text>
  <text x="296" y="294" fill="#38bdf8" opacity="0.6" font-size="8.5" text-anchor="middle" class="mono">72px</text>

  <!-- RACK 102 (12U) -->
  <g id="full-rack-102">
    <rect x="332" y="125" width="210" height="160" rx="6" fill="#122026" stroke="#059669" stroke-width="1.5"/>
    <rect x="332" y="125" width="210" height="24" rx="6" fill="#064e3b"/>
    <circle cx="346" cy="137" r="3.5" fill="#10b981"/>
    <text x="356" y="141" fill="#f8fafc" font-size="10.5" font-weight="700">Rack 102 (12U)</text>

    <!-- Switch Rack 102 -->
    <rect x="344" y="156" width="186" height="22" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="356" cy="167" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="368" y="171" fill="#d1fae5" font-size="9" font-weight="700">Switch Rack 102 (Te1/1/1)</text>

    <rect x="344" y="184" width="186" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="352" y="196" fill="#94a3b8" font-size="8">Patch Panel Cat6A</text>
    <rect x="344" y="206" width="186" height="24" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="352" y="222" fill="#94a3b8" font-size="8">Servidor Aplicaciones</text>
    <rect x="344" y="255" width="186" height="22" rx="2" fill="#271a0c" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="352" y="269" fill="#fde68a" font-size="8">UPS 1500VA</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- CABLE INTER-RACK (AZUL) — VIAJA POR ARRIBA (CANASTILLO) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g class="glow-blue">
    <!-- Switch 102 (x=356, y=167) -> Sube al canastillo (y=95) -> Viaja a x=250 -> Baja al Core Switch (x=236, y=167) -->
    <path d="M 356 167
             L 305 167
             Q 296 167 296 158
             L 296 103
             Q 296 95 288 95
             L 260 95
             Q 252 95 252 103
             L 252 159
             Q 252 167 244 167
             L 236 167"
          stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <circle cx="356" cy="167" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="236" cy="167" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- NIVEL 3: SECCIÓN DE EQUIPOS DE PISO (.floor-section) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g id="floor-devices-full-section">
    <!-- Contenedor Principal de Piso -->
    <rect x="50" y="475" width="920" height="145" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Encabezado de la Sección de Piso -->
    <rect x="50" y="475" width="920" height="30" rx="8" fill="#131c2e"/>
    <circle cx="68" cy="490" r="4" fill="#10b981"/>
    <text x="80" y="494" fill="#f8fafc" font-size="11" font-weight="700">Equipos de Piso / Periféricos de la Sala</text>
    <rect x="850" y="480" width="105" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="902" y="493" fill="#38bdf8" font-size="9" text-anchor="middle">4 Dispositivos</text>

    <!-- CANALETA TÉCNICA DE PISO (SUBTERRÁNEA / PERIMETRAL) -->
    <rect x="65" y="600" width="890" height="12" rx="3" fill="#1a2536" stroke="#0ea5e9" stroke-width="0.8" opacity="0.8"/>
    <text x="510" y="609" fill="#38bdf8" font-size="8" font-weight="600" text-anchor="middle" class="mono">▼ CANALETA TÉCNICA PERIMETRAL DE PISO (UNDERFLOOR CONDUIT)</text>

    <!-- TARJETA 1: CÁMARA 01 (PoE) -->
    <g id="card-cam1">
      <rect x="70" y="518" width="195" height="68" rx="6" fill="#162032" stroke="#10b981" stroke-width="1.2"/>
      <rect x="80" y="528" width="30" height="30" rx="4" fill="#064e3b"/>
      <text x="95" y="547" font-size="14" text-anchor="middle">📹</text>
      <text x="120" y="538" fill="#f8fafc" font-size="10" font-weight="700">Cámara 01 Datacenter</text>
      <text x="120" y="552" fill="#34d399" font-size="8.5" class="mono">10.10.60.10 · PoE</text>
      <text x="120" y="565" fill="#64748b" font-size="7.5">Conectado a Switch 101</text>
      <!-- Puerto de salida del cable -->
      <circle cx="250" cy="552" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- TARJETA 2: IMPRESORA ADMINISTRACIÓN -->
    <g id="card-printer1">
      <rect x="285" y="518" width="195" height="68" rx="6" fill="#162032" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="295" y="528" width="30" height="30" rx="4" fill="#451a03"/>
      <text x="310" y="547" font-size="14" text-anchor="middle">🖨️</text>
      <text x="335" y="538" fill="#f8fafc" font-size="10" font-weight="700">Impresora Admin</text>
      <text x="335" y="552" fill="#fbbf24" font-size="8.5" class="mono">10.10.70.10 · VLAN 70</text>
      <text x="335" y="565" fill="#64748b" font-size="7.5">Conectado a Switch 101</text>
      <circle cx="465" cy="552" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- TARJETA 3: ACCESS POINT WIFI -->
    <g id="card-ap1">
      <rect x="500" y="518" width="195" height="68" rx="6" fill="#162032" stroke="#0ea5e9" stroke-width="1.2"/>
      <rect x="510" y="528" width="30" height="30" rx="4" fill="#082f49"/>
      <text x="525" y="547" font-size="14" text-anchor="middle">📡</text>
      <text x="550" y="538" fill="#f8fafc" font-size="10" font-weight="700">AP A2 Corporativo</text>
      <text x="550" y="552" fill="#38bdf8" font-size="8.5" class="mono">10.10.10.20 · WiFi 6</text>
      <text x="550" y="565" fill="#64748b" font-size="7.5">Provee VLAN 50 y 90</text>
      <circle cx="680" cy="552" r="3.5" fill="#0ea5e9" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- TARJETA 4: TELÉFONO IP -->
    <g id="card-phone1">
      <rect x="715" y="518" width="195" height="68" rx="6" fill="#162032" stroke="#8b5cf6" stroke-width="1.2"/>
      <rect x="725" y="528" width="30" height="30" rx="4" fill="#2e1065"/>
      <text x="740" y="547" font-size="14" text-anchor="middle">📞</text>
      <text x="765" y="538" fill="#f8fafc" font-size="10" font-weight="700">Teléfono IP 01</text>
      <text x="765" y="552" fill="#c084fc" font-size="8.5" class="mono">10.10.80.10 · VoIP</text>
      <text x="765" y="565" fill="#64748b" font-size="7.5">VLAN 80 Telefonía</text>
      <circle cx="895" cy="552" r="3.5" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- TRAZADO DE CABLES DE PISO: ¡CERO SUPERPOSICIÓN! -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- CABLE VERDE: CÁMARA 01 -> SWITCH RACK 101 -->
  <!-- Origen: x=250, y=552. Baja a la canaleta perimetral de piso (y=606), viaja a x=275, sube por la canaleta de 72px a y=193 -> Switch 101 (x=236) -->
  <g class="glow-green">
    <path d="M 250 552
             L 258 552
             Q 266 552 266 560
             L 266 598
             Q 266 606 274 606
             L 282 606
             Q 290 606 290 598
             L 290 201
             Q 290 193 282 193
             L 236 193"
          stroke="#10b981" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <circle cx="250" cy="552" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="236" cy="193" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>

  <!-- CABLE NARANJA: IMPRESORA -> SWITCH RACK 101 -->
  <!-- Origen: x=465, y=552. Baja a y=606, viaja por la canaleta a x=304, sube por la canaleta vertical a y=193 -> Switch 101 (x=224) -->
  <g class="glow-amber">
    <path d="M 465 552
             L 475 552
             Q 483 552 483 560
             L 483 598
             Q 483 606 475 606
             L 312 606
             Q 304 606 304 598
             L 304 201
             Q 304 193 296 193
             L 224 193"
          stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <circle cx="465" cy="552" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="224" cy="193" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- PANEL EXPLICATIVO: CÓMO SE RESUELVE LA VISIBILIDAD DE PISO -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g id="floor-callouts">
    <rect x="560" y="125" width="410" height="320" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="560" y="125" width="410" height="30" rx="8" fill="#064e3b"/>
    <text x="765" y="145" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">¿CÓMO QUEDAN PROTEGIDOS LOS EQUIPOS DE PISO?</text>

    <text x="575" y="178" fill="#34d399" font-size="11" font-weight="700">1. Doble Canaleta Técnica Segregada:</text>
    <text x="575" y="196" fill="#cbd5e1" font-size="9.5">• Los cables <tspan fill="#38bdf8" font-weight="700">entre Racks</tspan> viajan por el <tspan fill="#fbbf24" font-weight="700">Canastillo Superior Aéreo</tspan>.</text>
    <text x="575" y="212" fill="#cbd5e1" font-size="9.5">  Nunca bajan a la zona de piso ni cruzan gabinetes.</text>

    <text x="575" y="240" fill="#34d399" font-size="11" font-weight="700">2. Canaleta Perimetral de Piso:</text>
    <text x="575" y="258" fill="#cbd5e1" font-size="9.5">• Los periféricos (Cámaras, Impresoras, APs) bajan directo a su</text>
    <text x="575" y="274" fill="#cbd5e1" font-size="9.5">  propia <tspan fill="#38bdf8" font-weight="700">canaleta técnica subterránea/perimetral</tspan> (a y=606px).</text>
    <text x="575" y="290" fill="#cbd5e1" font-size="9.5">• Ningún cable cruza sobre las tarjetas de los demás equipos.</text>

    <text x="575" y="320" fill="#34d399" font-size="11" font-weight="700">3. Ascenso por la Canaleta Inter-Rack de 72px:</text>
    <text x="575" y="338" fill="#cbd5e1" font-size="9.5">• El espacio de 72px que triplicamos entre gabinetes actúa como</text>
    <text x="575" y="354" fill="#cbd5e1" font-size="9.5">  <tspan fill="#10b981" font-weight="700">columna montante vertical</tspan> exclusiva para que los cables de piso</text>
    <text x="575" y="370" fill="#cbd5e1" font-size="9.5">  suban hasta los switches sin tocar los servidores en rack.</text>

    <rect x="575" y="390" width="380" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="585" y="406" fill="#f8fafc" font-size="9" font-weight="600">Resultado visual:</text>
    <text x="585" y="420" fill="#94a3b8" font-size="9">El 100% de los equipos de piso permanecen limpios, legibles y despejados.</text>
  </g>

  <!-- Resumen al pie -->
  <rect x="50" y="635" width="920" height="50" rx="6" fill="#131c2e" stroke="#1e293b" stroke-width="1"/>
  <circle cx="70" cy="660" r="8" fill="#10b981"/>
  <text x="70" y="664" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">✓</text>
  <text x="90" y="655" fill="#f8fafc" font-size="10.5" font-weight="700">Conclusión de Arquitectura Física:</text>
  <text x="90" y="672" fill="#94a3b8" font-size="9.5">El sistema aéreo para racks + canaleta perimetral inferior para piso resuelve simultáneamente la visibilidad de piso y la ausencia de cruces en racks.</text>
</svg>
