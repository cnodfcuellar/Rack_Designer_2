<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .glow-cyan { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.7)); }
      .glow-emerald { filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.7)); }
    </style>
    <pattern id="grid-dots-m25a" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1e293b" opacity="0.6"/>
    </pattern>
    <linearGradient id="bg-grad-m25a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="header-grad-m25a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fondo General -->
  <rect width="1100" height="680" fill="url(#bg-grad-m25a)" rx="16"/>
  <rect width="1100" height="680" fill="url(#grid-dots-m25a)" rx="16"/>
  <rect width="1100" height="680" fill="none" stroke="#1e293b" stroke-width="1.5" rx="16"/>

  <!-- Cabecera de la Propuesta M-25A -->
  <rect x="30" y="24" width="1040" height="60" rx="10" fill="url(#header-grad-m25a)" stroke="#334155" stroke-width="1"/>
  <rect x="46" y="34" width="6" height="40" rx="3" fill="#38bdf8"/>
