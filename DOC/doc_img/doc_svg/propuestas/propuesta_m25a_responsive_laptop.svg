    <rect x="56" y="86" width="280" height="230" rx="4" fill="#0b1120" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text x="196" y="108" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">Lienzo Central Solo ~600px Utiles</text>
    
    <rect x="70" y="125" width="110" height="150" rx="4" fill="#1a2235" stroke="#475569" stroke-width="1"/>
