    <rect x="28" y="10" width="10" height="10" rx="5" fill="#f59e0b"/>
    <rect x="44" y="10" width="10" height="10" rx="5" fill="#10b981"/>
    <text x="70" y="22" fill="#86efac" font-size="12" font-weight="700">M-25A: Laptop Adaptativa (Espaciosa, Fluida y Sin Desborde)</text>

