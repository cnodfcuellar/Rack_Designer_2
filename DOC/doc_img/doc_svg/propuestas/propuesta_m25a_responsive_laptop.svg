  <text x="64" y="71" fill="#94a3b8" font-size="12">Optimizacion ergonomica: auto-colapso lateral a drawer, barra compacta sin desborde y altura elastica de racks</text>
  
  <rect x="910" y="38" width="144" height="32" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="982" y="58" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">M-25A ROADMAP</text>

  <!-- ==================== COLUMNA IZQUIERDA: ESTADO ACTUAL (PROBLEMA) ==================== -->
  <g transform="translate(30, 105)">
