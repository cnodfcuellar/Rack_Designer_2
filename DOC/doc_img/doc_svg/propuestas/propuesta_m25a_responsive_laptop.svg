    <rect x="15" y="44" width="460" height="34" rx="4" fill="#151e32" stroke="#10b981" stroke-width="1"/>
    <text x="24" y="65" fill="#38bdf8" font-size="11" font-weight="700">LOGO</text>
    <rect x="65" y="49" width="75" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
