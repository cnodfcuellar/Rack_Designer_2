    <text x="125" y="165" fill="#64748b" font-size="9" text-anchor="middle">Comprimido</text>

    <rect x="190" y="125" width="110" height="150" rx="4" fill="#1a2235" stroke="#ef4444" stroke-width="1.5"/>
    <text x="245" y="145" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">Rack 2 (280px)</text>
    <text x="245" y="165" fill="#ef4444" font-size="9" text-anchor="middle">CORTADO</text>

