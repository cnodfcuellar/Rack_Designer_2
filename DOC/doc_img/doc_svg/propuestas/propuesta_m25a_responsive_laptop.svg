  <!-- ==================== TARJETAS INFERIORES ==================== -->
  <g transform="translate(30, 545)">
    <rect x="0" y="0" width="245" height="110" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f8fafc" font-size="13" font-weight="700">1. Drawer Colapsable</text>
    <text x="20" y="48" fill="#38bdf8" font-size="10.5">En anchos &lt;= 1280px</text>
    <text x="20" y="72" fill="#94a3b8" font-size="11">El panel derecho se contrae a 26px</text>
    <text x="20" y="88" fill="#94a3b8" font-size="11">Recupera 274px limpios para gabinetes</text>

    <rect x="265" y="0" width="245" height="110" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="285" y="30" fill="#f8fafc" font-size="13" font-weight="700">2. Toolbar Adaptativo</text>
    <text x="285" y="48" fill="#10b981" font-size="10.5">Iconos y elipsis dinamica</text>
    <text x="285" y="72" fill="#94a3b8" font-size="11">Buscador compacto expandible</text>
    <text x="285" y="88" fill="#94a3b8" font-size="11">Botones compactos sin desbordar</text>

    <rect x="530" y="0" width="245" height="110" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="550" y="30" fill="#f8fafc" font-size="13" font-weight="700">3. Altura de Racks</text>
    <text x="550" y="48" fill="#f59e0b" font-size="10.5">Optimizacion para 768px</text>
    <text x="550" y="72" fill="#94a3b8" font-size="11">Bottom panel calibra a 160px</text>
    <text x="550" y="88" fill="#94a3b8" font-size="11">&gt;500px libres para racks 42U</text>

    <rect x="795" y="0" width="245" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="815" y="30" fill="#86efac" font-size="13" font-weight="700">4. Cierre Fase 3 (100%)</text>
    <text x="815" y="48" fill="#10b981" font-size="10.5">9 de 9 tareas listas</text>
    <text x="815" y="72" fill="#94a3b8" font-size="11">Culmina Fase 3 de navegacion</text>
    <text x="815" y="88" fill="#94a3b8" font-size="11">Progreso global sube a 90.5%</text>
  </g>
