      <text x="82" y="15" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">RACK-101 (42U)</text>
      <rect x="12" y="28" width="141" height="20" rx="2" fill="#0284c7"/>
      <text x="82" y="42" fill="#fff" font-size="8.5" text-anchor="middle">Switch Core 48P</text>
      <rect x="12" y="52" width="141" height="34" rx="2" fill="#059669"/>
      <text x="82" y="73" fill="#fff" font-size="8.5" text-anchor="middle">Servidor 2U</text>
      <rect x="12" y="90" width="141" height="20" rx="2" fill="#d97706"/>
      <text x="82" y="104" fill="#fff" font-size="8.5" text-anchor="middle">Patch Panel ODF</text>
    </g>

    <g transform="translate(245, 120)">
      <rect width="165" height="195" rx="6" fill="#151e32" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="0" width="165" height="22" rx="6" fill="#1e293b"/>
      <text x="82" y="15" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">RACK-102 (42U)</text>
      <rect x="12" y="28" width="141" height="20" rx="2" fill="#0284c7"/>
      <text x="82" y="42" fill="#fff" font-size="8.5" text-anchor="middle">Switch ToR Computo</text>
      <rect x="12" y="52" width="141" height="34" rx="2" fill="#059669"/>
      <text x="82" y="73" fill="#fff" font-size="8.5" text-anchor="middle">Servidor 2U</text>
      <rect x="12" y="90" width="141" height="20" rx="2" fill="#7c3aed"/>
      <text x="82" y="104" fill="#fff" font-size="8.5" text-anchor="middle">Storage SAN 4U</text>
    </g>

    <path d="M 177 148 C 210 130, 220 130, 257 148" stroke="#10b981" stroke-width="2.5" fill="none"/>

    <!-- Drawer lateral colapsado 26px -->
    <rect x="448" y="86" width="27" height="240" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="461" y="195" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle" transform="rotate(-90 461 195)">&lt; INSPECTOR</text>

    <!-- Bottom Panel Inteligente: 160px -->
    <rect x="15" y="334" width="460" height="75" rx="4" fill="#151e32" stroke="#10b981" stroke-width="1"/>
    <rect x="15" y="334" width="460" height="24" rx="4" fill="#1e293b"/>
    <text x="30" y="350" fill="#38bdf8" font-size="9" font-weight="700">Dispositivos (12)</text>
    <text x="110" y="350" fill="#94a3b8" font-size="9">Racks (2)</text>
    <text x="160" y="350" fill="#94a3b8" font-size="9">Conexiones (18)</text>
    <text x="245" y="380" fill="#86efac" font-size="10" font-weight="600" text-anchor="middle">Altura elastica 160px: maximiza espacio vertical en laptops 768px</text>
