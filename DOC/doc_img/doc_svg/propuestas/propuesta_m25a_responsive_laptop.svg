    <rect x="44" y="10" width="10" height="10" rx="5" fill="#10b981"/>
    <text x="70" y="22" fill="#fca5a5" font-size="12" font-weight="700">ACTUAL: Laptop 1366x768 (Lienzo Comprimido y Saturado)</text>

    <!-- Header saturado -->
    <rect x="15" y="44" width="460" height="34" rx="4" fill="#151e32" stroke="#334155" stroke-width="1"/>
