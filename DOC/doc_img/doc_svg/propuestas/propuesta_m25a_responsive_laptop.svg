    <text x="245" y="355" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">Bottom Panel (Fijo 220px) - Reduce altura vertical a &lt; 380px</text>
    <text x="245" y="375" fill="#94a3b8" font-size="10" text-anchor="middle">Racks de 42U requieren scroll constante o alejarse al 50% de zoom</text>
