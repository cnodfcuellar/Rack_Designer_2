  <rect x="480" y="158" width="30" height="24" rx="4" fill="#1e3a5f"/>
  <text x="495" y="174" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#60a5fa">DM</text>

  <rect x="84" y="206" width="440" height="50" rx="8" fill="#0d1a2a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="110" y="229" font-family="'Segoe UI', monospace" font-size="11" fill="#93c5fd" font-weight="600">CableModal.js</text>
  <text x="270" y="229" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">Patch cables · Dynamic ports</text>
  <rect x="480" y="216" width="30" height="24" rx="4" fill="#1e3a5f"/>
  <text x="495" y="232" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#60a5fa">CM</text>

  <rect x="84" y="264" width="440" height="50" rx="8" fill="#0d1a2a" stroke="#1e3a5f" stroke-width="1"/>
