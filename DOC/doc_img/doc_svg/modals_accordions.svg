  <text x="60" y="49" font-family="'Segoe UI', sans-serif" font-size="9" fill="#60a5fa" letter-spacing="3" font-weight="600">RACK DESIGNER 2  ·  UI SYSTEM  ·  MODALS</text>
  <text x="60" y="68" font-family="'Segoe UI', sans-serif" font-size="20" fill="#f0f6ff" font-weight="700">MODALS  ·  ACCORDIONS  ·  CONTEXT MENUS</text>

