  <text x="305" y="132" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#93c5fd" font-weight="700" letter-spacing="1">MODAL SUBSYSTEM  ·  js/ui/modals/</text>

  <!-- Modal cards list -->
