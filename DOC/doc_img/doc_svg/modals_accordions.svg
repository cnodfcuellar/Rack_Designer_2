  <text x="660" y="608" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e2e8f0">⋮ Edit device</text>
  <text x="660" y="622" font-family="'Segoe UI', sans-serif" font-size="9" fill="#e2e8f0">⋮ Clone to...</text>
  <text x="660" y="636" font-family="'Segoe UI', sans-serif" font-size="9" fill="#f87171">⋮ Delete (confirm)</text>
  <text x="830" y="612" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">On racks: (⋮) dropdown</text>
  <text x="830" y="628" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">Groups: Edit / Delete</text>
  <text x="830" y="644" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">+ Quick place ⚡ / 🧹 Clear</text>

