  <rect x="624" y="262" width="412" height="36" rx="6" fill="#0a1508" stroke="#10b981" stroke-width="1.5"/>
  <rect x="624" y="262" width="26" height="26" rx="4" fill="#10b981" fill-opacity="0.2" transform="translate(2, 5)"/>
  <text x="638" y="280" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12">▶</text>
  <text x="660" y="285" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4ade80" font-weight="600">Network Interfaces</text>
  <text x="1016" y="285" text-anchor="end" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">[ON/OFF]</text>
  <rect x="624" y="298" width="412" height="60" rx="0" fill="#050e08" stroke="#1a6b45" stroke-width="0.5"/>
  <text x="644" y="320" font-family="'Segoe UI', monospace" font-size="9" fill="#94a3b8">IP: [__________]   Ethernet ports: [24]</text>
  <text x="644" y="338" font-family="'Segoe UI', monospace" font-size="9" fill="#94a3b8">VLAN: [___]   Fiber ports: [4]   MAC: [___]</text>
  <text x="644" y="354" font-family="'Segoe UI', monospace" font-size="9" fill="#334155">* Fiber ports generate SFP-01..04 options</text>

