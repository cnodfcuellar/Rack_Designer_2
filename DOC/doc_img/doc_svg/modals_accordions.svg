  <text x="1016" y="190" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="9" fill="#4ade80">always visible</text>
  <rect x="624" y="204" width="412" height="50" rx="0" rx="0" fill="#050e18" stroke="#1e3a5f" stroke-width="0.5"/>
