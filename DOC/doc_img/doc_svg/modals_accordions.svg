  <text x="495" y="464" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#f43f5e">🔐</text>

  <!-- Modal CSS rules -->
  <rect x="84" y="510" width="440" height="150" rx="8" fill="#060e1a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="304" y="532" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#60a5fa" font-weight="700" letter-spacing="1">CSS RULES  ·  modals.css</text>
  <text x="104" y="554" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">.modal {  max-height: 90vh; overflow-y: auto; }</text>
  <text x="104" y="572" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">input, select, button {  height: 24px !important; }</text>
  <text x="104" y="590" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">.modal::backdrop {  blur(8px) dark overlay; }</text>
  <text x="104" y="610" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">Scrollbar styled to match IDE aesthetic</text>
  <text x="104" y="628" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">Native &lt;dialog&gt; element · focus trap</text>
  <text x="104" y="646" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">Escape key closes · Confirm before close</text>

  <!-- Accordion section -->
