  <text x="830" y="156" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">DeviceModal → modules shown when enabled</text>

  <!-- Accordion blocks -->
  <!-- Identity (always open) -->
  <rect x="624" y="168" width="412" height="36" rx="6" fill="#0d1a2a" stroke="#60a5fa" stroke-width="1.5"/>
