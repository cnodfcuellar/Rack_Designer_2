<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 680" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <rect width="340" height="680" fill="#0b0f19" rx="8"/>
  <text x="170" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Right Panel Layout — #right-panel (260px width)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- RIGHT PANEL -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="10" y="30" width="260" height="640" fill="#151c2e" stroke="#25304b" stroke-width="1"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- SECTION 1: OUTLINER -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="10" y="30" width="260" height="24" fill="#1a2235"/>
  <!-- List icon 13x13 -->
  <rect x="22" y="35" width="13" height="13" rx="2" fill="#38bdf8" opacity="0.3"/>
  <text x="28" y="45" text-anchor="middle" fill="#38bdf8" font-size="8">≡</text>
  <text x="40" y="46" fill="#8b9ab8" font-size="13" font-weight="700">Outliner</text>

  <line x1="10" y1="54" x2="270" y2="54" stroke="#25304b" stroke-width="1"/>

  <!-- Tree structure -->
  <rect x="10" y="54" width="260" height="260" fill="#151c2e"/>

  <!-- Room: Data Center -->
  <rect x="22" y="64" width="246" height="20" rx="4" fill="transparent"/>
  <text x="32" y="78" fill="#f0f4ff" font-size="13" font-weight="600">▸ Data Center</text>
  <!-- Room icon -->
  <rect x="22" y="66" width="13" height="13" rx="2" fill="#0ea5e9" opacity="0.3"/>
  <text x="28" y="76" text-anchor="middle" fill="#0ea5e9" font-size="8">▸</text>

  <!-- Rack: Rack-A1 -->
  <rect x="34" y="88" width="234" height="18" rx="4" fill="transparent"/>
  <text x="50" y="100" fill="#f0f4ff" font-size="12" font-weight="500">▸ Rack-A1</text>
  <!-- Rack icon -->
  <rect x="34" y="90" width="11" height="11" rx="2" fill="#3b82f6" opacity="0.3"/>
  <text x="39" y="99" text-anchor="middle" fill="#3b82f6" font-size="7">▸</text>

  <!-- Devices under Rack-A1 -->
  <rect x="48" y="110" width="222" height="16" rx="3" fill="transparent"/>
  <text x="60" y="121" fill="#94a3b8" font-size="12">  ▸ SRV-001</text>

  <rect x="48" y="128" width="222" height="16" rx="3" fill="transparent"/>
  <text x="60" y="139" fill="#94a3b8" font-size="12">  ▸ SW-001</text>

  <rect x="48" y="146" width="222" height="16" rx="3" fill="transparent"/>
  <text x="60" y="157" fill="#94a3b8" font-size="12">  ▸ RTR-001</text>

  <!-- Rack: Rack-A2 -->
  <rect x="34" y="168" width="234" height="18" rx="4" fill="transparent"/>
  <text x="50" y="180" fill="#f0f4ff" font-size="12" font-weight="500">▸ Rack-A2</text>
  <rect x="34" y="170" width="11" height="11" rx="2" fill="#3b82f6" opacity="0.3"/>
  <text x="39" y="179" text-anchor="middle" fill="#3b82f6" font-size="7">▸</text>

  <!-- Devices under Rack-A2 -->
  <rect x="48" y="190" width="222" height="16" rx="3" fill="transparent"/>
  <text x="60" y="201" fill="#94a3b8" font-size="12">  ▸ UPS-001</text>

  <rect x="48" y="208" width="222" height="16" rx="3" fill="transparent"/>
  <text x="60" y="219" fill="#94a3b8" font-size="12">  ▸ PP-001</text>

  <!-- Room 2 -->
  <rect x="22" y="230" width="246" height="20" rx="4" fill="transparent"/>
  <text x="32" y="244" fill="#8b9ab8" font-size="13" font-weight="500">▸ Sala B</text>
  <rect x="22" y="232" width="13" height="13" rx="2" fill="#0ea5e9" opacity="0.2"/>
  <text x="28" y="242" text-anchor="middle" fill="#0ea5e9" font-size="8" opacity="0.5">▸</text>

  <!-- Room 3 -->
  <rect x="22" y="254" width="246" height="20" rx="4" fill="transparent"/>
  <text x="32" y="268" fill="#8b9ab8" font-size="13" font-weight="500">▸ Sala C</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- SECTION 2: PROPIEDADES (Inspector) -->
  <!-- ═══════════════════════════════════════ -->
  <line x1="10" y1="314" x2="270" y2="314" stroke="#25304b" stroke-width="1"/>
  <rect x="10" y="314" width="260" height="24" fill="#1a2235"/>
  <!-- Search icon -->
  <rect x="22" y="319" width="13" height="13" rx="2" fill="#38bdf8" opacity="0.3"/>
  <text x="28" y="329" text-anchor="middle" fill="#38bdf8" font-size="8">🔍</text>
  <text x="40" y="330" fill="#8b9ab8" font-size="13" font-weight="700">Propiedades</text>

  <line x1="10" y1="338" x2="270" y2="338" stroke="#25304b" stroke-width="1"/>

  <!-- Inspector content: default empty state -->
  <rect x="10" y="338" width="260" height="80" fill="#151c2e"/>
  <text x="140" y="374" text-anchor="middle" fill="#64748b" font-size="12" font-style="italic">Ningun elemento</text>
  <text x="140" y="392" text-anchor="middle" fill="#64748b" font-size="12" font-style="italic">seleccionado</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- SECTION 3: ESTADISTICAS -->
  <!-- ═══════════════════════════════════════ -->
  <line x1="10" y1="418" x2="270" y2="418" stroke="#25304b" stroke-width="1"/>
  <rect x="10" y="418" width="260" height="24" fill="#1a2235"/>
  <!-- Chart icon -->
  <rect x="22" y="423" width="13" height="13" rx="2" fill="#38bdf8" opacity="0.3"/>
  <text x="28" y="433" text-anchor="middle" fill="#38bdf8" font-size="8">📊</text>
  <text x="40" y="434" fill="#8b9ab8" font-size="13" font-weight="700">Estadisticas</text>
  <!-- Toggle icon -->
  <text x="260" y="434" text-anchor="end" fill="#64748b" font-size="10">▾</text>

  <line x1="10" y1="442" x2="270" y2="442" stroke="#25304b" stroke-width="1"/>

  <!-- Subheading -->
  <rect x="10" y="442" width="260" height="20" fill="#151c2e"/>
  <text x="22" y="456" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.5">METRICAS DEL PROYECTO GLOBAL</text>

  <!-- Stats pills row 1 -->
  <rect x="10" y="462" width="260" height="80" fill="#151c2e"/>

  <!-- Stat pill 1: Rooms -->
  <rect x="18" y="468" width="44" height="68" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <rect x="24" y="474" width="32" height="32" rx="6" fill="#38bdf8" opacity="0.15"/>
  <text x="40" y="494" text-anchor="middle" fill="#38bdf8" font-size="12">🏢</text>
  <text x="40" y="520" text-anchor="middle" fill="#64748b" font-size="7">Salas</text>
  <text x="40" y="532" text-anchor="middle" fill="#f0f4ff" font-size="13" font-weight="700">4</text>

  <!-- Stat pill 2: Racks -->
  <rect x="68" y="468" width="44" height="68" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <rect x="74" y="474" width="32" height="32" rx="6" fill="#38bdf8" opacity="0.15"/>
  <text x="90" y="494" text-anchor="middle" fill="#38bdf8" font-size="12">🖥</text>
  <text x="90" y="520" text-anchor="middle" fill="#64748b" font-size="7">Racks</text>
  <text x="90" y="532" text-anchor="middle" fill="#f0f4ff" font-size="13" font-weight="700">8</text>

  <!-- Stat pill 3: Rack Devices -->
  <rect x="118" y="468" width="44" height="68" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <rect x="124" y="474" width="32" height="32" rx="6" fill="#f43f5e" opacity="0.15"/>
  <text x="140" y="494" text-anchor="middle" fill="#f43f5e" font-size="12">⚡</text>
  <text x="140" y="520" text-anchor="middle" fill="#64748b" font-size="7">Rack</text>
  <text x="140" y="532" text-anchor="middle" fill="#f0f4ff" font-size="13" font-weight="700">24</text>

  <!-- Stat pill 4: Floor Devices -->
  <rect x="168" y="468" width="44" height="68" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <rect x="174" y="474" width="32" height="32" rx="6" fill="#22c55e" opacity="0.15"/>
  <text x="190" y="494" text-anchor="middle" fill="#22c55e" font-size="12">💻</text>
  <text x="190" y="520" text-anchor="middle" fill="#64748b" font-size="7">Piso</text>
  <text x="190" y="532" text-anchor="middle" fill="#f0f4ff" font-size="13" font-weight="700">6</text>

  <!-- Stat pill 5: Connections -->
  <rect x="218" y="468" width="44" height="68" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <rect x="224" y="474" width="32" height="32" rx="6" fill="#f59e0b" opacity="0.15"/>
  <text x="240" y="494" text-anchor="middle" fill="#f59e0b" font-size="12">🔗</text>
  <text x="240" y="520" text-anchor="middle" fill="#64748b" font-size="7">Cables</text>
  <text x="240" y="532" text-anchor="middle" fill="#f0f4ff" font-size="13" font-weight="700">5</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ANNOTATIONS -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Width dimension -->
  <line x1="10" y1="650" x2="270" y2="650" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="140" y="664" text-anchor="middle" fill="#475569" font-size="9" class="mono">260px (var(--right-panel-w))</text>

  <!-- Section labels -->
  <line x1="276" y1="30" x2="290" y2="30" stroke="#475569" stroke-width="0.5"/>
  <text x="294" y="34" fill="#475569" font-size="8" class="mono">.right-panel-section (flex:1)</text>
  <line x1="276" y1="314" x2="290" y2="314" stroke="#475569" stroke-width="0.5"/>
  <text x="294" y="318" fill="#475569" font-size="8" class="mono">.right-panel-section#inspector</text>
  <line x1="276" y1="418" x2="290" y2="418" stroke="#475569" stroke-width="0.5"/>
  <text x="294" y="422" fill="#475569" font-size="8" class="mono">.right-panel-section#stats (collapsible)</text>

  <!-- Height annotations -->
  <line x1="276" y1="30" x2="276" y2="314" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="282" y="175" fill="#475569" font-size="7" class="mono" transform="rotate(90 282 175)">flex: 1</text>

  <line x1="276" y1="314" x2="276" y2="418" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="282" y="370" fill="#475569" font-size="7" class="mono" transform="rotate(90 282 370)">flex: 1</text>

  <!-- CSS variables legend -->
  <rect x="10" y="630" width="260" height="14" rx="3" fill="#1e293b" opacity="0.5"/>
  <text x="18" y="640" fill="#64748b" font-size="7" class="mono">bg-card: #151c2e | panel-header: bg-card2 #1a2235 | border: #25304b | stat-icon: 32x32</text>

</svg>