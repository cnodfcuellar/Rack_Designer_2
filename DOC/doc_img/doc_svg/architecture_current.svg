<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1520" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .title { font-weight: 800; fill: #38bdf8; }
      .subtitle { fill: #8b9ab8; font-weight: 400; }
      .meta { fill: #64748b; font-size: 11px; }
      .layer-title { font-weight: 700; font-size: 15px; fill: #0ea5e9; }
      .class-title { font-weight: 700; font-size: 12px; fill: #38bdf8; }
      .class-desc { font-size: 10px; fill: #94a3b8; }
      .connector { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .flow-arrow { stroke: #38bdf8; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <linearGradient id="g-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="g-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1520" fill="#0b0f19" rx="16"/>
  <rect width="1200" height="1520" fill="none" stroke="#25304b" stroke-width="2" rx="16"/>

  <!-- ========================================== -->
  <!-- TITLE BLOCK -->
  <!-- ========================================== -->
  <g transform="translate(40, 40)">
    <rect width="1120" height="130" rx="12" fill="#151c2e" stroke="#25304b" stroke-width="1.5"/>
    <text x="560" y="52" text-anchor="middle" font-size="28" class="title">⚡ RACK DESIGNER NEXT</text>
    <text x="560" y="80" text-anchor="middle" font-size="16" class="subtitle">Diagrama de Arquitectura del Sistema Actual (2026)</text>
    <text x="560" y="108" text-anchor="middle" font-size="12" class="meta mono">PWA · 100% Vanilla JS · CSS3 · Canvas 2D · Offline-First · Zero Build Steps · pnpm Only</text>
  </g>

  <!-- ========================================== -->
  <!-- PRESENTATION LAYER (UI) -->
  <!-- ========================================== -->
  <g transform="translate(40, 200)">
    <rect width="1120" height="340" rx="12" fill="url(#g-accent)" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="24" y="32" class="layer-title">CAPA 1: PRESENTACIÓN (INTERFAZ DE USUARIO)</text>
    
    <!-- index.html -->
    <rect x="24" y="55" width="240" height="260" rx="8" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <text x="144" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f4ff">index.html (PWA Layout)</text>
    <text x="144" y="98" text-anchor="middle" font-size="10" class="mono subtitle">Single Page Application</text>
    
    <!-- Modals inside index.html -->
    <g transform="translate(44, 120)">
      <rect width="200" height="175" rx="6" fill="#151c2e" stroke="#2e3d5a" stroke-width="1"/>
      <text x="10" y="24" font-size="11" font-weight="600" fill="#38bdf8">Vistas y Diálogos Comunes</text>
      <!-- Change PIN -->
      <rect x="10" y="38" width="180" height="26" rx="4" fill="#0f172a" stroke="#2e3d5a" stroke-width="1"/>
      <text x="20" y="55" font-size="10" fill="#f0f4ff">#modal-change-pin (24px controls)</text>
      <!-- Modals accordions -->
      <rect x="10" y="72" width="180" height="26" rx="4" fill="#0f172a" stroke="#2e3d5a" stroke-width="1"/>
      <text x="20" y="89" font-size="10" fill="#f0f4ff">Room/Rack/Device Modals</text>
      <!-- customConfirm -->
      <rect x="10" y="106" width="180" height="26" rx="4" fill="#0f172a" stroke="#2e3d5a" stroke-width="1"/>
      <text x="20" y="123" font-size="10" fill="#f0f4ff">customConfirm (danger support)</text>
      <!-- Sidebar -->
      <rect x="10" y="140" width="180" height="26" rx="4" fill="#0f172a" stroke="#2e3d5a" stroke-width="1"/>
      <text x="20" y="157" font-size="10" fill="#f0f4ff">Sidebar Catálogo / Plantillas</text>
    </g>

    <!-- Componentes de Visualización -->
    <!-- Topology View -->
    <rect x="290" y="55" width="250" height="120" rx="8" fill="#151c2e" stroke="#2e3d5a" stroke-width="1"/>
    <text x="306" y="80" class="class-title">Topology Engine (Canvas 2D)</text>
    <text x="306" y="98" class="class-desc mono">TopologyRenderer.js · Events.js · Layout.js</text>
    <rect x="306" y="112" width="218" height="48" rx="4" fill="#0f172a" stroke="#25304b" stroke-width="0.5"/>
    <text x="314" y="128" font-size="9" fill="#94a3b8">· Canvas HUD y Tooltips seguros</text>
    <text x="314" y="143" font-size="9" fill="#38bdf8">· String(dev.type).toUpperCase() crash-shield</text>

    <!-- Physical View / Faceplates -->
    <rect x="560" y="55" width="250" height="120" rx="8" fill="#151c2e" stroke="#2e3d5a" stroke-width="1"/>
    <text x="576" y="80" class="class-title">Vista Física &amp; Gabinetes</text>
    <text x="576" y="98" class="class-desc mono">rack.js · faceplates.js</text>
    <rect x="576" y="112" width="218" height="48" rx="4" fill="#0f172a" stroke="#25304b" stroke-width="0.5"/>
    <text x="584" y="128" font-size="9" fill="#94a3b8">· Grid HTML interactivo por U</text>
    <text x="584" y="143" font-size="9" fill="#10b981">· Front/Rear CSS Faceplate fallbacks</text>

    <!-- Right and Bottom Panels -->
    <rect x="830" y="55" width="266" height="120" rx="8" fill="#151c2e" stroke="#2e3d5a" stroke-width="1"/>
    <text x="846" y="80" class="class-title">Outliner, Inspector &amp; Tablas</text>
    <text x="846" y="98" class="class-desc mono">outliner.js · inspector.js · tables.js</text>
    <rect x="846" y="112" width="234" height="48" rx="4" fill="#0f172a" stroke="#25304b" stroke-width="0.5"/>
    <text x="854" y="128" font-size="9" fill="#38bdf8">· Inspector con variables estándar de acento</text>
    <text x="854" y="143" font-size="9" fill="#94a3b8">· Inventario y listados de PISO / Racks</text>

    <!-- Placement & Export Modals -->
    <rect x="290" y="190" width="390" height="125" rx="8" fill="#151c2e" stroke="#2e3d5a" stroke-width="1"/>
    <text x="306" y="215" class="class-title">PlacementModal.js &amp; ExportModal.js</text>
    <text x="306" y="233" class="class-desc">Asistentes de ubicación y exportación del espacio</text>
    <rect x="306" y="246" width="358" height="54" rx="4" fill="#0f172a" stroke="#25304b" stroke-width="0.5"/>
    <text x="314" y="262" font-size="9" fill="#94a3b8">· Ubicación asistida instantánea y selector de catálogo</text>
    <text x="314" y="276" font-size="9" fill="#f59e0b">· Exportador de planos PNG off-canvas</text>
    <text x="314" y="290" font-size="9" fill="#38bdf8">· Blindaje contra excepciones mediante String(type).toUpperCase()</text>

    <!-- FileManager -->
    <rect x="700" y="190" width="396" height="125" rx="8" fill="#151c2e" stroke="#2e3d5a" stroke-width="1"/>
    <text x="716" y="215" class="class-title">fileManager.js &amp; xlsx.full.min.js</text>
    <text x="716" y="233" class="class-desc">Importador/Exportador del Datacenter completo</text>
    <rect x="716" y="246" width="364" height="54" rx="4" fill="#0f172a" stroke="#25304b" stroke-width="0.5"/>
    <text x="724" y="262" font-size="9" fill="#94a3b8">· Serialización JSON directa para respaldos rápidos</text>
    <text x="724" y="276" font-size="9" fill="#ef4444">· Integración nativa de SheetJS para importar/exportar Excel</text>
    <text x="724" y="290" font-size="9" fill="#94a3b8">· File System Access API para guardados automáticos directos</text>
  </g>

  <!-- ========================================== -->
  <!-- ORCHESTRATOR / DISPATCHER LAYER -->
  <!-- ========================================== -->
  <g transform="translate(40, 570)">
    <rect width="1120" height="200" rx="12" fill="url(#g-cyan)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="24" y="32" class="layer-title" fill="#06b6d4">CAPA 2: CONTROLADOR Y DESPACHADOR CENTRAL</text>
    
    <!-- main.js -->
    <rect x="24" y="55" width="480" height="120" rx="8" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <text x="44" y="80" class="class-title" fill="#06b6d4">main.js (Orquestador Central)</text>
    <text x="44" y="98" class="class-desc">Punto de entrada de la aplicación. Gestiona el ciclo de vida y eventos del DOM.</text>
    <rect x="44" y="112" width="440" height="50" rx="4" fill="#151c2e" stroke="#25304b" stroke-width="0.5"/>
    <text x="52" y="128" font-size="9" fill="#94a3b8">· Enlaza eventos globales (click, keydown, drag-drop)</text>
    <text x="52" y="143" font-size="9" fill="#38bdf8">· Escucha 'change' del Store y ejecuta renderAll() reactivamente</text>

    <!-- utils.js -->
    <rect x="520" y="55" width="576" height="120" rx="8" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <text x="540" y="80" class="class-title" fill="#06b6d4">utils.js (Ayudantes y Diálogos Estándar)</text>
    <text x="540" y="98" class="class-desc">Métodos matemáticos, validadores y componentes dinámicos de UI.</text>
    <rect x="540" y="112" width="536" height="50" rx="4" fill="#151c2e" stroke="#25304b" stroke-width="0.5"/>
    <text x="548" y="128" font-size="9" fill="#94a3b8">· Generación de IDs seguros mediante crypto.randomUUID con fallback local</text>
    <text x="548" y="143" font-size="9" fill="#10b981">· Función notify() para mensajes y customConfirm() alinedo con el diseño</text>
  </g>

  <!-- ========================================== -->
  <!-- SECURITY & RBAC LAYER -->
  <!-- ========================================== -->
  <g transform="translate(40, 800)">
    <rect width="1120" height="240" rx="12" fill="url(#g-amber)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="24" y="32" class="layer-title" fill="#f59e0b">CAPA 3: SEGURIDAD, ROLES (RBAC) &amp; CRIPTOGRAFÍA</text>
    
    <!-- roles.js -->
    <rect x="24" y="55" width="1072" height="160" rx="8" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <text x="44" y="80" class="class-title" fill="#f59e0b">roles.js (window.RackAuth)</text>
    <text x="44" y="98" class="class-desc">Control de acceso basado en roles (RBAC) y criptografía offline en navegador.</text>
    
    <g transform="translate(44, 112)">
      <!-- SHA-256 Block -->
      <rect width="320" height="85" rx="6" fill="#151c2e" stroke="#f59e0b" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#fbbf24">Validación del PIN de Admin</text>
      <text x="12" y="38" font-size="9" fill="#94a3b8">· Compara hashes SHA-256 locales en localStorage</text>
      <text x="12" y="54" font-size="9" fill="#10b981">· Web Crypto API digest() (Contextos Seguros)</text>
      <text x="12" y="70" font-size="9" fill="#38bdf8">· [NUEVO] sha256_fallback pura en JS (Inseguros / file://)</text>

      <!-- Memory token integrity -->
      <rect x="340" y="0" width="340" height="85" rx="6" fill="#151c2e" stroke="#f59e0b" stroke-width="1"/>
      <text x="352" y="20" font-size="11" font-weight="700" fill="#fbbf24">Firma de Integridad (Anti-Tampering)</text>
      <text x="352" y="38" font-size="9" fill="#94a3b8">· Asigna un token UUID aleatorio único en RAM al iniciar sesión</text>
      <text x="352" y="54" font-size="9" fill="#94a3b8">· Previene elevación manual de privilegios en sessionStorage</text>
      <text x="352" y="70" font-size="9" fill="#38bdf8">· [NUEVO] Generador UUID con fallback matemático robusto</text>

      <!-- Permissions Matrix -->
      <rect x="700" y="0" width="316" height="85" rx="6" fill="#151c2e" stroke="#25304b" stroke-width="1"/>
      <text x="712" y="20" font-size="11" font-weight="700" fill="#f59e0b">Matriz de Permisos Directos</text>
      <text x="712" y="38" font-size="9" fill="#f87171">· ADMIN: Control total (puede cambiar PIN de acceso)</text>
      <text x="712" y="54" font-size="9" fill="#fbbf24">· EDITOR: Edición de equipos y racks (sin PIN global)</text>
      <text x="712" y="70" font-size="9" fill="#94a3b8">· ESPECTADOR: Solo Lectura. No modifica datos</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- STATE MANAGEMENT & STORAGE LAYER -->
  <!-- ========================================== -->
  <g transform="translate(40, 1070)">
    <rect width="1120" height="240" rx="12" fill="url(#g-green)" stroke="#10b981" stroke-width="1.5"/>
    <text x="24" y="32" class="layer-title" fill="#10b981">CAPA 4: ESTADO REACTIVO Y PERSISTENCIA (EL CEREBRO)</text>

    <!-- store.js -->
    <rect x="24" y="55" width="680" height="160" rx="8" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <text x="44" y="80" class="class-title" fill="#10b981">store.js (State Manager)</text>
    <text x="44" y="98" class="class-desc">Cerebro de datos reactivos del sistema. Administra salas, racks, equipos y conexiones.</text>
    
    <g transform="translate(44, 112)">
      <!-- Proxy wrapper -->
      <rect width="280" height="85" rx="6" fill="#151c2e" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#34d399">Proxy ES6 (Data Capture)</text>
      <text x="12" y="38" font-size="9" fill="#94a3b8">· Intercepta mutaciones de variables de estado</text>
      <text x="12" y="54" font-size="9" fill="#94a3b8">· Serializa y guarda automáticamente en disco</text>
      <text x="12" y="70" font-size="9" fill="#10b981">· Emite eventos 'change' automáticos al cambiar</text>

      <!-- History and snapshot -->
      <rect x="300" y="0" width="280" height="85" rx="6" fill="#151c2e" stroke="#25304b" stroke-width="1"/>
      <text x="312" y="20" font-size="11" font-weight="700" fill="#34d399">Historial Undo / Redo</text>
      <text x="312" y="38" font-size="9" fill="#94a3b8">· Capturas rápidas con store.snapshot()</text>
      <text x="312" y="54" font-size="9" fill="#94a3b8">· Deshacer/rehacer acciones de topología y racks</text>
      <text x="312" y="70" font-size="9" fill="#94a3b8">· Debounce en guardados para evitar bloqueos</text>
    </g>

    <!-- Storage and Demo Data -->
    <rect x="730" y="55" width="366" height="160" rx="8" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <text x="750" y="80" class="class-title" fill="#10b981">Almacenamiento y Demo</text>
    <text x="750" y="98" class="class-desc">Fuentes de persistencia e inicio de datos.</text>
    <rect x="750" y="112" width="326" height="85" rx="4" fill="#151c2e" stroke="#25304b" stroke-width="0.5"/>
    <text x="758" y="128" font-size="10" fill="#f0f4ff">· RACK_DESIGNER_NEXT_STATE (localStorage)</text>
    <text x="758" y="145" font-size="10" fill="#f0f4ff">· RACK_SESSION_USER (sessionStorage)</text>
    <text x="758" y="162" font-size="10" fill="#f0f4ff">· RACK_ADMIN_PIN (localStorage PBKDF2/SHA-256)</text>
    <text x="758" y="179" font-size="10" fill="#94a3b8">· demoData.js (Plantilla base autogenerada inicial)</text>
  </g>

  <!-- ========================================== -->
  <!-- OFFLINE ENGINE & SERVICE WORKER -->
  <!-- ========================================== -->
  <g transform="translate(40, 1340)">
    <rect width="1120" height="140" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="24" y="32" class="layer-title" fill="#94a3b8">CAPA 5: MOTOR OFFLINE PWA (ESTÁTICOS Y CACHÉ)</text>

    <!-- service-worker.js -->
    <rect x="24" y="50" width="1072" height="70" rx="8" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <text x="44" y="74" class="class-title" fill="#94a3b8">service-worker.js (Motor de Caché)</text>
    <text x="44" y="92" class="class-desc">Cache local de recursos web estáticos. Permite carga offline completa.</text>
    <rect x="520" y="60" width="556" height="50" rx="4" fill="#151c2e" stroke="#25304b" stroke-width="0.5"/>
    <text x="528" y="76" font-size="10" fill="#38bdf8">· [NUEVO] Nombre de caché: rack-designer-next-cache-v3 (actualizado)</text>
    <text x="528" y="93" font-size="10" fill="#94a3b8">· Descarga inicial de index.html, estilos y scripts. Invalidation activa al cargar.</text>
  </g>

  <!-- ========================================== -->
  <!-- DATA FLOW ARROWS (REACTIVE LOOP) -->
  <!-- ========================================== -->
  <!-- UI to main.js -->
  <path d="M 600,540 L 600,555 L 260,555 L 260,570" class="flow-arrow" marker-end="url(#arrow-cyan)"/>
  <text x="360" y="551" font-size="9" fill="#0ea5e9" class="mono">1. User Event Dispatch</text>

  <!-- main.js to roles.js / store.js -->
  <path d="M 200,690 L 200,800" class="flow-arrow" marker-end="url(#arrow-cyan)"/>
  <path d="M 280,690 L 280,785 L 360,785 L 360,1070" class="flow-arrow" marker-end="url(#arrow-cyan)"/>
  <text x="286" y="795" font-size="9" fill="#0ea5e9" class="mono">2. Call API / Mutation Action</text>

  <!-- store.js to LocalStorage -->
  <path d="M 704,180 L 730,180" class="flow-arrow" stroke-dasharray="2,2" stroke="#10b981" marker-end="url(#arrow-green)"/>
  <text x="696" y="174" font-size="8" fill="#10b981" class="mono" text-anchor="end">Auto-Save</text>

  <!-- store.js event back to main.js -->
  <path d="M 420,1070 L 420,690" class="flow-arrow" stroke="#10b981" marker-end="url(#arrow-green)"/>
  <text x="426" y="890" font-size="9" fill="#10b981" class="mono">3. Emit 'change' Event</text>

  <!-- main.js trigger re-render on UI -->
  <path d="M 120,570 L 120,540" class="flow-arrow" stroke="#10b981" marker-end="url(#arrow-green)"/>
  <text x="126" y="555" font-size="9" fill="#10b981" class="mono">4. renderAll() UI update</text>

</svg>
