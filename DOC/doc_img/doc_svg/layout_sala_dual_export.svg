<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" style="background:#090d16; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradiente de fondo del lienzo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gradiente de contenedor de rack -->
    <linearGradient id="rackModuleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Patrón de rejilla milimétrica -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo con textura de grilla técnica -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- ========================================== -->
  <!-- CABECERA DE LA SALA                        -->
  <!-- ========================================== -->
  <g transform="translate(40, 32)">
    <!-- Indicador de estado -->
    <circle cx="10" cy="14" r="5" fill="#10b981"/>
    <text x="26" y="18" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="-0.3">Sala: Edificio A2 — Infografía Completa de Gabinetes Duales</text>
    <text x="26" y="38" fill="#64748b" font-size="12" font-family="'Consolas', monospace">Exportación Panorámica 1:1 · Frente y Dorso por Módulo · 3 Gabinetes · 4 Equipos de Piso</text>
  </g>

  <!-- =================================================================== -->
  <!-- MÓDULO RACK 201 (ENCERRADO EN UN CUADRADO CON CABECERA DEL RACK)    -->
  <!-- =================================================================== -->
  <g transform="translate(40, 95)">
