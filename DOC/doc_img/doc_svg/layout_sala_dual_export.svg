        <rect x="10" y="14" width="28" height="30" rx="2" fill="#111827" stroke="#10b981" stroke-width="0.8"/>
        <text x="14" y="32" fill="#10b981" font-size="7" font-weight="700">PSU 1</text>
        <rect x="44" y="14" width="28" height="30" rx="2" fill="#111827" stroke="#10b981" stroke-width="0.8"/>
        <text x="48" y="32" fill="#10b981" font-size="7" font-weight="700">PSU 2</text>
