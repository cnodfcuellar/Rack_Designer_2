        <rect x="10" y="8" width="28" height="32" rx="2" fill="#111827" stroke="#10b981" stroke-width="0.8"/>
        <text x="14" y="26" fill="#10b981" font-size="7" font-weight="700">PSU 1</text>
        <rect x="44" y="8" width="28" height="32" rx="2" fill="#111827" stroke="#10b981" stroke-width="0.8"/>
        <text x="48" y="26" fill="#10b981" font-size="7" font-weight="700">PSU 2</text>
        <text x="80" y="24" fill="#94a3b8" font-size="9" font-family="'Consolas', monospace">NODO 4 DORSO</text>
