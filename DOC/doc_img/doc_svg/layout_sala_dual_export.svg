        <rect x="8" y="10" width="16" height="28" rx="2" fill="#1e293b"/>
        <rect x="28" y="10" width="16" height="28" rx="2" fill="#1e293b"/>
        <rect x="48" y="10" width="16" height="28" rx="2" fill="#1e293b"/>
        <text x="74" y="24" fill="#f59e0b" font-size="9" font-family="'Consolas', monospace">UPS SALIDAS AC</text>
        <text x="74" y="36" fill="#64748b" font-size="8">8x C13 PROTEGIDAS</text>
