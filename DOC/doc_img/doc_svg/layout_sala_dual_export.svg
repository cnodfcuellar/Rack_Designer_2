        <text x="8" y="20" fill="#f8fafc" font-size="10" font-weight="600">Servidor Nodo 5 (2U)</text>
        <text x="8" y="36" fill="#64748b" font-size="9" font-family="'Consolas', monospace">IP: 10.10.30.55</text>
        <circle cx="204" cy="24" r="3.5" fill="#10b981"/>
      </g>
      <!-- Servidor Nodo 4 U12-U13 -->
      <g transform="translate(18, 172)">
        <rect width="214" height="48" rx="2" fill="#10b98122" stroke="#10b981" stroke-width="1"/>
        <text x="8" y="20" fill="#f8fafc" font-size="10" font-weight="600">Servidor Nodo 4 (2U)</text>
        <text x="8" y="36" fill="#64748b" font-size="9" font-family="'Consolas', monospace">IP: 10.10.30.54</text>
        <circle cx="204" cy="24" r="3.5" fill="#10b981"/>
