        <rect width="214" height="24" rx="2" fill="#10b98122" stroke="#10b981" stroke-width="1"/>
        <text x="8" y="16" fill="#10b981" font-size="10" font-weight="600">Switch Core 24P</text>
        <circle cx="204" cy="12" r="3" fill="#10b981"/>
