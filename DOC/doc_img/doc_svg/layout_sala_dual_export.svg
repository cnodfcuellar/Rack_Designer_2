    <rect width="570" height="470" rx="10" fill="url(#rackModuleGrad)" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="none"/>
    
    <!-- Barra de cabecera del módulo -->
    <path d="M 0 10 Q 0 0 10 0 L 560 0 Q 570 0 570 10 L 570 42 L 0 42 Z" fill="#ef444415"/>
    <line x1="0" y1="42" x2="570" y2="42" stroke="#ef444444" stroke-width="1"/>
    
    <!-- Título del Gabinete -->
    <rect x="16" y="12" width="10" height="18" rx="2" fill="#ef4444"/>
    <text x="34" y="26" fill="#f8fafc" font-size="14" font-weight="700">GABINETE: RACK 201</text>
    <text x="195" y="26" fill="#ef4444" font-size="11" font-family="'Consolas', monospace" font-weight="600">[ 24U · 13U USADAS ]</text>
    <rect x="445" y="12" width="108" height="18" rx="4" fill="#ef444422" stroke="#ef444466"/>
    <text x="453" y="25" fill="#ef4444" font-size="9" font-family="'Consolas', monospace" font-weight="700">VISTA DUAL (F+T)</text>

    <!-- COLUMNA IZQUIERDA: VISTA FRONTAL -->
    <g transform="translate(20, 56)">
      <!-- Marco vista frontal -->
      <rect width="250" height="395" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <rect width="250" height="26" rx="6" fill="#1e293b55"/>
      <text x="125" y="17" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">VISTA FRONTAL</text>

      <!-- Rieles U -->
