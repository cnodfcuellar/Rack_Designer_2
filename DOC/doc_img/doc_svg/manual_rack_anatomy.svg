<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; }
      .title { font-weight: 800; fill: #38bdf8; font-size: 24px; }
      .desc { font-weight: 400; fill: #94a3b8; font-size: 14px; }
      .label-hl { font-weight: 700; fill: #10b981; font-size: 16px; }
    </style>
  </defs>

  <rect width="1000" height="700" fill="#0b0f19" rx="16"/>

  <text x="40" y="50" class="title">¿QUÉ ES UN RACK Y UNA UNIDAD "U"?</text>
  <text x="40" y="75" class="desc">Entiende la anatomía básica del almacenamiento en un Datacenter</text>

  <!-- Rack Diagram -->
  <g transform="translate(150, 150)">
    <!-- Rack Frame -->
    <rect x="0" y="0" width="300" height="400" fill="#151c2e" stroke="#2e3d5a" stroke-width="4" rx="4"/>
    
    <!-- U slots -->
    <g fill="#0f172a" stroke="#25304b" stroke-width="1">
      <rect x="10" y="10" width="280" height="30" />
      <text x="145" y="30" text-anchor="middle" font-size="12" fill="#475569">U42 (Vacío)</text>
      <rect x="10" y="45" width="280" height="30" />
      <text x="145" y="65" text-anchor="middle" font-size="12" fill="#475569">U41 (Vacío)</text>
      <!-- ... skip ... -->
      <rect x="10" y="150" width="280" height="30" />
      <text x="145" y="170" text-anchor="middle" font-size="12" fill="#475569">U30 (Vacío)</text>
    </g>

    <!-- 2U Server -->
    <rect x="8" y="185" width="284" height="65" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="2"/>
    <text x="150" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#10b981">Servidor Dell (Ocupa 2U)</text>
    <text x="150" y="235" text-anchor="middle" font-size="12" fill="#34d399">Instalado en U28 y U29</text>

    <g fill="#0f172a" stroke="#25304b" stroke-width="1">
      <rect x="10" y="255" width="280" height="30" />
      <text x="145" y="275" text-anchor="middle" font-size="12" fill="#475569">U27 (Vacío)</text>
    </g>

    <text x="150" y="430" text-anchor="middle" font-size="14" fill="#94a3b8">Gabinete Estándar (Ej: 42U)</text>
  </g>

  <!-- Explanations -->
  <g transform="translate(550, 150)">
    <text x="0" y="20" class="label-hl" fill="#38bdf8">1. ¿Qué es un Rack (Gabinete)?</text>
    <text x="0" y="45" font-size="14" fill="#94a3b8" width="400">Es un armario metálico diseñado para apilar</text>
    <text x="0" y="65" font-size="14" fill="#94a3b8" width="400">equipos de forma vertical, ahorrando espacio.</text>

    <text x="0" y="120" class="label-hl" fill="#10b981">2. ¿Qué es una "U"?</text>
    <text x="0" y="145" font-size="14" fill="#94a3b8" width="400">La "U" (Unidad Rack) es la medida de altura estándar.</text>
    <text x="0" y="165" font-size="14" fill="#94a3b8" width="400">1U = 1.75 pulgadas (4.44 cm).</text>
    <text x="0" y="185" font-size="14" fill="#94a3b8" width="400">Un servidor puede ocupar 1U, 2U o más.</text>

    <text x="0" y="240" class="label-hl" fill="#f59e0b">3. Vistas: Frontal y Trasera</text>
    <text x="0" y="265" font-size="14" fill="#94a3b8" width="400">Los Racks tienen dos "caras". Los equipos se montan</text>
    <text x="0" y="285" font-size="14" fill="#94a3b8" width="400">por delante (Frente), pero los cables y puertos</text>
    <text x="0" y="305" font-size="14" fill="#94a3b8" width="400">de red a menudo se conectan por detrás (Atrás).</text>
    
    <text x="0" y="325" font-size="14" fill="#38bdf8" width="400">En la aplicación puedes alternar entre ambas caras.</text>
  </g>
</svg>
