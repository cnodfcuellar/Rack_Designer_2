  <rect x="360" y="288" width="210" height="22" rx="6" fill="#0d2a1a"/>
  <text x="375" y="302" font-family="'Segoe UI', monospace" font-size="8" fill="#4ade80">Rack</text>
  <text x="410" y="302" font-family="'Segoe UI', monospace" font-size="8" fill="#4ade80">Device</text>
  <text x="460" y="302" font-family="'Segoe UI', monospace" font-size="8" fill="#4ade80">IP</text>
  <text x="508" y="302" font-family="'Segoe UI', monospace" font-size="8" fill="#4ade80">U</text>
  <!-- Data rows -->
  <text x="375" y="322" font-family="'Segoe UI', monospace" font-size="8" fill="#94a3b8">R01</text>
  <text x="410" y="322" font-family="'Segoe UI', monospace" font-size="8" fill="#94a3b8">srv-01</text>
  <text x="460" y="322" font-family="'Segoe UI', monospace" font-size="8" fill="#94a3b8">10.0.0.1</text>
  <text x="508" y="322" font-family="'Segoe UI', monospace" font-size="8" fill="#94a3b8">2</text>
  <text x="375" y="338" font-family="'Segoe UI', monospace" font-size="8" fill="#64748b">R01</text>
  <text x="410" y="338" font-family="'Segoe UI', monospace" font-size="8" fill="#64748b">sw-core</text>
  <text x="460" y="338" font-family="'Segoe UI', monospace" font-size="8" fill="#64748b">10.0.0.2</text>
  <text x="508" y="338" font-family="'Segoe UI', monospace" font-size="8" fill="#64748b">1</text>
  <text x="375" y="354" font-family="'Segoe UI', monospace" font-size="8" fill="#64748b">R02</text>
  <text x="410" y="354" font-family="'Segoe UI', monospace" font-size="8" fill="#64748b">fw-01</text>
  <text x="460" y="354" font-family="'Segoe UI', monospace" font-size="8" fill="#64748b">10.0.0.3</text>
  <text x="508" y="354" font-family="'Segoe UI', monospace" font-size="8" fill="#64748b">1</text>
  <text x="465" y="428" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">xlsx library / csv builder</text>
  <text x="465" y="446" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">God Mode → passwords censored</text>
  <rect x="360" y="462" width="210" height="24" rx="6" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-width="0.8"/>
  <text x="465" y="478" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#34d399" font-weight="600">.csv / .xlsx  ·  Inventory</text>

  <!-- PNG Topology -->
  <rect x="620" y="232" width="250" height="310" rx="14" fill="#050a10" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="620" y="232" width="250" height="7" rx="4" fill="#60a5fa"/>
  <text x="745" y="256" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#93c5fd" font-weight="700" letter-spacing="1">PNG  ·  TOPOLOGY</text>
