  <rect x="340" y="232" width="250" height="310" rx="14" fill="#05100a" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="340" y="232" width="250" height="7" rx="4" fill="#34d399"/>
  <text x="465" y="256" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6ee7b7" font-weight="700" letter-spacing="1">CSV / EXCEL</text>
  <text x="465" y="274" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#065f46">Inventory report</text>
  <!-- Table simulation -->
  <rect x="360" y="288" width="210" height="160" rx="6" fill="#060e08" stroke="#1a6b45" stroke-width="0.8"/>
