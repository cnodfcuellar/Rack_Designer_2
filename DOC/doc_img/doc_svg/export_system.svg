  <rect x="640" y="288" width="210" height="140" rx="6" fill="#06101a" stroke="#1e3a5f" stroke-width="0.8"/>
  <!-- Canvas frame simulation -->
  <text x="745" y="316" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#334155">canvas.toDataURL('image/png')</text>
  <circle cx="690" cy="350" r="16" fill="#0d2030" stroke="#1e3a5f" stroke-width="1"/>
  <text x="690" y="357" text-anchor="middle" font-size="12">🖥</text>
  <circle cx="745" cy="380" r="14" fill="#0d2030" stroke="#1e3a5f" stroke-width="1"/>
