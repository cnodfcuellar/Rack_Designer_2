<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a"/>
      <stop offset="100%" style="stop-color:#0a1520"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/></filter>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1100" height="780" fill="url(#bg)"/>
  <rect width="1100" height="780" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="40" y="28" width="460" height="52" rx="6" fill="#0d1f30" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="40" y1="28" x2="40" y2="80" stroke="#10b981" stroke-width="3"/>
  <text x="60" y="49" font-family="'Segoe UI', sans-serif" font-size="9" fill="#10b981" letter-spacing="3" font-weight="600">RACK DESIGNER 2  ·  DATA EXPORT</text>
  <text x="60" y="68" font-family="'Segoe UI', sans-serif" font-size="20" fill="#f0f6ff" font-weight="700">EXPORT SYSTEM  ·  MULTI-FORMAT</text>

  <!-- Trigger -->
  <rect x="350" y="108" width="400" height="68" rx="10" fill="#0d1a2a" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="350" y="108" width="400" height="5" rx="3" fill="#10b981"/>
  <text x="550" y="132" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6ee7b7" font-weight="700" letter-spacing="1">EXPORT TRIGGER</text>
  <text x="550" y="152" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#e2e8f0">User clicks Export in Header menu</text>
  <text x="550" y="168" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">→ core/export.js  ·  Checked by RackAuth.can('export')</text>

  <!-- Fan down to 4 formats -->
  <line x1="430" y1="176" x2="160" y2="228" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <line x1="480" y1="176" x2="390" y2="228" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <line x1="580" y1="176" x2="680" y2="228" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <line x1="640" y1="176" x2="930" y2="228" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <circle cx="550" cy="176" r="5" fill="#10b981"/>

  <!-- Format cards -->
  <!-- JSON -->
  <rect x="60" y="232" width="250" height="310" rx="14" fill="#051510" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="232" width="250" height="7" rx="4" fill="#10b981"/>
  <text x="185" y="256" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6ee7b7" font-weight="700" letter-spacing="1">JSON PROJECT</text>
  <text x="185" y="274" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#065f46">Full serialization</text>
  <rect x="80" y="288" width="210" height="220" rx="6" fill="#060e08" stroke="#1a6b45" stroke-width="0.8"/>
  <text x="100" y="310" font-family="'Segoe UI', monospace" font-size="9" fill="#4ade80">{</text>
  <text x="108" y="326" font-family="'Segoe UI', monospace" font-size="9" fill="#94a3b8">  "rooms": [...],</text>
  <text x="108" y="342" font-family="'Segoe UI', monospace" font-size="9" fill="#94a3b8">  "racks": [...],</text>
  <text x="108" y="358" font-family="'Segoe UI', monospace" font-size="9" fill="#94a3b8">  "devices": [...],</text>
  <text x="108" y="374" font-family="'Segoe UI', monospace" font-size="9" fill="#94a3b8">  "cables": [...],</text>
  <text x="108" y="390" font-family="'Segoe UI', monospace" font-size="9" fill="#94a3b8">  "positions": {...}</text>
  <text x="100" y="406" font-family="'Segoe UI', monospace" font-size="9" fill="#4ade80">}</text>
  <text x="185" y="440" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">showSaveFilePicker()</text>
  <text x="185" y="456" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">or blob download</text>
  <rect x="80" y="480" width="210" height="24" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="0.8"/>
  <text x="185" y="496" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#10b981" font-weight="600">.json  ·  Full project restore</text>

