  <circle cx="800" cy="350" r="14" fill="#0d2030" stroke="#1e3a5f" stroke-width="1"/>
  <text x="800" y="357" text-anchor="middle" font-size="11">📡</text>
  <path d="M 706 350 Q 720 340 731 366" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.5"/>
  <path d="M 759 378 Q 780 365 786 356" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.5"/>
  <text x="745" y="444" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">High-res · try/finally safe</text>
  <text x="745" y="462" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">Exports current viewport</text>
  <rect x="640" y="480" width="210" height="24" rx="6" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="745" y="496" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#60a5fa" font-weight="600">.png  ·  Network diagram</text>

  <!-- PDF Floor -->
  <rect x="900" y="232" width="160" height="310" rx="14" fill="#0a0510" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="900" y="232" width="160" height="7" rx="4" fill="#a78bfa"/>
  <text x="980" y="256" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c4b5fd" font-weight="700">FLOOR PNG</text>
  <text x="980" y="274" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#4c1d95">Floor devices</text>
  <text x="980" y="330" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">exportFloor</text>
  <text x="980" y="348" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">ToPNG()</text>
  <text x="980" y="380" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">Cards rendered</text>
  <text x="980" y="396" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">to off-screen</text>
  <text x="980" y="412" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">canvas</text>
  <text x="980" y="440" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">Per-room</text>
  <text x="980" y="456" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">export</text>
  <rect x="920" y="480" width="120" height="24" rx="6" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="980" y="496" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#a78bfa" font-weight="600">.png floor</text>

  <!-- Bottom banner -->
  <rect x="60" y="572" width="980" height="70" rx="12" fill="#050e08" stroke="#10b981" stroke-width="1"/>
  <text x="550" y="598" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6ee7b7" font-weight="700" letter-spacing="2">SECURITY  ·  ALL EXPORTS CHECKED BY RBAC</text>
  <text x="550" y="622" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">RackAuth.can('export') → if Viewer: download disabled  ·  if Admin: passwords visible in report</text>

  <!-- Footer -->
  <line x1="40" y1="748" x2="1060" y2="748" stroke="#fff" stroke-width="0.3" stroke-opacity="0.1"/>
  <text x="48" y="764" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">RACK Designer 2  ·  Export System</text>
  <text x="1052" y="764" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">doc_img/doc_svg/export_system.svg</text>
</svg>
