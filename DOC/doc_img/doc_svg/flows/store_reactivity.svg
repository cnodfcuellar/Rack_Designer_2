<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d1a"/>
      <stop offset="100%" stop-color="#0a1525"/>
    </linearGradient>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1000" height="920" fill="url(#bg)"/>
  <rect width="1000" height="920" fill="url(#dots)"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect width="520" height="54" rx="6" fill="#0d1f30" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="0" y2="54" stroke="#00d4ff" stroke-width="3"/>
    <text x="20" y="22" font-size="9" fill="#00d4ff" letter-spacing="3" font-weight="700" class="mono">RACK DESIGNER NEXT · REACTIVE ARCHITECTURE</text>
    <text x="20" y="42" font-size="18" fill="#f0f6ff" font-weight="700">FLUJO REACTIVO PROXY ES6 &amp; ESTADO GLOBAL</text>
  </g>

  <!-- ===== PASO 1: ACCIÓN DE USUARIO ===== -->
  <g transform="translate(330, 100)" filter="url(#shadow)">
    <rect width="340" height="78" rx="8" fill="#0d1a2a" stroke="#00d4ff" stroke-width="1.5"/>
    <rect width="340" height="5" rx="2" fill="#00d4ff"/>
    <circle cx="40" cy="40" r="18" fill="#00d4ff" fill-opacity="0.15"/>
    <text x="40" y="46" text-anchor="middle" font-size="16">👤</text>
    <text x="75" y="34" font-size="12" fill="#00d4ff" font-weight="700">1. ACCIÓN DEL USUARIO EN UI</text>
    <text x="75" y="50" font-size="10.5" fill="#f0f6ff">Drag &amp; Drop · Edición de Celdas · Conexión · Zoom</text>
    <text x="75" y="66" font-size="9.5" fill="#64748b" class="mono">Ej: onSlotDrop() ➔ store.addDeviceToRack()</text>
  </g>

  <!-- Flecha 1 -> 2 -->
  <line x1="500" y1="178" x2="500" y2="216" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowC)"/>

  <!-- ===== PASO 2: CAPTURA & SNAPSHOT PRE-MUTACIÓN ===== -->
  <g transform="translate(250, 220)" filter="url(#shadow)">
    <rect width="500" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="500" height="5" rx="2" fill="#38bdf8"/>
    <text x="250" y="26" text-anchor="middle" font-size="12" fill="#38bdf8" font-weight="700">2. INSTANTÁNEA OPTIMIZADA DE ESTADO (M-03)</text>
    <text x="250" y="46" text-anchor="middle" font-size="11" fill="#f0f6ff" class="mono">store.snapshot() ➔ fastClone(this._raw) (N ≤ 15)</text>
    <text x="250" y="64" text-anchor="middle" font-size="10" fill="#94a3b8">Clonado rápido O(N) por capas · Aislamiento de topologySlots (-80% RAM)</text>
    <text x="250" y="80" text-anchor="middle" font-size="9" fill="#38bdf8" class="mono">store._undoStack.push(snap) · store._redoStack = []</text>
  </g>

  <!-- Flecha 2 -> 3 -->
  <line x1="500" y1="310" x2="500" y2="348" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- ===== PASO 3: TRAMPA PROXY ES6 (SET TRAP) ===== -->
  <g transform="translate(220, 350)" filter="url(#shadow)">
    <rect width="560" height="96" rx="8" fill="#052e16" stroke="#10b981" stroke-width="2"/>
    <rect width="560" height="5" rx="2" fill="#10b981"/>
    <text x="280" y="26" text-anchor="middle" font-size="12.5" fill="#34d399" font-weight="700">3. TRAMPA DE ESCRITURA PROXY ES6 (_makeProxy)</text>
    <text x="280" y="48" text-anchor="middle" font-size="11.5" fill="#f0f6ff" class="mono">set(target, key, value) ➔ target[key] = value</text>
    <text x="280" y="68" text-anchor="middle" font-size="10.5" fill="#a7f3d0">Detecta inserción, eliminación o mutación atómica en store._raw</text>
    <text x="280" y="84" text-anchor="middle" font-size="9.5" fill="#6ee7b7" class="mono">Dispara automáticamente persistencia _save() y emisión de eventos _emit()</text>
  </g>

  <!-- Ramificaciones del Proxy -->
  <line x1="500" y1="446" x2="500" y2="480" stroke="#10b981" stroke-width="2"/>
  <line x1="200" y1="480" x2="800" y2="480" stroke="#10b981" stroke-width="2"/>
  <line x1="200" y1="480" x2="200" y2="510" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="500" y1="480" x2="500" y2="510" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="800" y1="480" x2="800" y2="510" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- ===== SALIDA A: PERSISTENCIA DISCO ===== -->
  <g transform="translate(60, 514)" filter="url(#shadow)">
    <rect width="280" height="135" rx="8" fill="#0d1a2a" stroke="#f59e0b" stroke-width="1.2"/>
    <rect width="280" height="4" rx="2" fill="#f59e0b"/>
    <text x="140" y="24" text-anchor="middle" font-size="11" fill="#fbbf24" font-weight="700">PERSISTENCIA &amp; CIFRADO</text>
    <text x="140" y="44" text-anchor="middle" font-size="9.5" fill="#f0f6ff" class="mono">Key: RACK_DESIGNER_NEXT_STATE</text>
    <text x="140" y="62" text-anchor="middle" font-size="9.5" fill="#94a3b8">Cifrado AES-GCM (M-01) en reposo</text>
    <text x="140" y="80" text-anchor="middle" font-size="9.5" fill="#94a3b8">Backup anti-corrupción JSON (M-05)</text>
    <text x="140" y="98" text-anchor="middle" font-size="9.5" fill="#94a3b8">Try/Catch QuotaExceeded (M-02)</text>
    <text x="140" y="118" text-anchor="middle" font-size="8.5" fill="#f59e0b" class="mono">Debounce 300ms + Auto-saneamiento</text>
  </g>

  <!-- ===== SALIDA B: DESPACHO COALESCENTE ===== -->
  <g transform="translate(360, 514)" filter="url(#shadow)">
    <rect width="280" height="135" rx="8" fill="#0d1a2a" stroke="#38bdf8" stroke-width="1.2"/>
    <rect width="280" height="4" rx="2" fill="#38bdf8"/>
    <text x="140" y="24" text-anchor="middle" font-size="11" fill="#38bdf8" font-weight="700">DESPACHADOR COALESCENTE</text>
    <text x="140" y="44" text-anchor="middle" font-size="9.5" fill="#f0f6ff" class="mono">store._emit('change', eventMeta)</text>
    <text x="140" y="62" text-anchor="middle" font-size="9.5" fill="#94a3b8">Metadatos: source, rackId, deviceId</text>
    <text x="140" y="80" text-anchor="middle" font-size="9.5" fill="#38bdf8">Agrupamiento requestAnimationFrame</text>
    <text x="140" y="98" text-anchor="middle" font-size="9.5" fill="#94a3b8">Coalescencia fluida a 60 FPS (M-04)</text>
    <text x="140" y="118" text-anchor="middle" font-size="8.5" fill="#34d399" class="mono">_renderPending flag anti-parpadeo</text>
  </g>

  <!-- ===== SALIDA C: REDIBUJADO SELECTIVO O(1) ===== -->
  <g transform="translate(660, 514)" filter="url(#shadow)">
    <rect width="280" height="135" rx="8" fill="#0d1a2a" stroke="#10b981" stroke-width="1.2"/>
    <rect width="280" height="4" rx="2" fill="#10b981"/>
    <text x="140" y="24" text-anchor="middle" font-size="11" fill="#34d399" font-weight="700">REDIBUJADO SELECTIVO (M-04)</text>
    <text x="140" y="44" text-anchor="middle" font-size="9.5" fill="#f0f6ff" class="mono">renderSingleRack(rackId) ➔ O(1)</text>
    <text x="140" y="62" text-anchor="middle" font-size="9.5" fill="#94a3b8">Preserva estado 3D (.flipped)</text>
    <text x="140" y="80" text-anchor="middle" font-size="9.5" fill="#94a3b8">dirtyPhysical / dirtyTopology flags</text>
    <text x="140" y="98" text-anchor="middle" font-size="9.5" fill="#94a3b8">Bottom Panel: solo tabla activa</text>
    <text x="140" y="118" text-anchor="middle" font-size="8.5" fill="#38bdf8" class="mono">Monitor RenderPerformance activo</text>
  </g>

  <!-- Flujo de Retorno hacia la UI -->
  <g transform="translate(60, 675)">
    <rect width="880" height="80" rx="8" fill="#0f172a" stroke="#25304b" stroke-width="1"/>
    <text x="24" y="28" font-size="12" fill="#f0f6ff" font-weight="700">CICLO REACTIVO UNIDIRECCIONAL CERRADO</text>
    <text x="24" y="48" font-size="10.5" fill="#94a3b8">El árbol DOM nunca se muta directamente para actualizar datos. Toda interacción nutre el almacén central, se asegura criptográficamente, se respalda con fastClone y actualiza selectivamente los componentes visuales en el siguiente frame de renderizado.</text>
    <text x="24" y="66" font-size="9.5" fill="#38bdf8" class="mono">Zero Full-Page Reloads · PWA Autónoma · Reactividad Estilo Redux con Pureza Vanilla JS 100%</text>
  </g>

  <!-- Historial / Undo / Redo Bar -->
  <g transform="translate(60, 775)">
    <rect width="880" height="54" rx="6" fill="#151c2e" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="24" y="24" font-size="11" fill="#c084fc" font-weight="700">HISTORIAL DE SESIÓN (Undo / Redo):</text>
    <text x="24" y="42" font-size="10" fill="#94a3b8">Pilas independientes _undoStack y _redoStack limitadas dinámicamente a store.maxHistory = 15. Atajos de teclado globales Ctrl+Z y Ctrl+Y operativos en toda la consola.</text>
  </g>

  <!-- Pie de pagina -->
  <line x1="40" y1="880" x2="960" y2="880" stroke="#fff" stroke-width="0.3" stroke-opacity="0.1"/>
  <text x="48" y="898" font-size="10" fill="#64748b" class="mono">RACK Designer Next · doc/doc_img/doc_svg/store_reactivity.svg · Proxy ES6 State Flow</text>

</svg>
