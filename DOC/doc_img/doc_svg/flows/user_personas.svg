<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a"/>
      <stop offset="100%" style="stop-color:#0a1520"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/></filter>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1100" height="800" fill="url(#bg)"/>
  <rect width="1100" height="800" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="40" y="28" width="460" height="52" rx="6" fill="#0d1f30" stroke="#e2e8f0" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="40" y1="28" x2="40" y2="80" stroke="#e2e8f0" stroke-width="3"/>
  <text x="60" y="49" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" letter-spacing="3" font-weight="600">RACK DESIGNER 2  ·  USER TYPES</text>
  <text x="60" y="68" font-family="'Segoe UI', sans-serif" font-size="20" fill="#f0f6ff" font-weight="700">USER PERSONAS  ·  USE CASE DIAGRAM</text>

  <!-- Three persona cards in a row -->

  <!-- SYSADMIN -->
  <rect x="60" y="110" width="300" height="580" rx="16" fill="#050818" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="110" width="300" height="8" rx="5" fill="#f43f5e"/>
  <!-- Avatar circle -->
  <circle cx="210" cy="186" r="44" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="210" y="195" text-anchor="middle" font-size="36">👩‍💼</text>
  <text x="210" y="248" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#fca5a5" font-weight="700">SysAdmin</text>
  <text x="210" y="268" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Datacenter Engineer</text>

  <!-- Admin role badge -->
  <rect x="135" y="280" width="150" height="26" rx="13" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1"/>
  <text x="210" y="297" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f43f5e" font-weight="700">👑 Administrator</text>

  <line x1="80" y1="318" x2="340" y2="318" stroke="#f43f5e" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Use cases -->
  <g font-family="'Segoe UI', sans-serif" font-size="11">
    <rect x="80" y="328" width="260" height="26" rx="4" fill="#f43f5e" fill-opacity="0.06"/>
    <text x="100" y="345" fill="#fca5a5">✓</text>
    <text x="118" y="345" fill="#e2e8f0">Design full datacenter</text>

    <rect x="80" y="360" width="260" height="26" rx="4" fill="#f43f5e" fill-opacity="0.06"/>
    <text x="100" y="377" fill="#fca5a5">✓</text>
    <text x="118" y="377" fill="#e2e8f0">Manage all racks / U-slots</text>

    <rect x="80" y="392" width="260" height="26" rx="4" fill="#f43f5e" fill-opacity="0.06"/>
    <text x="100" y="409" fill="#fca5a5">✓</text>
    <text x="118" y="409" fill="#e2e8f0">Set PIN &amp; manage users</text>

    <rect x="80" y="424" width="260" height="26" rx="4" fill="#f43f5e" fill-opacity="0.06"/>
    <text x="100" y="441" fill="#fca5a5">✓</text>
    <text x="118" y="441" fill="#e2e8f0">View all passwords (God Mode)</text>

    <rect x="80" y="456" width="260" height="26" rx="4" fill="#f43f5e" fill-opacity="0.06"/>
    <text x="100" y="473" fill="#fca5a5">✓</text>
    <text x="118" y="473" fill="#e2e8f0">Export full reports</text>

    <rect x="80" y="488" width="260" height="26" rx="4" fill="#f43f5e" fill-opacity="0.06"/>
    <text x="100" y="505" fill="#fca5a5">✓</text>
    <text x="118" y="505" fill="#e2e8f0">Plan cable topology</text>

    <rect x="80" y="520" width="260" height="26" rx="4" fill="#f43f5e" fill-opacity="0.06"/>
    <text x="100" y="537" fill="#fca5a5">✓</text>
    <text x="118" y="537" fill="#e2e8f0">PWA offline access</text>

    <rect x="80" y="552" width="260" height="26" rx="4" fill="#f43f5e" fill-opacity="0.06"/>
    <text x="100" y="569" fill="#fca5a5">✓</text>
    <text x="118" y="569" fill="#e2e8f0">Undo/Redo changes</text>
  </g>

  <!-- EDITOR -->
  <rect x="400" y="110" width="300" height="580" rx="16" fill="#050a18" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <rect x="400" y="110" width="300" height="8" rx="5" fill="#fbbf24"/>
  <circle cx="550" cy="186" r="44" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="550" y="195" text-anchor="middle" font-size="36">👨‍🔧</text>
  <text x="550" y="248" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#fde68a" font-weight="700">NOC Engineer</text>
  <text x="550" y="268" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Network Operations</text>

  <rect x="475" y="280" width="150" height="26" rx="13" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1"/>
  <text x="550" y="297" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fbbf24" font-weight="700">🛠 Editor</text>

  <line x1="420" y1="318" x2="680" y2="318" stroke="#fbbf24" stroke-width="0.5" stroke-opacity="0.3"/>

  <g font-family="'Segoe UI', sans-serif" font-size="11">
    <rect x="420" y="328" width="260" height="26" rx="4" fill="#fbbf24" fill-opacity="0.05"/>
