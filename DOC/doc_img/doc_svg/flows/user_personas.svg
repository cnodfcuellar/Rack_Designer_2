  <g font-family="'Segoe UI', sans-serif" font-size="11">
    <rect x="760" y="328" width="260" height="26" rx="4" fill="#64748b" fill-opacity="0.05"/>
    <text x="780" y="345" fill="#86efac">✓</text>
    <text x="798" y="345" fill="#e2e8f0">Read-only inventory</text>

    <rect x="760" y="360" width="260" height="26" rx="4" fill="#64748b" fill-opacity="0.05"/>
    <text x="780" y="377" fill="#86efac">✓</text>
    <text x="798" y="377" fill="#e2e8f0">View topology map</text>

    <rect x="760" y="392" width="260" height="26" rx="4" fill="#64748b" fill-opacity="0.05"/>
    <text x="780" y="409" fill="#86efac">✓</text>
    <text x="798" y="409" fill="#e2e8f0">See room / rack layout</text>

    <rect x="760" y="424" width="260" height="26" rx="4" fill="#0d0f1a" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="780" y="441" fill="#f87171">✗</text>
    <text x="798" y="441" fill="#64748b">No drag &amp; drop</text>

    <rect x="760" y="456" width="260" height="26" rx="4" fill="#0d0f1a" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="780" y="473" fill="#f87171">✗</text>
    <text x="798" y="473" fill="#64748b">No exports</text>

    <rect x="760" y="488" width="260" height="26" rx="4" fill="#0d0f1a" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="780" y="505" fill="#f87171">✗</text>
    <text x="798" y="505" fill="#64748b">No deletes</text>

    <rect x="760" y="520" width="260" height="26" rx="4" fill="#0d0f1a" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="780" y="537" fill="#f87171">✗</text>
    <text x="798" y="537" fill="#64748b">Passwords → ••••••••</text>

    <rect x="760" y="552" width="260" height="26" rx="4" fill="#0d0f1a" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="780" y="569" fill="#f87171">✗</text>
    <text x="798" y="569" fill="#64748b">No cables / settings</text>
  </g>

  <!-- Footer -->
  <line x1="40" y1="764" x2="1060" y2="764" stroke="#fff" stroke-width="0.3" stroke-opacity="0.1"/>
  <text x="48" y="780" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">RACK Designer 2  ·  User Personas &amp; Types</text>
  <text x="1052" y="780" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">doc_img/doc_svg/user_personas.svg</text>
</svg>
