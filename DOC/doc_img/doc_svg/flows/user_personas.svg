    <text x="458" y="345" fill="#e2e8f0">View all data</text>

    <rect x="420" y="360" width="260" height="26" rx="4" fill="#fbbf24" fill-opacity="0.05"/>
    <text x="440" y="377" fill="#fde68a">✓</text>
    <text x="458" y="377" fill="#e2e8f0">Add / move devices</text>

    <rect x="420" y="392" width="260" height="26" rx="4" fill="#fbbf24" fill-opacity="0.05"/>
    <text x="440" y="409" fill="#fde68a">✓</text>
    <text x="458" y="409" fill="#e2e8f0">Patch cables</text>

    <rect x="420" y="424" width="260" height="26" rx="4" fill="#fbbf24" fill-opacity="0.05"/>
    <text x="440" y="441" fill="#fde68a">✓</text>
    <text x="458" y="441" fill="#e2e8f0">Export inventory</text>

    <rect x="420" y="456" width="260" height="26" rx="4" fill="#fbbf24" fill-opacity="0.05"/>
    <text x="440" y="473" fill="#fde68a">✓</text>
    <text x="458" y="473" fill="#e2e8f0">Delete (with confirmation)</text>

    <rect x="420" y="488" width="260" height="26" rx="4" fill="#1a0f00" stroke="#fbbf24" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="440" y="505" fill="#f87171">✗</text>
    <text x="458" y="505" fill="#64748b">Passwords → censored</text>

    <rect x="420" y="520" width="260" height="26" rx="4" fill="#1a0f00" stroke="#fbbf24" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="440" y="537" fill="#f87171">✗</text>
    <text x="458" y="537" fill="#64748b">No user management</text>

    <rect x="420" y="552" width="260" height="26" rx="4" fill="#1a0f00" stroke="#fbbf24" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="440" y="569" fill="#f87171">✗</text>
    <text x="458" y="569" fill="#64748b">No system settings</text>
  </g>

  <!-- VIEWER -->
  <rect x="740" y="110" width="300" height="580" rx="16" fill="#050810" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="740" y="110" width="300" height="8" rx="5" fill="#64748b"/>
  <circle cx="890" cy="186" r="44" fill="#64748b" fill-opacity="0.1" stroke="#64748b" stroke-width="1.5"/>
  <text x="890" y="195" text-anchor="middle" font-size="36">👀</text>
  <text x="890" y="248" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#94a3b8" font-weight="700">Stakeholder</text>
  <text x="890" y="268" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Management / Auditor</text>

  <rect x="815" y="280" width="150" height="26" rx="13" fill="#64748b" fill-opacity="0.1" stroke="#64748b" stroke-width="1"/>
