<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>

    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1e293b" opacity="0.6"/>
    </pattern>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gradiente Paleta Sepia -->
    <linearGradient id="sepia-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4ece1"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="960" height="560" fill="url(#bg-grad)" rx="12"/>
  <rect width="960" height="560" fill="url(#grid-dots)" rx="12"/>
  <rect width="960" height="560" fill="none" stroke="#1e293b" stroke-width="1.5" rx="12"/>

  <!-- Cabecera -->
  <rect x="24" y="20" width="912" height="54" rx="8" fill="url(#header-grad)" stroke="#334155" stroke-width="1"/>
  <rect x="36" y="28" width="6" height="38" rx="3" fill="#d97706"/>
  <text x="52" y="44" fill="#f8fafc" font-size="16" font-weight="700">PROPUESTA 6: TEMA CÁLIDO SEPIA Y EXPERIENCIA MÓVIL / TABLET</text>
  <text x="52" y="61" fill="#94a3b8" font-size="11.5">Nuevo tema relajante anti-fatiga ocular y adaptación ergonómica responsive para smartphones y tablets</text>
  
  <rect x="790" y="32" width="134" height="28" rx="6" fill="rgba(217, 119, 6, 0.15)" stroke="#d97706" stroke-width="1"/>
  <text x="857" y="50" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">☕ CONFORT VISUAL</text>

  <!-- Lado Izquierdo: El Nuevo Tema Sepia -->
  <g transform="translate(40, 95)">
    <rect width="420" height="250" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="34" rx="8" fill="#1e293b"/>
    <text x="16" y="22" fill="#ffffff" font-size="12" font-weight="700">Selector de Tema Triple en Cabecera</text>

    <!-- Selector Switch 3 Estados -->
    <g transform="translate(16, 48)">
      <rect width="388" height="36" rx="8" fill="#090d16" stroke="#334155"/>
      <!-- Opción Claro -->
      <rect x="4" y="4" width="124" height="28" rx="6" fill="transparent"/>
      <text x="66" y="22" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">☀️ Claro</text>
      <!-- Opción Oscuro -->
      <rect x="132" y="4" width="124" height="28" rx="6" fill="transparent"/>
      <text x="194" y="22" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">🌙 Oscuro</text>
      <!-- Opción Sepia (Activa) -->
      <rect x="260" y="4" width="124" height="28" rx="6" fill="#78350f" stroke="#d97706" stroke-width="1.2"/>
      <text x="322" y="22" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">☕ Sepia (Activo)</text>
    </g>

    <!-- Tarjeta de Muestra en Paleta Sepia -->
    <g transform="translate(16, 96)">
      <rect width="388" height="135" rx="6" fill="url(#sepia-card)" stroke="#d4b996" stroke-width="1.5"/>
      <rect x="0" y="0" width="388" height="26" fill="#e8dac8"/>
      <text x="14" y="18" fill="#451a03" font-size="11" font-weight="700">Rack 101 · Vista en Tema Cálido</text>

      <!-- Servidor en Sepia -->
      <g transform="translate(12, 34)">
        <rect width="364" height="28" rx="3" fill="#3f2e20" stroke="#785336"/>
        <text x="14" y="18" fill="#fef3c7" font-size="9.5" font-weight="700">Switch Core Nexus 10G</text>
        <text x="240" y="18" fill="#fde68a" font-size="8.5" class="mono">10.10.10.2 · U40</text>
      </g>

      <g transform="translate(12, 68)">
        <rect width="364" height="52" rx="3" fill="#2d2218" stroke="#785336"/>
        <text x="14" y="22" fill="#fef3c7" font-size="9.5" font-weight="700">Servidor Web Frontend 2U</text>
        <text x="240" y="22" fill="#fde68a" font-size="8.5" class="mono">10.10.30.10 · U38</text>
        <text x="14" y="38" fill="#d97706" font-size="8.5">Tonos tierra cálidos reducen fatiga ocular nocturna</text>
      </g>
    </g>
  </g>

  <!-- Lado Derecho: Adaptación Móvil y Tablet -->
  <g transform="translate(490, 95)">
    <rect width="430" height="250" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="34" rx="8" fill="#1e293b"/>
    <text x="16" y="22" fill="#ffffff" font-size="12" font-weight="700">Interfaz Ergonómica Móvil y Tablet (Touch DCIM)</text>

    <!-- Mockup Smartphone -->
    <g transform="translate(20, 48)">
      <rect width="130" height="190" rx="14" fill="#090d16" stroke="#475569" stroke-width="2"/>
      <!-- Notch superior -->
      <rect x="45" y="4" width="40" height="6" rx="3" fill="#1e293b"/>
      
      <!-- Mini cabecera app móvil -->
      <rect x="4" y="14" width="122" height="16" fill="#1e293b"/>
      <text x="8" y="26" fill="#38bdf8" font-size="7" font-weight="700">⚡ RACK Next</text>

      <!-- Rack vertical ajustado al ancho -->
      <rect x="8" y="34" width="114" height="116" rx="4" fill="#141c2e" stroke="#334155"/>
      <text x="14" y="46" fill="#ffffff" font-size="7" font-weight="700">Rack 101 (42U)</text>
      <rect x="12" y="52" width="106" height="14" rx="2" fill="#1e3a5f"/>
      <rect x="12" y="70" width="106" height="24" rx="2" fill="#1e3a5f"/>
      <rect x="12" y="98" width="106" height="18" rx="2" fill="#1e3a5f"/>

      <!-- Bottom Navigation Bar Táctil -->
      <rect x="0" y="156" width="130" height="34" fill="#111827"/>
      <text x="18" y="174" fill="#38bdf8" font-size="7" text-anchor="middle">Racks</text>
      <text x="48" y="174" fill="#94a3b8" font-size="7" text-anchor="middle">Topología</text>
      <text x="80" y="174" fill="#94a3b8" font-size="7" text-anchor="middle">Piso</text>
      <text x="110" y="174" fill="#94a3b8" font-size="7" text-anchor="middle">Datos</text>
      <rect x="48" y="184" width="34" height="2" rx="1" fill="#475569"/>
    </g>

    <!-- Características del Responsive Touch -->
    <g transform="translate(170, 52)">
      <text x="0" y="16" fill="#f59e0b" font-size="11" font-weight="700">1. Bottom Navigation Bar</text>
      <text x="0" y="32" fill="#94a3b8" font-size="9.5">
        Barra de navegación inferior fija para alternar con una sola mano entre Vistas y Tablas.
      </text>

      <text x="0" y="60" fill="#38bdf8" font-size="11" font-weight="700">2. Gestos Táctiles Optimizados</text>
      <text x="0" y="76" fill="#94a3b8" font-size="9.5">
        Soporte para <tspan fill="#ffffff" font-weight="600">Pinch-to-Zoom</tspan> en topología y deslizamiento lateral para abrir el catálogo.
      </text>

      <text x="0" y="104" fill="#10b981" font-size="11" font-weight="700">3. Auditoría en Terreno</text>
      <text x="0" y="120" fill="#94a3b8" font-size="9.5">
        Permite a ingenieros consultar IPs y números de serie directamente frente al rack real.
      </text>

      <rect x="0" y="145" width="240" height="24" rx="4" fill="#1e293b"/>
      <text x="10" y="161" fill="#38bdf8" font-size="8.5" class="mono">📱 Media Queries: 480px, 768px, 1024px</text>
    </g>
  </g>

  <!-- Panel Inferior: Beneficios y Cumplimiento -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="880" height="165" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="30" fill="#ffffff" font-size="13" font-weight="700">Impacto en la Operación Diaria del Data Center:</text>

    <g transform="translate(24, 48)">
      <text x="0" y="16" fill="#d97706" font-size="11" font-weight="700">Salud Visual en Guardias 24/7</text>
      <text x="0" y="34" fill="#94a3b8" font-size="9.5">
        El tema Sepia utiliza una temperatura de color cálida (~3000K) que minimiza la emisión de luz azul, ideal para turnos nocturnos de monitoreo en SOCs y NOCs.
      </text>
      <text x="0" y="65" fill="#38bdf8" font-size="11" font-weight="700">Flexibilidad Multi-Dispositivo</text>
      <text x="0" y="83" fill="#94a3b8" font-size="9.5">
        Los paneles laterales se repliegan automáticamente en pantallas pequeñas, otorgando el 100% del área de visualización al rack o nodo seleccionado.
      </text>
    </g>

    <g transform="translate(460, 48)">
      <text x="0" y="16" fill="#10b981" font-size="11" font-weight="700">Autonomía PWA en Tablets Offline</text>
      <text x="0" y="34" fill="#94a3b8" font-size="9.5">
        Combinado con el Service Worker, los técnicos pueden ingresar a pasillos de contención fría sin cobertura Wi-Fi y documentar cableado sin interrupciones.
      </text>
      <text x="0" y="65" fill="#f59e0b" font-size="11" font-weight="700">Compatibilidad CSS Nativa</text>
      <text x="0" y="83" fill="#94a3b8" font-size="9.5">
        Variables CSS puras (<tspan class="mono" fill="#d97706">[data-theme="sepia"]</tspan>) sin dependencias de frameworks ni retrasos en el cambio de tema.
      </text>
    </g>
  </g>
</svg>
