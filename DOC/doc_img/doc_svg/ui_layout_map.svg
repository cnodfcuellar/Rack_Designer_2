<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1100" height="820" viewBox="0 0 1100 820" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a" />
      <stop offset="100%" style="stop-color:#0a1520" />
    </linearGradient>
    <filter id="shadow" x="-0.0007" y="-0.0011" width="1.001" height="1.002">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.04" />
    </pattern>
    <style>
      .text-title { font-family: 'Segoe UI', sans-serif; font-size: 20px; fill: #f0f6ff; font-weight: 700; }
      .text-sub { font-family: 'Segoe UI', sans-serif; font-size: 9px; fill: #94a3b8; letter-spacing: 3px; font-weight: 600; }
      .text-panel { font-family: 'Segoe UI', sans-serif; font-size: 14px; fill: #00d4ff; font-weight: 600; letter-spacing: 1px; }
      .text-desc { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #94a3b8; }
      .panel { fill: #08101a; stroke: #1e3a5f; stroke-width: 1.5px; }
      .header-panel { fill: #0a121e; stroke: #1e3a5f; stroke-width: 1.5px; }
      .main-panel { fill: #060a14; stroke: #1e3a5f; stroke-width: 1.5px; }
      .section-box { fill: #0d1a2a; stroke: #1e3a5f; stroke-width: 1px; rx: 6px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="url(#bg)" />
  <rect width="1100" height="820" fill="url(#grid)" />

  <!-- Title Area -->
  <rect x="40" y="28" width="520" height="52" rx="6" fill="#0d1f30" stroke="#e2e8f0" stroke-width="0.8" stroke-opacity="0.4" />
  <line x1="40" y1="28" x2="40" y2="80" stroke="#e2e8f0" stroke-width="3" />
  <text x="60" y="49" class="text-sub">RACK DESIGNER 2  ·  UI LAYOUT</text>
  <text x="60" y="68" class="text-title">APPLICATION LAYOUT  ·  3-COLUMN ARCHITECTURE</text>

  <!-- App Chrome Container -->
  <rect x="40" y="108" width="1020" height="660" rx="12" fill="#060a14" stroke="#1e3a5f" stroke-width="1.5" filter="url(#shadow)" />

  <!-- HEADER (Spans all columns) -->
  <rect x="40" y="108" width="1020" height="60" class="header-panel" />
  <text x="70" y="142" class="text-panel">HEADER</text>
  <text x="140" y="142" class="text-desc">| Logo, Project Menu, Room/Rack Navigation, View Tabs</text>

  <!-- LEFT SIDEBAR -->
  <rect x="40" y="168" width="240" height="480" class="panel" />
  <text x="70" y="195" class="text-panel">LEFT SIDEBAR</text>
  <text x="70" y="215" class="text-desc">Equipment Catalog</text>
  <!-- Mock items in sidebar -->
  <rect x="60" y="230" width="200" height="40" class="section-box" />
  <rect x="60" y="280" width="200" height="40" class="section-box" />
  <rect x="60" y="330" width="200" height="40" class="section-box" />

  <!-- MAIN CANVAS -->
  <rect x="280" y="168" width="540" height="480" class="main-panel" />
  <text x="310" y="195" class="text-panel">MAIN CANVAS</text>
  <text x="310" y="215" class="text-desc">Interactive Workspace (Physical Racks or Network Topology)</text>
  <!-- Mock Rack -->
  <rect x="420" y="250" width="260" height="350" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4" rx="4" />
  <text x="550" y="420" text-anchor="middle" class="text-desc" style="fill:#00d4ff;">+ RACK</text>

  <!-- RIGHT PANEL -->
  <rect x="820" y="168" width="240" height="480" class="panel" />
  <!-- Outliner Section -->
  <rect x="820" y="168" width="240" height="300" fill="none" />
  <text x="840" y="195" class="text-panel">RIGHT PANEL</text>
  <text x="840" y="215" class="text-desc">Outliner (Tree View)</text>
  <!-- Mock Tree items -->
  <rect x="840" y="230" width="200" height="20" fill="#0d1a2a" rx="4" />
  <rect x="860" y="255" width="180" height="20" fill="#0d1a2a" rx="4" />
  <rect x="860" y="280" width="180" height="20" fill="#0d1a2a" rx="4" />
  
  <line x1="820" y1="468" x2="1060" y2="468" stroke="#1e3a5f" stroke-width="1.5" />
  
  <!-- Stats Section -->
  <rect x="820" y="468" width="240" height="180" fill="none" />
  <text x="840" y="495" class="text-panel" style="font-size:12px;">STATISTICS</text>
  <rect x="840" y="510" width="40" height="40" class="section-box" />
  <rect x="890" y="510" width="40" height="40" class="section-box" />
  <rect x="940" y="510" width="40" height="40" class="section-box" />
  <rect x="990" y="510" width="40" height="40" class="section-box" />

  <!-- BOTTOM PANEL -->
  <rect x="40" y="648" width="1020" height="120" class="panel" />
  <text x="70" y="675" class="text-panel">BOTTOM PANEL</text>
  <text x="70" y="695" class="text-desc">Inventory Tables / Connections Data (Collapsible)</text>
  <rect x="70" y="710" width="960" height="40" class="section-box" />

</svg>
