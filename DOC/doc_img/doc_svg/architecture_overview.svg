<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a"/>
      <stop offset="100%" style="stop-color:#0c1a2e"/>
    </linearGradient>
    <linearGradient id="layerA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="layerB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5a0"/>
      <stop offset="100%" style="stop-color:#00d4aa"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00d4ff" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowDark">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00f5a0"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Title Block -->
  <rect x="40" y="28" width="520" height="56" rx="6" fill="#0d2137" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="40" y1="28" x2="40" y2="84" stroke="#00d4ff" stroke-width="3"/>
  <text x="60" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#00d4ff" letter-spacing="3" font-weight="600">RACK DESIGNER 2</text>
  <text x="60" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" fill="#f0f6ff" font-weight="700" letter-spacing="0.5">ARCHITECTURE OVERVIEW</text>

  <!-- Badge -->
  <rect x="1080" y="36" width="82" height="22" rx="11" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="1121" y="51" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00d4ff" font-weight="600" letter-spacing="1">v2.0</text>

  <!-- ==================== LAYER 1: DATA ==================== -->
  <rect x="60" y="130" width="1080" height="160" rx="12" fill="url(#layerA)" filter="url(#shadowDark)"/>
  <rect x="60" y="130" width="1080" height="160" rx="12" fill="none" stroke="#0f6ea0" stroke-width="1"/>
  <rect x="60" y="130" width="6" height="160" rx="3" fill="url(#accentBlue)"/>

  <!-- Layer label -->
  <text x="90" y="152" font-family="'Segoe UI', sans-serif" font-size="9" fill="#00d4ff" letter-spacing="3" font-weight="700">DATA LAYER</text>
  <line x1="90" y1="157" x2="350" y2="157" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Card: Models -->
  <rect x="90" y="168" width="220" height="100" rx="8" fill="#081a2f" stroke="#1e5f87" stroke-width="1" filter="url(#shadow)"/>
  <rect x="90" y="168" width="220" height="4" rx="2" fill="url(#accentBlue)"/>
  <text x="200" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#7dd3fc" font-weight="700" letter-spacing="1">MODELS</text>
  <text x="200" y="210" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#e2e8f0">Rack.js</text>
  <text x="200" y="228" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#e2e8f0">Device.js</text>
  <text x="200" y="246" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#e2e8f0">Cable.js</text>

  <!-- Card: Store -->
  <rect x="490" y="168" width="220" height="100" rx="8" fill="#0a1f10" stroke="#1e6b3a" stroke-width="1" filter="url(#shadow)"/>
  <rect x="490" y="168" width="220" height="4" rx="2" fill="url(#accentGreen)"/>
  <text x="600" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#86efac" font-weight="700" letter-spacing="1">REACTIVE STATE</text>
  <text x="600" y="210" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#e2e8f0">store.js (ES6 Proxy)</text>
  <text x="600" y="230" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">WeakMap Cache</text>
  <text x="600" y="250" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">Auto-persist → localStorage</text>

  <!-- Card: File System -->
  <rect x="880" y="168" width="220" height="100" rx="8" fill="#1a0a2e" stroke="#6b3ab8" stroke-width="1" filter="url(#shadow)"/>
  <rect x="880" y="168" width="220" height="4" rx="2" fill="url(#accentPurple)"/>
  <text x="990" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c4b5fd" font-weight="700" letter-spacing="1">PERSISTENCE</text>
  <text x="990" y="210" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#e2e8f0">localStorage</text>
  <text x="990" y="230" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">FileSystem Access API</text>
  <text x="990" y="250" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">JSON Project Files</text>

  <!-- ==================== LAYER 2: LOGIC ==================== -->
  <rect x="60" y="320" width="1080" height="170" rx="12" fill="url(#layerB)" filter="url(#shadowDark)"/>
  <rect x="60" y="320" width="1080" height="170" rx="12" fill="none" stroke="#5a4a8a" stroke-width="1"/>
  <rect x="60" y="320" width="6" height="170" rx="3" fill="url(#accentPurple)"/>
  <text x="90" y="342" font-family="'Segoe UI', sans-serif" font-size="9" fill="#a855f7" letter-spacing="3" font-weight="700">LOGIC LAYER  ·  CONTROLLERS</text>
  <line x1="90" y1="347" x2="400" y2="347" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.4"/>

  <rect x="90" y="358" width="180" height="110" rx="8" fill="#0d0a1f" stroke="#3d2d7a" stroke-width="1" filter="url(#shadow)"/>
  <rect x="90" y="358" width="180" height="4" rx="2" fill="url(#accentPurple)"/>
  <text x="180" y="378" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c4b5fd" font-weight="700" letter-spacing="1">ORCHESTRATOR</text>
  <text x="180" y="398" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#e2e8f0">main.js</text>
  <text x="180" y="418" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Init · Bind Events</text>
  <text x="180" y="436" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Performance Mode</text>

  <rect x="310" y="358" width="180" height="110" rx="8" fill="#0d0a1f" stroke="#3d2d7a" stroke-width="1" filter="url(#shadow)"/>
  <rect x="310" y="358" width="180" height="4" rx="2" fill="url(#accentPurple)"/>
  <text x="400" y="378" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c4b5fd" font-weight="700" letter-spacing="1">AUTH / RBAC</text>
  <text x="400" y="398" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#e2e8f0">roles.js</text>
  <text x="400" y="418" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">SHA-256 Crypto</text>
  <text x="400" y="436" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Admin / Editor / Viewer</text>

  <rect x="530" y="358" width="180" height="110" rx="8" fill="#0d0a1f" stroke="#3d2d7a" stroke-width="1" filter="url(#shadow)"/>
  <rect x="530" y="358" width="180" height="4" rx="2" fill="url(#accentPurple)"/>
  <text x="620" y="378" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c4b5fd" font-weight="700" letter-spacing="1">EXPORT ENGINE</text>
  <text x="620" y="398" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#e2e8f0">core/export.js</text>
  <text x="620" y="418" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Excel / CSV / PNG</text>

  <rect x="750" y="358" width="180" height="110" rx="8" fill="#0d0a1f" stroke="#3d2d7a" stroke-width="1" filter="url(#shadow)"/>
  <rect x="750" y="358" width="180" height="4" rx="2" fill="url(#accentPurple)"/>
  <text x="840" y="378" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c4b5fd" font-weight="700" letter-spacing="1">MODALS</text>
  <text x="840" y="398" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#e2e8f0">ui/modals/</text>
  <text x="840" y="418" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Device · Cable · Rack</text>

  <rect x="970" y="358" width="140" height="110" rx="8" fill="#0d0a1f" stroke="#3d2d7a" stroke-width="1" filter="url(#shadow)"/>
  <rect x="970" y="358" width="140" height="4" rx="2" fill="url(#accentPurple)"/>
  <text x="1040" y="378" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c4b5fd" font-weight="700" letter-spacing="1">API LAYER</text>
  <text x="1040" y="398" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" fill="#e2e8f0">apiClient.js</text>
  <text x="1040" y="418" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Future Backend</text>

  <!-- ==================== LAYER 3: PRESENTATION ==================== -->
  <rect x="60" y="520" width="1080" height="220" rx="12" fill="#0a0a14" stroke="#1e3a4a" stroke-width="1" filter="url(#shadowDark)"/>
  <rect x="60" y="520" width="6" height="220" rx="3" fill="url(#accentGreen)"/>
  <text x="90" y="542" font-family="'Segoe UI', sans-serif" font-size="9" fill="#00f5a0" letter-spacing="3" font-weight="700">PRESENTATION LAYER  ·  UI RENDERING</text>
  <line x1="90" y1="547" x2="450" y2="547" stroke="#00f5a0" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- UI Cards row -->
  <rect x="90" y="558" width="175" height="155" rx="8" fill="#061510" stroke="#0d4a30" stroke-width="1" filter="url(#shadow)"/>
  <rect x="90" y="558" width="175" height="4" rx="2" fill="url(#accentGreen)"/>
  <text x="177" y="578" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac" font-weight="700" letter-spacing="1">RACK RENDERER</text>
  <text x="177" y="600" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#e2e8f0">ui/rack.js</text>
  <text x="177" y="620" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">SVG Faceplates</text>
  <text x="177" y="638" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">U-Slot Engine</text>
  <text x="177" y="656" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">CSS Fallback</text>
  <text x="177" y="696" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#4ade80" font-weight="600">DOM-based</text>

  <rect x="300" y="558" width="175" height="155" rx="8" fill="#061510" stroke="#0d4a30" stroke-width="1" filter="url(#shadow)"/>
  <rect x="300" y="558" width="175" height="4" rx="2" fill="url(#accentGreen)"/>
  <text x="387" y="578" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac" font-weight="700" letter-spacing="1">TOPOLOGY MAP</text>
  <text x="387" y="600" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#e2e8f0">ui/topology/</text>
  <text x="387" y="620" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Canvas 2D · 60fps</text>
  <text x="387" y="638" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">MVC (State/Render)</text>
  <text x="387" y="656" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Particle Cables</text>
  <text x="387" y="696" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#4ade80" font-weight="600">Canvas-based</text>

  <rect x="510" y="558" width="175" height="155" rx="8" fill="#061510" stroke="#0d4a30" stroke-width="1" filter="url(#shadow)"/>
  <rect x="510" y="558" width="175" height="4" rx="2" fill="url(#accentGreen)"/>
  <text x="597" y="578" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac" font-weight="700" letter-spacing="1">CATALOG</text>
  <text x="597" y="600" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#e2e8f0">ui/catalog.js</text>
  <text x="597" y="620" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Drag &amp; Drop</text>
  <text x="597" y="638" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Category Filters</text>
  <text x="597" y="656" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Icon Gallery</text>
  <text x="597" y="696" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#4ade80" font-weight="600">Interactive</text>

  <rect x="720" y="558" width="175" height="155" rx="8" fill="#061510" stroke="#0d4a30" stroke-width="1" filter="url(#shadow)"/>
  <rect x="720" y="558" width="175" height="4" rx="2" fill="url(#accentGreen)"/>
  <text x="807" y="578" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac" font-weight="700" letter-spacing="1">TABLES</text>
  <text x="807" y="600" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#e2e8f0">ui/tables.js</text>
  <text x="807" y="620" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Live Inventory</text>
  <text x="807" y="638" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Inline Editing</text>
  <text x="807" y="656" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">XSS Protection</text>
  <text x="807" y="696" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#4ade80" font-weight="600">Reactive</text>

  <rect x="930" y="558" width="175" height="155" rx="8" fill="#061510" stroke="#0d4a30" stroke-width="1" filter="url(#shadow)"/>
  <rect x="930" y="558" width="175" height="4" rx="2" fill="url(#accentGreen)"/>
  <text x="1017" y="578" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac" font-weight="700" letter-spacing="1">FILE MANAGER</text>
  <text x="1017" y="600" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#e2e8f0">ui/fileManager.js</text>
  <text x="1017" y="620" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">showOpenFilePicker</text>
  <text x="1017" y="638" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Auto-Save Handle</text>
  <text x="1017" y="656" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Blob Fallback</text>
  <text x="1017" y="696" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#4ade80" font-weight="600">Native FS API</text>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- Data → Logic -->
  <path d="M 200 268 L 200 310 L 400 310 L 400 358" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <path d="M 600 268 L 600 310 L 600 358" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <path d="M 990 268 L 990 310 L 840 310 L 840 358" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>

  <!-- Logic → Presentation -->
  <path d="M 180 468 L 180 510 L 177 558" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
  <path d="M 620 468 L 620 510 L 387 558" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
  <path d="M 840 468 L 840 510 L 807 558" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>

  <!-- Store event bus indicator -->
  <line x1="490" y1="218" x2="310" y2="218" stroke="#00f5a0" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.6"/>
  <circle cx="490" cy="218" r="3" fill="#00f5a0"/>
  <circle cx="310" cy="218" r="3" fill="#00f5a0"/>
  <text x="400" y="213" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#00f5a0" font-weight="600">store-updated event</text>

  <!-- Footer -->
  <line x1="60" y1="772" x2="1140" y2="772" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.1"/>
  <text x="68" y="789" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">RACK Designer 2  ·  Architecture Documentation</text>
  <text x="1132" y="789" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">doc_img/doc_svg/architecture_overview.svg</text>
</svg>
