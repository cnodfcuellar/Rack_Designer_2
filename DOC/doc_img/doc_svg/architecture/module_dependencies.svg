<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="bgMod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d1a"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <filter id="shadowMod">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <pattern id="gridMod" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="920" fill="url(#bgMod)"/>
  <rect width="1200" height="920" fill="url(#gridMod)"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect width="560" height="54" rx="6" fill="#0d1f30" stroke="#a855f7" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="0" y2="54" stroke="#a855f7" stroke-width="3"/>
    <text x="20" y="22" font-size="9" fill="#a855f7" letter-spacing="3" font-weight="700" class="mono">RACK DESIGNER NEXT · ARQUITECTURA MODULAR</text>
    <text x="20" y="42" font-size="18" fill="#f0f6ff" font-weight="700">MAPA COMPLETO DE DEPENDENCIAS DE MÓDULOS (44 SCRIPTS)</text>
  </g>

  <!-- NODO CENTRAL: main.js (ORQUESTADOR) -->
  <g transform="translate(600, 420)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="65" fill="#0a0a18" stroke="#a855f7" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="62" fill="#151c2e" fill-opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" font-size="10" fill="#c4b5fd" font-weight="700" letter-spacing="1">ORCHESTRATOR</text>
    <text x="0" y="12" text-anchor="middle" font-size="15" fill="#f0f6ff" font-weight="700" class="mono">main.js</text>
    <text x="0" y="28" text-anchor="middle" font-size="8.5" fill="#94a3b8" class="mono">60 FPS rAF Coalescence</text>
  </g>

  <!-- ================= NUCLEO Y ESTADO (Arriba a la Izquierda) ================= -->
  <!-- store.js -->
  <line x1="540" y1="380" x2="300" y2="240" stroke="#00d4ff" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <g transform="translate(260, 210)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="48" fill="#050e1a" stroke="#00d4ff" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" font-size="12" fill="#7dd3fc" font-weight="700" class="mono">store.js</text>
    <text x="0" y="12" text-anchor="middle" font-size="8.5" fill="#94a3b8">Proxy ES6</text>
    <text x="0" y="24" text-anchor="middle" font-size="7.5" fill="#38bdf8" class="mono">N=15 History</text>
  </g>

  <!-- utils.js (fastClone) -->
  <line x1="570" y1="360" x2="440" y2="180" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <g transform="translate(420, 150)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="44" fill="#050e1a" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11.5" fill="#7dd3fc" font-weight="700" class="mono">utils.js</text>
    <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94a3b8">fastClone (M-03)</text>
    <text x="0" y="24" text-anchor="middle" font-size="7.5" fill="#38bdf8" class="mono">notify / helpers</text>
  </g>

  <!-- demoData.js -->
  <line x1="600" y1="355" x2="600" y2="175" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <g transform="translate(600, 140)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="44" fill="#08081a" stroke="#6366f1" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" fill="#a5b4fc" font-weight="700" class="mono">demoData.js</text>
    <text x="0" y="10" text-anchor="middle" font-size="7.5" fill="#94a3b8">TIA-942</text>
    <text x="0" y="22" text-anchor="middle" font-size="7.5" fill="#34d399" class="mono">Campus UTN</text>
  </g>

  <!-- ================= SEGURIDAD Y CRIPTO (Izquierda) ================= -->
  <!-- crypto.js (AES-GCM M-01) -->
  <line x1="535" y1="410" x2="220" y2="340" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <g transform="translate(170, 330)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="44" fill="#140d05" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" fill="#fbbf24" font-weight="700" class="mono">crypto.js</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">RackCrypto</text>
    <text x="0" y="22" text-anchor="middle" font-size="7.5" fill="#facc15" class="mono">AES-GCM (M-01)</text>
  </g>

  <!-- roles.js (RBAC SHA-256) -->
  <line x1="535" y1="430" x2="200" y2="460" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <g transform="translate(150, 470)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="44" fill="#140508" stroke="#f43f5e" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" fill="#fca5a5" font-weight="700" class="mono">roles.js</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">RackAuth (RBAC)</text>
    <text x="0" y="22" text-anchor="middle" font-size="7.5" fill="#f87171" class="mono">SHA-256 Fallback</text>
  </g>

  <!-- ================= RENDERIZADO FISICO Y UI (Abajo a la Izquierda) ================= -->
  <!-- rack.js (renderSingleRack M-04) -->
  <line x1="550" y1="475" x2="280" y2="600" stroke="#10b981" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <g transform="translate(240, 620)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="48" fill="#05120a" stroke="#10b981" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" font-size="12" fill="#6ee7b7" font-weight="700" class="mono">rack.js</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">renderSingleRack</text>
    <text x="0" y="22" text-anchor="middle" font-size="7.5" fill="#34d399" class="mono">O(1) Granular M-04</text>
  </g>

  <!-- faceplates.js -->
  <line x1="565" y1="480" x2="400" y2="680" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <g transform="translate(380, 710)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="42" fill="#05120a" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="10.5" fill="#6ee7b7" font-weight="700" class="mono">faceplates.js</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">SVG Fallbacks</text>
  </g>

  <!-- catalog.js -->
  <line x1="590" y1="485" x2="520" y2="720" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <g transform="translate(510, 750)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="42" fill="#05120a" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" fill="#6ee7b7" font-weight="700" class="mono">catalog.js</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">DnD · Search</text>
  </g>

  <!-- ================= TABLAS Y PANELES DERECHOS (Abajo / Derecha) ================= -->
  <!-- tables.js -->
  <line x1="620" y1="485" x2="670" y2="720" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <g transform="translate(680, 750)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="44" fill="#050e1a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="11" fill="#93c5fd" font-weight="700" class="mono">tables.js</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#94a3b8">Col Selector (P3)</text>
    <text x="0" y="22" text-anchor="middle" font-size="7.5" fill="#38bdf8" class="mono">Swap ⇄ Canaleta M-41</text>
  </g>

  <!-- outliner.js & inspector.js -->
  <line x1="645" y1="475" x2="810" y2="680" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <g transform="translate(830, 710)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="46" fill="#050e1a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="-10" text-anchor="middle" font-size="10" fill="#93c5fd" font-weight="700" class="mono">outliner.js</text>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#93c5fd" font-weight="700" class="mono">inspector.js</text>
    <text x="0" y="18" text-anchor="middle" font-size="7.5" fill="#94a3b8">Sort M-38 · Form M-36</text>
  </g>

  <!-- ================= MOTOR DE TOPOLOGIA (ui/topology/) ================= -->
  <line x1="665" y1="410" x2="940" y2="340" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <g transform="translate(990, 310)" filter="url(#shadowMod)">
    <rect x="-85" y="-55" width="170" height="110" rx="10" fill="#05141c" stroke="#06b6d4" stroke-width="1.8"/>
    <text x="0" y="-35" text-anchor="middle" font-size="11" fill="#22d3ee" font-weight="700" class="mono">ui/topology/ (6)</text>
    <text x="0" y="-18" text-anchor="middle" font-size="8.5" fill="#f0f6ff" class="mono">TopologySkins.js (M-28)</text>
    <text x="0" y="-3" text-anchor="middle" font-size="8.5" fill="#94a3b8" class="mono">TopologyState.js (M-40)</text>
    <text x="0" y="12" text-anchor="middle" font-size="8.5" fill="#94a3b8" class="mono">TopologyLayout.js</text>
    <text x="0" y="27" text-anchor="middle" font-size="8.5" fill="#94a3b8" class="mono">TopologyRenderer.js</text>
    <text x="0" y="42" text-anchor="middle" font-size="8" fill="#38bdf8" class="mono">Events.js · Orchestrator.js</text>
  </g>

  <!-- ================= MODALES (ui/modals/) ================= -->
  <line x1="650" y1="440" x2="940" y2="520" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <g transform="translate(990, 550)" filter="url(#shadowMod)">
    <rect x="-85" y="-50" width="170" height="100" rx="10" fill="#14061a" stroke="#c084fc" stroke-width="1.8"/>
    <text x="0" y="-30" text-anchor="middle" font-size="11" fill="#e9d5ff" font-weight="700" class="mono">ui/modals/ (8)</text>
    <text x="0" y="-14" text-anchor="middle" font-size="8.5" fill="#34d399" class="mono">ImportModal.js (M-22)</text>
    <text x="0" y="0" text-anchor="middle" font-size="8.5" fill="#94a3b8" class="mono">ExportModal.js</text>
    <text x="0" y="15" text-anchor="middle" font-size="8.5" fill="#94a3b8" class="mono">PlacementModal.js</text>
    <text x="0" y="30" text-anchor="middle" font-size="8" fill="#c084fc" class="mono">Rack · Device · Cable · Room</text>
  </g>

  <!-- fileManager.js -->
  <line x1="660" y1="380" x2="920" y2="180" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <g transform="translate(960, 150)" filter="url(#shadowMod)">
    <circle cx="0" cy="0" r="44" fill="#141405" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="0" y="-6" text-anchor="middle" font-size="10.5" fill="#fde68a" font-weight="700" class="mono">fileManager</text>
    <text x="0" y="8" text-anchor="middle" font-size="8" fill="#94a3b8">FS Access API</text>
    <text x="0" y="20" text-anchor="middle" font-size="7.5" fill="#fbbf24" class="mono">SheetJS XLSX</text>
  </g>

  <!-- LEYENDA INFERIOR -->
  <g transform="translate(40, 835)">
    <rect width="1120" height="50" rx="8" fill="#0d1520" stroke="#25304b" stroke-width="1"/>
    <text x="24" y="24" font-size="10" fill="#94a3b8" font-weight="700">ARQUITECTURA DE CARGA SÍNCRONA EN ÁRBOL GLOBAL:</text>
    <text x="24" y="38" font-size="9" fill="#64748b" class="mono">32 Scripts en index.html sin módulos ES6 en navegador · main.js inicializa al final · Bus de eventos 'change' reactivo · Cero acoplamiento cruzado circular</text>
  </g>

</svg>