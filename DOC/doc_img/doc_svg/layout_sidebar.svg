<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <rect width="360" height="780" fill="#0b0f19" rx="8"/>
  <text x="180" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Sidebar Layout — #sidebar (240px width)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- SIDEBAR -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="10" y="30" width="240" height="740" fill="#151c2e" stroke="#25304b" stroke-width="1"/>

  <!-- A. sb-actions (action buttons) -->
  <rect x="10" y="30" width="240" height="52" fill="#151c2e" stroke="#25304b" stroke-width="0" stroke-dasharray="0"/>
  <line x1="10" y1="82" x2="250" y2="82" stroke="#25304b" stroke-width="1"/>

  <!-- + Rack button -->
  <rect x="24" y="42" width="106" height="24" rx="6" fill="#0ea5e933" stroke="#0ea5e9" stroke-width="1"/>
  <text x="77" y="58" text-anchor="middle" fill="#0ea5e9" font-size="11" font-weight="600">+ Rack</text>

  <!-- + Equipo button -->
  <rect x="136" y="42" width="106" height="24" rx="6" fill="transparent" stroke="#25304b" stroke-width="1"/>
  <text x="189" y="58" text-anchor="middle" fill="#8b9ab8" font-size="11">+ Equipo</text>

  <!-- B. sb-search -->
