  <text x="278" y="258" fill="#475569" font-size="7" opacity="0.4">⋮⋮</text>
  <text x="278" y="312" fill="#475569" font-size="7" opacity="0.4">⋮⋮</text>
  <text x="278" y="366" fill="#475569" font-size="7" opacity="0.4">⋮⋮</text>
  <text x="278" y="420" fill="#475569" font-size="7" opacity="0.4">⋮⋮</text>
  <text x="278" y="474" fill="#475569" font-size="7" opacity="0.4">⋮⋮</text>
  <text x="278" y="528" fill="#475569" font-size="7" opacity="0.4">⋮⋮</text>
  <text x="278" y="582" fill="#475569" font-size="7" opacity="0.4">⋮⋮</text>
  <text x="278" y="636" fill="#475569" font-size="7" opacity="0.4">⋮⋮</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- ANNOTATIONS -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Width dimension -->
  <line x1="10" y1="680" x2="250" y2="680" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="150" y="692" text-anchor="middle" fill="#475569" font-size="9" class="mono">240px (var(--sidebar-w))</text>

  <!-- Section labels -->
  <line x1="296" y1="30" x2="310" y2="30" stroke="#475569" stroke-width="0.5"/>
  <text x="314" y="34" fill="#475569" font-size="8" class="mono">sb-actions</text>
  <line x1="296" y1="82" x2="310" y2="82" stroke="#475569" stroke-width="0.5"/>
  <text x="314" y="86" fill="#475569" font-size="8" class="mono">sb-search</text>
  <line x1="296" y1="126" x2="310" y2="126" stroke="#475569" stroke-width="0.5"/>
  <text x="314" y="130" fill="#475569" font-size="8" class="mono">sb-filter-tabs</text>
  <line x1="296" y1="166" x2="310" y2="166" stroke="#475569" stroke-width="0.5"/>
  <text x="314" y="170" fill="#475569" font-size="8" class="mono">.catalog (flex:1, overflow-y:auto)</text>

  <!-- Height annotations -->
  <line x1="300" y1="30" x2="300" y2="82" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="306" y="60" fill="#475569" font-size="7" class="mono" transform="rotate(90 306 60)">52px</text>

  <line x1="300" y1="82" x2="300" y2="126" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="306" y="108" fill="#475569" font-size="7" class="mono" transform="rotate(90 306 108)">44px</text>

  <line x1="300" y1="126" x2="300" y2="166" stroke="#475569" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="306" y="148" fill="#475569" font-size="7" class="mono" transform="rotate(90 306 148)">40px</text>

  <!-- CSS variables legend -->
  <rect x="10" y="700" width="240" height="22" rx="4" fill="#1e293b" opacity="0.5"/>
  <text x="20" y="715" fill="#475569" font-size="8" font-weight="600">VARS:</text>
  <text x="60" y="715" fill="#64748b" font-size="8" class="mono">--sidebar-w: 240px</text>
  <text x="190" y="715" fill="#64748b" font-size="8" class="mono">gap: 6px</text>

  <!-- Layout note -->
  <rect x="10" y="726" width="240" height="22" rx="4" fill="#1e293b" opacity="0.5"/>
  <text x="20" y="741" fill="#64748b" font-size="8" class="mono">display: flex; flex-direction: column; overflow: hidden</text>

</svg>