<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .glow-cyan { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.7)); }
      .glow-green { filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.8)); }
      .glow-red { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8)); }
    </style>

    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1e293b" opacity="0.6"/>
    </pattern>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="card-rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151e32"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="960" height="560" fill="url(#bg-grad)" rx="12"/>
  <rect width="960" height="560" fill="url(#grid-dots)" rx="12"/>
  <rect width="960" height="560" fill="none" stroke="#1e293b" stroke-width="1.5" rx="12"/>

  <!-- Cabecera -->
  <rect x="24" y="20" width="912" height="54" rx="8" fill="url(#header-grad)" stroke="#334155" stroke-width="1"/>
  <rect x="36" y="28" width="6" height="38" rx="3" fill="#38bdf8"/>
  <text x="52" y="44" fill="#f8fafc" font-size="16" font-weight="700">PROPUESTA 1: CONEXIÓN INTERACTIVA DIRECTA EN VISTA FÍSICA (DRAG-TO-CONNECT)</text>
  <text x="52" y="61" fill="#94a3b8" font-size="11.5">Conexión táctil arrastrando latiguillos entre puertos con snap magnético y validación cromática en tiempo real</text>
  
  <rect x="790" y="32" width="134" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="857" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">⚡ ALTA USABILIDAD</text>

  <!-- Contenedor Rack 101 (Origen) -->
  <g transform="translate(60, 100)">
    <rect width="250" height="420" rx="8" fill="url(#card-rack)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="36" rx="8" fill="#1e293b"/>
    <rect x="12" y="10" width="10" height="10" rx="2" fill="#38bdf8"/>
    <text x="30" y="23" fill="#ffffff" font-size="12" font-weight="700">Rack 101 · Borde &amp; Core</text>

    <!-- Slots -->
    <rect x="16" y="50" width="218" height="28" rx="3" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="68" fill="#64748b" font-size="9" class="mono">42U · Router BGP</text>

    <!-- Switch Core Activo (Origen) -->
    <rect x="16" y="86" width="218" height="32" rx="3" fill="#111c30" stroke="#38bdf8" stroke-width="1.5" class="glow-cyan"/>
    <text x="24" y="104" fill="#ffffff" font-size="10" font-weight="700">Switch Core Nexus 10G</text>
    <text x="24" y="114" fill="#38bdf8" font-size="7.5" class="mono">10.10.10.2 · U40</text>
    
    <!-- Puertos Switch -->
    <g transform="translate(140, 94)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#0f172a" stroke="#475569"/>
      <rect x="16" y="0" width="12" height="12" rx="2" fill="#0f172a" stroke="#475569"/>
      <rect x="32" y="0" width="12" height="12" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="38" cy="6" r="3" fill="#38bdf8" class="glow-cyan"/>
      <text x="38" y="20" fill="#38bdf8" font-size="7" font-weight="700" text-anchor="middle">Eth-4</text>
      <rect x="48" y="0" width="12" height="12" rx="2" fill="#0f172a" stroke="#475569"/>
      <rect x="64" y="0" width="12" height="12" rx="2" fill="#0f172a" stroke="#475569"/>
    </g>

    <!-- Otros Slots Vacíos -->
    <rect x="16" y="126" width="218" height="28" rx="3" fill="#090d16" stroke="#1e293b"/>
    <rect x="16" y="160" width="218" height="56" rx="3" fill="#090d16" stroke="#1e293b"/>
    <rect x="16" y="222" width="218" height="84" rx="3" fill="#090d16" stroke="#1e293b"/>
    <rect x="16" y="312" width="218" height="84" rx="3" fill="#090d16" stroke="#1e293b"/>
  </g>

  <!-- Contenedor Rack 102 (Destino) -->
  <g transform="translate(650, 100)">
    <rect width="250" height="420" rx="8" fill="url(#card-rack)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="36" rx="8" fill="#1e293b"/>
    <rect x="12" y="10" width="10" height="10" rx="2" fill="#10b981"/>
    <text x="30" y="23" fill="#ffffff" font-size="12" font-weight="700">Rack 102 · Cómputo</text>

    <!-- Servidor Destino -->
    <rect x="16" y="50" width="218" height="48" rx="3" fill="#111c30" stroke="#10b981" stroke-width="1.5" class="glow-green"/>
    <text x="24" y="72" fill="#ffffff" font-size="10" font-weight="700">Servidor Web Frontend 2U</text>
    <text x="24" y="86" fill="#10b981" font-size="8" class="mono">10.10.30.10 · U38</text>

    <!-- Puertos Servidor -->
    <g transform="translate(150, 66)">
      <!-- Puerto Ocupado (Rojo) -->
      <rect x="0" y="0" width="14" height="14" rx="2" fill="#ef4444" stroke="#f87171" opacity="0.85"/>
      <circle cx="7" cy="7" r="2.5" fill="#ffffff"/>
      <text x="7" y="24" fill="#ef4444" font-size="7" font-weight="700" text-anchor="middle">Eth-1 (X)</text>

      <!-- Puerto Objetivo Snap (Verde Glow) -->
      <rect x="24" y="0" width="16" height="16" rx="3" fill="#052e16" stroke="#10b981" stroke-width="2" class="glow-green"/>
      <circle cx="32" cy="8" r="4" fill="#10b981" class="glow-green"/>
      <text x="32" y="26" fill="#10b981" font-size="8" font-weight="800" text-anchor="middle">Eth-2 (✓)</text>
    </g>

    <rect x="16" y="106" width="218" height="48" rx="3" fill="#090d16" stroke="#1e293b"/>
    <rect x="16" y="160" width="218" height="48" rx="3" fill="#090d16" stroke="#1e293b"/>
    <rect x="16" y="214" width="218" height="96" rx="3" fill="#090d16" stroke="#1e293b"/>
    <rect x="16" y="316" width="218" height="84" rx="3" fill="#090d16" stroke="#1e293b"/>
  </g>

  <!-- Curva del Cable Arrastrado (Bézier elástica interactiva) -->
  <path d="M 238 200 C 350 140, 480 90, 650 120 C 720 135, 780 150, 832 174" 
        stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none" class="glow-cyan"/>
  <path d="M 238 200 C 350 140, 480 90, 650 120 C 720 135, 780 150, 832 174" 
        stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4" fill="none"/>

  <!-- Cursor con feedback de atracción magnética -->
  <g transform="translate(832, 174)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="6" fill="#10b981" class="glow-green"/>
    <!-- Icono Cursor / Puntero -->
    <path d="M 4 4 L 14 18 L 9 18 L 6 24 L 2 22 L 5 16 L 0 16 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  </g>

  <!-- Tooltip Flotante de Conexión en Vuelo -->
  <g transform="translate(420, 190)">
    <rect width="210" height="74" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.6))"/>
    <circle cx="20" cy="24" r="5" fill="#10b981"/>
    <text x="32" y="28" fill="#ffffff" font-size="11" font-weight="700">Atracción Magnética (Snap)</text>
    <text x="20" y="46" fill="#94a3b8" font-size="9.5">Origen: <tspan fill="#38bdf8" font-weight="600">Switch Core · Eth-4</tspan></text>
    <text x="20" y="60" fill="#94a3b8" font-size="9.5">Destino: <tspan fill="#10b981" font-weight="600">Web Frontend · Eth-2 (Libre)</tspan></text>
  </g>

  <!-- Panel Comparativo Inferior -->
  <g transform="translate(340, 310)">
    <rect width="280" height="200" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="280" height="30" rx="8" fill="#111827"/>
    <text x="14" y="20" fill="#e2e8f0" font-size="11" font-weight="700">CARACTERÍSTICAS DEL FLUJO</text>

    <text x="16" y="55" fill="#38bdf8" font-size="10" font-weight="700">1. Clic y arrastre directo:</text>
    <text x="16" y="70" fill="#94a3b8" font-size="9">Inicia el latiguillo desde cualquier puerto del rack.</text>

    <text x="16" y="95" fill="#10b981" font-size="10" font-weight="700">2. Snap magnético inteligente:</text>
    <text x="16" y="110" fill="#94a3b8" font-size="9">Se imanta al conector libre más cercano al soltar.</text>

    <text x="16" y="135" fill="#ef4444" font-size="10" font-weight="700">3. Bloqueo de colisión en vivo:</text>
    <text x="16" y="150" fill="#94a3b8" font-size="9">Puertos ocupados se iluminan en rojo (no elegibles).</text>

    <text x="16" y="175" fill="#f59e0b" font-size="10" font-weight="700">4. Menú rápido flotante (Popover):</text>
    <text x="16" y="190" fill="#94a3b8" font-size="9">Permite cambiar color o tipo (Fibra/Cat6) al instante.</text>
  </g>
</svg>
