<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; }
      .title { font-weight: 800; fill: #38bdf8; font-size: 24px; }
      .desc { font-weight: 400; fill: #94a3b8; font-size: 14px; }
      .badge { fill: #f59e0b; font-weight: 800; font-size: 20px; text-anchor: middle; }
      .panel-label { font-weight: 700; fill: #f0f4ff; font-size: 16px; }
      .panel-sub { font-weight: 400; fill: #94a3b8; font-size: 12px; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="850" fill="#0b0f19" rx="16"/>

  <!-- Title -->
  <text x="40" y="50" class="title">MAPA DE LA INTERFAZ PRINCIPAL</text>
  <text x="40" y="75" class="desc">Conoce las 5 áreas clave de RACK Designer Next</text>

  <!-- APP WINDOW MOCKUP -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <!-- Main Window Background -->
    <rect width="1120" height="600" rx="8" fill="#151c2e" stroke="#2e3d5a" stroke-width="2"/>
    
    <!-- 1. HEADER -->
    <rect x="0" y="0" width="1120" height="60" fill="#0f172a" rx="8" stroke="#2e3d5a" stroke-width="1"/>
    <circle cx="560" cy="30" r="16" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="560" y="37" class="badge" fill="#000">1</text>
    <text x="40" y="35" class="panel-label">BARRA SUPERIOR (Roles, Guardar, Exportar)</text>

    <!-- 2. LEFT SIDEBAR (CATALOG) -->
    <rect x="0" y="60" width="250" height="380" fill="#0f172a" stroke="#2e3d5a" stroke-width="1"/>
    <circle cx="125" cy="230" r="16" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="125" y="237" class="badge" fill="#000">2</text>
    <text x="125" y="270" text-anchor="middle" class="panel-label">CATÁLOGO</text>
    <text x="125" y="290" text-anchor="middle" class="panel-sub">Arrastra equipos desde aquí</text>

    <!-- 3. MAIN WORKSPACE -->
    <rect x="250" y="60" width="620" height="380" fill="#1e293b" stroke="#2e3d5a" stroke-width="1"/>
    <circle cx="560" cy="250" r="16" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="560" y="257" class="badge" fill="#000">3</text>
    <text x="560" y="290" text-anchor="middle" class="panel-label">ÁREA DE TRABAJO (LIENZO)</text>
    <text x="560" y="310" text-anchor="middle" class="panel-sub">Vista Física de Racks y Topología de Salas</text>

    <!-- 4. RIGHT SIDEBAR (INSPECTOR) -->
    <rect x="870" y="60" width="250" height="380" fill="#0f172a" stroke="#2e3d5a" stroke-width="1"/>
    <circle cx="995" cy="230" r="16" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="995" y="237" class="badge" fill="#000">4</text>
    <text x="995" y="270" text-anchor="middle" class="panel-label">INSPECTOR &amp; ÁRBOL</text>
    <text x="995" y="290" text-anchor="middle" class="panel-sub">Edita nombres, IPs y propiedades</text>

    <!-- 5. BOTTOM PANEL (TABLES) -->
    <rect x="0" y="440" width="1120" height="160" fill="#0f172a" stroke="#2e3d5a" stroke-width="1"/>
    <circle cx="560" cy="520" r="16" fill="#f59e0b" stroke="#000" stroke-width="2"/>
    <text x="560" y="527" class="badge" fill="#000">5</text>
    <text x="560" y="560" text-anchor="middle" class="panel-label">INVENTARIO Y CONEXIONES</text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(40, 730)">
    <text x="0" y="15" font-size="14" font-weight="700" fill="#f59e0b">1</text>
    <text x="25" y="15" font-size="14" fill="#f0f4ff">Barra Superior:</text>
    <text x="135" y="15" font-size="14" fill="#94a3b8">Cambia tu rol, guarda el proyecto o exporta a Excel/Plano.</text>

    <text x="0" y="40" font-size="14" font-weight="700" fill="#f59e0b">2</text>
    <text x="25" y="40" font-size="14" fill="#f0f4ff">Catálogo:</text>
    <text x="135" y="40" font-size="14" fill="#94a3b8">Lista de equipos disponibles. Selecciona, mantén presionado y arrastra al centro.</text>

    <text x="0" y="65" font-size="14" font-weight="700" fill="#f59e0b">3</text>
    <text x="25" y="65" font-size="14" fill="#f0f4ff">Área Central:</text>
    <text x="135" y="65" font-size="14" fill="#94a3b8">Aquí diseñas. Puedes ver cómo lucen los Racks de frente o ver las salas desde arriba.</text>

    <text x="0" y="90" font-size="14" font-weight="700" fill="#f59e0b">4</text>
    <text x="25" y="90" font-size="14" fill="#f0f4ff">Inspector:</text>
    <text x="135" y="90" font-size="14" fill="#94a3b8">Al tocar cualquier equipo, aquí podrás editar su nombre, IP, o ver en qué U está instalado.</text>

    <text x="580" y="15" font-size="14" font-weight="700" fill="#f59e0b">5</text>
    <text x="605" y="15" font-size="14" fill="#f0f4ff">Inventario:</text>
    <text x="690" y="15" font-size="14" fill="#94a3b8">Tabla que resume todo el hardware y los cables conectados.</text>
  </g>
</svg>
