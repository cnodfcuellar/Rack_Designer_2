<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" style="background-color: #0f111a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters for shadows and glow -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Marker for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="0.5">ARQUITECTURA DE RACK DESIGNER 2</text>
  <text x="450" y="55" text-anchor="middle" fill="#64748b" font-size="12">Flujo Unidireccional y Gestión de Estado Reactiva con Proxies ES6</text>

  <!-- GRID / BACKGROUND AESTHETICS -->
  <rect x="20" y="75" width="860" height="450" rx="12" fill="#141721" stroke="#232733" stroke-width="1.5" />

  <!-- SECTION: VISTA (DOM / INDEX.HTML) -->
  <g id="section-view">
    <!-- Outer boundary -->
    <rect x="50" y="100" width="230" height="340" rx="8" fill="#1e293b" fill-opacity="0.3" stroke="#334155" stroke-dasharray="4 4" />
    <text x="65" y="125" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">INTERFAZ &amp; DOM</text>
    
    <!-- index.html -->
    <rect x="70" y="145" width="190" height="45" rx="6" fill="url(#darkGrad)" stroke="#475569" stroke-width="1" />
    <text x="90" y="172" fill="#f8fafc" font-size="13" font-weight="bold">index.html</text>
    <text x="240" y="172" text-anchor="end" fill="#cbd5e1" font-size="10" font-family="monospace">&lt;/&gt;</text>
    
    <!-- UI Component Modules -->
    <rect x="70" y="210" width="190" height="210" rx="8" fill="#181b28" stroke="#1f2937" stroke-width="1" />
    <text x="85" y="232" fill="#38bdf8" font-size="11" font-weight="bold">MÓDULOS DE RENDER (UI)</text>
    
    <!-- Sub-components -->
    <!-- rack.js & faceplates.js -->
    <rect x="85" y="247" width="160" height="30" rx="4" fill="#0f111a" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="95" y="266" fill="#e2e8f0" font-size="11" font-family="monospace">rack.js / faceplates.js</text>
    
    <!-- topology.js -->
    <rect x="85" y="287" width="160" height="30" rx="4" fill="#0f111a" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="95" y="306" fill="#e2e8f0" font-size="11" font-family="monospace">topology.js (SVG)</text>
    
    <!-- tables.js -->
    <rect x="85" y="327" width="160" height="30" rx="4" fill="#0f111a" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="95" y="346" fill="#e2e8f0" font-size="11" font-family="monospace">tables.js (Tablas)</text>
    
    <!-- modals.js / catalog.js -->
    <rect x="85" y="367" width="160" height="30" rx="4" fill="#0f111a" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="95" y="386" fill="#e2e8f0" font-size="11" font-family="monospace">modals.js / catalog.js</text>
  </g>

  <!-- SECTION: ORCHESTRATOR (MAIN.JS) -->
  <g id="section-main">
    <rect x="340" y="100" width="220" height="150" rx="8" fill="url(#purpleGrad)" fill-opacity="0.08" stroke="#7c3aed" stroke-width="1.5" filter="url(#glowPurple)" />
    <text x="355" y="125" fill="#c084fc" font-size="12" font-weight="bold" letter-spacing="1">CONTROLADOR / ORQUESTADOR</text>
    
    <!-- main.js Card -->
    <rect x="355" y="145" width="190" height="85" rx="6" fill="url(#darkGrad)" stroke="#7c3aed" stroke-width="1" />
    <text x="370" y="170" fill="#ffffff" font-size="14" font-weight="bold">js/main.js</text>
    <text x="370" y="190" fill="#94a3b8" font-size="10">Escucha eventos globales</text>
    <text x="370" y="208" fill="#94a3b8" font-size="10">Dispara <tspan fill="#c084fc" font-weight="bold">renderAll(event)</tspan></text>
  </g>

  <!-- SECTION: REACTIVE STORE (STORE.JS) -->
  <g id="section-store">
    <rect x="340" y="290" width="510" height="150" rx="8" fill="url(#blueGrad)" fill-opacity="0.06" stroke="#0284c7" stroke-width="1.5" filter="url(#glowBlue)" />
    <text x="355" y="315" fill="#38bdf8" font-size="12" font-weight="bold" letter-spacing="1">ESTADO CENTRAL REACTIVO</text>
    
    <!-- store.js Card -->
    <rect x="355" y="335" width="210" height="85" rx="6" fill="url(#darkGrad)" stroke="#0284c7" stroke-width="1" />
    <text x="370" y="360" fill="#ffffff" font-size="14" font-weight="bold">js/store.js</text>
    <text x="370" y="380" fill="#38bdf8" font-weight="bold" font-size="11">Proxy ES6 de Reactividad</text>
    <text x="370" y="398" fill="#94a3b8" font-size="10">Mutación -> Auto-Save -> Emitir</text>
    
    <!-- Sub-elements inside Store -->
    <!-- LocalStorage -->
    <rect x="585" y="335" width="115" height="35" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="642" y="357" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="bold">localStorage</text>
    
    <!-- Historial (Undo/Redo Stack) -->
    <rect x="715" y="335" width="115" height="35" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="772" y="357" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="bold">Undo/Redo Stack</text>

    <!-- Data State object representation -->
    <rect x="585" y="380" width="245" height="40" rx="4" fill="#1e293b" fill-opacity="0.5" stroke="#334155" />
    <text x="595" y="395" fill="#f8fafc" font-size="9" font-family="monospace">state: { rooms, racks, devices }</text>
    <text x="595" y="409" fill="#64748b" font-size="9" font-family="monospace">       connections, selectedId }</text>
  </g>

  <!-- FLOW CONNECTIONS / ARROWS -->
  
  <!-- 1. USER INTERACTION: DOM to Store (Mutations) -->
  <path d="M 165,420 L 165,475 L 460,475 L 460,440" fill="none" stroke="url(#orangeGrad)" stroke-width="2.5" marker-end="url(#arrow)" />
  <!-- Label 1 -->
  <rect x="240" y="458" width="180" height="28" rx="4" fill="#141721" stroke="#ea580c" stroke-opacity="0.5" />
  <text x="330" y="475" text-anchor="middle" fill="#fb923c" font-size="10" font-weight="bold">1. Interacción / Mutación</text>
  <text x="330" y="488" text-anchor="middle" fill="#94a3b8" font-size="8">Modificaciones en store.state (ej: Drag &amp; Drop)</text>

  <!-- 2. STATE INTERNALS: Auto-Save and History -->
  <!-- Proxy to localStorage -->
  <path d="M 565,352.5 L 585,352.5" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Proxy to Stack -->
  <path d="M 565,370 L 610,370 L 610,318 L 772,318 L 772,335" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" />
  <text x="690" y="312" text-anchor="middle" fill="#64748b" font-size="9">snapshot()</text>

  <!-- 3. REACTIVE EVENT EMISSION: Store -> Main.js -->
  <path d="M 450,290 L 450,250" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)" />
  <!-- Label 2 -->
  <rect x="455" y="258" width="130" height="24" rx="4" fill="#0f111a" stroke="#0284c7" stroke-width="1" />
  <text x="520" y="274" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="bold">2. Evento 'change'</text>

  <!-- 4. ORCHESTRATION / DISPATCH: Main.js -> UI Render Modules -->
  <path d="M 340,150 L 260,150" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowPurple)" />
  <text x="300" y="142" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="bold">3. renderAll()</text>
  
  <path d="M 355,190 L 290,190 L 290,262 L 245,262" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)" />
  <text x="315" y="222" text-anchor="end" fill="#94a3b8" font-size="8">Llamadas selectivas</text>
  <text x="315" y="233" text-anchor="end" fill="#94a3b8" font-size="8">a renderizadores</text>

  <!-- USER ACTION CLICKS / KEYBOARD -->
  <path d="M 120,145 A 25,25 0 0,1 120,210" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2" />
  <path d="M 210,210 L 210,190" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="215" y="203" fill="#64748b" font-size="8">Actualiza DOM</text>

  <!-- LEGEND -->
  <g id="legend" transform="translate(620, 100)">
    <rect x="0" y="0" width="230" height="150" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1" />
    <text x="15" y="20" fill="#f8fafc" font-size="11" font-weight="bold">CÓMO FUNCIONA EL FLUJO:</text>
    
    <!-- Step 1 -->
    <circle cx="20" cy="45" r="7" fill="#ea580c" />
    <text x="20" y="48" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">1</text>
    <text x="35" y="48" fill="#cbd5e1" font-size="10">Mutación: Componente escribe</text>
    <text x="35" y="60" fill="#94a3b8" font-size="9">directamente en `store.state`</text>

    <!-- Step 2 -->
    <circle cx="20" cy="80" r="7" fill="#0284c7" />
    <text x="20" y="83" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">2</text>
    <text x="35" y="83" fill="#cbd5e1" font-size="10">Reacción: El proxy graba en</text>
    <text x="35" y="95" fill="#94a3b8" font-size="9">`localStorage` y emite 'change'</text>

    <!-- Step 3 -->
    <circle cx="20" cy="115" r="7" fill="#7c3aed" />
    <text x="20" y="118" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">3</text>
    <text x="35" y="118" fill="#cbd5e1" font-size="10">Render: `main.js` atrapa el</text>
    <text x="35" y="130" fill="#94a3b8" font-size="9">cambio y redibuja la vista en HTML</text>
  </g>
</svg>
