<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" style="background-color: transparent; font-family: -apple-system, sans-serif;">
  
  <!-- Modal Container -->
  <rect x="10" y="10" width="480" height="330" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="30" y="44" fill="#8a2be2" font-size="16">🔌</text>
  <text x="55" y="44" fill="#ffffff" font-size="18" font-weight="bold">Editar Conexión</text>
  <text x="30" y="65" fill="#8b949e" font-size="12">Conectar puertos entre equipos</text>

  <!-- Row 1: Origen -->
  <text x="30" y="100" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">EQUIPO ORIGEN</text>
  <rect x="30" y="110" width="240" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="45" y="133" fill="#c9d1d9" font-size="13" font-weight="bold">Router Core (router)</text>
  <text x="250" y="133" fill="#c9d1d9" font-size="12">▼</text>

  <text x="290" y="100" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">PUERTO ORIGEN</text>
  <rect x="290" y="110" width="180" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="305" y="133" fill="#c9d1d9" font-size="13" font-weight="bold">Eth0/1</text>

  <!-- Row 2: Destino -->
  <text x="30" y="175" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">EQUIPO DESTINO</text>
  <rect x="30" y="185" width="240" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="45" y="208" fill="#c9d1d9" font-size="13" font-weight="bold">Switch Managed 24P (switch)</text>
  <text x="250" y="208" fill="#c9d1d9" font-size="12">▼</text>

  <text x="290" y="175" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">PUERTO DESTINO</text>
  <rect x="290" y="185" width="180" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="305" y="208" fill="#c9d1d9" font-size="13" font-weight="bold">Eth0/2</text>

  <!-- Row 3: Cable -->
  <text x="30" y="250" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">TIPO DE CABLE</text>
  <rect x="30" y="260" width="240" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <circle cx="45" cy="278" r="6" fill="#f85149"/>
  <text x="60" y="283" fill="#c9d1d9" font-size="13" font-weight="bold">Fibra Monomodo</text>
  <text x="250" y="283" fill="#c9d1d9" font-size="12">▼</text>

  <text x="290" y="250" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">COLOR DEL CABLE</text>
  <rect x="290" y="260" width="36" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <rect x="295" y="265" width="26" height="26" fill="#f7f13b" rx="2"/>
  <rect x="336" y="260" width="134" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="350" y="283" fill="#c9d1d9" font-size="13" font-weight="bold">#f7f13b</text>

  <!-- Footer Buttons -->
  <rect x="290" y="315" width="80" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="330" y="335" fill="#c9d1d9" font-size="12" text-anchor="middle">Cancelar</text>

  <rect x="380" y="315" width="90" height="32" fill="#0ea5e9" rx="4" opacity="0.2"/>
  <rect x="380" y="315" width="90" height="32" fill="transparent" stroke="#0ea5e9" stroke-width="1" rx="4"/>
  <text x="425" y="335" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Conectar</text>

  <!-- Fake clipping for the overlapping buttons -->
  <rect x="280" y="305" width="210" height="45" fill="#0d1117"/>
  <rect x="290" y="305" width="80" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="330" y="325" fill="#c9d1d9" font-size="12" text-anchor="middle">Cancelar</text>

  <rect x="380" y="305" width="90" height="32" fill="#0ea5e9" rx="4" opacity="0.2"/>
  <rect x="380" y="305" width="90" height="32" fill="transparent" stroke="#0ea5e9" stroke-width="1" rx="4"/>
  <text x="425" y="325" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Conectar</text>

</svg>
