<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 720" width="100%" style="background-color: #0d1117; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Patterns and Gradients -->
    <pattern id="topology-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#38bdf8" opacity="0.3" />
    </pattern>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Badges color definitions -->
    <style>
      .badge-switch { fill: #ecfdf5; stroke: #a7f3d0; text-color: #047857; }
      .badge-ups { fill: #f5f3ff; stroke: #ddd6fe; text-color: #6d28d9; }
      .badge-server { fill: #f0f9ff; stroke: #bae6fd; text-color: #0369a1; }
      .badge-firewall { fill: #fef2f2; stroke: #fca5a5; text-color: #b91c1c; }
    </style>
  </defs>

  <!-- ==================== 1. CANVAS BASE (Lower part visible) ==================== -->
  <rect x="0" y="0" width="450" height="720" fill="url(#canvasGrad)" />
  <rect x="0" y="0" width="450" height="720" fill="url(#topology-grid)" />


  <!-- ==================== 2. MOBILE DRAWER PANEL (PULLED UP) ==================== -->
  <!-- Main white container from top (y=0) to y=600 -->
  <path d="M 0,0 L 450,0 L 450,590 A 16,16 0 0 1 434,606 L 16,606 A 16,16 0 0 1 0,590 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- 2.1 Panel Header Toolbar -->
  <!-- Search input (Partially visible/cut off on left) -->
  <rect x="-40" y="12" width="125" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="12" y="33" fill="#64748b" font-size="12.5">abla...</text>

  <!-- CSV Button -->
  <rect x="100" y="12" width="68" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" />
  <text x="134" y="33" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">↓ CSV</text>

  <!-- Excel Button -->
  <rect x="183" y="12" width="78" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" />
  <text x="222" y="33" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">↓ Excel</text>

  <!-- Contraer Button (Active/Pressed representation) -->
  <rect x="276" y="12" width="108" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" />
  <path d="M 292,23 L 292,18 L 297,18 M 306,18 L 311,18 L 311,23 M 311,32 L 311,37 L 306,37 M 297,37 L 292,37 L 292,32" fill="none" stroke="#334155" stroke-width="1.2" />
  <text x="340" y="33" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">⛶ Contraer</text>

  <!-- Expand/collapse toggler indicator -->
  <rect x="396" y="12" width="38" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8" />
  <polygon points="415,26 420,32 410,32" fill="#334155" />

  <!-- 2.2 Table Headers -->
  <rect x="0" y="60" width="450" height="36" fill="#f8fafc" />
  <text x="48" y="82" fill="#64748b" font-size="11.5" font-weight="bold" letter-spacing="0.5">MODELO</text>
  <text x="212" y="82" fill="#64748b" font-size="11.5" font-weight="bold" letter-spacing="0.5">TIPO</text>
  <text x="320" y="82" fill="#64748b" font-size="11.5" font-weight="bold" letter-spacing="0.5">IP</text>
  <line x1="0" y1="96" x2="450" y2="96" stroke="#f1f5f9" stroke-width="1" />

