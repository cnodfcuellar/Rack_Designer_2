    <rect x="0" y="0" width="450" height="40" fill="#ffffff" />
    <text x="48" y="25" fill="#334155" font-size="13" font-family="monospace">PowerEdge R740</text>
    <rect x="212" y="10" width="60" height="20" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8" />
