<rect x="200" y="155" width="46" height="14" rx="3" fill="#ef444430" stroke="#ef444460"/>
<text x="223" y="165" text-anchor="middle" font-family="JetBrains Mono" font-size="8" fill="#f87171">⚡ 550W</text>
<!-- power LED -->
<circle cx="278" cy="165" r="4" fill="#10b981" class="led"/>
<circle cx="278" cy="178" r="4" fill="#10b981" class="led2"/>

<!-- U5-8: Empty + badge -->
<rect x="50" y="202" width="232" height="92" rx="3" fill="#0d1428" stroke="#1e2d4e" stroke-dasharray="4,4"/>
<text x="166" y="245" text-anchor="middle" font-family="Space Grotesk" font-size="10" fill="#1e2d4e">4U libre</text>
<!-- Drop hint -->
<rect x="90" y="252" width="152" height="22" rx="6" fill="#10b98115" stroke="#10b98140"/>
<text x="166" y="267" text-anchor="middle" font-family="Space Grotesk" font-size="9" fill="#10b98188">+ Arrastrar aquí</text>

<!-- Capacity bar bottom -->
<rect x="32" y="302" width="276" height="8" rx="4" fill="#1e2d4e"/>
<rect x="32" y="302" width="236" height="8" rx="4" fill="#ef4444"/>
<!-- Breakdown legend -->
<circle cx="32" cy="320" r="3" fill="#0ea5e9"/>
<text x="38" y="324" font-family="JetBrains Mono" font-size="8" fill="#64748b">Serv</text>
<circle cx="70" cy="320" r="3" fill="#10b981"/>
<text x="76" y="324" font-family="JetBrains Mono" font-size="8" fill="#64748b">Net</text>
<circle cx="105" cy="320" r="3" fill="#ef4444"/>
<text x="111" y="324" font-family="JetBrains Mono" font-size="8" fill="#64748b">FW</text>

<!-- RACK 2 CARD — Vista dual (feature proposal) -->
<rect x="340" y="30" width="440" height="290" rx="12" fill="#0d1428" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="340" y="30" width="440" height="44" rx="12" fill="#1a0f2e"/>
<rect x="340" y="62" width="440" height="12" fill="#1a0f2e"/>
<rect x="352" y="40" width="8" height="24" rx="2" fill="#8b5cf6"/>
<text x="370" y="57" font-family="Space Grotesk" font-size="12" font-weight="700" fill="#e2e8f0">Rack Core — Vista Dual</text>
<!-- Feature badge -->
<rect x="600" y="40" width="72" height="20" rx="6" fill="#8b5cf620" stroke="#8b5cf660"/>
<text x="636" y="54" text-anchor="middle" font-family="JetBrains Mono" font-size="8" fill="#c4b5fd">✨ Nuevo</text>

<!-- Divider dual view -->
<line x1="560" y1="78" x2="560" y2="310" stroke="#1e2d4e" stroke-width="1" stroke-dasharray="4,3"/>
<text x="450" y="92" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">FRENTE</text>
<text x="670" y="92" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#3b82f6">ATRÁS</text>

<!-- Front side slots -->
<rect x="352" y="98" width="200" height="24" rx="3" fill="#0ea5e920" stroke="#0ea5e9"/>
<text x="362" y="114" font-family="Space Grotesk" font-size="9" font-weight="600" fill="#7dd3fc">Server HP ProLiant 2U</text>
<circle cx="350" cy="110" r="4" fill="#10b981" class="led"/>

<rect x="352" y="124" width="200" height="24" rx="3" fill="#8b5cf620" stroke="#8b5cf6"/>
<text x="362" y="140" font-family="Space Grotesk" font-size="9" font-weight="600" fill="#c4b5fd">UPS APC 2U</text>

<!-- Rear side slots with port details -->
<rect x="568" y="98" width="204" height="24" rx="3" fill="#0ea5e915" stroke="#0ea5e960"/>
<rect x="576" y="104" width="14" height="12" rx="2" fill="#3b82f6" opacity="0.8"/><!-- cable plug -->
<text x="596" y="114" font-family="JetBrains Mono" font-size="8" fill="#64748b">Eth0 → Switch-01</text>
<rect x="576" y="118" width="14" height="12" rx="2" fill="#3b82f6" opacity="0.8"/>
<text x="596" y="128" font-family="JetBrains Mono" font-size="8" fill="#64748b">Eth1 → FW-01</text>
<!-- power outlet -->
<rect x="720" y="104" width="18" height="12" rx="2" fill="#f59e0b40" stroke="#f59e0b80"/>
<text x="729" y="114" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#fbbf24">⚡</text>

<rect x="568" y="124" width="204" height="24" rx="3" fill="#8b5cf615" stroke="#8b5cf660"/>
<rect x="576" y="128" width="36" height="12" rx="2" fill="#1e2d4e"/>
<text x="594" y="138" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#475569">BATT</text>
<rect x="616" y="128" width="36" height="12" rx="2" fill="#10b98130" stroke="#10b98160"/>
<text x="634" y="138" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#6ee7b7">100%</text>

<text x="450" y="220" text-anchor="middle" font-family="Space Grotesk" font-size="12" fill="#1e2d4e">Capacidad: 40%</text>
<text x="670" y="220" text-anchor="middle" font-family="Space Grotesk" font-size="12" fill="#1e2d4e">2 cables</text>

<!-- Annotation arrows -->
<text x="800" y="115" font-family="JetBrains Mono" font-size="9" fill="#3b82f6">← Cables con</text>
<text x="800" y="128" font-family="JetBrains Mono" font-size="9" fill="#3b82f6">   destino visible</text>
<text x="800" y="148" font-family="JetBrains Mono" font-size="9" fill="#f59e0b">← Tomas de</text>
<text x="800" y="161" font-family="JetBrains Mono" font-size="9" fill="#f59e0b">   corriente</text>
<line x1="796" y1="115" x2="775" y2="115" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
<line x1="796" y1="148" x2="775" y2="136" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
</svg>