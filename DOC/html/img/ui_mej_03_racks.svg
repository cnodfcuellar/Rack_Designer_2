<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340">
<defs>
  <style>
    @keyframes led-blink { 0%,100%{opacity:1} 60%{opacity:0.2} }
    .led { animation: led-blink 1.2s ease-in-out infinite; }
    .led2 { animation: led-blink 0.8s ease-in-out 0.3s infinite; }
    @keyframes port-pulse { 0%,100%{r:3} 50%{r:5} }
    .pp { animation: port-pulse 1.5s ease-in-out infinite; }
  </style>
</defs>
<rect width="1100" height="340" fill="#060a14" rx="12"/>
<text x="550" y="18" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#475569">PROPUESTA — Vista Física Mejorada</text>

<!-- RACK 1 CARD — mejorado -->
<rect x="20" y="30" width="300" height="290" rx="12" fill="#0d1428" stroke="#0ea5e9" stroke-width="1.5"/>
<!-- Header con gradiente -->
<rect x="20" y="30" width="300" height="44" rx="12" fill="#0f2035"/>
<rect x="20" y="62" width="300" height="12" fill="#0f2035"/>
<rect x="32" y="40" width="8" height="24" rx="2" fill="#0ea5e9"/>
<text x="50" y="57" font-family="Space Grotesk" font-size="12" font-weight="700" fill="#e2e8f0">Rack Principal</text>
<text x="200" y="52" font-family="JetBrains Mono" font-size="9" fill="#64748b">42U · 0.92kW</text>
<!-- Capacity bar header -->
<rect x="32" y="72" width="276" height="6" rx="3" fill="#1e2d4e"/>
<rect x="32" y="72" width="236" height="6" rx="3" fill="#ef4444"/><!-- 86% full = red -->
<text x="32" y="92" font-family="JetBrains Mono" font-size="8" fill="#f87171">36/42U ⚠ 86%</text>
<text x="220" y="92" font-family="JetBrains Mono" font-size="8" fill="#475569">FRONT</text>
<text x="270" y="92" font-family="JetBrains Mono" font-size="8" fill="#0ea5e9">REAR →</text>

<!-- Slots / rail numbers -->
<rect x="32" y="98" width="16" height="196" rx="2" fill="#0a1520"/>
<rect x="284" y="98" width="16" height="196" rx="2" fill="#0a1520"/>
<!-- Rail numbers -->
<text x="40" y="114" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#1e2d4e">1</text>
<text x="40" y="142" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#1e2d4e">5</text>
<text x="40" y="170" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#1e2d4e">10</text>
<text x="40" y="198" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#1e2d4e">15</text>
<text x="40" y="226" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#1e2d4e">20</text>
<text x="40" y="254" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#1e2d4e">25</text>
<text x="40" y="282" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#1e2d4e">30</text>

<!-- U1: Switch — con cable indicators -->
<rect x="50" y="100" width="232" height="24" rx="3" fill="#10b98125" stroke="#10b981" stroke-width="1"/>
<text x="60" y="116" font-family="Space Grotesk" font-size="10" font-weight="600" fill="#34d399">Switch Cisco 48P</text>
<text x="235" y="116" font-family="JetBrains Mono" font-size="8" fill="#64748b">180W</text>
<!-- Cable connection dots -->
<circle cx="48" cy="112" r="4" fill="#3b82f6" class="pp"/>
<circle cx="48" cy="120" r="4" fill="#ef4444"/>
<text x="260" y="110" font-family="JetBrains Mono" font-size="7" fill="#3b82f6">Eth1</text>
<text x="260" y="120" font-family="JetBrains Mono" font-size="7" fill="#ef4444">Eth2</text>

<!-- U2: Firewall -->
<rect x="50" y="126" width="232" height="24" rx="3" fill="#ef444420" stroke="#ef4444" stroke-width="1"/>
<text x="60" y="142" font-family="Space Grotesk" font-size="10" font-weight="600" fill="#f87171">Firewall Fortinet</text>
<text x="235" y="142" font-family="JetBrains Mono" font-size="8" fill="#64748b">40W</text>
<circle cx="48" cy="138" r="4" fill="#ef4444" class="pp"/>

<!-- U3-4: Server Dell (2U) -->
<rect x="50" y="152" width="232" height="48" rx="3" fill="#0ea5e920" stroke="#0ea5e9" stroke-width="1"/>
<text x="60" y="170" font-family="Space Grotesk" font-size="10" font-weight="600" fill="#7dd3fc">Server Dell R740</text>
<text x="60" y="184" font-family="JetBrains Mono" font-size="9" fill="#64748b">192.168.1.10 · 550W</text>
