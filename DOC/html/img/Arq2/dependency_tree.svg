<svg viewBox="0 0 880 280" width="880" height="280" xmlns="http://www.w3.org/2000/svg">
              <rect width="100%" height="100%" fill="#0a0f1d" rx="10"/>
              
              <!-- Nivel 1: Datos &amp; Utils (Independientes) -->
              <rect x="30" y="40" width="180" height="40" rx="6" fill="#141a24" stroke="#242f41"/>
              <text x="120" y="65" fill="#f1f5f9" font-family="var(--font-mono)" font-size="12" text-anchor="middle">utils.js</text>
              
              <rect x="30" y="110" width="180" height="40" rx="6" fill="#141a24" stroke="#242f41"/>
              <text x="120" y="135" fill="#f1f5f9" font-family="var(--font-mono)" font-size="12" text-anchor="middle">store.js</text>

              <rect x="30" y="180" width="180" height="40" rx="6" fill="#141a24" stroke="#242f41"/>
              <text x="120" y="205" fill="#f1f5f9" font-family="var(--font-mono)" font-size="12" text-anchor="middle">catalog.js / demoData.js</text>

              <!-- Nivel 2: UI Components -->
              <rect x="320" y="40" width="220" height="180" rx="8" fill="#0c1e2d" stroke="#38bdf8" stroke-dasharray="4,4"/>
              <text x="430" y="65" fill="#38bdf8" font-family="var(--font-ui)" font-size="13" font-weight="700" text-anchor="middle">COMPONENTES VISUALES (UI)</text>
              <rect x="340" y="85" width="180" height="30" rx="4" fill="#141a24" stroke="#242f41"/>
              <text x="430" y="104" fill="#94a3b8" font-family="var(--font-mono)" font-size="11" text-anchor="middle">rack.js │ faceplates.js</text>
              <rect x="340" y="125" width="180" height="30" rx="4" fill="#141a24" stroke="#242f41"/>
              <text x="430" y="144" fill="#94a3b8" font-family="var(--font-mono)" font-size="11" text-anchor="middle">topology/ │ tables.js</text>
              <rect x="340" y="165" width="180" height="30" rx="4" fill="#141a24" stroke="#242f41"/>
              <text x="430" y="184" fill="#94a3b8" font-family="var(--font-mono)" font-size="11" text-anchor="middle">modals/</text>

              <!-- Nivel 3: Controller &amp; View -->
              <rect x="660" y="60" width="190" height="60" rx="6" fill="#162e24" stroke="#10b981"/>
              <text x="755" y="90" fill="#f1f5f9" font-family="var(--font-mono)" font-size="12" font-weight="700" text-anchor="middle">main.js (Entry Point)</text>
              <text x="755" y="105" fill="#34d399" font-family="var(--font-ui)" font-size="10" text-anchor="middle">Orquesta renders y eventos globales</text>

              <rect x="660" y="140" width="190" height="60" rx="6" fill="#2d1b00" stroke="#f59e0b"/>
              <text x="755" y="170" fill="#f1f5f9" font-family="var(--font-mono)" font-size="12" font-weight="700" text-anchor="middle">index.html (HTML5 skeletal)</text>
              <text x="755" y="185" fill="#f59e0b" font-family="var(--font-ui)" font-size="10" text-anchor="middle">Contenedores DOM y scripts externos</text>

              <!-- Lineas de dependencia -->
              <g stroke="#64748b" stroke-width="1.5" fill="none">
                <!-- Nivel 1 -> Nivel 2 -->
                <path d="M 210 60 L 320 60" marker-end="url(#dep-arrow)"/>
                <path d="M 210 130 L 320 130" marker-end="url(#dep-arrow)"/>
                <path d="M 210 200 L 320 200" marker-end="url(#dep-arrow)"/>
                <!-- Nivel 2 -> main.js -->
                <path d="M 540 100 L 660 85" marker-end="url(#dep-arrow)"/>
                <!-- main.js -> index.html (encapsulado en UI wrapper) -->
                <path d="M 755 120 L 755 140" marker-end="url(#dep-arrow)"/>
              </g>

              <defs>
                <marker id="dep-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M0,0 L0,6 L6,3 z" fill="#64748b"/>
                </marker>
              </defs>
            </svg>