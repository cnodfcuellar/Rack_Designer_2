<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 180" width="100%" height="180" style="background:#090d16; border-radius:8px; border:1px solid #242f41;">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- demoData.js -->
  <rect x="20" y="40" width="140" height="100" rx="8" fill="#2d1b00" stroke="#f59e0b" stroke-width="2"/>
  <text x="90" y="65" fill="#fcd34d" font-family="'Outfit'" font-size="13" font-weight="700" text-anchor="middle">demoData.js</text>
  <text x="90" y="85" fill="#fde68a" font-family="'JetBrains Mono'" font-size="9" text-anchor="middle">const DEMO_DATA = {</text>
  <text x="90" y="100" fill="#fde68a" font-family="'JetBrains Mono'" font-size="9" text-anchor="middle">  rooms: [...],</text>
  <text x="90" y="115" fill="#fde68a" font-family="'JetBrains Mono'" font-size="9" text-anchor="middle">  racks: [...]</text>

  <path d="M 160 90 L 260 90" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="210" y="78" fill="#f1f5f9" font-family="'Outfit'" font-size="11" font-weight="600" text-anchor="middle">Inyección</text>
  <text x="210" y="105" fill="#94a3b8" font-family="'Outfit'" font-size="9" text-anchor="middle">Object.assign()</text>

  <!-- Store.js Proxy -->
  <rect x="270" y="40" width="130" height="100" rx="8" fill="#0d1f2d" stroke="#0ea5e9" stroke-width="2"/>
  <text x="335" y="70" fill="#38bdf8" font-family="'Outfit'" font-size="14" font-weight="700" text-anchor="middle">store.state</text>
  <rect x="290" y="90" width="90" height="30" rx="4" fill="#0369a1" stroke="#38bdf8"/>
  <text x="335" y="108" fill="#e0f2fe" font-family="'JetBrains Mono'" font-size="10" text-anchor="middle">Datos Mock</text>

  <path d="M 400 90 L 440 90" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Emit -->
  <circle cx="480" cy="90" r="35" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="480" y="88" fill="#34d399" font-family="'Outfit'" font-size="11" font-weight="700" text-anchor="middle">Render</text>
  <text x="480" y="102" fill="#a7f3d0" font-family="'JetBrains Mono'" font-size="8" text-anchor="middle">Masivo</text>
</svg>
