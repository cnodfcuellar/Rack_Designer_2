<svg viewBox="0 0 880 340" width="880" height="340" xmlns="http://www.w3.org/2000/svg">
              <!-- Background -->
              <rect width="100%" height="100%" fill="#0a0f1d" rx="10"/>
              
              <!-- User UI Interaction -->
              <rect x="20" y="110" width="160" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
              <text x="100" y="140" fill="#f1f5f9" font-family="'Outfit'" font-size="14" font-weight="700" text-anchor="middle">UI Componentes</text>
              <text x="100" y="160" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10" text-anchor="middle">rack.js | topology.js</text>
              
              <!-- Store Mutator Action -->
              <rect x="240" y="110" width="180" height="70" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
              <text x="330" y="140" fill="#f1f5f9" font-family="'Outfit'" font-size="14" font-weight="700" text-anchor="middle">store.js (Mutator)</text>
              <text x="330" y="160" fill="#a78bfa" font-family="'JetBrains Mono'" font-size="10" text-anchor="middle">addDeviceToRack()</text>

              <!-- State Proxy &amp; LocalStorage -->
              <rect x="480" y="80" width="180" height="130" rx="8" fill="#0d1f2d" stroke="#0ea5e9" stroke-width="2"/>
              <text x="570" y="110" fill="#38bdf8" font-family="'Outfit'" font-size="15" font-weight="800" text-anchor="middle">Proxy ES6</text>
              <text x="570" y="135" fill="#94a3b8" font-family="'Outfit'" font-size="12" text-anchor="middle">Guarda snapshots (Undo)</text>
              <line x1="495" y1="150" x2="645" y2="150" stroke="#242f41" stroke-width="1"/>
              <text x="570" y="175" fill="#f59e0b" font-family="'JetBrains Mono'" font-size="11" text-anchor="middle">_save() → LocalStorage</text>
              <text x="570" y="193" fill="#10b981" font-family="'JetBrains Mono'" font-size="11" text-anchor="middle">_emit("change")</text>

              <!-- Main Controller -->
              <rect x="710" y="110" width="150" height="70" rx="8" fill="#162e24" stroke="#10b981" stroke-width="2"/>
              <text x="785" y="140" fill="#f1f5f9" font-family="'Outfit'" font-size="14" font-weight="700" text-anchor="middle">main.js (Listener)</text>
              <text x="785" y="160" fill="#34d399" font-family="'JetBrains Mono'" font-size="10" text-anchor="middle">renderAll()</text>

              <!-- Connections -->
              <g stroke="#94a3b8" stroke-width="2" fill="none">
                <!-- UI -> Store -->
                <path d="M 180 145 L 240 145" marker-end="url(#arrow)"/>
                <!-- Store -> Proxy -->
                <path d="M 420 145 L 480 145" marker-end="url(#arrow)"/>
                <!-- Proxy -> Main -->
                <path d="M 660 145 L 710 145" marker-end="url(#arrow)"/>
                <!-- Main -> UI (Loop back) -->
                <path d="M 785 180 C 785 270, 100 270, 100 180" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
              </g>

              <!-- Markers -->
              <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
                  <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
                </marker>
                <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
                  <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
                </marker>
              </defs>

              <text x="440" y="275" fill="#a5b4fc" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">Re-renderizado selectivo reactivo (Mantiene sincronizado Física y Topología)</text>
            </svg>