<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="320" style="background:#090d16; border-radius:8px; border:1px solid #242f41;">
  <g transform="translate(40, 30)">
    <!-- Root -->
    <rect x="0" y="0" width="160" height="30" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="20" fill="#f1f5f9" font-family="'Outfit'" font-size="14" font-weight="600" text-anchor="middle">📁 Rack_Designer_2/</text>

    <path d="M 80 30 L 80 270" stroke="#334155" stroke-width="2" fill="none"/>

    <!-- /js -->
    <path d="M 80 60 L 110 60" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="45" width="80" height="30" rx="4" fill="#1e293b" stroke="#f59e0b"/>
    <text x="150" y="65" fill="#fef3c7" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">📁 js/</text>
    
    <!-- /js/ui -->
    <path d="M 150 75 L 150 100 L 170 100" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <rect x="170" y="85" width="120" height="30" rx="4" fill="#1e1b4b" stroke="#8b5cf6"/>
    <text x="230" y="105" fill="#e0e7ff" font-family="'Outfit'" font-size="12" font-weight="600" text-anchor="middle">📁 ui/</text>
    <text x="300" y="105" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">rack.js, modals.js, faceplates.js...</text>

    <!-- /js core files -->
    <path d="M 150 100 L 150 135 L 170 135" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="175" y="140" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">main.js, store.js, utils.js</text>

    <!-- /css -->
    <path d="M 80 170 L 110 170" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="155" width="80" height="30" rx="4" fill="#1e293b" stroke="#ec4899"/>
    <text x="150" y="175" fill="#fce7f3" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">📁 css/</text>
    <text x="200" y="175" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">layout.css, style.css, /components</text>

    <!-- /doc -->
    <path d="M 80 215 L 110 215" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="200" width="80" height="30" rx="4" fill="#1e293b" stroke="#10b981"/>
    <text x="150" y="220" fill="#d1fae5" font-family="'Outfit'" font-size="13" font-weight="600" text-anchor="middle">📁 doc/</text>
    <text x="200" y="220" fill="#94a3b8" font-family="'JetBrains Mono'" font-size="10">/html (Arquitectura), /log (Changelog)</text>

    <!-- Root files -->
    <path d="M 80 260 L 110 260" stroke="#334155" stroke-width="2" fill="none"/>
    <rect x="110" y="245" width="140" height="30" rx="4" fill="#0f172a" stroke="#64748b"/>
    <text x="180" y="265" fill="#f1f5f9" font-family="'Outfit'" font-size="12" text-anchor="middle">index.html, package.json</text>

    <!-- Info Box -->
    <rect x="360" y="200" width="180" height="80" rx="6" fill="#0d1b2a" stroke="#38bdf8" stroke-dasharray="4,4"/>
    <text x="450" y="225" fill="#38bdf8" font-family="'Outfit'" font-size="12" font-weight="600" text-anchor="middle">Segmentación Lógica</text>
    <text x="450" y="245" fill="#cbd5e1" font-family="'Outfit'" font-size="10" text-anchor="middle">Separa el Core de la UI.</text>
    <text x="450" y="260" fill="#cbd5e1" font-family="'Outfit'" font-size="10" text-anchor="middle">Facilita el mantenimiento</text>
    <text x="450" y="275" fill="#cbd5e1" font-family="'Outfit'" font-size="10" text-anchor="middle">y el trabajo en equipo.</text>
  </g>
</svg>
