<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191a21" />
      <stop offset="100%" stop-color="#282a36" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="desktopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd93f9" />
      <stop offset="100%" stop-color="#8be9fd" />
    </linearGradient>
    
    <linearGradient id="mobileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff79c6" />
      <stop offset="100%" stop-color="#ffb86c" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Main Title -->
  <text x="600" y="60" fill="#f8f8f2" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle" letter-spacing="1">Comparativa de Experiencia: Escritorio vs. Móvil</text>
  <text x="600" y="90" fill="#6272a4" font-family="sans-serif" font-size="18" text-anchor="middle">Cómo Rack Designer adapta su interfaz e interacciones según el dispositivo</text>
  <line x1="100" y1="120" x2="1100" y2="120" stroke="#44475a" stroke-width="2" />

  <!-- Divider Line -->
  <line x1="600" y1="150" x2="600" y2="750" stroke="#44475a" stroke-width="2" stroke-dasharray="10, 10" />

  <!-- =============================== -->
  <!-- LEFT SIDE: DESKTOP WORKFLOW     -->
  <!-- =============================== -->

  <!-- Desktop Header -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#desktopGrad)" filter="url(#shadow)"/>
    <path d="M 15 20 L 45 20 L 45 40 L 15 40 Z M 25 40 L 25 45 L 35 45 L 35 40" stroke="#282a36" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="80" y="25" fill="#bd93f9" font-family="sans-serif" font-size="24" font-weight="bold">Entorno de Escritorio</text>
    <text x="80" y="50" fill="#f8f8f2" font-family="sans-serif" font-size="16">Interacción Libre y Panorámica</text>
  </g>

  <!-- Desktop Device Mockup -->
  <g transform="translate(100, 250)" filter="url(#shadow)">
    <!-- Monitor Frame -->
    <rect x="0" y="0" width="400" height="240" rx="8" fill="#21222c" stroke="#44475a" stroke-width="4"/>
    <rect x="150" y="240" width="100" height="30" fill="#44475a"/>
    <rect x="100" y="270" width="200" height="10" rx="5" fill="#44475a"/>
    
    <!-- App Layout -->
    <!-- Top Bar -->
    <rect x="4" y="4" width="392" height="20" fill="#191a21" />
    <rect x="10" y="8" width="80" height="12" rx="4" fill="#6272a4" />
    <circle cx="380" cy="14" r="4" fill="#50fa7b" />
    <circle cx="365" cy="14" r="4" fill="#f1fa8c" />
    
    <!-- Left Panel (Catalog) -->
    <rect x="4" y="26" width="70" height="170" fill="#282a36" stroke="#44475a" stroke-width="1"/>
    <rect x="10" y="35" width="58" height="15" rx="2" fill="#44475a" />
    <rect x="10" y="55" width="58" height="15" rx="2" fill="#44475a" />
    <rect x="10" y="75" width="58" height="15" rx="2" fill="#44475a" />

    <!-- Center Canvas -->
    <rect x="76" y="26" width="320" height="170" fill="#1e1e24" />
    <!-- Racks -->
    <rect x="130" y="50" width="40" height="120" rx="2" fill="#282a36" stroke="#bd93f9" stroke-width="1"/>
    <rect x="200" y="50" width="40" height="120" rx="2" fill="#282a36" stroke="#bd93f9" stroke-width="1"/>
    <rect x="270" y="50" width="40" height="120" rx="2" fill="#282a36" stroke="#bd93f9" stroke-width="1"/>
    
    <!-- Bottom Panel (Inventory) -->
    <rect x="4" y="198" width="392" height="38" fill="#282a36" stroke="#44475a" stroke-width="1"/>
    <line x1="10" y1="205" x2="380" y2="205" stroke="#44475a" stroke-width="2"/>
    <line x1="10" y1="215" x2="380" y2="215" stroke="#44475a" stroke-width="2"/>
    <line x1="10" y1="225" x2="380" y2="225" stroke="#44475a" stroke-width="2"/>
  </g>

  <!-- Desktop Key Features -->
  <g transform="translate(100, 560)">
    <!-- Feature 1: Drag and Drop -->
    <circle cx="20" cy="20" r="16" fill="#44475a"/>
    <path d="M 12 12 L 20 28 L 24 22 L 30 30 L 32 28 L 26 20 L 32 16 Z" fill="#bd93f9"/>
    <text x="50" y="15" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold">Interacción Drag &amp; Drop</text>
    <text x="50" y="35" fill="#6272a4" font-family="sans-serif" font-size="14">Arrastre fluido de equipos desde el catálogo fijo lateral.</text>

    <!-- Feature 2: Panels -->
    <circle cx="20" cy="80" r="16" fill="#44475a"/>
    <rect x="12" y="72" width="16" height="16" fill="none" stroke="#8be9fd" stroke-width="2" rx="2"/>
    <line x1="18" y1="72" x2="18" y2="88" stroke="#8be9fd" stroke-width="2"/>
    <text x="50" y="75" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold">Paneles Fijos y Modales Complejos</text>
    <text x="50" y="95" fill="#6272a4" font-family="sans-serif" font-size="14">Catálogo e inventario siempre visibles. Modales multipestaña.</text>

    <!-- Feature 3: Topology -->
    <circle cx="20" cy="140" r="16" fill="#44475a"/>
    <circle cx="14" cy="134" r="3" fill="#50fa7b"/>
    <circle cx="26" cy="146" r="3" fill="#50fa7b"/>
    <line x1="16" y1="136" x2="24" y2="144" stroke="#50fa7b" stroke-width="2"/>
    <text x="50" y="135" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold">Topología Panorámica</text>
    <text x="50" y="155" fill="#6272a4" font-family="sans-serif" font-size="14">Lienzo extenso que permite ver todo el diagrama lógico a la vez.</text>
  </g>


  <!-- =============================== -->
  <!-- RIGHT SIDE: MOBILE WORKFLOW     -->
  <!-- =============================== -->

  <!-- Mobile Header -->
  <g transform="translate(650, 150)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#mobileGrad)" filter="url(#shadow)"/>
    <rect x="20" y="12" width="20" height="36" rx="4" fill="none" stroke="#282a36" stroke-width="3"/>
    <circle cx="30" cy="42" r="2" fill="#282a36"/>
    <text x="80" y="25" fill="#ff79c6" font-family="sans-serif" font-size="24" font-weight="bold">Entorno Móvil</text>
    <text x="80" y="50" fill="#f8f8f2" font-family="sans-serif" font-size="16">Interacción Táctil y Asistida</text>
  </g>

  <!-- Mobile Device Mockups -->
  <g transform="translate(680, 240)" filter="url(#shadow)">
    <!-- Device 1: Main View (Racks) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="280" rx="16" fill="#21222c" stroke="#44475a" stroke-width="4"/>
      <!-- Notch -->
      <path d="M 50 4 L 90 4 L 85 15 L 55 15 Z" fill="#44475a"/>
      <!-- App Top Bar -->
      <rect x="4" y="20" width="132" height="25" fill="#191a21" />
      <text x="10" y="37" fill="#f8f8f2" font-family="sans-serif" font-size="10" font-weight="bold">Rack Designer</text>
      <!-- Hamburger Menu -->
      <line x1="115" y1="27" x2="130" y2="27" stroke="#ff79c6" stroke-width="2"/>
      <line x1="115" y1="32" x2="130" y2="32" stroke="#ff79c6" stroke-width="2"/>
      <line x1="115" y1="37" x2="130" y2="37" stroke="#ff79c6" stroke-width="2"/>
      
      <!-- Canvas -->
      <rect x="4" y="45" width="132" height="230" fill="#1e1e24" />
      <!-- Racks stacked vertically -->
      <rect x="20" y="60" width="100" height="80" rx="2" fill="#282a36" stroke="#bd93f9" stroke-width="1"/>
      <rect x="25" y="70" width="90" height="15" fill="#8be9fd"/>
      <rect x="25" y="90" width="90" height="15" fill="#ffb86c"/>
      
      <rect x="20" y="160" width="100" height="80" rx="2" fill="#282a36" stroke="#bd93f9" stroke-width="1"/>
      <rect x="25" y="170" width="90" height="15" fill="#50fa7b"/>

      <text x="70" y="295" fill="#6272a4" font-family="sans-serif" font-size="12" text-anchor="middle">Vista Compacta</text>
    </g>

    <!-- Arrow -->
    <path d="M 155 140 L 185 140" stroke="#6272a4" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#6272a4" />
      </marker>
    </defs>

    <!-- Device 2: Offcanvas Menu & Drawer -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="140" height="280" rx="16" fill="#21222c" stroke="#44475a" stroke-width="4"/>
      <!-- Notch -->
      <path d="M 50 4 L 90 4 L 85 15 L 55 15 Z" fill="#44475a"/>
      
      <!-- Dimmed Canvas -->
      <rect x="4" y="20" width="132" height="255" fill="#1e1e24" opacity="0.5"/>
      <rect x="20" y="60" width="100" height="80" rx="2" fill="#282a36" stroke="#bd93f9" stroke-width="1" opacity="0.5"/>
      <rect x="20" y="160" width="100" height="80" rx="2" fill="#282a36" stroke="#bd93f9" stroke-width="1" opacity="0.5"/>

      <!-- Off-canvas Menu (sliding from right) -->
      <rect x="60" y="20" width="76" height="255" fill="#282a36" filter="url(#shadow)"/>
      <rect x="65" y="30" width="66" height="10" rx="2" fill="#ff79c6" />
      <rect x="65" y="50" width="66" height="10" rx="2" fill="#44475a" />
      <rect x="65" y="65" width="66" height="10" rx="2" fill="#44475a" />
      <rect x="65" y="80" width="66" height="10" rx="2" fill="#44475a" />

      <!-- Inventory Drawer (sliding from bottom) -->
      <rect x="4" y="200" width="132" height="76" fill="#21222c" stroke="#44475a" stroke-width="1" filter="url(#shadow)"/>
      <line x1="50" y1="205" x2="90" y2="205" stroke="#6272a4" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="220" x2="130" y2="220" stroke="#44475a" stroke-width="2"/>
      <line x1="10" y1="235" x2="130" y2="235" stroke="#44475a" stroke-width="2"/>
      <line x1="10" y1="250" x2="130" y2="250" stroke="#44475a" stroke-width="2"/>

      <text x="70" y="295" fill="#6272a4" font-family="sans-serif" font-size="12" text-anchor="middle">Paneles Flotantes</text>
    </g>
  </g>

  <!-- Mobile Key Features -->
  <g transform="translate(650, 560)">
    <!-- Feature 1: Fast Placement -->
    <circle cx="20" cy="20" r="16" fill="#44475a"/>
    <path d="M 22 10 L 14 20 L 20 20 L 18 30 L 26 20 L 20 20 Z" fill="#f1fa8c"/>
    <text x="50" y="15" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold">Ubicación Rápida Asistida (⚡)</text>
    <text x="50" y="35" fill="#6272a4" font-family="sans-serif" font-size="14">Elimina el arrastre complejo mediante menús de destino.</text>

    <!-- Feature 2: Offcanvas/Drawers -->
    <circle cx="20" cy="80" r="16" fill="#44475a"/>
    <rect x="12" y="72" width="16" height="16" fill="none" stroke="#ff79c6" stroke-width="2" rx="2"/>
    <path d="M 22 72 L 22 88 M 12 82 L 28 82" stroke="#ff79c6" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="50" y="75" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold">Paneles Ocultables (Off-canvas)</text>
    <text x="50" y="95" fill="#6272a4" font-family="sans-serif" font-size="14">Menús laterales y tablas inferiores deslizables para ahorrar espacio.</text>

    <!-- Feature 3: Responsive Modals -->
    <circle cx="20" cy="140" r="16" fill="#44475a"/>
    <rect x="14" y="132" width="12" height="16" rx="2" fill="#50fa7b"/>
    <line x1="16" y1="136" x2="24" y2="136" stroke="#282a36" stroke-width="1"/>
    <line x1="16" y1="140" x2="24" y2="140" stroke="#282a36" stroke-width="1"/>
    <text x="50" y="135" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold">Modales Verticales Compactos</text>
    <text x="50" y="155" fill="#6272a4" font-family="sans-serif" font-size="14">Formularios reestructurados para evitar el desbordamiento horizontal.</text>
  </g>

</svg>
