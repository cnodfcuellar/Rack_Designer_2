<circle cx="910" cy="148" r="5" fill="#10b981" class="fps"/>
<text x="910" y="165" text-anchor="middle" class="p-s" fill="#10b981">60fps</text>

<line x1="610" y1="178" x2="610" y2="210" stroke="#06b6d4" stroke-width="1"/>
<line x1="825" y1="178" x2="825" y2="210" stroke="#06b6d4" stroke-width="1"/>

<!-- drawTopo phases -->
<rect x="520" y="210" width="180" height="44" rx="7" fill="#0a1a1f" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="610" y="229" text-anchor="middle" class="p-t" fill="#c4b5fd">① clearRect</text>
<text x="610" y="243" text-anchor="middle" class="p-s">Borra canvas completo</text>

<line x1="700" y1="232" x2="730" y2="232" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#pa2)"/>
<rect x="730" y="210" width="190" height="44" rx="7" fill="#0a1a1f" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="825" y="229" text-anchor="middle" class="p-t" fill="#c4b5fd">② Draw Rooms</text>
<text x="825" y="243" text-anchor="middle" class="p-s">roundRect + fillText</text>

<line x1="610" y1="254" x2="610" y2="286" stroke="#06b6d4" stroke-width="1"/>
<line x1="825" y1="254" x2="825" y2="286" stroke="#06b6d4" stroke-width="1"/>

<rect x="520" y="286" width="180" height="44" rx="7" fill="#0a1a1f" stroke="#10b981" stroke-width="1.5"/>
<text x="610" y="305" text-anchor="middle" class="p-t" fill="#34d399">③ Draw Racks</text>
<text x="610" y="319" text-anchor="middle" class="p-s">roundRect por rack</text>

<line x1="700" y1="308" x2="730" y2="308" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#pa2)"/>
<rect x="730" y="286" width="190" height="44" rx="7" fill="#0a1a1f" stroke="#f59e0b" stroke-width="1.5"/>
<text x="825" y="305" text-anchor="middle" class="p-t" fill="#fbbf24">④ Draw Connections</text>
<text x="825" y="319" text-anchor="middle" class="p-s">bezierCurveTo + partículas</text>

<line x1="610" y1="330" x2="610" y2="356" stroke="#06b6d4" stroke-width="1"/>
<line x1="825" y1="330" x2="825" y2="356" stroke="#06b6d4" stroke-width="1"/>
<line x1="610" y1="356" x2="825" y2="356" stroke="#06b6d4" stroke-width="1"/>
<line x1="720" y1="356" x2="720" y2="370" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#pa2)"/>
<rect x="640" y="370" width="160" height="30" rx="6" fill="#0a1a1f" stroke="#06b6d4" stroke-width="1.5"/>
<text x="720" y="390" text-anchor="middle" class="p-t" fill="#22d3ee">⑤ Draw Nodes + HUD</text>

<rect x="520" y="414" width="400" height="44" rx="8" fill="#0d1428" stroke="#06b6d4" stroke-width="1"/>
<text x="720" y="431" text-anchor="middle" class="p-l" fill="#22d3ee">⚡ Estrategia: borrado completo y repintado 60fps</text>
<text x="720" y="447" text-anchor="middle" class="p-l" fill="#475569">flowT acumula infinitamente (BUG-18) — fix: flowT = (flowT+0.015) % 1</text>

