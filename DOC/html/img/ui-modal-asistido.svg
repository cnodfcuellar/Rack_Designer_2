<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" style="background-color: transparent; font-family: -apple-system, sans-serif;">
  
  <!-- Modal Container -->
  <rect x="10" y="10" width="480" height="500" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="30" y="44" fill="#e3b341" font-size="16">⚡ ⚡</text>
  <text x="75" y="44" fill="#ffffff" font-size="18" font-weight="bold">Ubicar en Rack Asistido</text>
  <text x="30" y="65" fill="#8b949e" font-size="12">Instalar 2U de forma asistida sin arrastrar</text>

  <!-- Field 1: SELECCIONAR EQUIPO -->
  <text x="30" y="100" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">SELECCIONAR EQUIPO DEL CATÁLOGO</text>
  <rect x="30" y="110" width="440" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <rect x="40" y="122" width="8" height="12" fill="#c9d1d9" rx="1"/>
  <text x="60" y="133" fill="#c9d1d9" font-size="13" font-weight="bold">Server HP ProLiant (SERVER)</text>
  <text x="450" y="133" fill="#c9d1d9" font-size="12">▼</text>

  <!-- Field 2: 1. SELECCIONAR SALA -->
  <text x="30" y="175" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">1. SELECCIONAR SALA</text>
  <rect x="30" y="185" width="440" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="40" y="208" fill="#58a6ff" font-size="14">🏢</text>
  <text x="60" y="208" fill="#c9d1d9" font-size="13" font-weight="bold">ECA_bodega</text>
  <text x="450" y="208" fill="#c9d1d9" font-size="12">▼</text>

  <!-- Field 3: 2. SELECCIONAR GABINETE -->
  <text x="30" y="250" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">2. SELECCIONAR GABINETE</text>
  <rect x="30" y="260" width="440" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <rect x="40" y="272" width="10" height="12" fill="#8a2be2" rx="2"/>
  <rect x="42" y="274" width="6" height="2" fill="#ffffff" opacity="0.5"/>
  <rect x="42" y="278" width="6" height="2" fill="#ffffff" opacity="0.5"/>
  <text x="60" y="283" fill="#c9d1d9" font-size="13" font-weight="bold">cheque cosina (4U)</text>
  <text x="450" y="283" fill="#c9d1d9" font-size="12">▼</text>

  <!-- Field 4: 3. SELECCIONAR RANURA -->
  <text x="30" y="325" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">3. SELECCIONAR RANURA (SLOT U)</text>
  <rect x="30" y="335" width="440" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="45" y="358" fill="#c9d1d9" font-size="13" font-weight="bold">Posición U2 (Libre)</text>
  <text x="450" y="358" fill="#c9d1d9" font-size="12">▼</text>

  <!-- Field 5: 4. LADO DE MONTAJE -->
  <text x="30" y="400" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">4. LADO DE MONTAJE</text>
  <rect x="30" y="410" width="440" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="45" y="433" fill="#c9d1d9" font-size="13" font-weight="bold">Frontal</text>
  <text x="450" y="433" fill="#c9d1d9" font-size="12">▼</text>

  <!-- Footer Buttons -->
  <rect x="235" y="465" width="90" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="280" y="485" fill="#c9d1d9" font-size="12" text-anchor="middle">Cancelar</text>

  <rect x="335" y="465" width="135" height="32" fill="#0ea5e9" rx="4" opacity="0.2"/>
  <rect x="335" y="465" width="135" height="32" fill="transparent" stroke="#0ea5e9" stroke-width="1" rx="4"/>
  <text x="402" y="485" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Instalar Equipo</text>

