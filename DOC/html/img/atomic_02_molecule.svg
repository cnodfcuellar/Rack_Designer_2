<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="cyanSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>
    <radialGradient id="purpleSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" rx="15" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle background grid -->
  <g stroke="#334155" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>

  <!-- Molecule Bonds -->
  <g stroke="#a855f7" stroke-width="4" stroke-linecap="round">
    <line x1="200" y1="130" x2="150" y2="160"/>
    <line x1="200" y1="130" x2="250" y2="160"/>
    <line x1="200" y1="130" x2="200" y2="80"/>
  </g>
  <g stroke="#a855f7" stroke-width="12" stroke-linecap="round" opacity="0.2" filter="url(#glow)">
    <line x1="200" y1="130" x2="150" y2="160"/>
    <line x1="200" y1="130" x2="250" y2="160"/>
    <line x1="200" y1="130" x2="200" y2="80"/>
  </g>

  <!-- Spheres (Atoms) forming the Molecule -->
  <circle cx="200" cy="130" r="28" fill="url(#purpleSphere)"/>
  <circle cx="150" cy="160" r="18" fill="url(#cyanSphere)"/>
  <circle cx="250" cy="160" r="18" fill="url(#cyanSphere)"/>
  <circle cx="200" cy="80" r="14" fill="url(#cyanSphere)"/>

  <text x="200" y="225" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#c084fc" text-anchor="middle" letter-spacing="1">MOLÉCULA</text>
  <text x="200" y="248" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#94a3b8" text-anchor="middle">Unión de átomos para formar un elemento funcional</text>
  <text x="200" y="270" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Label + Input / Item Catálogo (Nombre+Icono)</text>
</svg>
