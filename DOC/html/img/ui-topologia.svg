<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" style="background-color: #0d1117; font-family: -apple-system, sans-serif;">
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="500" fill="#161b22"/>
  <line x1="220" y1="0" x2="220" y2="500" stroke="#30363d" stroke-width="1"/>
  
  <rect x="10" y="10" width="100" height="25" fill="#1f6feb" rx="4" opacity="0.2"/>
  <text x="60" y="26" fill="#58a6ff" font-size="11" text-anchor="middle">Todos</text>
  <text x="135" y="26" fill="#8b949e" font-size="11" text-anchor="middle">Servers</text>
  <text x="185" y="26" fill="#8b949e" font-size="11" text-anchor="middle">Red</text>

  <!-- Sidebar Item 1 -->
  <rect x="10" y="45" width="200" height="40" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4"/>
  <rect x="10" y="45" width="4" height="40" fill="#1f6feb" rx="2"/>
  <rect x="20" y="55" width="16" height="16" fill="#30363d" rx="2"/>
  <text x="45" y="62" fill="#c9d1d9" font-size="11" font-weight="bold">NAS 2U</text>
  <text x="45" y="75" fill="#8b949e" font-size="9">STORAGE | 150W</text>
  
  <!-- Sidebar Item 2 -->
  <rect x="10" y="95" width="200" height="40" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4"/>
  <rect x="10" y="95" width="4" height="40" fill="#1f6feb" rx="2"/>
  <rect x="20" y="105" width="16" height="16" fill="#30363d" rx="2"/>
  <text x="45" y="112" fill="#c9d1d9" font-size="11" font-weight="bold">PC Desktop</text>
  <text x="45" y="125" fill="#8b949e" font-size="9">PC | 250W</text>

  <!-- Sidebar Item 3 -->
  <rect x="10" y="145" width="200" height="40" fill="#0d1117" stroke="#8a2be2" stroke-width="1" rx="4"/>
  <rect x="10" y="145" width="4" height="40" fill="#8a2be2" rx="2"/>
  <rect x="20" y="155" width="16" height="16" fill="#30363d" rx="2"/>
  <text x="45" y="162" fill="#c9d1d9" font-size="11" font-weight="bold">Cámara IP</text>
  <text x="45" y="175" fill="#8b949e" font-size="9">CAMERA | 15W</text>

  <!-- Sidebar Item 4 -->
  <rect x="10" y="195" width="200" height="40" fill="#0d1117" stroke="#2ea043" stroke-width="1" rx="4"/>
  <rect x="10" y="195" width="4" height="40" fill="#2ea043" rx="2"/>
  <rect x="20" y="205" width="16" height="16" fill="#30363d" rx="2"/>
  <text x="45" y="212" fill="#c9d1d9" font-size="11" font-weight="bold">Access Point Wifi</text>
  <text x="45" y="225" fill="#8b949e" font-size="9">AP | 20W</text>

  <!-- Main Canvas (Blue Background) -->
  <rect x="221" y="0" width="779" height="500" fill="#1f6feb" opacity="0.1"/>
  <pattern id="dots4" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="#1f6feb" cx="10" cy="10" r="1" opacity="0.3"></circle>
  </pattern>
  <rect x="221" y="0" width="779" height="500" fill="url(#dots4)"/>

  <!-- Toolbar Top -->
  <rect x="240" y="15" width="200" height="30" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="340" y="34" fill="#c9d1d9" font-size="12" text-anchor="middle">Vista Física        |        Topología</text>
  
  <!-- Sala 1: ECA_Matriz (Orange Block) -->
  <rect x="350" y="100" width="220" height="340" fill="#ff7b25" stroke="#e66000" stroke-width="2" rx="12"/>
  <text x="365" y="125" fill="#ffffff" font-size="14" font-weight="bold">ECA_Matriz</text>
  
  <!-- Rack 1: Rack_principal (Green Block) -->
  <rect x="380" y="140" width="160" height="230" fill="#5cba2d" stroke="#489e1f" stroke-width="2" rx="8"/>
  <text x="390" y="155" fill="#ffffff" font-size="11" font-weight="bold">Rack_principal</text>

  <!-- Rack Nodes -->
  <!-- Node 1 -->
  <circle cx="460" cy="175" r="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <rect x="456" y="171" width="8" height="8" fill="#58a6ff" rx="1"/>
  <text x="460" y="195" fill="#ffffff" font-size="8" text-anchor="middle">Switch Poe 24P</text>
  
  <!-- Node 2 -->
  <circle cx="460" cy="210" r="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <rect x="456" y="206" width="8" height="8" fill="#58a6ff" rx="1"/>
  <text x="460" y="230" fill="#ffffff" font-size="8" text-anchor="middle">Switch 24P</text>
  
  <!-- Node 3 -->
  <circle cx="460" cy="245" r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <rect x="456" y="241" width="8" height="8" fill="#d2a8ff" rx="1"/>
  <text x="460" y="265" fill="#ffffff" font-size="8" text-anchor="middle">NVR 16ch</text>
  
  <!-- Node 4 (Router Core) -->
  <circle cx="460" cy="280" r="10" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <rect x="456" y="276" width="8" height="8" fill="#58a6ff" rx="1"/>
  <text x="460" y="300" fill="#ffffff" font-size="8" text-anchor="middle">Router Core</text>

  <!-- Node 5 (Router Core 2) -->
  <circle cx="460" cy="315" r="10" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <rect x="456" y="311" width="8" height="8" fill="#58a6ff" rx="1"/>
  <text x="460" y="335" fill="#ffffff" font-size="8" text-anchor="middle">Router Core</text>

  <!-- Floor Nodes (ECA_Matriz) -->
  <circle cx="380" cy="405" r="12" fill="#0d1117" stroke="#8a2be2" stroke-width="2"/>
  <text x="380" y="425" fill="#ffffff" font-size="7" text-anchor="middle">Cámara IP</text>

  <circle cx="420" cy="405" r="12" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="420" y="425" fill="#ffffff" font-size="7" text-anchor="middle">Impresora Red</text>

  <circle cx="460" cy="405" r="12" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <text x="460" y="425" fill="#ffffff" font-size="7" text-anchor="middle">Teléfono VoIP</text>
  
  <circle cx="500" cy="405" r="12" fill="#0d1117" stroke="#1f6feb" stroke-width="2"/>
  <text x="500" y="425" fill="#ffffff" font-size="7" text-anchor="middle">PC Desktop</text>


  <!-- Sala 2: ECA_bodega (Orange Block) -->
  <rect x="650" y="100" width="200" height="180" fill="#ff7b25" stroke="#ffffff" stroke-width="2" rx="12"/>
  <text x="665" y="125" fill="#ffffff" font-size="14" font-weight="bold">ECA_bodega</text>
  
  <!-- Rack 2: cheque cosina (Green Block) -->
  <rect x="670" y="140" width="160" height="120" fill="#5cba2d" stroke="#489e1f" stroke-width="2" rx="8"/>
  <text x="680" y="155" fill="#ffffff" font-size="11" font-weight="bold">cheque cosina</text>

  <!-- Rack Nodes -->
  <!-- Node 1 -->
  <circle cx="750" cy="190" r="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <rect x="746" y="186" width="8" height="8" fill="#58a6ff" rx="1"/>
  <text x="750" y="210" fill="#ffffff" font-size="8" text-anchor="middle">Switch Managed 2</text>

  <!-- Curved Connection Line (Cable) -->
  <path d="M 470 280 C 560 280, 600 190, 740 190" fill="transparent" stroke="#f7f13b" stroke-width="3"/>
  <circle cx="470" cy="280" r="3" fill="#ffffff"/>
  <circle cx="550" cy="245" r="2" fill="#ffffff"/>
  <circle cx="630" cy="210" r="2" fill="#ffffff"/>
  <circle cx="740" cy="190" r="3" fill="#ffffff"/>

</svg>
