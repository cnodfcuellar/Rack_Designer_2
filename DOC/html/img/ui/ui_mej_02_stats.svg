<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="1100" height="260">
<defs>
  <style>
    @keyframes gauge-fill { from{stroke-dashoffset:220} to{stroke-dashoffset:var(--end)} }
    .g1 { animation: gauge-fill 2s ease-out forwards; --end:66; }
    .g2 { animation: gauge-fill 2s ease-out 0.3s forwards; --end:110; }
    .g3 { animation: gauge-fill 2s ease-out 0.6s forwards; --end:30; }
    @keyframes pulse-red { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .pulse-red { animation: pulse-red 1s ease-in-out infinite; }
  </style>
</defs>
<rect width="1100" height="260" fill="#060a14" rx="12"/>
<text x="550" y="18" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#475569">PROPUESTA — Panel de Estadísticas Mejorado</text>

<!-- Card 1: Racks -->
<rect x="20" y="30" width="200" height="210" rx="12" fill="#0d1428" stroke="#1e2d4e"/>
<text x="120" y="52" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#94a3b8">GABINETES</text>
<circle cx="120" cy="130" r="60" fill="none" stroke="#1e2d4e" stroke-width="12"/>
<circle cx="120" cy="130" r="60" fill="none" stroke="#38bdf8" stroke-width="12" stroke-dasharray="220 220" stroke-linecap="round" stroke-dashoffset="66" transform="rotate(-90 120 130)" class="g1"/>
<text x="120" y="124" text-anchor="middle" font-family="Space Grotesk" font-size="28" font-weight="700" fill="#38bdf8">4</text>
<text x="120" y="142" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">gabinetes</text>
<text x="120" y="220" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">70% de sala llena</text>

<!-- Card 2: U capacity — CRITICAL -->
<rect x="230" y="30" width="200" height="210" rx="12" fill="#0d1428" stroke="#ef444455" class="pulse-red"/>
<text x="330" y="52" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#f87171">CAPACIDAD U ⚠</text>
<circle cx="330" cy="130" r="60" fill="none" stroke="#1e2d4e" stroke-width="12"/>
<circle cx="330" cy="130" r="60" fill="none" stroke="#ef4444" stroke-width="12" stroke-dasharray="220 220" stroke-linecap="round" stroke-dashoffset="30" transform="rotate(-90 330 130)"/>
<!-- Alert threshold arc (80%) -->
<circle cx="330" cy="130" r="60" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="176 44" stroke-linecap="round" transform="rotate(-90 330 130)" opacity="0.5"/>
<text x="330" y="118" text-anchor="middle" font-family="Space Grotesk" font-size="20" font-weight="700" fill="#ef4444">86%</text>
<text x="330" y="136" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#f87171">60/70 U usadas</text>
<rect x="250" y="205" width="160" height="20" rx="6" fill="#ef444420" stroke="#ef444450"/>
<text x="330" y="219" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#f87171">⚠ Crítico — añade racks</text>

<!-- Card 3: Power -->
<rect x="440" y="30" width="200" height="210" rx="12" fill="#0d1428" stroke="#1e2d4e"/>
<text x="540" y="52" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#94a3b8">POTENCIA</text>
<circle cx="540" cy="130" r="60" fill="none" stroke="#1e2d4e" stroke-width="12"/>
<circle cx="540" cy="130" r="60" fill="none" stroke="#8b5cf6" stroke-width="12" stroke-dasharray="220 220" stroke-linecap="round" stroke-dashoffset="110" transform="rotate(-90 540 130)" class="g2"/>
<text x="540" y="122" text-anchor="middle" font-family="Space Grotesk" font-size="20" font-weight="700" fill="#8b5cf6">2340</text>
<text x="540" y="138" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">W consumidos</text>
<text x="540" y="220" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">Límite: 5000W | 47%</text>

<!-- Card 4: Connections -->
<rect x="650" y="30" width="200" height="210" rx="12" fill="#0d1428" stroke="#1e2d4e"/>
<text x="750" y="52" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#94a3b8">CONEXIONES</text>
<circle cx="750" cy="130" r="60" fill="none" stroke="#1e2d4e" stroke-width="12"/>
<circle cx="750" cy="130" r="60" fill="none" stroke="#10b981" stroke-width="12" stroke-dasharray="220 220" stroke-linecap="round" stroke-dashoffset="30" transform="rotate(-90 750 130)" class="g3"/>
<text x="750" y="122" text-anchor="middle" font-family="Space Grotesk" font-size="28" font-weight="700" fill="#10b981">12</text>
<text x="750" y="138" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">cables activos</text>
<text x="750" y="220" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">86% de equipos conectados</text>

<!-- Card 5: Next free slot recommendation -->
<rect x="860" y="30" width="220" height="210" rx="12" fill="#061a10" stroke="#10b98155"/>
<text x="970" y="52" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#34d399">PRÓXIMO LIBRE</text>
<text x="970" y="78" text-anchor="middle" font-size="20">🗄</text>
<rect x="880" y="90" width="180" height="28" rx="6" fill="#10b98120" stroke="#10b98140"/>
<text x="970" y="108" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="600" fill="#6ee7b7">Rack 2 — U7-U10</text>
<text x="970" y="130" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#64748b">4U disponibles</text>
<text x="970" y="146" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#64748b">Frente · 320W libres</text>
<rect x="895" y="158" width="150" height="28" rx="8" fill="#10b981" stroke="none"/>
<text x="970" y="176" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#fff">⚡ Instalar aquí</text>
<text x="970" y="208" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#475569">Sugerencia inteligente</text>
</svg>