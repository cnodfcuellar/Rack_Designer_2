<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="1100" height="260">
<defs>
  <style>
    @keyframes notif-in { from{transform:translateX(40px);opacity:0} to{transform:translateX(0);opacity:1} }
    .ni1 { animation: notif-in 0.3s ease-out forwards; }
    .ni2 { animation: notif-in 0.3s ease-out 0.1s both; }
    .ni3 { animation: notif-in 0.3s ease-out 0.2s both; }
    .ni4 { animation: notif-in 0.3s ease-out 0.3s both; }
    @keyframes progress-drain { from{width:100%} to{width:0%} }
    .pd { animation: progress-drain 5s linear forwards; }
  </style>
</defs>
<rect width="1100" height="260" fill="#060a14" rx="12"/>
<text x="550" y="18" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#475569">PROPUESTA — Sistema de Notificaciones</text>

<!-- NOTIFICATION STACK — right side -->
<!-- Notif 1: Success with undo -->
<rect x="740" y="30" width="340" height="56" rx="10" fill="#0d1428" stroke="#10b981" stroke-width="1.5" class="ni1"/>
<rect x="740" y="30" width="4" height="56" rx="2" fill="#10b981"/>
<text x="756" y="48" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#34d399">✓ Equipo instalado</text>
<text x="756" y="64" font-family="JetBrains Mono" font-size="9" fill="#64748b">Server Dell R740 → Rack 1 / U3</text>
<!-- undo button -->
<rect x="970" y="36" width="60" height="20" rx="6" fill="#10b98130" stroke="#10b98180"/>
<text x="1000" y="50" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="600" fill="#34d399">↩ Deshacer</text>
<!-- close -->
<text x="1065" y="56" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#475569">✕</text>
<!-- progress bar -->
<rect x="744" y="82" width="332" height="3" rx="1.5" fill="#1e2d4e"/>
<rect x="744" y="82" width="200" height="3" rx="1.5" fill="#10b981" class="pd"/>

<!-- Notif 2: Warning -->
<rect x="740" y="100" width="340" height="52" rx="10" fill="#0d1428" stroke="#f59e0b" stroke-width="1.5" class="ni2"/>
<rect x="740" y="100" width="4" height="52" rx="2" fill="#f59e0b"/>
<text x="756" y="118" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#fbbf24">⚠ Capacidad crítica</text>
<text x="756" y="134" font-family="JetBrains Mono" font-size="9" fill="#64748b">Rack 1 al 86% — considera agregar gabinete</text>
<text x="1065" y="126" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#475569">✕</text>

<!-- Notif 3: Error -->
<rect x="740" y="168" width="340" height="52" rx="10" fill="#0d1428" stroke="#ef4444" stroke-width="1.5" class="ni3"/>
<rect x="740" y="168" width="4" height="52" rx="2" fill="#ef4444"/>
<text x="756" y="186" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#f87171">✗ IP duplicada detectada</text>
<text x="756" y="202" font-family="JetBrains Mono" font-size="9" fill="#64748b">192.168.1.1 ya existe en Switch Cisco 48P</text>
<rect x="950" y="172" width="72" height="20" rx="6" fill="#ef444420" stroke="#ef444460"/>
<text x="986" y="186" text-anchor="middle" font-family="Space Grotesk" font-size="9" fill="#f87171">Ver equipo</text>
<text x="1065" y="194" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#475569">✕</text>

<!-- Overflow indicator -->
<rect x="740" y="232" width="340" height="18" rx="9" fill="#1e2d4e" stroke="#243655"/>
<text x="910" y="245" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">+2 notificaciones más — ver historial 🔔</text>

<!-- HISTORY CENTER panel -->
<rect x="20" y="30" width="300" height="210" rx="12" fill="#0d1428" stroke="#38bdf8" stroke-width="1.5"/>
<rect x="20" y="30" width="300" height="40" rx="12" fill="#0f2035"/>
<rect x="20" y="56" width="300" height="14" fill="#0f2035"/>
<text x="32" y="52" font-family="Space Grotesk" font-size="12" font-weight="700" fill="#e2e8f0">🔔 Centro de Historial</text>
<rect x="248" y="35" width="28" height="18" rx="5" fill="#ef444430" stroke="#ef444460"/>
<text x="262" y="48" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#f87171">5</text>
<text x="286" y="52" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#475569">✕</text>

<!-- History items -->
<text x="32" y="85" font-family="JetBrains Mono" font-size="8" fill="#1e2d4e">—— Hoy ——</text>

<text x="32" y="102" font-family="Space Grotesk" font-size="10" fill="#34d399">✓ Server Dell instalado</text>
<text x="32" y="114" font-family="JetBrains Mono" font-size="8" fill="#475569">17:03 · Rack 1 · U3</text>

<text x="32" y="130" font-family="Space Grotesk" font-size="10" fill="#fbbf24">⚠ Cap. crítica Rack 1</text>
<text x="32" y="142" font-family="JetBrains Mono" font-size="8" fill="#475569">17:02</text>

<text x="32" y="158" font-family="Space Grotesk" font-size="10" fill="#f87171">✗ IP duplicada: 192.168.1.1</text>
<text x="32" y="170" font-family="JetBrains Mono" font-size="8" fill="#475569">16:55 · Equipo: Switch Cisco</text>

<text x="32" y="186" font-family="Space Grotesk" font-size="10" fill="#7dd3fc">ℹ Cable Eth0→Eth1 creado</text>
<text x="32" y="198" font-family="JetBrains Mono" font-size="8" fill="#475569">16:44</text>

<text x="32" y="214" font-family="Space Grotesk" font-size="10" fill="#34d399">✓ Sala "Piso 2" creada</text>
<text x="32" y="226" font-family="JetBrains Mono" font-size="8" fill="#475569">16:30</text>

<!-- Annotation -->
<text x="390" y="240" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">← Panel de historial lateral (nuevo)</text>
<text x="910" y="60" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#64748b">Máximo 4 notificaciones simultáneas + barra de tiempo</text>
</svg>