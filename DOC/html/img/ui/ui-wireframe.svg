<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" style="background-color: #0d1117; font-family: -apple-system, sans-serif;">
  
  <!-- Header Background -->
  <rect x="0" y="0" width="1000" height="50" fill="#161b22" border-bottom="1px solid #30363d"/>
  <line x1="0" y1="50" x2="1000" y2="50" stroke="#30363d" stroke-width="1"/>

  <!-- Logo area -->
  <rect x="15" y="15" width="20" height="20" fill="#2196f3" rx="4"/>
  <text x="45" y="30" fill="#c9d1d9" font-size="16" font-weight="bold">RACK Designer</text>
  
  <!-- Header Center Buttons -->
  <rect x="250" y="10" width="100" height="30" fill="#1f6feb" rx="4" opacity="0.2"/>
  <text x="300" y="30" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Vista Física</text>
  <text x="400" y="30" fill="#8b949e" font-size="12" text-anchor="middle">Topología</text>

  <!-- Header Right Search -->
  <rect x="750" y="10" width="180" height="30" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="15"/>
  <text x="770" y="29" fill="#8b949e" font-size="11">🔍 Buscar equipo, IP...</text>

  <!-- Left Sidebar (Catalog) -->
  <rect x="0" y="51" width="220" height="549" fill="#161b22"/>
  <line x1="220" y1="51" x2="220" y2="600" stroke="#30363d" stroke-width="1"/>
  
  <!-- Sidebar Buttons -->
  <rect x="15" y="70" width="90" height="30" fill="#1f6feb" stroke="#388bfd" stroke-width="1" rx="4" opacity="0.1"/>
  <text x="60" y="89" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">+ Rack</text>
  
  <rect x="115" y="70" width="90" height="30" fill="#21262d" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="160" y="89" fill="#c9d1d9" font-size="11" text-anchor="middle">+ Equipo</text>

  <!-- Sidebar List Items (Mockup) -->
  <rect x="15" y="130" width="190" height="50" fill="#0d1117" stroke="#8a2be2" stroke-width="2" rx="4"/>
  <rect x="25" y="145" width="20" height="20" fill="#30363d" rx="4"/>
  <text x="55" y="152" fill="#c9d1d9" font-size="12" font-weight="bold">Cámara IP</text>
  <text x="55" y="168" fill="#8b949e" font-size="10">Piso | 15W</text>

  <rect x="15" y="190" width="190" height="50" fill="#0d1117" stroke="#238636" stroke-width="2" rx="4"/>
  <rect x="25" y="205" width="20" height="20" fill="#30363d" rx="4"/>
  <text x="55" y="212" fill="#c9d1d9" font-size="12" font-weight="bold">Access Point Wifi</text>
  <text x="55" y="228" fill="#8b949e" font-size="10">Piso | 20W</text>
  
  <rect x="15" y="250" width="190" height="50" fill="#0d1117" stroke="#d29922" stroke-width="2" rx="4"/>
  <rect x="25" y="265" width="20" height="20" fill="#30363d" rx="4"/>
  <text x="55" y="272" fill="#c9d1d9" font-size="12" font-weight="bold">Controlador Puer...</text>
  <text x="55" y="288" fill="#8b949e" font-size="10">Piso | 30W</text>

  <!-- Main Canvas Toolbar -->
  <rect x="221" y="51" width="779" height="40" fill="#161b22"/>
  <line x1="221" y1="91" x2="1000" y2="91" stroke="#30363d" stroke-width="1"/>
  
  <rect x="350" y="60" width="100" height="22" fill="#1f6feb" rx="4" opacity="0.2"/>
  <text x="400" y="75" fill="#58a6ff" font-size="11" text-anchor="middle">ECA_Matriz</text>
  
  <rect x="460" y="60" width="100" height="22" fill="#21262d" rx="4"/>
  <text x="510" y="75" fill="#8b949e" font-size="11" text-anchor="middle">ECA_bodega</text>

  <rect x="900" y="60" width="80" height="22" fill="#21262d" rx="4"/>
  <text x="940" y="75" fill="#8b949e" font-size="10" text-anchor="middle">📷 PNG</text>

  <!-- Main Canvas Area (Dot Grid) -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="#30363d" cx="10" cy="10" r="1"></circle>
  </pattern>
  <rect x="221" y="92" width="779" height="308" fill="url(#dots)"/>

  <!-- Rendered Rack Mockup -->
  <rect x="260" y="120" width="250" height="260" fill="#0d1117" stroke="#21262d" stroke-width="2" rx="6"/>
  <rect x="260" y="120" width="250" height="30" fill="#161b22" stroke="#21262d" stroke-width="1" rx="6"/>
  <text x="280" y="140" fill="#c9d1d9" font-size="12" font-weight="bold">Rack_principal</text>
  <rect x="375" y="125" width="50" height="18" fill="#21262d" rx="2"/>
  <text x="400" y="137" fill="#8b949e" font-size="9" text-anchor="middle">🔄 ATRÁS</text>

  <!-- U slots inside rack -->
  <line x1="260" y1="170" x2="510" y2="170" stroke="#21262d" stroke-width="1"/>
  <line x1="260" y1="200" x2="510" y2="200" stroke="#21262d" stroke-width="1"/>
  <line x1="260" y1="230" x2="510" y2="230" stroke="#21262d" stroke-width="1"/>
  <line x1="260" y1="260" x2="510" y2="260" stroke="#21262d" stroke-width="1"/>

  <!-- Devices inside rack -->
  <!-- Switch -->
  <rect x="280" y="172" width="210" height="26" fill="#0d1117" stroke="#238636" stroke-width="1"/>
  <rect x="285" y="178" width="10" height="14" fill="#238636" rx="2"/>
  <rect x="300" y="178" width="10" height="14" fill="#238636" rx="2"/>
  <rect x="315" y="178" width="10" height="14" fill="#238636" rx="2"/>

  <!-- Server -->
  <rect x="280" y="232" width="210" height="56" fill="#0d1117" stroke="#1f6feb" stroke-width="1"/>
  <circle cx="295" cy="245" r="4" fill="#1f6feb"/>
  <circle cx="295" cy="265" r="4" fill="#2ea043"/>
  <line x1="310" y1="245" x2="350" y2="245" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Storage -->
  <rect x="280" y="322" width="210" height="26" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
  <text x="290" y="340" fill="#d29922" font-size="12" font-weight="bold">RT</text>
  <rect x="320" y="328" width="15" height="14" fill="#21262d" stroke="#d29922" stroke-width="1" rx="2"/>
  <rect x="340" y="328" width="15" height="14" fill="#21262d" stroke="#d29922" stroke-width="1" rx="2"/>

  <!-- Bottom Panel (Inventory) -->
  <rect x="221" y="400" width="779" height="200" fill="#161b22"/>
  <line x1="221" y1="400" x2="1000" y2="400" stroke="#30363d" stroke-width="1"/>
  
  <!-- Bottom Toolbar -->
  <rect x="235" y="415" width="80" height="22" fill="#1f6feb" rx="4" opacity="0.2"/>
  <text x="275" y="430" fill="#58a6ff" font-size="11" text-anchor="middle">Inventario</text>
  <text x="350" y="430" fill="#8b949e" font-size="11" text-anchor="middle">Conexiones</text>

  <rect x="620" y="410" width="80" height="26" fill="#0d1117" stroke="#8a2be2" stroke-width="1" rx="4"/>
  <text x="660" y="427" fill="#c9d1d9" font-size="10" text-anchor="middle">⚡ Agregar Equipo</text>
  
  <rect x="850" y="410" width="60" height="26" fill="#21262d" rx="4"/>
  <text x="880" y="427" fill="#8b949e" font-size="10" text-anchor="middle">⬇ CSV</text>
  
  <!-- Table Header -->
  <line x1="221" y1="450" x2="1000" y2="450" stroke="#30363d" stroke-width="1"/>
  <text x="240" y="465" fill="#8b949e" font-size="9" font-weight="bold">RACK</text>
  <text x="320" y="465" fill="#8b949e" font-size="9" font-weight="bold">U</text>
  <text x="350" y="465" fill="#8b949e" font-size="9" font-weight="bold">LADO</text>
  <text x="420" y="465" fill="#8b949e" font-size="9" font-weight="bold">NOMBRE</text>
  <text x="520" y="465" fill="#8b949e" font-size="9" font-weight="bold">MARCA</text>
  <text x="600" y="465" fill="#8b949e" font-size="9" font-weight="bold">TIPO</text>
  <text x="660" y="465" fill="#8b949e" font-size="9" font-weight="bold">IP</text>
  <text x="760" y="465" fill="#8b949e" font-size="9" font-weight="bold">CONSUMO</text>

  <!-- Table Row 1 -->
  <line x1="221" y1="480" x2="1000" y2="480" stroke="#30363d" stroke-width="1"/>
  <text x="240" y="495" fill="#c9d1d9" font-size="11">Rack_principal</text>
  <text x="320" y="495" fill="#c9d1d9" font-size="11">7</text>
  <rect x="345" y="483" width="50" height="16" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8"/>
  <text x="370" y="494" fill="#c9d1d9" font-size="9" text-anchor="middle">Frontal</text>
  <text x="420" y="495" fill="#c9d1d9" font-size="11">NVR 16ch</text>
  <text x="520" y="495" fill="#c9d1d9" font-size="11">Hikvision</text>
  <rect x="600" y="485" width="40" height="14" fill="#1f6feb" rx="2" opacity="0.2"/>
  <text x="620" y="495" fill="#58a6ff" font-size="8" font-weight="bold" text-anchor="middle">STORAGE</text>
  <text x="660" y="495" fill="#c9d1d9" font-size="11">192.168.10.71</text>
  <text x="760" y="495" fill="#c9d1d9" font-size="11">200 W</text>

  <!-- Table Row 2 -->
  <line x1="221" y1="510" x2="1000" y2="510" stroke="#30363d" stroke-width="1"/>
  <text x="240" y="525" fill="#c9d1d9" font-size="11">Rack_principal</text>
  <text x="320" y="525" fill="#c9d1d9" font-size="11">11</text>
  <rect x="345" y="513" width="50" height="16" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8"/>
  <text x="370" y="524" fill="#c9d1d9" font-size="9" text-anchor="middle">Frontal</text>
  <text x="420" y="525" fill="#c9d1d9" font-size="11">PDU 8TOMAS</text>
  <text x="520" y="525" fill="#c9d1d9" font-size="11">TECLAM</text>
  <rect x="600" y="515" width="40" height="14" fill="#8a2be2" rx="2" opacity="0.2"/>
  <text x="620" y="525" fill="#d2a8ff" font-size="8" font-weight="bold" text-anchor="middle">UPS</text>
  <text x="660" y="525" fill="#8b949e" font-size="11">-</text>
  <text x="760" y="525" fill="#c9d1d9" font-size="11">0 W</text>

</svg>
