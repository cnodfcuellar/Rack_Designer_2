<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" style="background-color: transparent; font-family: -apple-system, sans-serif;">
  
  <!-- Modal Background Shadow -->
  <rect x="0" y="0" width="500" height="300" fill="transparent"/>
  
  <!-- Modal Container -->
  <rect x="10" y="10" width="480" height="270" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8" />

  <!-- Header -->
  <rect x="30" y="30" width="12" height="16" fill="#8a2be2" rx="2"/>
  <rect x="32" y="32" width="8" height="2" fill="#fff" opacity="0.5"/>
  <rect x="32" y="36" width="8" height="2" fill="#fff" opacity="0.5"/>
  <text x="50" y="44" fill="#ffffff" font-size="18" font-weight="bold">Nuevo Gabinete</text>
  <text x="30" y="65" fill="#8b949e" font-size="12">Configura las propiedades del gabinete físico</text>

  <!-- Field 1: NOMBRE DEL GABINETE -->
  <text x="30" y="100" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">NOMBRE DEL GABINETE</text>
  <rect x="30" y="110" width="440" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="45" y="132" fill="#c9d1d9" font-size="13">Rack A1 - Producción</text>

  <!-- Row for Altura and Color -->
  
  <!-- Field 2: ALTURA (U) -->
  <text x="30" y="175" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">ALTURA (U)</text>
  <rect x="30" y="185" width="200" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="45" y="207" fill="#c9d1d9" font-size="13">24</text>

  <!-- Field 3: COLOR -->
  <text x="250" y="175" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">COLOR</text>
  
  <!-- Color Picker Box -->
  <rect x="250" y="185" width="36" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <rect x="255" y="190" width="26" height="26" fill="#0ea5e9" rx="2"/>
  
  <!-- Color Text Input -->
  <rect x="296" y="185" width="174" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="310" y="207" fill="#c9d1d9" font-size="13">#0ea5e9</text>

  <!-- Footer Buttons -->
  <rect x="290" y="240" width="80" height="32" fill="transparent" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="330" y="260" fill="#c9d1d9" font-size="12" text-anchor="middle">Cancelar</text>

  <rect x="380" y="240" width="90" height="32" fill="#0ea5e9" rx="4" opacity="0.2"/>
  <rect x="380" y="240" width="90" height="32" fill="transparent" stroke="#0ea5e9" stroke-width="1" rx="4"/>
  <text x="425" y="260" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Guardar</text>

</svg>
