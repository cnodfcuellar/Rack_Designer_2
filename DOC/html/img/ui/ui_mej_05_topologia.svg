<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380">
<defs>
  <style>
    @keyframes topo-flow { from{stroke-dashoffset:30} to{stroke-dashoffset:0} }
    .tf { stroke-dasharray:10,5; animation: topo-flow 1.5s linear infinite; }
    @keyframes minimap-scan { 0%,100%{opacity:0.6} 50%{opacity:1} }
    .ms { animation: minimap-scan 2s ease-in-out infinite; }
  </style>
</defs>
<rect width="1100" height="380" fill="#0f1e3d" rx="12"/>
<!-- Grid dots -->
<pattern id="dots2" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
