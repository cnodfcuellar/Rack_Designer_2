<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" style="background-color: #2151a1; font-family: -apple-system, sans-serif;">
  
  <!-- Main Canvas Area (Blue Dot Grid) -->
  <pattern id="dots_zoom" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle fill="#ffffff" cx="15" cy="15" r="1.5" opacity="0.3"></circle>
  </pattern>
  <rect x="0" y="0" width="800" height="600" fill="url(#dots_zoom)"/>

  <!-- Sala 1: ECA_Matriz (Orange Block) -->
  <rect x="80" y="80" width="340" height="440" fill="#f97316" stroke="#ffffff" stroke-width="4" rx="16"/>
  <text x="100" y="115" fill="#ffffff" font-size="22" font-weight="bold">ECA_Matriz</text>
  
  <!-- Rack 1: Rack_principal (Green Block) -->
  <rect x="110" y="140" width="165" height="295" fill="#5cba2d" stroke="#ffffff" stroke-width="2" rx="8"/>
  <text x="120" y="160" fill="#ffffff" font-size="14" font-weight="bold">Rack_principal</text>

  <!-- Cables (Drawn behind nodes) -->
  <!-- Cámara IP to Switch Poe 24P (Black/Dark Gray) -->
  <path d="M 95 480 C 130 350, 180 270, 185 190" fill="transparent" stroke="#161b22" stroke-width="3"/>
  <circle cx="165" cy="305" r="3" fill="#ffffff"/>

  <!-- Impresora Red to Router Core (Magenta/Pink) -->
  <path d="M 190 480 L 190 380" fill="transparent" stroke="#e81cff" stroke-width="3"/>

  <!-- Teléfono VoIP to Switch Poe 24P (Brown) -->
  <path d="M 285 490 C 260 360, 210 270, 185 190" fill="transparent" stroke="#5c2e0e" stroke-width="3"/>
  <circle cx="245" cy="390" r="3" fill="#ffffff"/>
  <circle cx="215" cy="275" r="3" fill="#ffffff"/>

  <!-- PC Desktop to Switch 24P (Blue) -->
  <path d="M 360 480 C 310 370, 220 280, 185 230" fill="transparent" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="290" cy="400" r="3" fill="#ffffff"/>
  <circle cx="250" cy="310" r="3" fill="#ffffff"/>

  <!-- Router to Switch Managed 2 (Yellow) -->
  <path d="M 185 355 C 330 355, 380 190, 560 190" fill="transparent" stroke="#f7f13b" stroke-width="3"/>
  <circle cx="240" cy="355" r="3" fill="#ffffff"/>
  <circle cx="340" cy="305" r="3" fill="#ffffff"/>
  <circle cx="420" cy="235" r="3" fill="#ffffff"/>


  <!-- Rack Nodes (ECA_Matriz) -->
  <!-- Node 1 -->
  <circle cx="185" cy="190" r="14" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
  <text x="185" y="215" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Switch Poe 24P</text>
  
  <!-- Node 2 -->
  <circle cx="185" cy="230" r="14" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
  <text x="185" y="255" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Switch 24P</text>
  
  <!-- Node 3 -->
  <circle cx="185" cy="270" r="14" fill="#0d1117" stroke="#e81cff" stroke-width="3"/>
  <text x="185" y="295" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">NVR 16ch</text>
  <rect x="150" y="300" width="70" height="15" fill="#e2e8f0" rx="3"/>
  <text x="185" y="311" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">192.168.1.71</text>
  
  <!-- Node 4 -->
  <circle cx="185" cy="315" r="14" fill="#0d1117" stroke="#5cba2d" stroke-width="3"/>
  <text x="185" y="340" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">PDU 8TOMAS</text>

  <!-- Node 5 -->
  <circle cx="185" cy="355" r="14" fill="#0d1117" stroke="#d29922" stroke-width="3"/>
  <text x="185" y="380" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Router Core</text>

  <!-- Node 6 -->
  <circle cx="185" cy="395" r="14" fill="#0d1117" stroke="#d29922" stroke-width="3"/>
  <text x="185" y="420" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Router Core</text>


  <!-- Floor Nodes (ECA_Matriz) -->
  <circle cx="95" cy="485" r="18" fill="#0d1117" stroke="#e81cff" stroke-width="4"/>
  <text x="95" y="515" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Cámara IP</text>

  <circle cx="190" cy="485" r="18" fill="#0d1117" stroke="#06b6d4" stroke-width="4"/>
  <text x="190" y="515" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Impresora Red</text>

  <circle cx="285" cy="485" r="18" fill="#0d1117" stroke="#ef4444" stroke-width="4"/>
  <text x="285" y="515" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Teléfono VoIP</text>
  
  <circle cx="360" cy="485" r="18" fill="#0d1117" stroke="#06b6d4" stroke-width="4"/>
  <text x="360" y="515" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">PC Desktop</text>


  <!-- Sala 2: ECA_bodega (Orange Block) -->
  <rect x="460" y="80" width="280" height="220" fill="#f97316" stroke="#c2410c" stroke-width="4" rx="16"/>
  <text x="480" y="115" fill="#ffffff" font-size="22" font-weight="bold">ECA_bodega</text>
  
  <!-- Rack 2: cheque cosina (Green Block) -->
  <rect x="500" y="140" width="150" height="140" fill="#5cba2d" stroke="#ffffff" stroke-width="2" rx="8"/>
  <text x="510" y="160" fill="#ffffff" font-size="14" font-weight="bold">cheque cosina</text>

  <!-- Rack Nodes (ECA_bodega) -->
  <circle cx="560" cy="190" r="14" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
  <text x="560" y="215" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Switch Managed 2</text>

</svg>
