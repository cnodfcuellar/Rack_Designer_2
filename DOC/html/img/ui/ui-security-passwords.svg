<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#0d1117" rx="10"/>
  
  <!-- Title -->
  <text x="400" y="40" fill="#f0f6fc" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">Implementación: Ocultación por defecto (Estándar de Seguridad)</text>

  <!-- Section 1: Tooltip / HUD -->
  <rect x="40" y="80" width="340" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="210" y="110" fill="#8b949e" font-size="14" font-family="sans-serif" text-anchor="middle">1. Tooltip Físico / HUD Topológico</text>
  <rect x="100" y="130" width="220" height="100" rx="4" fill="#21262d" stroke="#484f58"/>
  <text x="120" y="160" fill="#58a6ff" font-size="14" font-family="monospace">SRV-APP-01</text>
  <text x="120" y="185" fill="#c9d1d9" font-size="12" font-family="monospace">IP:   192.168.10.50</text>
  <text x="120" y="205" fill="#c9d1d9" font-size="12" font-family="monospace">User: admin</text>
  
  <!-- Highlighted secure pass -->
  <rect x="115" y="210" width="180" height="20" fill="#238636" fill-opacity="0.2" rx="3"/>
  <text x="120" y="225" fill="#3fb950" font-size="12" font-family="monospace" font-weight="bold">Pass: ••••••••</text>
  <text x="210" y="250" fill="#8b949e" font-size="10" font-style="italic" text-anchor="middle">Siempre censurado en vistas rápidas</text>

  <!-- Section 2: Modal de Edición -->
  <rect x="420" y="80" width="340" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="590" y="110" fill="#8b949e" font-size="14" font-family="sans-serif" text-anchor="middle">2. Modal de Configuración (Doble Clic)</text>
  <text x="450" y="140" fill="#c9d1d9" font-size="12" font-family="sans-serif">Usuario</text>
  <rect x="450" y="150" width="280" height="30" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="460" y="170" fill="#8b949e" font-size="12" font-family="monospace">admin</text>

  <text x="450" y="205" fill="#c9d1d9" font-size="12" font-family="sans-serif">Contraseña</text>
  <rect x="450" y="215" width="240" height="30" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="460" y="235" fill="#c9d1d9" font-size="16" font-family="sans-serif" letter-spacing="2">••••••••</text>
  
  <!-- Eye toggle button -->
  <rect x="695" y="215" width="35" height="30" rx="4" fill="#238636"/>
  <text x="712" y="235" fill="#ffffff" font-size="14" text-anchor="middle">👁</text>
  <!-- Strikethrough to indicate toggle state -->
  <path d="M702,230 L722,230" stroke="#fff" stroke-width="1.5" opacity="0.8" transform="rotate(-45 712 230)"/>
  
  <text x="590" y="270" fill="#8b949e" font-size="10" font-style="italic" text-anchor="middle">Único lugar para revelar (Toggle show/hide)</text>

  <!-- Section 3: Tabla de Inventario -->
  <rect x="40" y="300" width="720" height="170" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="400" y="330" fill="#8b949e" font-size="14" font-family="sans-serif" text-anchor="middle">3. Panel Inferior (Tabla de Inventario)</text>
  
  <rect x="60" y="350" width="680" height="25" fill="#21262d"/>
  <text x="70" y="367" fill="#8b949e" font-size="12" font-family="sans-serif" font-weight="bold">Rack</text>
  <text x="140" y="367" fill="#8b949e" font-size="12" font-family="sans-serif" font-weight="bold">Nombre</text>
  <text x="240" y="367" fill="#8b949e" font-size="12" font-family="sans-serif" font-weight="bold">Tipo</text>
  <text x="320" y="367" fill="#8b949e" font-size="12" font-family="sans-serif" font-weight="bold">IP</text>
  <text x="430" y="367" fill="#8b949e" font-size="12" font-family="sans-serif" font-weight="bold">Usuario</text>
  <text x="520" y="367" fill="#8b949e" font-size="12" font-family="sans-serif" font-weight="bold">Contraseña</text>

  <text x="70" y="395" fill="#c9d1d9" font-size="12" font-family="sans-serif">RACK-01</text>
  <text x="140" y="395" fill="#58a6ff" font-size="12" font-family="sans-serif">SRV-APP-01</text>
  <rect x="235" y="382" width="50" height="18" rx="9" fill="#1f6feb" fill-opacity="0.2" stroke="#1f6feb"/>
  <text x="260" y="395" fill="#58a6ff" font-size="10" font-family="sans-serif" text-anchor="middle">Server</text>
  <text x="320" y="395" fill="#c9d1d9" font-size="12" font-family="monospace">192.168.10.50</text>
  <text x="430" y="395" fill="#c9d1d9" font-size="12" font-family="sans-serif">admin</text>
  <!-- Password cell -->
  <rect x="515" y="380" width="70" height="20" fill="#238636" fill-opacity="0.1" rx="3"/>
  <text x="520" y="395" fill="#3fb950" font-size="12" font-family="monospace" font-weight="bold">••••••••</text>
  
  <!-- Line separator -->
  <line x1="60" y1="415" x2="740" y2="415" stroke="#30363d"/>

  <text x="70" y="440" fill="#c9d1d9" font-size="12" font-family="sans-serif">RACK-01</text>
  <text x="140" y="440" fill="#58a6ff" font-size="12" font-family="sans-serif">SW-CORE-01</text>
  <rect x="235" y="427" width="50" height="18" rx="9" fill="#238636" fill-opacity="0.2" stroke="#238636"/>
  <text x="260" y="440" fill="#3fb950" font-size="10" font-family="sans-serif" text-anchor="middle">Switch</text>
  <text x="320" y="440" fill="#c9d1d9" font-size="12" font-family="monospace">192.168.10.1</text>
  <text x="430" y="440" fill="#c9d1d9" font-size="12" font-family="sans-serif">root</text>
  <!-- Password cell -->
  <rect x="515" y="425" width="70" height="20" fill="#238636" fill-opacity="0.1" rx="3"/>
  <text x="520" y="440" fill="#3fb950" font-size="12" font-family="monospace" font-weight="bold">••••••••</text>
</svg>
