<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 640" width="100%" style="background-color: #090d16; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Patterns and Gradients for phone background -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.3" />
    </pattern>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Drop shadow for the modal card -->
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ==================== BACKGROUND: DESIGN CANVAS ==================== -->
  <rect x="0" y="0" width="450" height="640" fill="url(#canvasGrad)" />
  <rect x="0" y="0" width="450" height="640" fill="url(#dot-grid)" opacity="0.5" />

  <!-- Dark backdrop overlay representing modal state -->
  <rect x="0" y="0" width="450" height="640" fill="#020617" fill-opacity="0.55" />


  <!-- ==================== MOBILE FORM MODAL (CENTRAL) ==================== -->
  <g transform="translate(15, 15)" filter="url(#modalShadow)">
    <!-- Main Modal Card Container -->
    <rect x="0" y="0" width="420" height="610" rx="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />

    <!-- 1. Header Section -->
    <!-- Plug Icon -->
    <g transform="translate(25, 25)">
      <rect x="2" y="6" width="16" height="12" rx="2" fill="#475569" />
      <!-- Prongs -->
      <line x1="6" y1="2" x2="6" y2="6" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
      <line x1="14" y1="2" x2="14" y2="6" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
      <!-- Wire -->
      <path d="M 10,18 L 10,24" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="60" y="42" fill="#0f172a" font-size="19" font-weight="800" letter-spacing="0.2">Conectar Equipos</text>
    <text x="25" y="70" fill="#475569" font-size="12.5" font-weight="600" letter-spacing="0.5">Conectar puertos entre equipos</text>


    <!-- 2. Form Fields -->
    
    <!-- Field 1: Equipo Origen -->
    <g transform="translate(25, 95)">
      <text x="0" y="12" fill="#475569" font-size="10" font-weight="800" letter-spacing="0.8">EQUIPO ORIGEN</text>
      <rect x="0" y="22" width="370" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="15" y="48" fill="#334155" font-size="14.5" font-family="monospace">Switch Rack 101 (switch)</text>
      <path d="M 345,40 L 350,46 L 355,40" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Field 2: Puerto Origen -->
    <g transform="translate(25, 180)">
      <text x="0" y="12" fill="#475569" font-size="10" font-weight="800" letter-spacing="0.8">PUERTO ORIGEN</text>
      <rect x="0" y="22" width="370" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="15" y="48" fill="#334155" font-size="14.5" font-family="monospace">Eth0/1</text>
    </g>

    <!-- Field 3: Equipo Destino -->
    <g transform="translate(25, 265)">
      <text x="0" y="12" fill="#475569" font-size="10" font-weight="800" letter-spacing="0.8">EQUIPO DESTINO</text>
      <rect x="0" y="22" width="370" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="15" y="48" fill="#334155" font-size="14.5" font-family="monospace">Switch Rack 101 (switch)</text>
      <path d="M 345,40 L 350,46 L 355,40" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Field 4: Puerto Destino -->
    <g transform="translate(25, 350)">
      <text x="0" y="12" fill="#475569" font-size="10" font-weight="800" letter-spacing="0.8">PUERTO DESTINO</text>
      <rect x="0" y="22" width="370" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="15" y="48" fill="#334155" font-size="14.5" font-family="monospace">Eth0/2</text>
    </g>

    <!-- Field 5: Tipo de Cable -->
    <g transform="translate(25, 435)">
      <text x="0" y="12" fill="#475569" font-size="10" font-weight="800" letter-spacing="0.8">TIPO DE CABLE</text>
      <rect x="0" y="22" width="370" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
      <!-- Cable Type Color Indicator -->
      <rect x="15" y="35" width="14" height="14" fill="#3b82f6" rx="2" />
      <text x="38" y="48" fill="#0f172a" font-size="14" font-weight="500">Cobre (Cat6/Cat6A)</text>
      <path d="M 345,40 L 350,46 L 355,40" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Field 6: Color del Cable -->
    <g transform="translate(25, 520)">
      <text x="0" y="12" fill="#475569" font-size="10" font-weight="800" letter-spacing="0.8">COLOR DEL CABLE</text>
      
      <!-- Color Picker Button -->
      <rect x="0" y="22" width="48" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <rect x="8" y="30" width="32" height="26" fill="#3b82f6" rx="4" />
      
      <!-- Color Hex Input -->
      <rect x="60" y="22" width="310" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="75" y="48" fill="#334155" font-size="14.5" font-family="monospace">#3b82f6</text>
    </g>
  </g>
</svg>
