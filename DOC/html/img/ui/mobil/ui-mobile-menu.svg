<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 568" width="100%" height="100%">
  <!-- Definitions for shadows and gradients -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="menu-shadow" x="0" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="0" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="568" fill="url(#bgGradient)" />

  <!-- Background App State (Dimmed) -->
  <g opacity="0.4">
    <!-- Racks -->
    <rect x="60" y="80" width="90" height="400" rx="4" fill="#2a2b36" stroke="#44475a" stroke-width="1.5" />
    <rect x="170" y="80" width="90" height="400" rx="4" fill="#2a2b36" stroke="#44475a" stroke-width="1.5" />
    <!-- Rack items -->
    <rect x="65" y="90" width="80" height="20" rx="2" fill="#ff79c6" />
    <rect x="65" y="115" width="80" height="40" rx="2" fill="#8be9fd" />
    <rect x="65" y="160" width="80" height="20" rx="2" fill="#50fa7b" />
    <rect x="175" y="90" width="80" height="40" rx="2" fill="#bd93f9" />
    <rect x="175" y="135" width="80" height="20" rx="2" fill="#ffb86c" />
  </g>

  <!-- Dark Overlay -->
  <rect width="320" height="568" fill="#000000" opacity="0.6" />

  <!-- Off-Canvas Project Menu -->
  <g filter="url(#menu-shadow)">
    <!-- Menu Background -->
    <rect x="0" y="0" width="240" height="568" fill="#282a36" />
    
    <!-- Menu Header -->
    <rect x="0" y="0" width="240" height="60" fill="#21222c" />
    <text x="20" y="38" fill="#f8f8f2" font-family="sans-serif" font-size="18" font-weight="bold">Menú del Proyecto</text>
    
    <!-- Close Button -->
    <path d="M 200 20 L 220 40 M 220 20 L 200 40" stroke="#ff5555" stroke-width="2.5" stroke-linecap="round" />

    <!-- Menu Items -->
    <!-- 1. Nuevo Proyecto -->
    <g transform="translate(0, 80)">
      <rect x="10" y="0" width="220" height="40" rx="4" fill="#44475a" opacity="0" /> <!-- Hover effect placeholder -->
      <!-- Sparkle Icon -->
      <path d="M 30 10 L 32 18 L 40 20 L 32 22 L 30 30 L 28 22 L 20 20 L 28 18 Z" fill="#ffb86c" />
      <text x="55" y="25" fill="#f8f8f2" font-family="sans-serif" font-size="14">Nuevo Proyecto</text>
    </g>

    <!-- 2. Abrir Proyecto -->
    <g transform="translate(0, 130)">
      <!-- Folder Icon -->
      <path d="M 20 12 L 30 12 L 34 16 L 40 16 C 42 16 42 18 42 18 L 42 28 C 42 30 40 30 40 30 L 20 30 C 18 30 18 28 18 28 L 18 14 C 18 12 20 12 20 12 Z" fill="#8be9fd" />
      <text x="55" y="25" fill="#f8f8f2" font-family="sans-serif" font-size="14">Abrir Proyecto</text>
    </g>

    <!-- 3. Guardar -->
    <g transform="translate(0, 180)">
      <!-- Save Icon -->
      <path d="M 20 10 L 36 10 L 40 14 L 40 30 C 40 32 38 32 38 32 L 22 32 C 20 32 20 30 20 30 Z" fill="#50fa7b" />
      <rect x="24" y="10" width="8" height="6" fill="#282a36" />
      <rect x="24" y="22" width="12" height="10" fill="#282a36" />
      <text x="55" y="25" fill="#f8f8f2" font-family="sans-serif" font-size="14">Guardar</text>
    </g>

    <!-- 4. Exportar JSON -->
    <g transform="translate(0, 230)">
      <!-- Download Icon -->
      <path d="M 30 10 L 30 24 M 24 18 L 30 24 L 36 18 M 20 28 L 40 28" stroke="#bd93f9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="55" y="25" fill="#f8f8f2" font-family="sans-serif" font-size="14">Exportar (.json)</text>
    </g>

    <!-- 5. Importar JSON -->
    <g transform="translate(0, 280)">
      <!-- Upload Icon -->
      <path d="M 30 24 L 30 10 M 24 16 L 30 10 L 36 16 M 20 28 L 40 28" stroke="#ff79c6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="55" y="25" fill="#f8f8f2" font-family="sans-serif" font-size="14">Importar (.json)</text>
    </g>

    <!-- Divider -->
    <line x1="20" y1="335" x2="220" y2="335" stroke="#44475a" stroke-width="1" />

    <!-- 6. Cambiar Tema -->
    <g transform="translate(0, 350)">
      <!-- Sun Icon -->
      <circle cx="30" cy="20" r="5" fill="#f1fa8c" />
      <path d="M 30 10 L 30 12 M 30 28 L 30 30 M 20 20 L 22 20 M 38 20 L 40 20 M 23 13 L 24.5 14.5 M 35.5 25.5 L 37 27 M 23 27 L 24.5 25.5 M 35.5 14.5 L 37 13" stroke="#f1fa8c" stroke-width="1.5" stroke-linecap="round" />
      <text x="55" y="25" fill="#f8f8f2" font-family="sans-serif" font-size="14">Modo Claro / Oscuro</text>
    </g>

    <!-- 7. Limpiar Todo -->
    <g transform="translate(0, 400)">
      <!-- Broom/Trash Icon -->
      <path d="M 22 14 L 38 14 M 26 14 L 26 10 L 34 10 L 34 14 M 24 14 L 26 30 L 34 30 L 36 14" stroke="#ff5555" stroke-width="2" fill="none" stroke-linejoin="round" />
      <text x="55" y="25" fill="#ff5555" font-family="sans-serif" font-size="14">Limpiar Todo</text>
    </g>
    
    <!-- Footer Logo/Info -->
    <g transform="translate(0, 520)">
      <text x="120" y="20" fill="#6272a4" font-family="sans-serif" font-size="12" text-anchor="middle">Rack Designer v2.0</text>
    </g>
  </g>
</svg>
