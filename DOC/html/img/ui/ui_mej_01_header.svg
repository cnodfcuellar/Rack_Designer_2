<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 180" width="1100" height="180">
<defs>
  <style>
    .hf { font-family:'Space Grotesk',sans-serif; }
    .hm { font-family:'JetBrains Mono',monospace; }
    @keyframes cursor-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor { animation: cursor-blink 1s step-start infinite; }
  </style>
  <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d1428"/>
    <stop offset="100%" stop-color="#080c18"/>
  </linearGradient>
  <linearGradient id="hbrand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#818cf8"/>
  </linearGradient>
</defs>

<rect width="1100" height="180" fill="#060a14" rx="12"/>
<text x="550" y="18" text-anchor="middle" class="hm" font-size="10" fill="#475569">PROPUESTA — Header Mejorado</text>

<!-- Toolbar background -->
<rect x="20" y="28" width="1060" height="52" rx="10" fill="url(#hbg)" stroke="#1e2d4e" stroke-width="1"/>

<!-- Brand -->
<rect x="32" y="38" width="32" height="32" rx="8" fill="#38bdf815" stroke="#38bdf855"/>
<text x="48" y="59" text-anchor="middle" font-size="16">🗄</text>
<text x="75" y="56" class="hf" font-size="13" font-weight="700" fill="url(#hbrand)">RACK</text>
<text x="107" y="56" class="hf" font-size="13" font-weight="400" fill="#64748b">Designer</text>

<!-- Divider -->
<line x1="140" y1="38" x2="140" y2="70" stroke="#1e2d4e" stroke-width="1"/>

<!-- Group 1: Proyecto -->
<text x="150" y="42" class="hm" font-size="8" fill="#475569">PROYECTO</text>
<rect x="150" y="46" width="60" height="22" rx="5" fill="#1e2d4e" stroke="#243655"/>
<text x="180" y="61" text-anchor="middle" class="hf" font-size="10" font-weight="600" fill="#94a3b8">📂 Abrir</text>
<rect x="216" y="46" width="66" height="22" rx="5" fill="#1e2d4e" stroke="#243655"/>
<text x="249" y="61" text-anchor="middle" class="hf" font-size="10" font-weight="600" fill="#94a3b8">💾 Guardar</text>
<rect x="288" y="46" width="66" height="22" rx="5" fill="#0ea5e920" stroke="#0ea5e960"/>
<text x="321" y="61" text-anchor="middle" class="hf" font-size="10" font-weight="600" fill="#38bdf8">⬆ Exportar</text>

<line x1="362" y1="38" x2="362" y2="70" stroke="#1e2d4e" stroke-width="1"/>

<!-- Group 2: Edición -->
<text x="372" y="42" class="hm" font-size="8" fill="#475569">EDICIÓN</text>
<rect x="372" y="46" width="44" height="22" rx="5" fill="#1e2d4e" stroke="#243655"/>
<text x="394" y="58" text-anchor="middle" font-size="13">↩</text>
<text x="394" y="68" text-anchor="middle" class="hm" font-size="7" fill="#8b5cf6">3</text><!-- counter -->
<rect x="422" y="46" width="44" height="22" rx="5" fill="#1e2d4e" stroke="#243655" opacity="0.4"/>
<text x="444" y="58" text-anchor="middle" font-size="13" opacity="0.4">↪</text>
<text x="444" y="68" text-anchor="middle" class="hm" font-size="7" fill="#475569">0</text>

<line x1="474" y1="38" x2="474" y2="70" stroke="#1e2d4e" stroke-width="1"/>

<!-- Group 3: Vista -->
<text x="484" y="42" class="hm" font-size="8" fill="#475569">VISTA</text>
<rect x="484" y="46" width="76" height="22" rx="5" fill="#0ea5e920" stroke="#0ea5e960"/>
<text x="522" y="61" text-anchor="middle" class="hf" font-size="10" font-weight="600" fill="#38bdf8">🖥 Física</text>
<rect x="566" y="46" width="80" height="22" rx="5" fill="#1e2d4e" stroke="#243655"/>
<text x="606" y="61" text-anchor="middle" class="hf" font-size="10" font-weight="600" fill="#64748b">🗺 Topología</text>

<rect x="654" y="46" width="28" height="22" rx="5" fill="#1e2d4e" stroke="#243655"/>
<text x="668" y="61" text-anchor="middle" class="hm" font-size="10" fill="#94a3b8">−</text>
<rect x="686" y="46" width="44" height="22" rx="5" fill="#1e2d4e" stroke="#38bdf855"/>
<text x="708" y="61" text-anchor="middle" class="hm" font-size="10" fill="#38bdf8">100%</text>
<rect x="734" y="46" width="28" height="22" rx="5" fill="#1e2d4e" stroke="#243655"/>
<text x="748" y="61" text-anchor="middle" class="hm" font-size="10" fill="#94a3b8">+</text>

<line x1="770" y1="38" x2="770" y2="70" stroke="#1e2d4e" stroke-width="1"/>

<!-- Group 4: Estructuras -->
<text x="780" y="42" class="hm" font-size="8" fill="#475569">AGREGAR</text>
<rect x="780" y="46" width="66" height="22" rx="5" fill="#10b98120" stroke="#10b98160"/>
<text x="813" y="61" text-anchor="middle" class="hf" font-size="10" font-weight="600" fill="#34d399">+ Rack</text>
<rect x="852" y="46" width="80" height="22" rx="5" fill="#10b98120" stroke="#10b98160"/>
<text x="892" y="61" text-anchor="middle" class="hf" font-size="10" font-weight="600" fill="#34d399">+ Equipo</text>
<rect x="938" y="46" width="66" height="22" rx="5" fill="#10b98120" stroke="#10b98160"/>
<text x="971" y="61" text-anchor="middle" class="hf" font-size="10" font-weight="600" fill="#34d399">+ Sala</text>

<!-- Theme toggle + User far right -->
<rect x="1010" y="46" width="32" height="22" rx="5" fill="#1e2d4e" stroke="#243655"/>
<text x="1026" y="60" text-anchor="middle" font-size="12">🌙</text>
<rect x="1048" y="46" width="22" height="22" rx="11" fill="#38bdf8" stroke="none"/>
<text x="1059" y="61" text-anchor="middle" class="hf" font-size="10" font-weight="700" fill="#0f172a">A</text>

<!-- Breadcrumb below toolbar -->
<rect x="20" y="88" width="1060" height="30" rx="8" fill="#0d1428" stroke="#1e2d4e"/>
<text x="32" y="107" class="hm" font-size="9" fill="#475569">📍</text>
<text x="44" y="107" class="hm" font-size="9" fill="#64748b">Sala A: Centro de Datos</text>
<text x="176" y="107" class="hm" font-size="9" fill="#1e2d4e"> / </text>
<text x="188" y="107" class="hm" font-size="9" fill="#64748b">Rack 1</text>
<text x="220" y="107" class="hm" font-size="9" fill="#1e2d4e"> / </text>
<text x="232" y="107" class="hm" font-size="9" fill="#38bdf8">Switch Cisco 48P</text>
<rect x="224" y="96" width="96" height="16" rx="3" fill="#38bdf815" stroke="#38bdf830"/>
<!-- Status indicators right -->
<circle cx="950" cy="103" r="4" fill="#10b981"/>
<text x="960" y="107" class="hm" font-size="9" fill="#6ee7b7">Autoguardado 2:34 PM</text>
<rect x="1048" y="96" width="24" height="16" rx="4" fill="#ef444420" stroke="#ef444440"/>
<text x="1060" y="107" text-anchor="middle" class="hm" font-size="8" fill="#f87171">3 ⚠</text>

<!-- Labels -->
<text x="168" y="148" text-anchor="middle" class="hm" font-size="9" fill="#10b981">↑ Grupos de acciones separados</text>
<text x="430" y="148" text-anchor="middle" class="hm" font-size="9" fill="#8b5cf6">↑ Undo con contador</text>
<text x="660" y="148" text-anchor="middle" class="hm" font-size="9" fill="#38bdf8">↑ Zoom interactivo inline</text>
<text x="550" y="166" text-anchor="middle" class="hm" font-size="9" fill="#64748b">↑ Breadcrumb de navegación con autoguardado y contador de alertas</text>
</svg>