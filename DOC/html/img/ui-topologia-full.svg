<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" style="background-color: #1f6feb; font-family: -apple-system, sans-serif;">
  
  <!-- Main Canvas Area (Blue Dot Grid) -->
  <pattern id="dots5" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="#ffffff" cx="10" cy="10" r="1" opacity="0.1"></circle>
  </pattern>
  <rect x="0" y="0" width="1000" height="500" fill="url(#dots5)"/>

  <!-- Top Floating Toolbar (Centered/Right aligned) -->
  <rect x="20" y="20" width="300" height="40" fill="#161b22" stroke="#30363d" stroke-width="1" rx="8" opacity="0.9"/>
  <text x="40" y="45" fill="#8b949e" font-size="12">-   82%   +</text>
  <rect x="120" y="26" width="90" height="28" fill="#21262d" rx="4"/>
  <text x="165" y="45" fill="#8b949e" font-size="12" text-anchor="middle">ECA_Matriz</text>
  <rect x="220" y="26" width="90" height="28" fill="#1f6feb" rx="4" opacity="0.2"/>
  <text x="265" y="45" fill="#58a6ff" font-size="12" text-anchor="middle">ECA_bodega</text>

  <rect x="800" y="20" width="180" height="40" fill="#161b22" stroke="#30363d" stroke-width="1" rx="8" opacity="0.9"/>
  <text x="830" y="45" fill="#8b949e" font-size="12">📷 PNG</text>
  <rect x="880" y="26" width="90" height="28" fill="#21262d" rx="4"/>
  <text x="925" y="44" fill="#c9d1d9" font-size="11" text-anchor="middle">Contraer</text>

  <!-- Sala 1: ECA_Matriz (Orange Block) -->
  <rect x="80" y="100" width="260" height="360" fill="#ff7b25" stroke="#e66000" stroke-width="2" rx="12"/>
  <text x="95" y="125" fill="#ffffff" font-size="16" font-weight="bold">ECA_Matriz</text>
  
  <!-- Rack 1: Rack_principal (Green Block) -->
  <rect x="120" y="140" width="140" height="260" fill="#5cba2d" stroke="#489e1f" stroke-width="2" rx="8"/>
  <text x="130" y="160" fill="#ffffff" font-size="12" font-weight="bold">Rack_principal</text>

  <!-- Cables (Drawn before nodes so they are behind them) -->
  <!-- Cámara IP to Switch Poe 24P (Black/Dark Gray) -->
  <path d="M 100 420 C 120 300, 180 260, 180 180" fill="transparent" stroke="#161b22" stroke-width="3"/>
  <circle cx="160" cy="275" r="2" fill="#ffffff"/>

  <!-- Impresora Red to Switch 24P (Red) -->
  <path d="M 170 420 C 170 350, 180 300, 180 220" fill="transparent" stroke="#f85149" stroke-width="3"/>

  <!-- Teléfono VoIP to Switch Poe 24P (Brown) -->
  <path d="M 240 420 C 220 300, 190 220, 180 180" fill="transparent" stroke="#8b4513" stroke-width="3"/>
  <circle cx="215" cy="330" r="2" fill="#ffffff"/>

  <!-- PC Desktop to Switch 24P (Blue) -->
  <path d="M 310 420 C 280 300, 200 240, 180 220" fill="transparent" stroke="#1f6feb" stroke-width="3"/>
  <circle cx="260" cy="350" r="2" fill="#ffffff"/>
  <circle cx="230" cy="280" r="2" fill="#ffffff"/>

  <!-- Router to Switch Managed 2 (Yellow) -->
  <path d="M 180 300 C 280 300, 350 180, 500 180" fill="transparent" stroke="#f7f13b" stroke-width="3"/>
  <circle cx="260" cy="290" r="3" fill="#ffffff"/>
  <circle cx="340" cy="250" r="3" fill="#ffffff"/>
  <circle cx="420" cy="210" r="3" fill="#ffffff"/>


  <!-- Rack Nodes (ECA_Matriz) -->
  <!-- Node 1 -->
  <circle cx="180" cy="180" r="12" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
  <text x="180" y="200" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Switch Poe 24P</text>
  
  <!-- Node 2 -->
  <circle cx="180" cy="220" r="12" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
  <text x="180" y="240" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Switch 24P</text>
  
  <!-- Node 3 -->
  <circle cx="180" cy="260" r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
  <text x="180" y="280" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">NVR 16ch</text>
  
  <!-- Node 4 -->
  <circle cx="180" cy="300" r="12" fill="#0d1117" stroke="#d29922" stroke-width="3"/>
  <text x="180" y="320" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Router Core</text>

  <!-- Node 5 -->
  <circle cx="180" cy="340" r="12" fill="#0d1117" stroke="#d29922" stroke-width="3"/>
  <text x="180" y="360" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Router Core</text>

  <!-- Node 6 -->
  <circle cx="180" cy="380" r="12" fill="#0d1117" stroke="#8a2be2" stroke-width="3"/>

  <!-- Floor Nodes (ECA_Matriz) -->
  <circle cx="100" cy="420" r="14" fill="#0d1117" stroke="#8a2be2" stroke-width="3"/>
  <text x="100" y="445" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Cámara IP</text>

  <circle cx="170" cy="420" r="14" fill="#0d1117" stroke="#f85149" stroke-width="3"/>
  <text x="170" y="445" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Impresora Red</text>

  <circle cx="240" cy="420" r="14" fill="#0d1117" stroke="#d29922" stroke-width="3"/>
  <text x="240" y="445" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Teléfono VoIP</text>
  
  <circle cx="310" cy="420" r="14" fill="#0d1117" stroke="#1f6feb" stroke-width="3"/>
  <text x="310" y="445" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">PC Desktop</text>


  <!-- Sala 2: ECA_bodega (Orange Block) -->
  <rect x="420" y="100" width="220" height="190" fill="#ff7b25" stroke="#ffffff" stroke-width="2" rx="12"/>
  <text x="435" y="125" fill="#ffffff" font-size="16" font-weight="bold">ECA_bodega</text>
  
  <!-- Rack 2: cheque cosina (Green Block) -->
  <rect x="450" y="140" width="140" height="130" fill="#5cba2d" stroke="#489e1f" stroke-width="2" rx="8"/>
  <text x="460" y="160" fill="#ffffff" font-size="12" font-weight="bold">cheque cosina</text>

  <!-- Rack Nodes (ECA_bodega) -->
  <circle cx="500" cy="180" r="12" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
  <text x="500" y="200" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">Switch Managed 2</text>

</svg>
