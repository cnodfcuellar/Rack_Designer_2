<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="greenSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" rx="15" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle background grid -->
  <g stroke="#334155" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>

  <!-- Complete Page UI drawing with color and active details -->
  <g transform="translate(100, 35)">
    <!-- Base application window -->
    <rect x="0" y="0" width="200" height="150" rx="6" fill="#0b0f19" stroke="#10b981" stroke-width="2" />
    
    <!-- Colored active Toolbar -->
    <rect x="6" y="6" width="188" height="24" rx="2" fill="#1e293b" />
    <circle cx="16" cy="18" r="4" fill="#38bdf8" /> <!-- Logo mock -->
    <rect x="30" y="14" width="40" height="8" rx="1" fill="#334155" /> <!-- Menu tabs mock -->
    <rect x="75" y="14" width="30" height="8" rx="1" fill="#334155" />
    <circle cx="178" cy="18" r="4" fill="#f43f5e" /> <!-- Profile/Control mock -->
    
    <!-- Left Sidebar (Stats + Catalog) -->
    <rect x="6" y="36" width="50" height="108" rx="2" fill="#182235" />
    <rect x="12" y="44" width="38" height="8" rx="1" fill="#38bdf8" />
    <rect x="12" y="58" width="38" height="6" rx="1" fill="#475569" />
    <!-- Small catalog items list -->
    <rect x="12" y="74" width="38" height="18" rx="1" fill="#0f172a" stroke="#334155" stroke-width="0.5" />
    <rect x="12" y="96" width="38" height="18" rx="1" fill="#0f172a" stroke="#334155" stroke-width="0.5" />
    
    <!-- Main Workspace (Rendered Physical Rack view with active devices) -->
    <rect x="62" y="36" width="132" height="108" rx="2" fill="#090d16" />
    
    <!-- A Rack Cabinet Organism Inside -->
    <rect x="106" y="42" width="44" height="96" rx="1.5" fill="#111827" stroke="#475569" stroke-width="0.75" />
    <!-- Mounted active server molecules -->
    <rect x="109" y="52" width="38" height="14" rx="0.5" fill="#f43f5e" /> <!-- Active UPS (Rose) -->
    <circle cx="115" cy="59" r="2" fill="#a5f3fc" /> <!-- Ports/LED -->
    <circle cx="121" cy="59" r="2" fill="#a5f3fc" />

    <rect x="109" y="70" width="38" height="8" rx="0.5" fill="#0284c7" /> <!-- Active Switch (Blue) -->
    <circle cx="115" cy="74" r="1.5" fill="#d1fae5" />
    <circle cx="120" cy="74" r="1.5" fill="#d1fae5" />
    <circle cx="125" cy="74" r="1.5" fill="#d1fae5" />
    
    <rect x="109" y="82" width="38" height="24" rx="0.5" fill="#059669" /> <!-- Active DB Server (Green) -->
    <rect x="114" y="90" width="28" height="8" rx="0.5" fill="#111827" />
    
    <rect x="109" y="110" width="38" height="8" rx="0.5" fill="#4b5563" fill-opacity="0.5" /> <!-- Empty Slot (Gray) -->

    <!-- Page Floating indicator -->
    <circle cx="180" cy="115" r="14" fill="url(#greenSphere)" />
  </g>

  <text x="200" y="225" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#10b981" text-anchor="middle" letter-spacing="1">PÁGINA</text>
  <text x="200" y="248" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#94a3b8" text-anchor="middle">Interfaz final instanciada con datos reales y reactividad activa</text>
  <text x="200" y="270" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Vista Física de Gabinetes / Vista de Topología General</text>
</svg>
