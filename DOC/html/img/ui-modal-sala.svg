<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" style="background-color: transparent; font-family: -apple-system, sans-serif;">
  
  <!-- Modal Background Shadow -->
  <rect x="0" y="0" width="500" height="220" fill="transparent"/>
  
  <!-- Modal Container -->
  <rect x="10" y="10" width="480" height="200" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8" />

  <!-- Header -->
  <text x="30" y="44" fill="#58a6ff" font-size="16">🏢</text>
  <text x="55" y="44" fill="#ffffff" font-size="18" font-weight="bold">Nueva Sala</text>
  <text x="30" y="65" fill="#8b949e" font-size="12">Agregar una sala al centro de datos</text>

  <!-- Field 1: NOMBRE DE LA SALA -->
  <text x="30" y="100" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">NOMBRE DE LA SALA</text>
  <rect x="30" y="110" width="440" height="36" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="45" y="132" fill="#8b949e" font-size="13">Sala A - Centro de Datos Principal</text>

  <!-- Footer Buttons -->
  <rect x="290" y="165" width="80" height="32" fill="transparent" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="330" y="185" fill="#c9d1d9" font-size="12" text-anchor="middle">Cancelar</text>

  <rect x="380" y="165" width="90" height="32" fill="#0ea5e9" rx="4" opacity="0.2"/>
  <rect x="380" y="165" width="90" height="32" fill="transparent" stroke="#0ea5e9" stroke-width="1" rx="4"/>
  <text x="425" y="185" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Crear Sala</text>

</svg>
