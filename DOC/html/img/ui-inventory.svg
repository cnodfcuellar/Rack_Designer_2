  <line x1="0" y1="270" x2="1000" y2="270" stroke="#30363d" stroke-width="1"/>
  <text x="15" y="255" fill="#d2a8ff" font-size="10" font-weight="bold">PISO</text>
  <text x="110" y="255" fill="#8b949e" font-size="11" text-anchor="middle">-</text>
