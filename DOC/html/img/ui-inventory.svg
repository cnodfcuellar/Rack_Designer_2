  <text x="160" y="253" fill="#8b949e" font-size="9" text-anchor="middle">-</text>
  <text x="210" y="255" fill="#c9d1d9" font-size="11">PC Desktop</text>
  <text x="320" y="255" fill="#8b949e" font-size="11">-</text>
  <text x="390" y="255" fill="#8b949e" font-size="10">PC</text>
  <text x="460" y="255" fill="#8b949e" font-size="11">-</text>
  <text x="600" y="255" fill="#c9d1d9" font-size="11">admin</text>
  <text x="730" y="255" fill="#c9d1d9" font-size="11">250</text>
  <text x="820" y="255" fill="#c9d1d9" font-size="11">1</text>
  <!-- Acciones -->
  <rect x="890" y="245" width="18" height="16" fill="#1f6feb" rx="2" opacity="0.2"/>
  <rect x="912" y="245" width="18" height="16" fill="#21262d" rx="2"/>

