  <text x="110" y="95" fill="#c9d1d9" font-size="11" text-anchor="middle">4</text>
  <rect x="140" y="83" width="40" height="16" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8"/>
  <text x="160" y="94" fill="#c9d1d9" font-size="9" text-anchor="middle">Frontal</text>
  <text x="210" y="95" fill="#c9d1d9" font-size="11">Switch Poe 24P</text>
  <text x="320" y="95" fill="#c9d1d9" font-size="11">HIKVISION</text>
  <rect x="390" y="85" width="40" height="14" fill="#2ea043" rx="2" opacity="0.2"/>
