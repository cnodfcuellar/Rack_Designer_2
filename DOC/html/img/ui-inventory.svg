  <text x="15" y="135" fill="#c9d1d9" font-size="11">Rack_principal</text>
  <text x="110" y="135" fill="#c9d1d9" font-size="11" text-anchor="middle">7</text>
  <rect x="140" y="123" width="40" height="16" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8"/>
  <text x="160" y="134" fill="#c9d1d9" font-size="9" text-anchor="middle">Frontal</text>
  <text x="210" y="135" fill="#c9d1d9" font-size="11">NVR 16ch</text>
  <text x="320" y="135" fill="#c9d1d9" font-size="11">Hikvision</text>
  <rect x="390" y="125" width="40" height="14" fill="#1f6feb" rx="2" opacity="0.2"/>
  <text x="410" y="135" fill="#58a6ff" font-size="8" font-weight="bold" text-anchor="middle">STORAGE</text>
  <text x="460" y="135" fill="#c9d1d9" font-size="11">192.168.10.71</text>
  <text x="600" y="135" fill="#c9d1d9" font-size="11">admin</text>
  <text x="730" y="135" fill="#c9d1d9" font-size="11">200</text>
  <text x="820" y="135" fill="#c9d1d9" font-size="11">1</text>
