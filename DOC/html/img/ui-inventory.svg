  <text x="15" y="175" fill="#c9d1d9" font-size="11">Rack_principal</text>
  <text x="110" y="175" fill="#c9d1d9" font-size="11" text-anchor="middle">10</text>
  <rect x="140" y="163" width="40" height="16" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8"/>
  <text x="160" y="174" fill="#8b949e" font-size="9" text-anchor="middle">Atrás</text>
  <text x="210" y="175" fill="#c9d1d9" font-size="11">Router Core</text>
  <text x="320" y="175" fill="#8b949e" font-size="11">-</text>
  <rect x="390" y="165" width="40" height="14" fill="#d29922" rx="2" opacity="0.2"/>
  <text x="410" y="175" fill="#e3b341" font-size="8" font-weight="bold" text-anchor="middle">ROUTER</text>
  <text x="460" y="175" fill="#8b949e" font-size="11">-</text>
  <text x="600" y="175" fill="#c9d1d9" font-size="11">admin</text>
  <text x="730" y="175" fill="#c9d1d9" font-size="11">90</text>
  <text x="820" y="175" fill="#c9d1d9" font-size="11">1</text>
