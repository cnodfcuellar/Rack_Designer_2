  <rect x="912" y="165" width="18" height="16" fill="#21262d" rx="2"/>

  <!-- Row: PISO 1 -->
  <line x1="0" y1="230" x2="1000" y2="230" stroke="#30363d" stroke-width="1"/>
  <text x="15" y="215" fill="#d2a8ff" font-size="10" font-weight="bold">PISO</text>
  <text x="110" y="215" fill="#8b949e" font-size="11" text-anchor="middle">-</text>
  <circle cx="160" cy="210" r="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="160" y="213" fill="#8b949e" font-size="9" text-anchor="middle">-</text>
  <text x="210" y="215" fill="#c9d1d9" font-size="11">Cámara IP</text>
  <text x="320" y="215" fill="#8b949e" font-size="11">-</text>
  <text x="390" y="215" fill="#8b949e" font-size="10">CAMERA</text>
  <text x="460" y="215" fill="#8b949e" font-size="11">-</text>
  <text x="600" y="215" fill="#c9d1d9" font-size="11">admin</text>
  <text x="730" y="215" fill="#c9d1d9" font-size="11">15</text>
  <text x="820" y="215" fill="#c9d1d9" font-size="11">1</text>
