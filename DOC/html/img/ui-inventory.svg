<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" style="background-color: #161b22; font-family: -apple-system, sans-serif;">
  
  <!-- Top Toolbar -->
  <rect x="0" y="0" width="1000" height="40" fill="#161b22" border-bottom="1px solid #30363d"/>
  <line x1="0" y1="40" x2="1000" y2="40" stroke="#30363d" stroke-width="1"/>
  
  <rect x="15" y="10" width="75" height="22" fill="#1f6feb" rx="4" opacity="0.2"/>
  <text x="52" y="25" fill="#58a6ff" font-size="11" text-anchor="middle">Inventario</text>
  <text x="130" y="25" fill="#8b949e" font-size="11" text-anchor="middle">Conexiones</text>

  <!-- Right side buttons -->
  <rect x="520" y="8" width="65" height="24" fill="#0d1117" stroke="#388bfd" stroke-width="1" rx="4"/>
  <text x="552" y="24" fill="#58a6ff" font-size="10" font-weight="bold" text-anchor="middle">+ Equipo</text>

  <rect x="595" y="8" width="100" height="24" fill="#0d1117" stroke="#8a2be2" stroke-width="1" rx="4"/>
  <text x="645" y="24" fill="#d2a8ff" font-size="10" font-weight="bold" text-anchor="middle">⚡ Agregar Equipo</text>
  
  <rect x="705" y="8" width="110" height="24" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="715" y="24" fill="#8b949e" font-size="10">🔍 Filtrar tabla...</text>

  <rect x="825" y="8" width="50" height="24" fill="#21262d" rx="4"/>
  <text x="850" y="24" fill="#8b949e" font-size="10" text-anchor="middle">⬇ CSV</text>
  
  <rect x="885" y="8" width="50" height="24" fill="#21262d" rx="4"/>
  <text x="910" y="24" fill="#8b949e" font-size="10" text-anchor="middle">⬇ Excel</text>

  <rect x="945" y="8" width="20" height="24" fill="#21262d" rx="4"/>
  <text x="955" y="24" fill="#8b949e" font-size="10" text-anchor="middle">▼</text>
  
  <!-- Table Header -->
  <line x1="0" y1="70" x2="1000" y2="70" stroke="#30363d" stroke-width="1"/>
  <text x="15" y="60" fill="#8b949e" font-size="9" font-weight="bold">RACK</text>
  <text x="110" y="60" fill="#8b949e" font-size="9" font-weight="bold" text-anchor="middle">U</text>
  <text x="160" y="60" fill="#8b949e" font-size="9" font-weight="bold" text-anchor="middle">LADO</text>
  <text x="210" y="60" fill="#8b949e" font-size="9" font-weight="bold">NOMBRE</text>
  <text x="320" y="60" fill="#8b949e" font-size="9" font-weight="bold">MARCA</text>
  <text x="390" y="60" fill="#8b949e" font-size="9" font-weight="bold">TIPO</text>
  <text x="460" y="60" fill="#8b949e" font-size="9" font-weight="bold">IP</text>
  <text x="600" y="60" fill="#8b949e" font-size="9" font-weight="bold">USUARIO</text>
  <text x="730" y="60" fill="#8b949e" font-size="9" font-weight="bold">CONSUMO (W)</text>
  <text x="820" y="60" fill="#8b949e" font-size="9" font-weight="bold">TOMAS</text>
  <text x="890" y="60" fill="#8b949e" font-size="9" font-weight="bold">ACCIONES</text>

