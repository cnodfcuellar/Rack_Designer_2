<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" style="background:#1a1e27; font-family:-apple-system, sans-serif;">
  <text x="30" y="40" fill="#ffffff" font-size="20" font-weight="bold">Diagrama Topológico</text>
  <text x="30" y="65" fill="#8b9ab8" font-size="14">Nodos y tipos de cableado</text>

  <!-- Router Node -->
  <circle cx="150" cy="180" r="30" fill="#2d3748" stroke="#4299e1" stroke-width="3"/>
  <text x="150" y="185" fill="#fff" font-size="18" text-anchor="middle">🌐</text>
  <text x="150" y="230" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Router Principal</text>
  <text x="150" y="245" fill="#aab2c0" font-size="10" text-anchor="middle">Sala A</text>
  
  <!-- Switch Node -->
  <circle cx="400" cy="180" r="30" fill="#2d3748" stroke="#48bb78" stroke-width="3"/>
  <text x="400" y="185" fill="#fff" font-size="18" text-anchor="middle">🔀</text>
  <text x="400" y="230" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Switch Core</text>
  <text x="400" y="245" fill="#aab2c0" font-size="10" text-anchor="middle">Sala A</text>
  
  <!-- Server Node -->
  <circle cx="650" cy="130" r="30" fill="#2d3748" stroke="#a0aec0" stroke-width="3"/>
  <text x="650" y="135" fill="#fff" font-size="18" text-anchor="middle">🖥</text>
  <text x="650" y="180" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Servidor 01</text>
  
  <circle cx="650" cy="230" r="30" fill="#2d3748" stroke="#a0aec0" stroke-width="3"/>
  <text x="650" y="235" fill="#fff" font-size="18" text-anchor="middle">🖥</text>
  <text x="650" y="280" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Servidor 02</text>

  <!-- Fiber Connection -->
  <path d="M 180 180 L 370 180" fill="none" stroke="#ed8936" stroke-width="3"/>
  <text x="275" y="170" fill="#ed8936" font-size="12" font-weight="bold" text-anchor="middle">Fibra Óptica</text>
  
  <!-- Ethernet Connections -->
  <path d="M 425 165 L 625 140" fill="none" stroke="#4299e1" stroke-width="2"/>
  <text x="525" y="145" fill="#4299e1" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-7 525 145)">Ethernet</text>
  
  <path d="M 425 195 L 625 220" fill="none" stroke="#4299e1" stroke-width="2"/>

  <!-- Legend Box -->
  <rect x="520" y="20" width="250" height="70" fill="#232733" stroke="#353b4b" stroke-width="1" rx="4"/>
  <text x="530" y="40" fill="#fff" font-size="12" font-weight="bold">Leyenda de Nodos</text>
  <circle cx="540" cy="55" r="5" fill="#4299e1"/>
  <text x="555" y="60" fill="#aab2c0" font-size="11">Borde Resaltado = Equipo en sala actual</text>
  <circle cx="540" cy="75" r="5" fill="#a0aec0"/>
  <text x="555" y="80" fill="#aab2c0" font-size="11">Borde Gris = Equipo en otra sala</text>

</svg>
