<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <style>
      .text-light { fill: #ffffff; font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .text-dark { fill: #0f172a; font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .subtext-light { fill: rgba(255,255,255,0.75); font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
      .subtext-dark { fill: rgba(15,23,42,0.75); font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
      .block { stroke: #1e293b; stroke-width: 4; rx: 6; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#0f172a" />

  <!-- 1. Logo / Top Left (Pizarra Oscuro) -->
  <rect x="4" y="4" width="246" height="56" fill="#1e293b" class="block" />
  <text x="127" y="25" class="text-light">1. Logo / Header</text>
  <text x="127" y="45" class="subtext-light">ui_app_header.svg</text>

  <!-- 2. Top Header (Celeste) -->
  <rect x="254" y="4" width="942" height="56" fill="#0ea5e9" class="block" />
  <text x="725" y="25" class="text-light">2. Top Header</text>
  <text x="725" y="45" class="subtext-light">ui_top_bar.svg</text>

  <!-- 4. Sidebar (Gris Lateral) -->
  <rect x="4" y="64" width="246" height="492" fill="#334155" class="block" />
  <text x="127" y="295" class="text-light">4. Sidebar</text>
  <text x="127" y="315" class="subtext-light">Paneles Contextuales</text>

  <!-- 3. Toolbar / Tabs (Violeta) -->
  <rect x="254" y="64" width="942" height="46" fill="#8b5cf6" class="block" />
  <text x="725" y="87" class="text-light">3. Toolbar / Tabs (ui_zoom_controls.svg)</text>

  <!-- 5. Main Canvas (Gris Claro) -->
  <rect x="254" y="114" width="942" height="442" fill="#cbd5e1" class="block" />
  <text x="725" y="325" class="text-dark">5. Main Canvas</text>
  <text x="725" y="345" class="subtext-dark">ui_main_canvas.svg</text>

  <!-- 6. Bottom Bar (Rosa Oscuro / Rojo) -->
  <rect x="4" y="560" width="1192" height="46" fill="#f43f5e" class="block" />
  <text x="600" y="583" class="text-light">6. Bottom Bar / Pestañas (ui_bottom_bar.svg)</text>

  <!-- 7. Table Inventory / Expanded (Rosa Claro / Salmón) -->
  <rect x="4" y="610" width="1192" height="186" fill="#fda4af" class="block" />
  <text x="600" y="695" class="text-dark">7. Tabla de Datos / Inventario Expandido</text>
  <text x="600" y="715" class="subtext-dark">ui_table_inventory.svg</text>

</svg>
