<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 400" width="350" height="400">
  <defs>
    <style>
      .bg { fill: #0b1121; }
      .bg-panel { fill: #0f172a; border-right: 1px solid #1e293b; }
      .text-title { fill: #0ea5e9; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; }
      .text-sub { fill: #94a3b8; font-family: monospace, sans-serif; font-size: 12px; }
      .text-u { fill: #64748b; font-family: monospace, sans-serif; font-size: 11px; }
      .text-white { fill: #f8fafc; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; }
      .line { stroke: #1e293b; stroke-width: 1; }
      .u-row { fill: #111827; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg-panel" />

  <!-- Header -->
  <g transform="translate(20, 20)">
    <text x="0" y="15" class="text-title">Rack 101</text>
    <rect x="80" y="3" width="35" height="18" rx="4" fill="#1e293b" />
    <text x="97.5" y="16" class="text-sub" text-anchor="middle">42U</text>
  </g>
  <line x1="0" y1="50" x2="350" y2="50" class="line" />

  <!-- Rows -->
  <g transform="translate(0, 50)">
    
    <!-- U 42 -->
    <rect x="0" y="0" width="350" height="40" class="u-row" />
    <text x="20" y="24" class="text-u">42 U</text>
    <line x1="55" y1="10" x2="55" y2="30" stroke="#334155" stroke-width="1" />
    <text x="65" y="24" class="text-u">0 W</text>
    <line x1="0" y1="40" x2="350" y2="40" class="line" />

    <!-- U 41 -->
    <rect x="0" y="40" width="350" height="40" class="u-row" />
    <text x="20" y="64" class="text-u">41 U</text>
    <line x1="55" y1="50" x2="55" y2="70" stroke="#334155" stroke-width="1" />
    <text x="65" y="64" class="text-u">0 W</text>
    <line x1="0" y1="80" x2="350" y2="80" class="line" />

    <!-- U 40 (Occupied by Switch) -->
    <rect x="0" y="80" width="350" height="40" fill="#0f172a" />
    <text x="20" y="104" class="text-u" fill="#cbd5e1">40 U</text>
    <line x1="55" y1="90" x2="55" y2="110" stroke="#334155" stroke-width="1" />
    <text x="65" y="104" class="text-u">250 W</text>
    
    <!-- Switch Block -->
    <rect x="110" y="85" width="220" height="30" rx="4" fill="rgba(14, 165, 233, 0.1)" stroke="#0ea5e9" stroke-width="1" />
    <rect x="115" y="90" width="20" height="20" rx="4" fill="#0c4a6e" />
    <path d="M121 96 L129 96 M121 100 L129 100 M121 104 L129 104" stroke="#38bdf8" stroke-width="1.5" />
    <text x="145" y="105" class="text-white">Switch Rack 101</text>
    
    <rect x="270" y="90" width="50" height="20" rx="10" fill="#1e293b" />
    <text x="295" y="104" class="text-sub" font-size="10" text-anchor="middle">Frontal</text>
    <line x1="0" y1="120" x2="350" y2="120" class="line" />

    <!-- U 39 -->
    <rect x="0" y="120" width="350" height="40" class="u-row" />
    <text x="20" y="144" class="text-u">39 U</text>
    <line x1="55" y1="130" x2="55" y2="150" stroke="#334155" stroke-width="1" />
    <text x="65" y="144" class="text-u">0 W</text>
    <line x1="0" y1="160" x2="350" y2="160" class="line" />
    
    <!-- U 38 -->
    <rect x="0" y="160" width="350" height="40" class="u-row" />
    <text x="20" y="184" class="text-u">38 U</text>
    <line x1="55" y1="170" x2="55" y2="190" stroke="#334155" stroke-width="1" />
    <text x="65" y="184" class="text-u">0 W</text>
    <line x1="0" y1="200" x2="350" y2="200" class="line" />

  </g>
</svg>
