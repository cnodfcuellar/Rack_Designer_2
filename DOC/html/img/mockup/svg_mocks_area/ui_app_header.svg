<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <style>
      .bg { fill: #0b1121; }
      .text-title-1 { fill: #0ea5e9; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; }
      .text-title-2 { fill: #e0f2fe; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; }
      .text-sub { fill: #94a3b8; font-family: monospace, sans-serif; font-size: 12px; }
      .btn-bg { fill: #0b1121; stroke: #1e293b; stroke-width: 2; }
    </style>
    <!-- Add a glow filter for the logo -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" class="bg" />

  <!-- Logo -->
  <g transform="translate(20, 20)">
    <!-- Glow effect -->
    <rect x="0" y="0" width="40" height="40" fill="none" stroke="#0ea5e9" stroke-width="1.5" rx="4" filter="url(#glow)"/>
    <rect x="0" y="0" width="40" height="40" fill="none" stroke="#0ea5e9" stroke-width="1.5" rx="4" />
    
    <!-- Lines inside logo -->
    <!-- Green line -->
    <circle cx="8" cy="12" r="1.5" fill="#22c55e" />
    <circle cx="13" cy="12" r="1.5" fill="#22c55e" />
    <rect x="18" y="10.5" width="16" height="3" fill="#0ea5e9" rx="1.5" />
    
    <!-- Purple box -->
    <rect x="5" y="19" width="30" height="6" fill="none" stroke="#a855f7" stroke-width="1.5" rx="2" />
    <circle cx="9" cy="22" r="1.5" fill="#f59e0b" />
    <rect x="14" y="21" width="6" height="2" fill="#94a3b8" />
    
    <!-- Red/blue lines -->
    <rect x="5" y="29" width="8" height="3" fill="#0ea5e9" rx="1.5" />
    <rect x="15" y="29" width="6" height="3" fill="#0ea5e9" rx="1.5" />
    <rect x="23" y="29" width="4" height="3" fill="#ef4444" rx="1.5" />
    <rect x="29" y="29" width="4" height="3" fill="#ef4444" rx="1.5" />
  </g>

  <!-- Text -->
  <g transform="translate(75, 40)">
    <text x="0" y="0" class="text-title-1">RACK<tspan class="text-title-2"> Designer</tspan></text>
    <text x="0" y="16" class="text-sub">Nuevo Proyecto</text>
  </g>

  <!-- Hamburger Menu -->
  <g transform="translate(320, 15)">
    <rect x="0" y="0" width="50" height="50" rx="8" class="btn-bg" />
    <rect x="15" y="18" width="20" height="2.5" fill="#e2e8f0" rx="1" />
    <rect x="15" y="24" width="20" height="2.5" fill="#e2e8f0" rx="1" />
    <rect x="15" y="30" width="20" height="2.5" fill="#e2e8f0" rx="1" />
  </g>
</svg>
