  <text x="60" y="515" fill="#d2a8ff" font-size="16" font-weight="bold">PDU 8TOMAS</text>
  <circle cx="425" cy="510" r="6" fill="#10b981"/>

  <line x1="20" y1="570" x2="470" y2="570" stroke="#21262d" stroke-width="1"/>
  <text x="35" y="555" fill="#30363d" font-size="10" text-anchor="middle">12</text>
  <text x="455" y="555" fill="#30363d" font-size="10" text-anchor="middle">12</text>


