<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" style="background-color: #0d1117; font-family: -apple-system, sans-serif;">
  
  <!-- BACKGROUND -->
  <rect x="0" y="0" width="1000" height="600" fill="#0d1117"/>

  <!-- ===============================
       LEFT SIDE: RACK FRONTAL 
       =============================== -->
  <rect x="20" y="20" width="450" height="560" fill="transparent" stroke="#0ea5e9" stroke-width="4"/>
  
  <!-- Header Left -->
