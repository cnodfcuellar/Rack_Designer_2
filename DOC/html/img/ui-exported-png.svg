  <text x="455" y="235" fill="#30363d" font-size="10" text-anchor="middle">4</text>
  <rect x="50" y="210" width="390" height="40" fill="#111f18" stroke="#3fb950" stroke-width="2"/>
  <text x="60" y="235" fill="#56d364" font-size="16" font-weight="bold">Switch Poe 24P</text>
  <circle cx="425" cy="230" r="6" fill="#3fb950"/>

  <!-- U5: Switch 24P -->
  <line x1="20" y1="290" x2="470" y2="290" stroke="#21262d" stroke-width="1"/>
  <text x="35" y="275" fill="#30363d" font-size="10" text-anchor="middle">5</text>
  <text x="455" y="275" fill="#30363d" font-size="10" text-anchor="middle">5</text>
