  <text x="40" y="75" fill="#8b949e" font-size="12" letter-spacing="1">12U • 5 usadas</text>

  <!-- U Slots Background Left -->
  <!-- Left Rail -->
  <rect x="20" y="90" width="30" height="490" fill="#161b22"/>
  <!-- Right Rail -->
  <rect x="440" y="90" width="30" height="490" fill="#161b22"/>

  <!-- U Lines & Numbers (1 to 12) -->
  <!-- Loop simulated by drawing lines manually -->
  <line x1="20" y1="130" x2="470" y2="130" stroke="#21262d" stroke-width="1"/>
  <text x="35" y="115" fill="#30363d" font-size="10" text-anchor="middle">1</text>
  <text x="455" y="115" fill="#30363d" font-size="10" text-anchor="middle">1</text>

  <line x1="20" y1="170" x2="470" y2="170" stroke="#21262d" stroke-width="1"/>
  <text x="35" y="155" fill="#30363d" font-size="10" text-anchor="middle">2</text>
  <text x="455" y="155" fill="#30363d" font-size="10" text-anchor="middle">2</text>

  <line x1="20" y1="210" x2="470" y2="210" stroke="#21262d" stroke-width="1"/>
  <text x="35" y="195" fill="#30363d" font-size="10" text-anchor="middle">3</text>
  <text x="455" y="195" fill="#30363d" font-size="10" text-anchor="middle">3</text>

