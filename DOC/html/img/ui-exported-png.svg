  <circle cx="925" cy="470" r="6" fill="#10b981"/>

  <line x1="520" y1="530" x2="970" y2="530" stroke="#21262d" stroke-width="1"/>
  <text x="535" y="515" fill="#30363d" font-size="10" text-anchor="middle">11</text>
  <text x="955" y="515" fill="#30363d" font-size="10" text-anchor="middle">11</text>

  <line x1="520" y1="570" x2="970" y2="570" stroke="#21262d" stroke-width="1"/>
  <text x="535" y="555" fill="#30363d" font-size="10" text-anchor="middle">12</text>
  <text x="955" y="555" fill="#30363d" font-size="10" text-anchor="middle">12</text>

