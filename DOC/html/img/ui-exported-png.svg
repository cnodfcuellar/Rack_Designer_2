  <text x="535" y="235" fill="#30363d" font-size="10" text-anchor="middle">4</text>
  <text x="955" y="235" fill="#30363d" font-size="10" text-anchor="middle">4</text>

  <line x1="520" y1="290" x2="970" y2="290" stroke="#21262d" stroke-width="1"/>
  <text x="535" y="275" fill="#30363d" font-size="10" text-anchor="middle">5</text>
  <text x="955" y="275" fill="#30363d" font-size="10" text-anchor="middle">5</text>

  <line x1="520" y1="330" x2="970" y2="330" stroke="#21262d" stroke-width="1"/>
  <text x="535" y="315" fill="#30363d" font-size="10" text-anchor="middle">6</text>
  <text x="955" y="315" fill="#30363d" font-size="10" text-anchor="middle">6</text>

  <line x1="520" y1="370" x2="970" y2="370" stroke="#21262d" stroke-width="1"/>
  <text x="535" y="355" fill="#30363d" font-size="10" text-anchor="middle">7</text>
  <text x="955" y="355" fill="#30363d" font-size="10" text-anchor="middle">7</text>

  <line x1="520" y1="410" x2="970" y2="410" stroke="#21262d" stroke-width="1"/>
  <text x="535" y="395" fill="#30363d" font-size="10" text-anchor="middle">8</text>
  <text x="955" y="395" fill="#30363d" font-size="10" text-anchor="middle">8</text>

  <line x1="520" y1="450" x2="970" y2="450" stroke="#21262d" stroke-width="1"/>
  <text x="535" y="435" fill="#30363d" font-size="10" text-anchor="middle">9</text>
  <text x="955" y="435" fill="#30363d" font-size="10" text-anchor="middle">9</text>

  <!-- U10: Router Core (Trasera) -->
  <line x1="520" y1="490" x2="970" y2="490" stroke="#21262d" stroke-width="1"/>
  <text x="535" y="475" fill="#58a6ff" font-size="10" text-anchor="middle">10</text>
  <text x="955" y="475" fill="#58a6ff" font-size="10" text-anchor="middle">10</text>
