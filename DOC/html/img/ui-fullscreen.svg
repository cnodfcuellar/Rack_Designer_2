<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" style="background-color: #0d1117; font-family: -apple-system, sans-serif;">
  
  <!-- Main Canvas Area (Dot Grid) spanning full width/height -->
  <pattern id="dots3" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="#30363d" cx="10" cy="10" r="1"></circle>
  </pattern>
  <rect x="0" y="0" width="1000" height="500" fill="url(#dots3)"/>

  <!-- Top Floating Toolbar (Centered/Right aligned) -->
  <rect x="20" y="20" width="300" height="40" fill="#161b22" stroke="#30363d" stroke-width="1" rx="8" opacity="0.9"/>
  <text x="40" y="45" fill="#8b949e" font-size="12">-  100%  +</text>
  <rect x="120" y="26" width="90" height="28" fill="#1f6feb" rx="4" opacity="0.2"/>
  <text x="165" y="45" fill="#58a6ff" font-size="12" text-anchor="middle">ECA_Matriz</text>
  <text x="250" y="45" fill="#8b949e" font-size="12" text-anchor="middle">ECA_bodega</text>

  <rect x="800" y="20" width="180" height="40" fill="#161b22" stroke="#30363d" stroke-width="1" rx="8" opacity="0.9"/>
  <text x="830" y="45" fill="#8b949e" font-size="12">📷 PNG</text>
  <rect x="880" y="26" width="90" height="28" fill="#21262d" rx="4"/>
  <text x="925" y="44" fill="#c9d1d9" font-size="11" text-anchor="middle">Contraer</text>

  <!-- Rendered Rack Mockup (Vista Trasera) on the left -->
  <rect x="40" y="80" width="220" height="260" fill="#0d1117" stroke="#1f6feb" stroke-width="2" rx="6"/>
  
  <!-- Rack Header (Blue for Rear View) -->
  <rect x="40" y="80" width="220" height="35" fill="#1f6feb" opacity="0.2" rx="6"/>
  <text x="60" y="103" fill="#c9d1d9" font-size="14" font-weight="bold">Vista Trasera</text>
  <rect x="170" y="88" width="80" height="20" fill="#21262d" rx="4"/>
  <text x="210" y="102" fill="#8b949e" font-size="10" text-anchor="middle">FRENTE 🔄</text>

  <!-- U slots inside rack -->
  <line x1="40" y1="140" x2="260" y2="140" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="180" x2="260" y2="180" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="220" x2="260" y2="220" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="260" x2="260" y2="260" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="300" x2="260" y2="300" stroke="#21262d" stroke-width="1"/>

  <!-- Device (PDU in rear view) -->
  <rect x="50" y="302" width="200" height="36" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <text x="60" y="325" fill="#d29922" font-size="16" font-weight="bold">RT</text>
  <rect x="90" y="310" width="12" height="20" fill="#21262d" stroke="#d29922" stroke-width="1" rx="2"/>
  <rect x="110" y="310" width="12" height="20" fill="#21262d" stroke="#d29922" stroke-width="1" rx="2"/>
  <rect x="130" y="310" width="12" height="20" fill="#21262d" stroke="#d29922" stroke-width="1" rx="2"/>
  <rect x="150" y="310" width="12" height="20" fill="#21262d" stroke="#d29922" stroke-width="1" rx="2"/>
  <rect x="170" y="310" width="12" height="20" fill="#21262d" stroke="#d29922" stroke-width="1" rx="2"/>
  <rect x="190" y="310" width="12" height="20" fill="#21262d" stroke="#d29922" stroke-width="1" rx="2"/>
  <rect x="210" y="310" width="12" height="20" fill="#21262d" stroke="#d29922" stroke-width="1" rx="2"/>
  <rect x="230" y="310" width="12" height="20" fill="#21262d" stroke="#d29922" stroke-width="1" rx="2"/>

  <!-- Rack Stats Text below -->
  <text x="150" y="360" fill="#8b949e" font-size="11" text-anchor="middle">12U • 5/12 FRONT • 1/12 REAR</text>

  <!-- Floor Devices Section (Equipo de piso) full width -->
  <rect x="40" y="400" width="920" height="80" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="4" rx="8"/>
  
  <text x="60" y="425" fill="#8b949e" font-size="11" font-weight="bold">EQUIPOS DE PISO / PERIFÉRICOS</text>
  <rect x="850" y="410" width="90" height="20" fill="#21262d" rx="10"/>
  <text x="895" y="424" fill="#8b949e" font-size="10" font-weight="bold" text-anchor="middle">4 DISPOSITIVOS</text>

  <!-- Floor Device 1 -->
  <rect x="60" y="440" width="180" height="50" fill="#0d1117" stroke="#8a2be2" stroke-width="1" rx="6"/>
  <rect x="60" y="440" width="4" height="50" fill="#8a2be2" rx="2"/>
  <rect x="75" y="450" width="24" height="24" fill="#30363d" rx="4"/>
  <text x="110" y="460" fill="#c9d1d9" font-size="12" font-weight="bold">Cámara IP</text>
  <text x="110" y="475" fill="#8b949e" font-size="10">CAMERA</text>

  <!-- Floor Device 2 -->
  <rect x="260" y="440" width="180" height="50" fill="#0d1117" stroke="#2ea043" stroke-width="1" rx="6"/>
  <rect x="260" y="440" width="4" height="50" fill="#2ea043" rx="2"/>
  <rect x="275" y="450" width="24" height="24" fill="#30363d" rx="4"/>
  <text x="310" y="460" fill="#c9d1d9" font-size="12" font-weight="bold">Impresora Red</text>
  <text x="310" y="475" fill="#8b949e" font-size="10">PRINTER</text>

  <!-- Floor Device 3 -->
  <rect x="460" y="440" width="180" height="50" fill="#0d1117" stroke="#f85149" stroke-width="1" rx="6"/>
  <rect x="460" y="440" width="4" height="50" fill="#f85149" rx="2"/>
  <rect x="475" y="450" width="24" height="24" fill="#30363d" rx="4"/>
  <text x="510" y="460" fill="#c9d1d9" font-size="12" font-weight="bold">Teléfono VoIP</text>
  <text x="510" y="475" fill="#8b949e" font-size="10">PHONE</text>

  <!-- Floor Device 4 -->
  <rect x="660" y="440" width="180" height="50" fill="#0d1117" stroke="#1f6feb" stroke-width="1" rx="6"/>
  <rect x="660" y="440" width="4" height="50" fill="#1f6feb" rx="2"/>
  <rect x="675" y="450" width="24" height="24" fill="#30363d" rx="4"/>
  <text x="710" y="460" fill="#c9d1d9" font-size="12" font-weight="bold">PC Desktop</text>
  <text x="710" y="475" fill="#8b949e" font-size="10">PC</text>

</svg>
