<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radial Gradients for Spheres -->
    <radialGradient id="cyanSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>
    <radialGradient id="purpleSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </radialGradient>
    <radialGradient id="roseSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </radialGradient>
    <radialGradient id="orangeSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>
    <radialGradient id="greenSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <style>
      .main-title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 26px; fill: #ffffff; letter-spacing: 1px; }
      .desc-title { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; fill: #94a3b8; }
      .step-num { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 48px; fill: #334155; fill-opacity: 0.4; }
      .step-label { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; fill: #f8fafc; text-anchor: middle; text-transform: uppercase; letter-spacing: 1.5px; }
      .step-desc { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .wireframe-stroke { stroke: #475569; stroke-width: 1.5; fill: none; }
      .wireframe-fill { fill: #1e293b; fill-opacity: 0.5; }
      .example-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .example-body { font-family: 'Consolas', monospace; font-size: 11px; fill: #38bdf8; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="550" fill="url(#bgGrad)" />

  <!-- Title -->
  <text x="50" y="55" class="main-title">Evolución de Componentes: Del Átomo a la Página</text>
  <text x="50" y="80" class="desc-title">Cómo las piezas pequeñas se ensamblan progresivamente para crear el proyecto Rack Designer 2</text>

  <!-- Progression Arrows -->
  <g stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 180 230 L 220 230 M 215 225 L 220 230 L 215 235" />
    <path d="M 380 230 L 420 230 M 415 225 L 420 230 L 415 235" />
    <path d="M 580 230 L 620 230 M 615 225 L 620 230 L 615 235" />
    <path d="M 780 230 L 820 230 M 815 225 L 820 230 L 815 235" />
  </g>

  <!-- ==================== STEP 1: ATOMS ==================== -->
  <g transform="translate(100, 120)">
    <text x="0" y="30" class="step-num" text-anchor="middle">01</text>
    
    <!-- Visual Representation: A single basic sphere -->
    <circle cx="0" cy="110" r="25" fill="url(#cyanSphere)" filter="url(#glow)" opacity="0.3"/>
    <circle cx="0" cy="110" r="25" fill="url(#cyanSphere)"/>
    
    <text x="0" y="180" class="step-label" fill="#22d3ee">Átomo</text>
    <text x="0" y="198" class="step-desc">Pieza única e indivisible</text>
    
    <!-- Project example -->
    <rect x="-70" y="225" width="140" height="70" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" />
    <text x="0" y="248" class="example-title">Ejemplo Código:</text>
    <text x="0" y="270" class="example-body">&lt;button class="btn"&gt;</text>
    <text x="0" y="282" class="example-body">"Slot 1U Vacío"</text>
  </g>

  <!-- ==================== STEP 2: MOLECULES ==================== -->
  <g transform="translate(300, 120)">
    <text x="0" y="30" class="step-num" text-anchor="middle">02</text>
    
    <!-- Visual Representation: Spheres bonded together -->
    <g stroke="#a855f7" stroke-width="3">
      <line x1="-25" y1="110" x2="25" y2="110" />
      <line x1="0" y1="110" x2="15" y2="85" />
    </g>
    <circle cx="-25" cy="110" r="16" fill="url(#purpleSphere)"/>
    <circle cx="25" cy="110" r="16" fill="url(#purpleSphere)"/>
    <circle cx="15" cy="85" r="10" fill="url(#cyanSphere)"/> <!-- Shows atom inside molecule -->
    
    <text x="0" y="180" class="step-label" fill="#a855f7">Molécula</text>
    <text x="0" y="198" class="step-desc">Unión de varios átomos</text>

    <!-- Project example -->
    <rect x="-70" y="225" width="140" height="70" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" />
    <text x="0" y="248" class="example-title">Ejemplo Código:</text>
    <text x="0" y="270" class="example-body">Label + Input</text>
    <text x="0" y="282" class="example-body">"Item Catálogo"</text>
  </g>

  <!-- ==================== STEP 3: ORGANISMS ==================== -->
  <g transform="translate(500, 120)">
    <text x="0" y="30" class="step-num" text-anchor="middle">03</text>
    
    <!-- Visual Representation: Complex structure (Many bonded molecules enclosed in a system) -->
    <rect x="-45" y="65" width="90" height="90" rx="10" fill="none" stroke="#f43f5e" stroke-dasharray="4 4" stroke-width="2" />
    <!-- Group of molecules inside -->
    <g stroke="#64748b" stroke-width="2">
      <line x1="-20" y1="110" x2="20" y2="110" />
      <line x1="-20" y1="110" x2="-20" y2="85" />
      <line x1="20" y1="110" x2="20" y2="135" />
    </g>
    <circle cx="-20" cy="110" r="12" fill="url(#purpleSphere)"/>
    <circle cx="20" cy="110" r="12" fill="url(#purpleSphere)"/>
    <circle cx="-20" cy="85" r="8" fill="url(#cyanSphere)"/>
    <circle cx="20" cy="135" r="8" fill="url(#roseSphere)"/>
    
    <text x="0" y="180" class="step-label" fill="#f43f5e">Organismo</text>
    <text x="0" y="198" class="step-desc">Componente funcional complejo</text>

    <!-- Project example -->
    <rect x="-70" y="225" width="140" height="70" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" />
    <text x="0" y="248" class="example-title">Ejemplo Código:</text>
    <text x="0" y="270" class="example-body">Gabinete Rack</text>
    <text x="0" y="282" class="example-body">"Formulario Modal"</text>
  </g>

  <!-- ==================== STEP 4: TEMPLATES ==================== -->
  <g transform="translate(700, 120)">
    <text x="0" y="30" class="step-num" text-anchor="middle">04</text>
    
    <!-- Visual Representation: Wireframe Layout (showing where organisms go) -->
    <g transform="translate(-40, 65)">
      <!-- Main layout box -->
      <rect x="0" y="0" width="80" height="90" rx="4" class="wireframe-stroke" />
      <!-- Top header wireframe placeholder -->
      <rect x="5" y="5" width="70" height="15" rx="2" class="wireframe-stroke" />
      <!-- Left sidebar wireframe placeholder -->
      <rect x="5" y="25" width="20" height="60" rx="2" class="wireframe-stroke" fill="#334155" fill-opacity="0.3" />
      <!-- Main canvas wireframe placeholder (Organism goes here) -->
      <rect x="30" y="25" width="45" height="60" rx="2" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-dasharray="2 2" />
      <!-- Small indicator representing the organism -->
      <circle cx="52" cy="55" r="8" fill="url(#orangeSphere)" />
    </g>
    
    <text x="0" y="180" class="step-label" fill="#fb923c">Plantilla</text>
    <text x="0" y="198" class="step-desc">Estructura / Plano visual</text>

    <!-- Project example -->
    <rect x="-70" y="225" width="140" height="70" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" />
    <text x="0" y="248" class="example-title">Ejemplo Código:</text>
    <text x="0" y="270" class="example-body">Layout Grid CSS</text>
    <text x="0" y="282" class="example-body">"Lienzo de Trabajo"</text>
  </g>

  <!-- ==================== STEP 5: PAGES ==================== -->
  <g transform="translate(900, 120)">
    <text x="0" y="30" class="step-num" text-anchor="middle">05</text>
    
    <!-- Visual Representation: Final Page with real UI look and mock values -->
    <g transform="translate(-40, 65)">
      <!-- Main window -->
      <rect x="0" y="0" width="80" height="90" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <!-- Colored Header -->
      <rect x="3" y="3" width="74" height="15" rx="1" fill="#1e293b" />
      <rect x="8" y="8" width="15" height="4" rx="1" fill="#38bdf8" /> <!-- Logo mockup -->
      <!-- Active Sidebar -->
      <rect x="3" y="21" width="22" height="66" rx="1" fill="#1e293b" />
      <circle cx="14" cy="35" r="3" fill="#a855f7" />
      <circle cx="14" cy="50" r="3" fill="#a855f7" />
      <!-- Populated Content Area (Real Racks with Devices) -->
      <g transform="translate(30, 21)">
        <!-- A Rack mock drawing -->
        <rect x="5" y="5" width="35" height="56" rx="1" fill="#0b0f19" stroke="#475569" stroke-width="0.5" />
        <rect x="8" y="15" width="29" height="8" rx="0.5" fill="#f43f5e" /> <!-- Occupied Device 1 -->
        <rect x="8" y="28" width="29" height="5" rx="0.5" fill="#06b6d4" /> <!-- Occupied Device 2 -->
        <rect x="8" y="38" width="29" height="12" rx="0.5" fill="#10b981" /> <!-- Occupied Device 3 -->
      </g>
    </g>
    
    <text x="0" y="180" class="step-label" fill="#10b981">Página</text>
    <text x="0" y="198" class="step-desc">Pantalla con datos reales</text>

    <!-- Project example -->
    <rect x="-70" y="225" width="140" height="70" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" />
    <text x="0" y="248" class="example-title">Ejemplo Código:</text>
    <text x="0" y="270" class="example-body">Data Center Vista</text>
    <text x="0" y="282" class="example-body">"Topología de Red"</text>
  </g>
</svg>
