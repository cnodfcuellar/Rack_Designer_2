<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
<defs>
  <style>
    @keyframes drag-anim { 0%{transform:translate(0,0)} 25%{transform:translate(60px,20px)} 75%{transform:translate(120px,40px)} 100%{transform:translate(180px,0px)} }
    @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .dd-anim { animation: drag-anim 3s ease-in-out infinite; }
    .flash { animation: flash 1s ease-in-out infinite; }
    .dl { font-family:'JetBrains Mono',monospace; font-size:9px; }
    .dh { font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; }
    @keyframes dd-flow2 { from{stroke-dashoffset:24} to{stroke-dashoffset:0} }
    .df { stroke-dasharray:8,4; animation: dd-flow2 1.2s linear infinite; }
  </style>
  <marker id="dma" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#38bdf8"/>
  </marker>
  <marker id="dma-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#10b981"/>
  </marker>
  <marker id="dma-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#ef4444"/>
  </marker>
</defs>
<rect width="960" height="600" fill="#080c18" rx="12"/>
<text x="480" y="24" text-anchor="middle" font-family="Space Grotesk" font-size="14" font-weight="700" fill="#38bdf8">Ciclo de Vida — Drag &amp; Drop de Dispositivos</text>

<!-- Sources: Catalog item drag / Faceplate drag -->
<rect x="30" y="50" width="160" height="60" rx="8" fill="#0f2535" stroke="#10b981" stroke-width="2"/>
<text x="110" y="74" text-anchor="middle" class="dh" fill="#34d399">CATÁLOGO</text>
<text x="110" y="90" text-anchor="middle" class="dl" fill="#64748b">onCatalogDragStart</text>
<text x="110" y="102" text-anchor="middle" class="dl" fill="#64748b">dragState.type='catalog'</text>

<rect x="30" y="130" width="160" height="60" rx="8" fill="#0f2020" stroke="#06b6d4" stroke-width="2"/>
<text x="110" y="154" text-anchor="middle" class="dh" fill="#22d3ee">FACEPLATE</text>
<text x="110" y="170" text-anchor="middle" class="dl" fill="#64748b">onDeviceDragStart</text>
<text x="110" y="182" text-anchor="middle" class="dl" fill="#64748b">dragState.type='device'</text>

<!-- dragState central -->
<rect x="230" y="76" width="180" height="100" rx="10" fill="#1a1f35" stroke="#818cf8" stroke-width="2"/>
<text x="320" y="100" text-anchor="middle" class="dh" fill="#a5b4fc">dragState {}</text>
<text x="320" y="116" text-anchor="middle" class="dl" fill="#94a3b8">type: 'catalog' | 'device'</text>
<text x="320" y="130" text-anchor="middle" class="dl" fill="#94a3b8">item: catalogItem</text>
<text x="320" y="144" text-anchor="middle" class="dl" fill="#94a3b8">deviceId: uuid</text>
<text x="320" y="158" text-anchor="middle" class="dl" fill="#94a3b8">device: deepClone(dev)</text>

<!-- Arrows to dragState -->
<line x1="190" y1="80" x2="230" y2="100" stroke="#10b981" stroke-width="1.5" marker-end="url(#dma-g)" class="df"/>
<line x1="190" y1="160" x2="230" y2="148" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#dma)" class="df"/>

<!-- setDragImage (ghost) -->
<rect x="230" y="200" width="180" height="50" rx="8" fill="#0a0a1a" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="320" y="220" text-anchor="middle" class="dh" fill="#c4b5fd">#drag-ghost</text>
<text x="320" y="234" text-anchor="middle" class="dl" fill="#64748b">buildFaceplate(item)</text>
<text x="320" y="246" text-anchor="middle" class="dl" fill="#64748b">e.dataTransfer.setDragImage</text>
<line x1="320" y1="176" x2="320" y2="200" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#dma)"/>

<!-- dragover detection -->
<rect x="460" y="76" width="220" height="130" rx="10" fill="#1a1a0a" stroke="#f59e0b" stroke-width="2"/>
<text x="570" y="100" text-anchor="middle" class="dh" fill="#fbbf24">onSlotDragOver</text>
<text x="570" y="116" text-anchor="middle" class="dl" fill="#94a3b8">slot.dataset.slot → slotU</text>
<text x="570" y="130" text-anchor="middle" class="dl" fill="#94a3b8">slot.dataset.rack → rackId</text>
<text x="570" y="144" text-anchor="middle" class="dl" fill="#94a3b8">slot.dataset.side → mountSide</text>
<text x="570" y="160" text-anchor="middle" class="dl" fill="#64748b">Verifica colisión por lado</text>
<text x="570" y="174" text-anchor="middle" class="dl" fill="#64748b">clearDropHighlights()</text>
<text x="570" y="186" text-anchor="middle" class="dl" fill="#64748b">→ drop-highlight / drop-invalid</text>

<line x1="410" y1="126" x2="460" y2="126" stroke="#f59e0b" stroke-width="2" marker-end="url(#dma)" class="df"/>

<!-- Collision Check -->
<rect x="700" y="50" width="240" height="160" rx="10" fill="#1a0a0a" stroke="#ef4444" stroke-width="2"/>
<text x="820" y="74" text-anchor="middle" class="dh" fill="#f87171">Verificación de Colisión</text>
<text x="820" y="94" text-anchor="middle" class="dl" fill="#94a3b8">existing = allDevicesInRack(rackId)</text>
<text x="820" y="108" text-anchor="middle" class="dl" fill="#94a3b8">.filter(d=&gt;mountSide===side)</text>
<line x1="712" y1="122" x2="840" y2="122" stroke="#1e2d4e" stroke-width="1"/>
<text x="820" y="140" text-anchor="middle" class="dl" fill="#6ee7b7">✓ !(nEnd &lt; d.slotStart</text>
<text x="820" y="154" text-anchor="middle" class="dl" fill="#6ee7b7">  || slotU &gt; dEnd)</text>
<line x1="712" y1="168" x2="840" y2="168" stroke="#1e2d4e" stroke-width="1"/>
<text x="820" y="184" text-anchor="middle" class="dl" fill="#ef4444">⚠ BUG-10: canPlace()</text>
<text x="820" y="198" text-anchor="middle" class="dl" fill="#ef4444">ignora mountSide</text>

<line x1="680" y1="141" x2="700" y2="141" stroke="#ef4444" stroke-width="1.5" marker-end="url(#dma-r)"/>

<!-- Feedback visual -->
<rect x="460" y="240" width="220" height="80" rx="8" fill="#0d1428" stroke="#38bdf8" stroke-width="1.5"/>
<text x="570" y="260" text-anchor="middle" class="dh" fill="#7dd3fc">Feedback Visual</text>
<rect x="476" y="270" width="80" height="22" rx="4" fill="#10b981" opacity="0.4"/>
<text x="516" y="285" text-anchor="middle" class="dl" fill="#6ee7b7">.drop-highlight</text>
<rect x="576" y="270" width="80" height="22" rx="4" fill="#ef4444" opacity="0.4"/>
<text x="616" y="285" text-anchor="middle" class="dl" fill="#fca5a5">.drop-invalid</text>
<line x1="570" y1="206" x2="570" y2="240" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#dma)"/>

<!-- onSlotDrop -->
<rect x="460" y="354" width="220" height="100" rx="10" fill="#0f2535" stroke="#10b981" stroke-width="2"/>
<text x="570" y="378" text-anchor="middle" class="dh" fill="#34d399">onSlotDrop()</text>
<text x="570" y="396" text-anchor="middle" class="dl" fill="#94a3b8">type==='catalog' →</text>
<text x="570" y="410" text-anchor="middle" class="dl" fill="#94a3b8">  store.addDeviceToRack()</text>
<text x="570" y="424" text-anchor="middle" class="dl" fill="#94a3b8">type==='device' →</text>
<text x="570" y="438" text-anchor="middle" class="dl" fill="#94a3b8">  store.moveDevice()</text>
<line x1="570" y1="320" x2="570" y2="354" stroke="#10b981" stroke-width="1.5" marker-end="url(#dma-g)"/>

<!-- store validation -->
<rect x="700" y="250" width="240" height="120" rx="10" fill="#061a10" stroke="#10b981" stroke-width="2"/>
<text x="820" y="274" text-anchor="middle" class="dh" fill="#34d399">store.addDeviceToRack()</text>
<text x="820" y="292" text-anchor="middle" class="dl" fill="#94a3b8">1. rackById(rackId)</text>
<text x="820" y="308" text-anchor="middle" class="dl" fill="#94a3b8">2. slotStart+size &lt;= rack.height</text>
<text x="820" y="324" text-anchor="middle" class="dl" fill="#94a3b8">3. collision check (correcta ✓)</text>
<text x="820" y="340" text-anchor="middle" class="dl" fill="#94a3b8">4. snapshot() → push device</text>
<text x="820" y="354" text-anchor="middle" class="dl" fill="#94a3b8">5. _save() + _emit()</text>
<line x1="680" y1="360" x2="700" y2="340" stroke="#10b981" stroke-width="1.5" marker-end="url(#dma-g)"/>

<!-- onDragEnd -->
<rect x="230" y="354" width="180" height="60" rx="8" fill="#1a1a1a" stroke="#64748b" stroke-width="1.5"/>
<text x="320" y="378" text-anchor="middle" class="dh" fill="#94a3b8">onDragEnd()</text>
<text x="320" y="394" text-anchor="middle" class="dl" fill="#64748b">dragState = null</text>
<text x="320" y="406" text-anchor="middle" class="dl" fill="#64748b">clearDropHighlights()</text>
<line x1="410" y1="384" x2="460" y2="384" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>

<!-- notify result -->
<rect x="700" y="400" width="240" height="60" rx="8" fill="#0f2535" stroke="#10b981" stroke-width="1.5"/>
<text x="820" y="422" text-anchor="middle" class="dh" fill="#34d399">notify()</text>
<text x="820" y="438" text-anchor="middle" class="dl" fill="#94a3b8">✓ Instalado en U${slotU}</text>
<text x="820" y="450" text-anchor="middle" class="dl" fill="#ef4444">✗ Espacio ocupado</text>
<line x1="820" y1="370" x2="820" y2="400" stroke="#10b981" stroke-width="1.5" marker-end="url(#dma-g)"/>

<!-- Floor drop path -->
<rect x="30" y="380" width="180" height="70" rx="8" fill="#0a0f1f" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="120" y="402" text-anchor="middle" class="dh" fill="#c4b5fd">PISO (floor)</text>
<text x="120" y="420" text-anchor="middle" class="dl" fill="#94a3b8">.floor-devices-grid</text>
<text x="120" y="434" text-anchor="middle" class="dl" fill="#94a3b8">dragover event</text>
<text x="120" y="448" text-anchor="middle" class="dl" fill="#94a3b8">store.addFloorDevice()</text>
<path d="M 110 130 Q 60 200 60 380" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

<!-- Timeline bar -->
<rect x="30" y="496" width="900" height="80" rx="8" fill="#0d1428" stroke="#1e2d4e"/>
<text x="480" y="514" text-anchor="middle" class="dh" fill="#475569">TIMELINE DE EVENTOS</text>
<line x1="50" y1="530" x2="910" y2="530" stroke="#1e2d4e" stroke-width="1"/>
<circle cx="90" cy="530" r="5" fill="#10b981"/>
<text x="90" y="548" text-anchor="middle" class="dl" fill="#6ee7b7">dragstart</text>
<circle cx="240" cy="530" r="5" fill="#f59e0b"/>
<text x="240" y="548" text-anchor="middle" class="dl" fill="#fbbf24">dragover</text>
<circle cx="450" cy="530" r="5" fill="#38bdf8"/>
<text x="450" y="548" text-anchor="middle" class="dl" fill="#7dd3fc">dragleave</text>
<circle cx="640" cy="530" r="5" fill="#34d399"/>
<text x="640" y="548" text-anchor="middle" class="dl" fill="#6ee7b7">drop</text>
<circle cx="830" cy="530" r="5" fill="#94a3b8"/>
<text x="830" y="548" text-anchor="middle" class="dl" fill="#94a3b8">dragend</text>
<line x1="90" y1="530" x2="240" y2="530" stroke="#f59e0b" stroke-width="2" class="df"/>
<line x1="240" y1="530" x2="450" y2="530" stroke="#38bdf8" stroke-width="2" class="df"/>
<line x1="450" y1="530" x2="640" y2="530" stroke="#34d399" stroke-width="2" class="df"/>
<line x1="640" y1="530" x2="830" y2="530" stroke="#94a3b8" stroke-width="2"/>
<text x="480" y="572" text-anchor="middle" class="dl" fill="#475569">repeat n veces (hovering over multiple slots) → una sola llamada a store al soltar</text>
</svg>