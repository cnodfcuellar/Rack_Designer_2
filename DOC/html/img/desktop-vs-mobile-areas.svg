<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191a21" />
      <stop offset="100%" stop-color="#282a36" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="desktopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50fa7b" />
      <stop offset="100%" stop-color="#8be9fd" />
    </linearGradient>
    
    <linearGradient id="mobileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb86c" />
      <stop offset="100%" stop-color="#ff5555" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Main Title -->
  <text x="600" y="60" fill="#f8f8f2" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle" letter-spacing="1">Bocetos de Áreas (Salas): Escritorio vs. Móvil</text>
  <text x="600" y="90" fill="#6272a4" font-family="sans-serif" font-size="18" text-anchor="middle">Cómo se distribuye y navega el espacio físico (Salas de Datos) según la pantalla</text>
  <line x1="100" y1="120" x2="1100" y2="120" stroke="#44475a" stroke-width="2" />

  <!-- Divider Line -->
  <line x1="600" y1="150" x2="600" y2="750" stroke="#44475a" stroke-width="2" stroke-dasharray="10, 10" />

  <!-- =============================== -->
  <!-- LEFT SIDE: DESKTOP AREAS        -->
  <!-- =============================== -->

  <!-- Desktop Header -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#desktopGrad)" filter="url(#shadow)"/>
    <!-- Area Icon -->
    <path d="M 15 15 L 45 15 L 45 45 L 15 45 Z M 15 30 L 45 30 M 30 15 L 30 45" stroke="#282a36" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="80" y="25" fill="#50fa7b" font-family="sans-serif" font-size="24" font-weight="bold">Áreas en Escritorio</text>
    <text x="80" y="50" fill="#f8f8f2" font-family="sans-serif" font-size="16">Pestañas Estáticas y Lienzo Dividido</text>
  </g>

  <!-- Desktop Monitor Mockup -->
  <g transform="translate(100, 250)" filter="url(#shadow)">
    <!-- Monitor Frame -->
    <rect x="0" y="0" width="400" height="240" rx="8" fill="#21222c" stroke="#44475a" stroke-width="4"/>
    <rect x="150" y="240" width="100" height="30" fill="#44475a"/>
    <rect x="100" y="270" width="200" height="10" rx="5" fill="#44475a"/>
    
    <!-- App UI -->
    <!-- Top Bar -->
    <rect x="4" y="4" width="392" height="20" fill="#191a21" />
    <circle cx="380" cy="14" r="4" fill="#50fa7b" />
    
    <!-- Room Tabs (Desktop style: multiple visible tabs) -->
    <rect x="4" y="24" width="392" height="24" fill="#282a36" />
    <!-- Tab 1 (Active) -->
    <rect x="10" y="28" width="100" height="20" rx="4" fill="#1e1e24" />
    <text x="60" y="41" fill="#8be9fd" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Data Center 1</text>
    <!-- Tab 2 -->
    <rect x="115" y="28" width="100" height="20" rx="4" fill="#44475a" />
    <text x="165" y="41" fill="#f8f8f2" font-family="sans-serif" font-size="10" text-anchor="middle">Sala Eléctrica</text>
    <!-- Tab 3 -->
    <rect x="220" y="28" width="100" height="20" rx="4" fill="#44475a" />
    <text x="270" y="41" fill="#f8f8f2" font-family="sans-serif" font-size="10" text-anchor="middle">Telecomunicaciones</text>
    <!-- Add Tab Button -->
    <rect x="325" y="28" width="20" height="20" rx="4" fill="#6272a4" />
    <text x="335" y="42" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle">+</text>

    <!-- Canvas Area -->
    <rect x="4" y="48" width="392" height="188" fill="#1e1e24" />
    <!-- Floor plan sketch -->
    <rect x="20" y="60" width="360" height="160" fill="none" stroke="#44475a" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Racks Group 1 -->
    <rect x="40" y="80" width="80" height="40" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
    <rect x="130" y="80" width="80" height="40" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
    <rect x="220" y="80" width="80" height="40" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
    
    <!-- Racks Group 2 -->
    <rect x="40" y="150" width="80" height="40" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
    <rect x="130" y="150" width="80" height="40" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
    <rect x="220" y="150" width="80" height="40" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
  </g>

  <!-- Desktop Key Features -->
  <g transform="translate(100, 580)">
    <!-- Feature 1 -->
    <circle cx="20" cy="20" r="16" fill="#44475a"/>
    <rect x="12" y="15" width="16" height="10" fill="#8be9fd"/>
    <text x="50" y="15" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold">Pestañas Multi-Vista</text>
    <text x="50" y="35" fill="#6272a4" font-family="sans-serif" font-size="14">Todas las salas accesibles simultáneamente en la barra superior.</text>

    <!-- Feature 2 -->
    <circle cx="20" cy="80" r="16" fill="#44475a"/>
    <path d="M 12 72 L 28 72 L 28 88 L 12 88 Z" fill="none" stroke="#50fa7b" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="50" y="75" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold">Distribución en Grilla Libre</text>
    <text x="50" y="95" fill="#6272a4" font-family="sans-serif" font-size="14">El lienzo ancho permite posicionar Racks de forma espaciada.</text>
  </g>


  <!-- =============================== -->
  <!-- RIGHT SIDE: MOBILE AREAS        -->
  <!-- =============================== -->

  <!-- Mobile Header -->
  <g transform="translate(650, 150)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="url(#mobileGrad)" filter="url(#shadow)"/>
    <!-- Area Swipe Icon -->
    <path d="M 15 30 L 45 30 M 15 30 L 25 20 M 15 30 L 25 40" stroke="#282a36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="25" fill="#ffb86c" font-family="sans-serif" font-size="24" font-weight="bold">Áreas en Móvil</text>
    <text x="80" y="50" fill="#f8f8f2" font-family="sans-serif" font-size="16">Pestañas Deslizables y Enfoque Único</text>
  </g>

  <!-- Mobile Device Mockups -->
  <g transform="translate(700, 240)" filter="url(#shadow)">
    <!-- Device Main View -->
    <rect x="0" y="0" width="180" height="320" rx="16" fill="#21222c" stroke="#44475a" stroke-width="4"/>
    <!-- Notch -->
    <path d="M 60 4 L 120 4 L 115 15 L 65 15 Z" fill="#44475a"/>
    
    <!-- Top Bar -->
    <rect x="4" y="20" width="172" height="25" fill="#191a21" />
    <text x="10" y="37" fill="#f8f8f2" font-family="sans-serif" font-size="12" font-weight="bold">Rack Designer</text>
    
    <!-- Mobile Swipeable Tabs -->
    <rect x="4" y="45" width="172" height="30" fill="#282a36" />
    
    <!-- Tab 1 (Partially visible/swiped left) -->
    <rect x="-30" y="50" width="80" height="20" rx="10" fill="#44475a" />
    <!-- Tab 2 (Active Centered) -->
    <rect x="60" y="50" width="100" height="20" rx="10" fill="#1e1e24" stroke="#ffb86c" stroke-width="1"/>
    <text x="110" y="64" fill="#ffb86c" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Data Center 1</text>
    <!-- Tab 3 (Partially visible/swiped right) -->
    <rect x="170" y="50" width="80" height="20" rx="10" fill="#44475a" />
    
    <!-- Canvas Area -->
    <rect x="4" y="75" width="172" height="240" fill="#1e1e24" />
    
    <!-- Floor plan sketch (Vertical layout) -->
    <rect x="10" y="85" width="152" height="220" fill="none" stroke="#44475a" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Racks Stacked Vertically -->
    <rect x="20" y="100" width="132" height="40" rx="4" fill="#282a36" stroke="#ff5555" stroke-width="2"/>
    <text x="86" y="125" fill="#6272a4" font-family="sans-serif" font-size="12" text-anchor="middle">Rack A1</text>

    <rect x="20" y="150" width="132" height="40" rx="4" fill="#282a36" stroke="#ff5555" stroke-width="2"/>
    <text x="86" y="175" fill="#6272a4" font-family="sans-serif" font-size="12" text-anchor="middle">Rack A2</text>

    <rect x="20" y="200" width="132" height="40" rx="4" fill="#282a36" stroke="#ff5555" stroke-width="2"/>
    <text x="86" y="225" fill="#6272a4" font-family="sans-serif" font-size="12" text-anchor="middle">Rack A3</text>

    <!-- Swipe Gesture Indicator -->
    <path d="M 50 60 L 40 60 M 130 60 L 140 60" stroke="#f8f8f2" stroke-width="2" stroke-linecap="round"/>
    <path d="M 45 55 L 40 60 L 45 65" stroke="#f8f8f2" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 135 55 L 140 60 L 135 65" stroke="#f8f8f2" stroke-width="2" stroke-linecap="round" fill="none"/>

    <circle cx="90" cy="180" r="20" fill="#ffffff" opacity="0.2" />
    <circle cx="90" cy="180" r="10" fill="#ffffff" opacity="0.4" />
    <path d="M 90 200 L 90 140" stroke="#ffffff" stroke-width="3" stroke-dasharray="4,4" opacity="0.6"/>
    <path d="M 85 145 L 90 140 L 95 145" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6"/>
  </g>

  <!-- Mobile Key Features -->
  <g transform="translate(650, 580)">
    <!-- Feature 1 -->
    <circle cx="20" cy="20" r="16" fill="#44475a"/>
    <path d="M 12 20 L 28 20 M 12 20 L 18 14 M 12 20 L 18 26" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="50" y="15" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold">Pestañas con Scroll Táctil</text>
    <text x="50" y="35" fill="#6272a4" font-family="sans-serif" font-size="14">Navegación entre salas arrastrando las pestañas laterales.</text>

    <!-- Feature 2 -->
    <circle cx="20" cy="80" r="16" fill="#44475a"/>
    <rect x="16" y="70" width="8" height="20" rx="2" fill="none" stroke="#ff5555" stroke-width="2"/>
    <line x1="12" y1="80" x2="28" y2="80" stroke="#ff5555" stroke-width="2"/>
    <text x="50" y="75" fill="#f8f8f2" font-family="sans-serif" font-size="16" font-weight="bold">Apilamiento Vertical (Stacking)</text>
    <text x="50" y="95" fill="#6272a4" font-family="sans-serif" font-size="14">Racks distribuidos verticalmente para aprovechar el espacio.</text>
  </g>

</svg>
