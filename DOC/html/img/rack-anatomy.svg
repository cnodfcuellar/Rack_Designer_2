<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" style="background:#1a1e27; font-family:-apple-system, sans-serif;">
  <!-- Title -->
  <text x="30" y="40" fill="#ffffff" font-size="20" font-weight="bold">Anatomía de un Gabinete (Rack)</text>
  <text x="30" y="65" fill="#8b9ab8" font-size="14">Concepto de Unidades (U) y Montaje Frontal/Trasero</text>
  
  <!-- Rack Body -->
  <rect x="250" y="100" width="160" height="250" fill="#0f111a" stroke="#4a5568" stroke-width="4" rx="4"/>
  <rect x="250" y="100" width="160" height="30" fill="#2d3748" stroke="#4a5568" stroke-width="4" rx="4"/>
  <text x="330" y="120" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">RACK-01</text>
  
  <!-- U Indicators (Left side of Rack) -->
  <line x1="230" y1="340" x2="245" y2="340" stroke="#8b9ab8" stroke-width="1"/>
  <text x="220" y="344" fill="#8b9ab8" font-size="12" text-anchor="end">1U</text>
  
  <line x1="230" y1="300" x2="245" y2="300" stroke="#8b9ab8" stroke-width="1"/>
  <text x="220" y="304" fill="#8b9ab8" font-size="12" text-anchor="end">...U</text>
  
  <line x1="230" y1="200" x2="245" y2="200" stroke="#8b9ab8" stroke-width="1"/>
  <text x="220" y="204" fill="#8b9ab8" font-size="12" text-anchor="end">40U</text>
  
  <line x1="230" y1="160" x2="245" y2="160" stroke="#8b9ab8" stroke-width="1"/>
  <text x="220" y="164" fill="#8b9ab8" font-size="12" text-anchor="end">41U</text>
  
  <!-- Server Front (2U) -->
  <rect x="254" y="280" width="152" height="60" fill="#2b6cb0" stroke="#1a365d" stroke-width="2"/>
  <text x="330" y="315" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Servidor (Frente)</text>
  <text x="330" y="330" fill="#bee3f8" font-size="11" text-anchor="middle">Tamaño: 2U</text>
  
  <!-- Server Rear (1U) -->
  <rect x="254" y="240" width="152" height="30" fill="#c53030" stroke="#742a2a" stroke-width="2"/>
  <text x="330" y="260" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">PDU (Atrás)</text>
  
  <!-- Explanatory Lines and Text -->
  <path d="M 160 310 L 250 310" fill="none" stroke="#2196f3" stroke-width="2" stroke-dasharray="4"/>
  <rect x="30" y="290" width="120" height="40" fill="#232733" rx="4"/>
  <text x="40" y="308" fill="#fff" font-size="12" font-weight="bold">Equipos Frontales</text>
  <text x="40" y="322" fill="#8b9ab8" font-size="10">Ocupan espacio principal</text>
  
  <path d="M 160 255 L 250 255" fill="none" stroke="#f56565" stroke-width="2" stroke-dasharray="4"/>
  <rect x="30" y="235" width="120" height="40" fill="#232733" rx="4"/>
  <text x="40" y="253" fill="#fff" font-size="12" font-weight="bold">Equipos Traseros</text>
  <text x="40" y="267" fill="#8b9ab8" font-size="10">Regletas o Cableado</text>

  <!-- Explanation box -->
  <rect x="460" y="100" width="300" height="150" fill="rgba(33, 150, 243, 0.1)" stroke="#2196f3" stroke-width="2" rx="8"/>
  <text x="480" y="130" fill="#fff" font-size="14" font-weight="bold">¿Cómo se cuenta?</text>
  <text x="480" y="155" fill="#aab2c0" font-size="12">1. Las "Unidades" (U) se enumeran desde la</text>
  <text x="480" y="175" fill="#aab2c0" font-size="12">   parte INFERIOR (1U) hacia ARRIBA (42U).</text>
  <text x="480" y="200" fill="#aab2c0" font-size="12">2. Puedes instalar un Servidor por delante,</text>
  <text x="480" y="220" fill="#aab2c0" font-size="12">   y una regleta PDU por detrás en la misma "U".</text>
</svg>
