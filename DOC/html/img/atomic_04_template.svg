<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="orangeSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>
    <style>
      .wireframe-stroke { stroke: #475569; stroke-width: 1.5; fill: none; }
      .wireframe-fill { fill: #1e293b; fill-opacity: 0.3; }
    </style>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" rx="15" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle background grid -->
  <g stroke="#334155" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>

  <!-- Template Wireframe Drawing -->
  <g transform="translate(100, 35)">
    <!-- Base application window -->
    <rect x="0" y="0" width="200" height="150" rx="6" class="wireframe-stroke" />
    
    <!-- Top toolbar area placeholder -->
    <rect x="8" y="8" width="184" height="24" rx="3" class="wireframe-stroke wireframe-fill" />
    
    <!-- Left sidebar container -->
    <rect x="8" y="40" width="50" height="102" rx="3" class="wireframe-stroke wireframe-fill" />
    <!-- Small indicators representing slots/items in sidebar -->
    <line x1="15" y1="50" x2="50" y2="50" stroke="#475569" stroke-width="2"/>
    <line x1="15" y1="65" x2="45" y2="65" stroke="#475569" stroke-width="2"/>
    <line x1="15" y1="80" x2="50" y2="80" stroke="#475569" stroke-width="2"/>

    <!-- Main Workspace Container (Dashboard content area) -->
    <!-- The highlighted space where the main organism will be placed -->
    <rect x="66" y="40" width="126" height="102" rx="3" stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="3 3" />
    
    <!-- Small sphere indicator showing placement focus -->
    <circle cx="129" cy="91" r="16" fill="url(#orangeSphere)" />
  </g>

  <text x="200" y="225" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#fb923c" text-anchor="middle" letter-spacing="1">PLANTILLA</text>
  <text x="200" y="248" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#94a3b8" text-anchor="middle">Plano estructural (layout) que distribuye los organismos</text>
  <text x="200" y="270" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Layout Principal CSS / Esqueleto del Lienzo (Canvas)</text>
</svg>
