<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" style="background-color: transparent; font-family: -apple-system, sans-serif;">
  
  <!-- Modal Background Shadow -->
  <rect x="0" y="0" width="500" height="560" fill="transparent"/>
  
  <!-- Modal Container -->
  <rect x="10" y="10" width="480" height="540" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="8" />

  <!-- Header -->
  <rect x="30" y="35" width="14" height="10" fill="#58a6ff" rx="1"/>
  <rect x="32" y="32" width="10" height="2" fill="#58a6ff"/>
  <text x="55" y="44" fill="#ffffff" font-size="18" font-weight="bold">Nuevo Equipo</text>
  <text x="30" y="65" fill="#8b949e" font-size="12">Datos técnicos del equipo en rack</text>

  <!-- Row 1: NOMBRE DEL EQUIPO -->
  <text x="30" y="100" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">NOMBRE DEL EQUIPO</text>
  <rect x="30" y="110" width="440" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="40" y="130" fill="#c9d1d9" font-size="12">Server principal</text>

  <!-- Row 2: MARCA | MODELO | SERIE -->
  <text x="30" y="165" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">MARCA</text>
  <rect x="30" y="175" width="140" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="40" y="195" fill="#8b949e" font-size="12">HP, Cisco, Dell...</text>

  <text x="180" y="165" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">MODELO</text>
  <rect x="180" y="175" width="140" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="190" y="195" fill="#8b949e" font-size="12">ProLiant DL380</text>

  <text x="330" y="165" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">NÚMERO DE SERIE</text>
  <rect x="330" y="175" width="140" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="340" y="195" fill="#8b949e" font-size="12">SRV-2024-001</text>

  <!-- Row 3: UBICACION | TIPO -->
  <text x="30" y="230" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">UBICACIÓN FÍSICA</text>
  <rect x="30" y="240" width="215" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <rect x="40" y="250" width="8" height="12" fill="#8a2be2" rx="1"/>
  <text x="60" y="260" fill="#c9d1d9" font-size="12" font-weight="bold">Gabinete (Rack)</text>
  <text x="230" y="260" fill="#c9d1d9" font-size="10">▼</text>

  <text x="255" y="230" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">TIPO DE EQUIPO</text>
  <rect x="255" y="240" width="215" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <rect x="265" y="250" width="8" height="12" fill="#c9d1d9" rx="1"/>
  <text x="285" y="260" fill="#c9d1d9" font-size="12" font-weight="bold">Servidor</text>
  <text x="455" y="260" fill="#c9d1d9" font-size="10">▼</text>

  <!-- Row 4: Network (IP/MAC) -->
  <rect x="30" y="307" width="14" height="14" fill="#161b22" stroke="#8b949e" stroke-width="1" rx="2"/>
  
  <text x="60" y="295" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">DIRECCIÓN IP</text>
  <rect x="60" y="305" width="200" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="70" y="325" fill="#8b949e" font-size="12">192.168.1.10</text>

  <text x="270" y="295" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">DIRECCIÓN MAC</text>
  <rect x="270" y="305" width="200" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="280" y="325" fill="#8b949e" font-size="12">AA:BB:CC:DD:EE:FF</text>

  <!-- Row 5: Credenciales -->
  <rect x="30" y="372" width="14" height="14" fill="#161b22" stroke="#8b949e" stroke-width="1" rx="2"/>
  
  <text x="60" y="360" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">USUARIO</text>
  <rect x="60" y="370" width="200" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="70" y="390" fill="#8b949e" font-size="12">admin</text>

  <text x="270" y="360" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">CONTRASEÑA</text>
  <rect x="270" y="370" width="200" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="280" y="390" fill="#8b949e" font-size="12">••••••••</text>

  <!-- Row 6: Energía & Tamaño -->
  <rect x="30" y="437" width="14" height="14" fill="#1f6feb" rx="2"/>
  <path d="M 33 444 L 35 447 L 41 440" fill="transparent" stroke="#ffffff" stroke-width="2"/>
  
  <text x="60" y="425" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">TOMAS ELÉCTRICAS</text>
  <rect x="60" y="435" width="55" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="70" y="455" fill="#c9d1d9" font-size="12">1</text>
  <rect x="125" y="435" width="55" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="135" y="455" fill="#c9d1d9" font-size="12">0</text>

  <text x="195" y="425" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">CONSUMO (W)</text>
  <rect x="195" y="435" width="90" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="205" y="455" fill="#c9d1d9" font-size="12">200</text>

  <text x="380" y="425" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">TAMAÑO (U)</text>
  <rect x="380" y="435" width="90" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="390" y="455" fill="#c9d1d9" font-size="12" font-weight="bold">2U</text>
  <text x="455" y="455" fill="#c9d1d9" font-size="10">▼</text>

  <!-- Row 7: Notas -->
  <text x="30" y="490" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">NOTAS</text>
  <rect x="30" y="500" width="440" height="40" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="40" y="520" fill="#8b949e" font-size="12">Observaciones técnicas...</text>
  <!-- Textarea resizer lines -->
  <line x1="465" y1="535" x2="468" y2="538" stroke="#8b949e" stroke-width="1"/>
  <line x1="462" y1="535" x2="468" y2="532" stroke="#8b949e" stroke-width="1"/> <!-- Fake resizer pattern -->

  <!-- Footer Buttons -->
  <rect x="300" y="490" width="80" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="340" y="510" fill="#c9d1d9" font-size="12" text-anchor="middle">Cancelar</text>

  <rect x="390" y="490" width="80" height="32" fill="#0ea5e9" rx="4" opacity="0.2"/>
  <rect x="390" y="490" width="80" height="32" fill="transparent" stroke="#0ea5e9" stroke-width="1" rx="4"/>
  <text x="430" y="510" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Guardar</text>

  <!-- Note: Overlapping the textarea and buttons is intentional for saving space in this mockup -->
  <rect x="290" y="480" width="190" height="60" fill="#0d1117"/>
  <rect x="295" y="505" width="80" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="335" y="525" fill="#8b949e" font-size="12" text-anchor="middle">Cancelar</text>

  <rect x="385" y="505" width="85" height="32" fill="#0ea5e9" rx="4" opacity="0.2"/>
  <rect x="385" y="505" width="85" height="32" fill="transparent" stroke="#0ea5e9" stroke-width="1" rx="4"/>
  <text x="427" y="525" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Guardar</text>

</svg>
