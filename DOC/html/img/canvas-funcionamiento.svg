<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" style="background-color: #0f111a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="physGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="topoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Marker for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrowPhys" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c" />
    </marker>
    <marker id="arrowTopo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.5">COMPARTIMENTOS Y FUNCIONAMIENTO DE LOS LIENZOS (CANVAS)</text>
  <text x="475" y="50" text-anchor="middle" fill="#64748b" font-size="11">Diferencias estructurales y de renderizado entre la Vista Física (DOM) y la Vista Topológica (Canvas 2D)</text>

  <!-- GRID / BACKGROUND AESTHETICS -->
  <rect x="15" y="70" width="920" height="460" rx="12" fill="#141721" stroke="#232733" stroke-width="1.5" />

  <!-- ==================== COLUMN 1: VISTA FÍSICA ==================== -->
  <g transform="translate(35, 90)">
    <!-- Boundary Box -->
    <rect x="0" y="0" width="410" height="420" rx="8" fill="#1e293b" fill-opacity="0.2" stroke="#fb923c" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="45" rx="8" fill="url(#physGrad)" fill-opacity="0.15" stroke="#fb923c" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="15" y="27" fill="#fb923c" font-size="13" font-weight="800" letter-spacing="0.5">⬛ VISTA FÍSICA (Árbol DOM HTML)</text>
    
    <!-- Container HTML Tag -->
    <rect x="15" y="60" width="380" height="30" rx="4" fill="#0f111a" stroke="#475569" stroke-dasharray="3 3" />
    <text x="25" y="79" fill="#94a3b8" font-size="11" font-family="monospace">&lt;div id="view-physical"&gt;</text>

    <!-- Structural Breakdown Racks -->
    <g transform="translate(15, 105)">
      <rect x="0" y="0" width="380" height="190" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="20" fill="#e2e8f0" font-size="11" font-weight="bold">Maquetación Anidada (.rack-wrapper)</text>
      
      <!-- Flipper -->
      <rect x="15" y="35" width="350" height="140" rx="4" fill="#0f111a" stroke="#475569" stroke-opacity="0.6" />
      <text x="25" y="52" fill="#64748b" font-size="9" font-family="monospace">.rack-flipper { transform-style: preserve-3d }</text>

      <!-- Front Face -->
      <rect x="25" y="65" width="150" height="100" rx="4" fill="#1e293b" fill-opacity="0.6" stroke="#fb923c" stroke-opacity="0.4" />
      <text x="32" y="80" fill="#fb923c" font-size="10" font-weight="bold">.rack-face (Frente)</text>
      <rect x="35" y="90" width="130" height="18" rx="2" fill="#0f111a" stroke="#334155" />
      <text x="42" y="102" fill="#cbd5e1" font-size="9" font-family="monospace">.rack-slot (Vacío)</text>
      <rect x="35" y="112" width="130" height="18" rx="2" fill="#1e3a8a" stroke="#2563eb" />
      <text x="42" y="124" fill="#ffffff" font-size="9" font-family="monospace">.device-faceplate</text>
      <text x="35" y="152" fill="#64748b" font-size="8">Slots numerados 1 a N</text>

      <!-- Rear Face -->
      <rect x="200" y="65" width="160" height="100" rx="4" fill="#1a1c23" stroke="#3b82f6" stroke-opacity="0.4" />
      <text x="208" y="80" fill="#38bdf8" font-size="10" font-weight="bold">.rack-rear (Atrás)</text>
      <rect x="210" y="90" width="140" height="18" rx="2" fill="#0f111a" stroke="#334155" />
      <text x="217" y="102" fill="#cbd5e1" font-size="9" font-family="monospace">.rack-slot (Vacío)</text>
      <text x="210" y="125" fill="#64748b" font-size="8">Estructura independiente</text>
      <text x="210" y="137" fill="#64748b" font-size="8">para regletas/PDUs traseros</text>
    </g>

    <!-- Structural Breakdown Floor Section -->
    <g transform="translate(15, 310)">
      <rect x="0" y="0" width="380" height="95" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="20" fill="#e2e8f0" font-size="11" font-weight="bold">Equipos de Piso / Periféricos (.floor-section)</text>
      
      <rect x="15" y="32" width="350" height="50" rx="4" fill="#0f111a" stroke="#475569" stroke-opacity="0.6" />
      <text x="25" y="47" fill="#fb923c" font-size="10" font-weight="bold">.floor-devices-grid (Grid Flexible CSS)</text>
      <text x="25" y="62" fill="#94a3b8" font-size="9">Aloja ordenadores, cámaras IP y routers sin montaje en rack.</text>
      <text x="25" y="74" fill="#94a3b8" font-size="9">Drag &amp; Drop nativo HTML5 (dragstart, dragover, drop).</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: VISTA TOPOLÓGICA ==================== -->
  <g transform="translate(505, 90)">
    <!-- Boundary Box -->
    <rect x="0" y="0" width="410" height="420" rx="8" fill="#1e293b" fill-opacity="0.2" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="45" rx="8" fill="url(#topoGrad)" fill-opacity="0.15" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="15" y="27" fill="#c084fc" font-size="13" font-weight="800" letter-spacing="0.5">◎ VISTA TOPOLÓGICA (HTML5 Canvas 2D)</text>
    
    <!-- Canvas Tag -->
    <rect x="15" y="60" width="380" height="30" rx="4" fill="#0f111a" stroke="#475569" stroke-dasharray="3 3" />
    <text x="25" y="79" fill="#94a3b8" font-size="11" font-family="monospace">&lt;canvas id="topology-canvas"&gt;</text>

    <!-- Canvas Rendering Pipeline -->
    <g transform="translate(15, 105)">
      <rect x="0" y="0" width="380" height="290" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="20" fill="#e2e8f0" font-size="11" font-weight="bold">Ciclo de Renderizado (requestAnimationFrame)</text>
      <text x="12" y="35" fill="#64748b" font-size="9">Se ejecuta a 60fps mientras la pestaña de topología esté activa</text>

      <!-- Step-by-Step Flow -->
      <g transform="translate(15, 55)">
        <!-- Box 1: Limpieza -->
        <rect x="0" y="0" width="350" height="32" rx="4" fill="#0f111a" stroke="#475569" />
        <text x="10" y="20" fill="#cbd5e1" font-size="10" font-weight="bold">1. Limpieza y Transformación Viewport</text>
        <text x="230" y="20" fill="#64748b" font-size="9" font-family="monospace">ctx.clearRect(), ctx.scale()</text>

        <!-- Box 2: Salas y Racks -->
        <rect x="0" y="42" width="350" height="32" rx="4" fill="#0f111a" stroke="#475569" />
        <text x="10" y="62" fill="#38bdf8" font-size="10" font-weight="bold">2. Dibujo de Contenedores (Salas &amp; Racks)</text>
        <text x="230" y="62" fill="#64748b" font-size="9">Rectángulos y etiquetas</text>

        <!-- Box 3: Enlaces -->
        <rect x="0" y="84" width="350" height="38" rx="4" fill="#0f111a" stroke="#475569" />
        <text x="10" y="102" fill="#22c55e" font-size="10" font-weight="bold">3. Trazado de Cables / Conexiones</text>
        <text x="10" y="115" fill="#94a3b8" font-size="9">Cálculo de curvas de Bézier e impulsos eléctricos animados (flowT)</text>

        <!-- Box 4: Nodos -->
        <rect x="0" y="132" width="350" height="32" rx="4" fill="#0f111a" stroke="#475569" />
        <text x="10" y="152" fill="#a855f7" font-size="10" font-weight="bold">4. Nodos de Red (Equipos)</text>
        <text x="230" y="152" fill="#64748b" font-size="9">Círculos r=24px + Iconos</text>

        <!-- Box 5: Controladores Matemáticos -->
        <rect x="0" y="174" width="350" height="50" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-opacity="0.6" />
        <text x="10" y="192" fill="#c084fc" font-size="10" font-weight="bold">Manejo de Eventos Interactivos (Matemático)</text>
        <text x="10" y="206" fill="#94a3b8" font-size="9">· Clic/Arrastre: Distancia euclidiana (dx*dx + dy*dy &lt;= r*r)</text>
        <text x="10" y="217" fill="#94a3b8" font-size="9">· Zoom &amp; Pan: Transformación inversa de coordenadas del cursor</text>
      </g>
    </g>
  </g>

  <!-- ==================== FLOW INDICATORS & SHARED STATE ==================== -->
  <!-- Central Bridge: State sync -->
  <path d="M 445,300 L 505,300" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <path d="M 505,320 L 445,320" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  
  <rect x="420" y="235" width="110" height="50" rx="6" fill="#0f111a" stroke="#334155" stroke-width="1.5" />
  <text x="475" y="253" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">store.js</text>
  <text x="475" y="265" text-anchor="middle" fill="#64748b" font-size="8">Sincronización</text>
  <text x="475" y="275" text-anchor="middle" fill="#64748b" font-size="8">de Coordenadas</text>

  <!-- Footer description -->
  <rect x="35" y="485" width="880" height="35" rx="6" fill="#1e293b" fill-opacity="0.3" stroke="#334155" stroke-width="1" />
  <text x="50" y="506" fill="#cbd5e1" font-size="10">💡 <tspan font-weight="bold" fill="#ffffff">Dato de interés:</tspan> Mientras que la vista física es puramente HTML modular controlado por estilos CSS tradicionales, la vista topológica es un único elemento gráfico dinámico que dibuja de forma optimizada toda la infraestructura lógica de redes mediante cálculo matricial bidimensional en tiempo real.</text>
</svg>
