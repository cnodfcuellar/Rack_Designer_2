<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" style="background-color: #0d1117; font-family: -apple-system, sans-serif;">
  
  <!-- Header Background -->
  <rect x="0" y="0" width="1000" height="50" fill="#161b22" border-bottom="1px solid #30363d"/>
  <line x1="0" y1="50" x2="1000" y2="50" stroke="#30363d" stroke-width="1"/>

  <!-- Logo area -->
  <rect x="15" y="15" width="20" height="20" fill="#2196f3" rx="4"/>
  <text x="45" y="30" fill="#c9d1d9" font-size="16" font-weight="bold">RACK Designer</text>
  
  <!-- Header Center Buttons -->
  <rect x="250" y="10" width="100" height="30" fill="#1f6feb" rx="4" opacity="0.2"/>
  <text x="300" y="30" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Vista Física</text>
  <text x="400" y="30" fill="#8b949e" font-size="12" text-anchor="middle">Topología</text>

  <!-- Left Sidebar (Stats + Catalog) -->
  <rect x="0" y="51" width="220" height="549" fill="#161b22"/>
  <line x1="220" y1="51" x2="220" y2="600" stroke="#30363d" stroke-width="1"/>
  
  <!-- Estadisticas Section -->
  <text x="15" y="75" fill="#c9d1d9" font-size="11" font-weight="bold">ESTADÍSTICAS</text>
  <text x="200" y="75" fill="#8b949e" font-size="10">▼</text>
  
  <!-- Stats Grid -->
  <rect x="10" y="90" width="45" height="50" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="32" y="110" fill="#58a6ff" font-size="12" text-anchor="middle">📄</text>
  <text x="32" y="130" fill="#c9d1d9" font-size="14" font-weight="bold" text-anchor="middle">1</text>
  
  <rect x="60" y="90" width="45" height="50" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="82" y="110" fill="#d2a8ff" font-size="12" text-anchor="middle">🗄️</text>
  <text x="82" y="130" fill="#c9d1d9" font-size="14" font-weight="bold" text-anchor="middle">10</text>
  
  <rect x="110" y="90" width="45" height="50" fill="#0d1117" stroke="#d29922" stroke-width="1" rx="4"/>
  <text x="132" y="110" fill="#d29922" font-size="12" text-anchor="middle">U</text>
  <text x="132" y="130" fill="#d29922" font-size="12" font-weight="bold" text-anchor="middle">6/12</text>
  
  <rect x="160" y="90" width="45" height="50" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="182" y="110" fill="#2ea043" font-size="12" text-anchor="middle">🔌</text>
  <text x="182" y="130" fill="#c9d1d9" font-size="14" font-weight="bold" text-anchor="middle">0</text>

  <!-- Progress Bars -->
  <text x="10" y="160" fill="#8b949e" font-size="9">RACK CAPACITY</text>
  <text x="205" y="160" fill="#8b949e" font-size="9" text-anchor="end">50%</text>
  <rect x="10" y="165" width="195" height="4" fill="#30363d" rx="2"/>
  <rect x="10" y="165" width="97" height="4" fill="#58a6ff" rx="2"/>

  <text x="10" y="190" fill="#8b949e" font-size="9">POWER</text>
  <text x="205" y="190" fill="#8b949e" font-size="9" text-anchor="end">1245 W</text>
  <rect x="10" y="195" width="195" height="4" fill="#30363d" rx="2"/>
  <rect x="10" y="195" width="150" height="4" fill="#d29922" rx="2"/>

  <!-- Sidebar Buttons -->
  <rect x="15" y="220" width="90" height="30" fill="#1f6feb" stroke="#388bfd" stroke-width="1" rx="4" opacity="0.1"/>
  <text x="60" y="239" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">+ Rack</text>
  
  <rect x="115" y="220" width="90" height="30" fill="#21262d" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="160" y="239" fill="#c9d1d9" font-size="11" text-anchor="middle">+ Equipo</text>

  <!-- Sidebar List Items (Mockup) -->
  <rect x="15" y="270" width="190" height="50" fill="#0d1117" stroke="#1f6feb" stroke-width="2" rx="4"/>
  <rect x="25" y="285" width="20" height="20" fill="#30363d" rx="4"/>
  <text x="55" y="292" fill="#c9d1d9" font-size="12" font-weight="bold">NAS 2U</text>
  <text x="55" y="308" fill="#8b949e" font-size="10">STORAGE | 150W</text>

  <!-- Main Canvas Toolbar -->
  <rect x="221" y="51" width="779" height="40" fill="#161b22"/>
  <line x1="221" y1="91" x2="1000" y2="91" stroke="#30363d" stroke-width="1"/>
  
  <rect x="350" y="60" width="100" height="22" fill="#1f6feb" rx="4" opacity="0.2"/>
  <text x="400" y="75" fill="#58a6ff" font-size="11" text-anchor="middle">ECA_Matriz</text>
  
  <rect x="460" y="60" width="100" height="22" fill="#21262d" rx="4"/>
  <text x="510" y="75" fill="#8b949e" font-size="11" text-anchor="middle">ECA_bodega</text>

  <!-- Main Canvas Area (Dot Grid) -->
  <pattern id="dots2" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle fill="#30363d" cx="10" cy="10" r="1"></circle>
  </pattern>
  <rect x="221" y="92" width="779" height="468" fill="url(#dots2)"/>

  <!-- Rendered Rack Mockup (Vista Trasera) -->
  <rect x="250" y="120" width="150" height="200" fill="#0d1117" stroke="#1f6feb" stroke-width="2" rx="6"/>
  
  <!-- Rack Header (Blue for Rear View) -->
  <rect x="250" y="120" width="150" height="25" fill="#1f6feb" opacity="0.2" rx="6"/>
  <text x="260" y="137" fill="#c9d1d9" font-size="10" font-weight="bold">Vista Trasera</text>
  <rect x="335" y="125" width="40" height="15" fill="#21262d" rx="2"/>
  <text x="355" y="135" fill="#8b949e" font-size="8" text-anchor="middle">FRENTE 🔄</text>

  <!-- U slots inside rack -->
  <line x1="250" y1="160" x2="400" y2="160" stroke="#21262d" stroke-width="1"/>
  <line x1="250" y1="190" x2="400" y2="190" stroke="#21262d" stroke-width="1"/>
  <line x1="250" y1="220" x2="400" y2="220" stroke="#21262d" stroke-width="1"/>
  <line x1="250" y1="250" x2="400" y2="250" stroke="#21262d" stroke-width="1"/>

  <!-- Device (PDU in rear view) -->
  <rect x="260" y="260" width="130" height="20" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
  <text x="265" y="274" fill="#d29922" font-size="10" font-weight="bold">RT</text>
  <rect x="285" y="265" width="8" height="10" fill="#21262d" stroke="#d29922" stroke-width="1" rx="1"/>
  <rect x="295" y="265" width="8" height="10" fill="#21262d" stroke="#d29922" stroke-width="1" rx="1"/>
  <rect x="305" y="265" width="8" height="10" fill="#21262d" stroke="#d29922" stroke-width="1" rx="1"/>
  <rect x="315" y="265" width="8" height="10" fill="#21262d" stroke="#d29922" stroke-width="1" rx="1"/>
  <rect x="325" y="265" width="8" height="10" fill="#21262d" stroke="#d29922" stroke-width="1" rx="1"/>
  <rect x="335" y="265" width="8" height="10" fill="#21262d" stroke="#d29922" stroke-width="1" rx="1"/>
  <rect x="345" y="265" width="8" height="10" fill="#21262d" stroke="#d29922" stroke-width="1" rx="1"/>
  <rect x="355" y="265" width="8" height="10" fill="#21262d" stroke="#d29922" stroke-width="1" rx="1"/>

  <!-- Floor Devices Section (Equipo de piso) -->
  <rect x="250" y="340" width="720" height="80" fill="transparent" stroke="#30363d" stroke-width="1" stroke-dasharray="4" rx="4"/>
  <rect x="250" y="340" width="720" height="20" fill="#161b22" rx="4"/>
  <text x="260" y="354" fill="#8b949e" font-size="9" font-weight="bold">EQUIPO DE PISO / PERIFÉRICOS</text>

  <!-- Floor Device 1 -->
  <rect x="260" y="370" width="140" height="40" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="4"/>
  <rect x="265" y="380" width="16" height="16" fill="#30363d" rx="2"/>
  <text x="290" y="387" fill="#c9d1d9" font-size="10" font-weight="bold">Cámara IP</text>
  <text x="290" y="400" fill="#8b949e" font-size="8">CAMERA</text>

  <!-- Floor Device 2 -->
  <rect x="410" y="370" width="140" height="40" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="4"/>
  <rect x="415" y="380" width="16" height="16" fill="#30363d" rx="2"/>
  <text x="440" y="387" fill="#c9d1d9" font-size="10" font-weight="bold">Impresora Red</text>
  <text x="440" y="400" fill="#8b949e" font-size="8">PRINTER</text>

  <!-- Floor Device 3 -->
  <rect x="560" y="370" width="140" height="40" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="4"/>
  <rect x="565" y="380" width="16" height="16" fill="#30363d" rx="2"/>
  <text x="590" y="387" fill="#c9d1d9" font-size="10" font-weight="bold">Teléfono VoIP</text>
  <text x="590" y="400" fill="#8b949e" font-size="8">PHONE</text>

  <!-- Floor Device 4 -->
  <rect x="710" y="370" width="140" height="40" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="4"/>
  <rect x="715" y="380" width="16" height="16" fill="#30363d" rx="2"/>
  <text x="740" y="387" fill="#c9d1d9" font-size="10" font-weight="bold">PC Desktop</text>
  <text x="740" y="400" fill="#8b949e" font-size="8">PC</text>

  <!-- Bottom Panel Minimized -->
  <rect x="221" y="560" width="779" height="40" fill="#161b22"/>
  <line x1="221" y1="560" x2="1000" y2="560" stroke="#30363d" stroke-width="1"/>
  
  <rect x="235" y="569" width="80" height="22" fill="#1f6feb" rx="4" opacity="0.2"/>
  <text x="275" y="584" fill="#58a6ff" font-size="11" text-anchor="middle">Inventario</text>
  <text x="350" y="584" fill="#8b949e" font-size="11" text-anchor="middle">Conexiones</text>

  <rect x="620" y="567" width="80" height="26" fill="#0d1117" stroke="#8a2be2" stroke-width="1" rx="4"/>
  <text x="660" y="584" fill="#c9d1d9" font-size="10" text-anchor="middle">⚡ Agregar Equipo</text>
  
  <rect x="850" y="567" width="60" height="26" fill="#21262d" rx="4"/>
  <text x="880" y="584" fill="#8b949e" font-size="10" text-anchor="middle">⬇ CSV</text>
  
</svg>
