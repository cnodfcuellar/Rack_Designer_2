<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="cyanSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>
    <radialGradient id="purpleSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </radialGradient>
    <radialGradient id="roseSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" rx="15" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle background grid -->
  <g stroke="#334155" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>

  <!-- Organism Boundary -->
  <rect x="110" y="45" width="180" height="150" rx="15" fill="none" stroke="#f43f5e" stroke-dasharray="6 6" stroke-width="2.5" />
  
  <!-- Multiple molecules inside operating together -->
  <!-- Molecule 1 (left) -->
  <g stroke="#64748b" stroke-width="2.5">
    <line x1="160" y1="130" x2="140" y2="100"/>
    <line x1="160" y1="130" x2="185" y2="110"/>
  </g>
  <circle cx="160" cy="130" r="18" fill="url(#purpleSphere)"/>
  <circle cx="140" cy="100" r="10" fill="url(#cyanSphere)"/>
  <circle cx="185" cy="110" r="10" fill="url(#cyanSphere)"/>

  <!-- Molecule 2 (right) -->
  <g stroke="#64748b" stroke-width="2.5">
    <line x1="230" y1="95" x2="210" y2="125"/>
    <line x1="230" y1="95" x2="255" y2="125"/>
  </g>
  <circle cx="230" cy="95" r="18" fill="url(#roseSphere)"/>
  <circle cx="210" cy="125" r="10" fill="url(#cyanSphere)"/>
  <circle cx="255" cy="125" r="10" fill="url(#cyanSphere)"/>

  <!-- System Link between Molecules -->
  <line x1="160" y1="130" x2="210" y2="125" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="2 2" />

  <text x="200" y="225" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#f43f5e" text-anchor="middle" letter-spacing="1">ORGANISMO</text>
  <text x="200" y="248" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#94a3b8" text-anchor="middle">Grupo de moléculas agrupadas en una sección independiente</text>
  <text x="200" y="270" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Gabinete Rack Completo / Modal Configuración</text>
</svg>
