<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" style="background-color: #0f111a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.5">DETALLE DE CAPA: CONTROLADOR / ORQUESTADOR</text>
  <text x="475" y="50" text-anchor="middle" fill="#64748b" font-size="11">Funcionamiento y enrutamiento de eventos por parte de js/main.js</text>

  <!-- GRID / BACKGROUND AESTHETICS -->
  <rect x="15" y="70" width="920" height="460" rx="12" fill="#141721" stroke="#232733" stroke-width="1.5" />

  <!-- ==================== COLUMN 1: ENTRADAS ==================== -->
  <g transform="translate(35, 90)">
    <rect x="0" y="0" width="240" height="420" rx="8" fill="#1e293b" fill-opacity="0.2" stroke="#334155" stroke-width="1" />
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">1. EVENTOS DE ENTRADA</text>

    <!-- Block A: User DOM Events -->
    <rect x="15" y="45" width="210" height="170" rx="6" fill="url(#cardGrad)" stroke="#334155" />
    <text x="25" y="65" fill="#fb923c" font-size="11" font-weight="bold">Interacciones del Usuario (DOM)</text>
    
    <g transform="translate(25, 80)" fill="#cbd5e1" font-size="9.5">
      <text x="0" y="10">· Clic en Zoom In / Out / Reset</text>
      <text x="0" y="28">· Pointerdown / Pointermove (Pan)</text>
      <text x="0" y="46">· Clic en pestañas (Vista Física/Red)</text>
      <text x="0" y="64">· Selección en menú de proyecto (💾/📂)</text>
      <text x="0" y="82">· Alternar modo Claro / Oscuro</text>
      <text x="0" y="100">· Selección e inserción de salas</text>
    </g>

    <!-- Block B: Store Events -->
    <rect x="15" y="235" width="210" height="170" rx="6" fill="url(#cardGrad)" stroke="#334155" />
    <text x="25" y="255" fill="#38bdf8" font-size="11" font-weight="bold">Mutación de Datos (Store)</text>
    <text x="25" y="272" fill="#64748b" font-size="8.5">Eventos reactivos emitidos por el proxy</text>

    <g transform="translate(25, 290)" fill="#cbd5e1" font-size="9.5">
      <text x="0" y="10" font-family="monospace">store.on('change', renderAll)</text>
      <text x="0" y="32">Alertas de cambio con metadatos:</text>
      <text x="10" y="50" fill="#38bdf8" font-family="monospace">· source: "addDevice"</text>
      <text x="10" y="66" fill="#38bdf8" font-family="monospace">· source: "room-rename"</text>
      <text x="10" y="82" fill="#38bdf8" font-family="monospace">· source: "undo" / "redo"</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: ORQUESTADOR CENTRAL ==================== -->
  <g transform="translate(325, 90)">
    <rect x="0" y="0" width="280" height="420" rx="8" fill="#1e1b4b" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="45" rx="8" fill="url(#mainGrad)" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="15" y="27" fill="#c084fc" font-size="13" font-weight="800" letter-spacing="0.5">⚙️ ORQUESTADOR (js/main.js)</text>

    <!-- Global Listeners Core -->
    <rect x="15" y="60" width="250" height="90" rx="6" fill="#0f111a" stroke="#334155" />
    <text x="25" y="80" fill="#f8fafc" font-size="11" font-weight="bold">initGlobalEvents()</text>
    <text x="25" y="98" fill="#cbd5e1" font-size="9">1. Enlaza los botones de zoom y paneo</text>
    <text x="25" y="113" fill="#cbd5e1" font-size="9">2. Controla visibilidad física vs canvas</text>
    <text x="25" y="128" fill="#cbd5e1" font-size="9">3. Inicializa I/O de archivos y temas</text>

    <!-- renderAll Router core -->
    <rect x="15" y="165" width="250" height="240" rx="6" fill="#0f111a" stroke="#a855f7" stroke-width="1.5" />
    <text x="25" y="188" fill="#c084fc" font-size="12" font-weight="bold" font-family="monospace">renderAll(event)</text>
    <text x="25" y="205" fill="#64748b" font-size="8.5">Enrutador inteligente de actualización DOM</text>

    <!-- Code branches representation -->
    <g transform="translate(25, 225)" font-family="monospace" font-size="8.5">
      <!-- Route A -->
      <rect x="0" y="0" width="200" height="32" rx="3" fill="#1e293b" stroke="#334155" />
      <text x="8" y="14" fill="#fb923c">event == 'loadData' | 'undo'</text>
      <text x="8" y="24" fill="#94a3b8">⇒ Redibuja TODO el entorno</text>

      <!-- Route B -->
      <rect x="0" y="38" width="200" height="32" rx="3" fill="#1e293b" stroke="#334155" />
      <text x="8" y="52" fill="#fb923c">event.source == 'Room'</text>
      <text x="8" y="62" fill="#94a3b8">⇒ renderRoomTabs(), renderPhysical()</text>

      <!-- Route C -->
      <rect x="0" y="76" width="200" height="32" rx="3" fill="#1e293b" stroke="#334155" />
      <text x="8" y="90" fill="#fb923c">event.source == 'Device'</text>
      <text x="8" y="100" fill="#94a3b8">⇒ renderStats(), renderPhysical(), ...</text>

      <!-- Route D -->
      <rect x="0" y="114" width="200" height="32" rx="3" fill="#1e293b" stroke="#334155" />
      <text x="8" y="128" fill="#fb923c">event.source == 'Connection'</text>
      <text x="8" y="138" fill="#94a3b8">⇒ renderStats(), renderBottomPanel()</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: UI DE SALIDA ==================== -->
  <g transform="translate(655, 90)">
    <rect x="0" y="0" width="260" height="420" rx="8" fill="#1e293b" fill-opacity="0.2" stroke="#334155" stroke-width="1" />
    <text x="15" y="25" fill="#94a3b8" font-size="11" font-weight="bold" letter-spacing="1">3. MÓDULOS RECEPTORES</text>

    <!-- Destination modules list -->
    <g transform="translate(15, 45)">
      <!-- Render physical -->
      <rect x="0" y="0" width="230" height="50" rx="4" fill="url(#cardGrad)" stroke="#334155" />
      <text x="12" y="20" fill="#f8fafc" font-size="10" font-weight="bold">renderPhysical()</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">Redibuja gabinetes y slots físicos</text>

      <!-- Render stats -->
      <rect x="0" y="60" width="230" height="50" rx="4" fill="url(#cardGrad)" stroke="#334155" />
      <text x="12" y="20" fill="#f8fafc" font-size="10" font-weight="bold">renderStats()</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">Actualiza contadores, consumo W y %</text>

      <!-- Render catalog -->
      <rect x="0" y="120" width="230" height="50" rx="4" fill="url(#cardGrad)" stroke="#334155" />
      <text x="12" y="20" fill="#f8fafc" font-size="10" font-weight="bold">renderCatalog()</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">Filtra listado del catálogo izquierdo</text>

      <!-- Render bottom -->
      <rect x="0" y="180" width="230" height="50" rx="4" fill="url(#cardGrad)" stroke="#334155" />
      <text x="12" y="20" fill="#f8fafc" font-size="10" font-weight="bold">renderBottomPanel()</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">Actualiza tablas de inventario y cables</text>

      <!-- Canvas control -->
      <rect x="0" y="240" width="230" height="55" rx="4" fill="#0c2010" stroke="#10b981" />
      <text x="12" y="20" fill="#34d399" font-size="10" font-weight="bold">startTopo() / stopTopo()</text>
      <text x="12" y="34" fill="#88af9c" font-size="8.5">Controla el bucle del loop procedimental</text>
      <text x="12" y="46" fill="#88af9c" font-size="8.5">del canvas topológico a 60fps</text>

      <!-- Zoom and UI elements -->
      <rect x="0" y="305" width="230" height="50" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="12" y="20" fill="#f8fafc" font-size="10" font-weight="bold">updateZoomLabel()</text>
      <text x="12" y="36" fill="#cbd5e1" font-size="9">Aplica escala CSS/Zoom y despliega texto %</text>
    </g>
  </g>

  <!-- FLOW INTER-CONNECTORS (ARROWS) -->
  <!-- Inputs to main.js -->
  <path d="M 290,200 L 325,200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <!-- main.js to UI renders -->
  <path d="M 605,250 L 655,250" fill="none" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowPurple)" />
  <text x="630" y="238" text-anchor="middle" fill="#c084fc" font-size="8" font-weight="bold">Enruta</text>
</svg>
