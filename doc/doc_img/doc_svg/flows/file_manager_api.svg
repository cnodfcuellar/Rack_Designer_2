<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a"/>
      <stop offset="100%" style="stop-color:#0a1520"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/></filter>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1100" height="800" fill="url(#bg)"/>
  <rect width="1100" height="800" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="40" y="28" width="460" height="52" rx="6" fill="#0d1f30" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="40" y1="28" x2="40" y2="80" stroke="#00d4ff" stroke-width="3"/>
  <text x="60" y="49" font-family="'Segoe UI', sans-serif" font-size="9" fill="#00d4ff" letter-spacing="3" font-weight="600">RACK DESIGNER 2  ·  FS API</text>
  <text x="60" y="68" font-family="'Segoe UI', sans-serif" font-size="20" fill="#f0f6ff" font-weight="700">FILE SYSTEM ACCESS API  ·  OPEN/SAVE FLOW</text>

  <!-- Three top operations -->
  <rect x="80" y="116" width="280" height="70" rx="10" fill="#050e18" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="116" width="280" height="5" rx="3" fill="#00d4ff"/>
  <text x="220" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#7dd3fc" font-weight="700" letter-spacing="1">📂 OPEN PROJECT</text>
  <text x="220" y="160" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">showOpenFilePicker({'{'}types:[json]{'}'}) </text>
  <text x="220" y="176" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">User picks .json from disk</text>

  <rect x="410" y="116" width="280" height="70" rx="10" fill="#050e18" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="410" y="116" width="280" height="5" rx="3" fill="#10b981"/>
  <text x="550" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6ee7b7" font-weight="700" letter-spacing="1">💾 AUTOSAVE</text>
  <text x="550" y="160" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">fileHandle.createWritable()</text>
  <text x="550" y="176" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">Silent · 3s debounced · No popup</text>

  <rect x="740" y="116" width="280" height="70" rx="10" fill="#050e18" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="740" y="116" width="280" height="5" rx="3" fill="#fbbf24"/>
  <text x="880" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fde68a" font-weight="700" letter-spacing="1">💾 SAVE AS...</text>
  <text x="880" y="160" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">showSaveFilePicker({'{'}types:[json]{'}'}) </text>
  <text x="880" y="176" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">User names file · new handle stored</text>

  <!-- Arrows down -->
  <line x1="220" y1="186" x2="220" y2="228" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowC)"/>
  <line x1="550" y1="186" x2="550" y2="228" stroke="#10b981" stroke-width="2"/>
  <line x1="880" y1="186" x2="880" y2="228" stroke="#fbbf24" stroke-width="2"/>

  <!-- FS Handle lifecycle -->
  <rect x="60" y="232" width="980" height="100" rx="12" fill="#0a0e1a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="256" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" font-weight="700" letter-spacing="2">FILE SYSTEM HANDLE LIFECYCLE  ·  Stored in RAM (fileManager.js)</text>
  <line x1="80" y1="262" x2="1020" y2="262" stroke="#334155" stroke-width="0.5"/>

  <rect x="90" y="272" width="250" height="44" rx="6" fill="#050e18" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="215" y="292" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#7dd3fc">handle = await file picker</text>
  <text x="215" y="308" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">FileSystemFileHandle</text>

  <text x="356" y="296" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="14" fill="#334155">→</text>

  <rect x="376" y="272" width="250" height="44" rx="6" fill="#050e18" stroke="#10b981" stroke-width="0.8"/>
  <text x="501" y="292" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#6ee7b7">writable = handle.createWritable()</text>
  <text x="501" y="308" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">FileSystemWritableFileStream</text>

  <text x="642" y="296" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="14" fill="#334155">→</text>

  <rect x="660" y="272" width="320" height="44" rx="6" fill="#050e18" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="820" y="292" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#fde68a">writable.write(json) → writable.close()</text>
  <text x="820" y="308" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#64748b">Disk updated silently · Handle reused</text>

  <!-- ===== FALLBACK SYSTEM ===== -->
  <rect x="60" y="360" width="480" height="280" rx="12" fill="#060808" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="360" width="480" height="7" rx="4" fill="#64748b"/>
  <text x="300" y="384" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="1">BLOB FALLBACK  ·  Firefox / Safari</text>
  <text x="300" y="404" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#334155">window.showOpenFilePicker is undefined</text>

  <!-- Classic input -->
  <rect x="90" y="416" width="400" height="50" rx="6" fill="#0a0a0a" stroke="#334155" stroke-width="1"/>
  <text x="300" y="438" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Open: &lt;input type="file" accept=".json"&gt;</text>
  <text x="300" y="456" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">FileReader.readAsText() → JSON.parse()</text>

  <text x="300" y="488" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11" fill="#334155">── or ──</text>

  <rect x="90" y="496" width="400" height="50" rx="6" fill="#0a0a0a" stroke="#334155" stroke-width="1"/>
  <text x="300" y="518" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Save: new Blob([json], {'{'}type:'json'{'}'}) </text>
  <text x="300" y="536" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">URL.createObjectURL → &lt;a download&gt; click</text>

  <rect x="90" y="564" width="400" height="44" rx="6" fill="#0a0d10" stroke="#334155" stroke-width="0.8"/>
  <text x="300" y="584" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">No persistent handle · Manual reload needed</text>
  <text x="300" y="600" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">autoSave disabled (no permission)</text>

  <!-- ===== FILE HEADER DISPLAY ===== -->
  <rect x="580" y="360" width="480" height="280" rx="12" fill="#050a18" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="580" y="360" width="480" height="7" rx="4" fill="#00d4ff"/>
  <text x="820" y="384" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#7dd3fc" font-weight="700" letter-spacing="1">PROJECT HEADER INDICATOR</text>

  <!-- Header simulation -->
  <rect x="610" y="400" width="420" height="50" rx="6" fill="#0d1a2a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="640" y="420" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">RACK Designer 2</text>
  <!-- File badge -->
  <rect x="760" y="410" width="200" height="26" rx="4" fill="#00d4ff" fill-opacity="0.08" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="860" y="428" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#7dd3fc">📄 datacenter-2026.json</text>

  <text x="820" y="476" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">#project-filename element in header</text>
  <text x="820" y="494" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">Displays active file path when opened</text>

  <rect x="610" y="508" width="420" height="50" rx="6" fill="#0d1a2a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="640" y="528" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">RACK Designer 2</text>
  <rect x="760" y="518" width="200" height="26" rx="4" fill="#334155" fill-opacity="0.15" stroke="#334155" stroke-width="0.8"/>
  <text x="860" y="536" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">New Project</text>
  <text x="820" y="574" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">Clean state · No file handle linked</text>

  <rect x="610" y="586" width="420" height="36" rx="6" fill="#050818" stroke="#334155" stroke-width="0.8"/>
  <text x="820" y="608" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">🧹 Clean Project resets handle → "New Project"</text>

  <!-- Footer -->
  <line x1="40" y1="766" x2="1060" y2="766" stroke="#fff" stroke-width="0.3" stroke-opacity="0.1"/>
  <text x="48" y="782" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">RACK Designer 2  ·  File Manager API</text>
  <text x="1052" y="782" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">doc_img/doc_svg/file_manager_api.svg</text>
</svg>
