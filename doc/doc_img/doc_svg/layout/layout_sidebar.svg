<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'Outfit', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <rect width="360" height="780" fill="#0b0f19" rx="8"/>
  <text x="180" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Sidebar (Compact) &amp; Catalog Flyout Layout</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- NARROW SIDEBAR (#sidebar) -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="10" y="30" width="60" height="740" fill="#151c2e" stroke="#25304b" stroke-width="1"/>
  
  <!-- Active icon highlight -->
  <rect x="14" y="40" width="52" height="52" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="40" y="72" text-anchor="middle" fill="#0ea5e9" font-size="20">⬡</text>
  
  <text x="40" y="130" text-anchor="middle" fill="#475569" font-size="20">■</text>
  <text x="40" y="180" text-anchor="middle" fill="#475569" font-size="20">●</text>
  <text x="40" y="230" text-anchor="middle" fill="#475569" font-size="20">▲</text>
  <text x="40" y="280" text-anchor="middle" fill="#475569" font-size="20">◆</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- FLYOUT CATALOG (#catalog-flyout) -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="70" y="30" width="240" height="740" fill="#151c2e" stroke="#25304b" stroke-width="1"/>
  
  <!-- Flyout Header -->
  <rect x="70" y="30" width="240" height="40" fill="#151c2e"/>
  <line x1="70" y1="70" x2="310" y2="70" stroke="#25304b" stroke-width="1"/>
  <text x="82" y="55" fill="#f0f4ff" font-size="13" font-weight="600">SERVERS</text>
  <text x="290" y="55" fill="#64748b" font-size="14" font-weight="600">✕</text>

  <!-- Flyout Actions -->
  <rect x="70" y="70" width="240" height="52" fill="#151c2e"/>
  <line x1="70" y1="122" x2="310" y2="122" stroke="#25304b" stroke-width="1"/>

  <!-- + Rack button -->
  <rect x="82" y="84" width="104" height="26" rx="6" fill="#0ea5e933" stroke="#0ea5e9" stroke-width="1"/>
  <text x="134" y="102" text-anchor="middle" fill="#0ea5e9" font-size="11" font-weight="600">+ Rack</text>

  <!-- + Equipo button -->
  <rect x="194" y="84" width="104" height="26" rx="6" fill="transparent" stroke="#25304b" stroke-width="1"/>
  <text x="246" y="102" text-anchor="middle" fill="#8b9ab8" font-size="11">+ Equipo</text>

  <!-- Flyout Search -->
  <rect x="82" y="134" width="216" height="26" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="1"/>
  <text x="92" y="151" fill="#475569" font-size="10" class="mono">Buscar equipo...</text>

  <!-- Catalog List -->
  <rect x="70" y="172" width="240" height="598" fill="#151c2e"/>
  
  <!-- Catalog item 1: Server -->
  <rect x="82" y="180" width="216" height="48" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <rect x="90" y="188" width="32" height="32" rx="6" fill="#10b981" opacity="0.15"/>
  <text x="106" y="208" text-anchor="middle" fill="#10b981" font-size="12">⬡</text>
  <text x="130" y="202" fill="#f0f4ff" font-size="11" font-weight="600">Server HP ProLiant DL380</text>
  <text x="130" y="216" fill="#94a3b8" font-size="10" class="mono">SERVER · 460W</text>
  <rect x="250" y="196" width="22" height="16" rx="4" fill="#25304b"/>
  <text x="261" y="207" text-anchor="middle" fill="#94a3b8" font-size="9" class="mono">2U</text>
  <text x="284" y="208" fill="#94a3b8" font-size="12">⋮</text>

  <!-- Catalog item 2: Switch -->
  <rect x="82" y="236" width="216" height="48" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <rect x="90" y="244" width="32" height="32" rx="6" fill="#10b981" opacity="0.15"/>
  <text x="106" y="264" text-anchor="middle" fill="#10b981" font-size="12">⬡</text>
  <text x="130" y="258" fill="#f0f4ff" font-size="11" font-weight="600">Server Dell R740</text>
  <text x="130" y="272" fill="#94a3b8" font-size="10" class="mono">SERVER · 550W</text>
  <rect x="250" y="252" width="22" height="16" rx="4" fill="#25304b"/>
  <text x="261" y="263" text-anchor="middle" fill="#94a3b8" font-size="9" class="mono">2U</text>
  <text x="284" y="264" fill="#94a3b8" font-size="12">⋮</text>

  <!-- Catalog item 3: Router -->
  <rect x="82" y="292" width="216" height="48" rx="6" fill="#1a2235" stroke="#25304b" stroke-width="0.5"/>
  <rect x="90" y="300" width="32" height="32" rx="6" fill="#10b981" opacity="0.15"/>
  <text x="106" y="320" text-anchor="middle" fill="#10b981" font-size="12">⬡</text>
  <text x="130" y="314" fill="#f0f4ff" font-size="11" font-weight="600">Server 1U</text>
  <text x="130" y="328" fill="#94a3b8" font-size="10" class="mono">SERVER · 200W</text>
  <rect x="250" y="308" width="22" height="16" rx="4" fill="#25304b"/>
  <text x="261" y="319" text-anchor="middle" fill="#94a3b8" font-size="9" class="mono">1U</text>
  <text x="284" y="320" fill="#94a3b8" font-size="12">⋮</text>

</svg>