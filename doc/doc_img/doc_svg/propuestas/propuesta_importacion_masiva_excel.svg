<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>

    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1e293b" opacity="0.6"/>
    </pattern>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="drop-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.1)"/>
      <stop offset="100%" stop-color="rgba(5, 150, 105, 0.02)"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="960" height="560" fill="url(#bg-grad)" rx="12"/>
  <rect width="960" height="560" fill="url(#grid-dots)" rx="12"/>
  <rect width="960" height="560" fill="none" stroke="#1e293b" stroke-width="1.5" rx="12"/>

  <!-- Cabecera -->
  <rect x="24" y="20" width="912" height="54" rx="8" fill="url(#header-grad)" stroke="#334155" stroke-width="1"/>
  <rect x="36" y="28" width="6" height="38" rx="3" fill="#10b981"/>
  <text x="52" y="44" fill="#f8fafc" font-size="16" font-weight="700">PROPUESTA 4: IMPORTACIÓN MASIVA DE EQUIPOS DESDE EXCEL / CSV</text>
  <text x="52" y="61" fill="#94a3b8" font-size="11.5">Aprovisionamiento veloz de cientos de dispositivos con validación atómica y resolución inteligente de colisiones</text>
  
  <rect x="790" y="32" width="134" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="857" y="50" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">📥 CARGA MASIVA</text>

  <!-- Flujo en 3 Pasos -->
  <!-- PASO 1: Drop Zone de Archivo -->
  <g transform="translate(30, 95)">
    <rect width="260" height="250" rx="8" fill="url(#drop-grad)" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="130" cy="65" r="28" fill="#10b981" opacity="0.15"/>
    <!-- Icono Excel / Archivo -->
    <rect x="116" y="50" width="28" height="30" rx="4" fill="#059669"/>
    <text x="130" y="70" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">X</text>

    <text x="130" y="115" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">1. Arrastra tu Plantilla</text>
    <text x="130" y="134" fill="#94a3b8" font-size="10.5" text-anchor="middle">Archivos .xlsx, .xls o .csv</text>
    
    <rect x="50" y="152" width="160" height="26" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="169" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">Descargar Plantilla Demo</text>

    <!-- Fila archivo cargado -->
    <g transform="translate(20, 195)">
      <rect width="220" height="38" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="20" fill="#10b981" font-size="10" font-weight="700">✓ inventario_sede_norte.xlsx</text>
      <text x="14" y="32" fill="#64748b" font-size="8.5" class="mono">48 filas detectadas · 14.2 KB</text>
    </g>
  </g>

  <!-- Flecha Conectora 1 -->
  <path d="M 305 220 L 325 220" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PASO 2: Mapeo y Previsualización -->
  <g transform="translate(330, 95)">
    <rect width="360" height="250" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="360" height="34" rx="8" fill="#1e293b"/>
    <text x="16" y="22" fill="#ffffff" font-size="12" font-weight="700">2. Mapeo Automático de Columnas</text>

    <!-- Tabla Mapeo -->
    <g transform="translate(14, 45)">
      <rect width="332" height="24" fill="#111827"/>
      <text x="10" y="16" fill="#94a3b8" font-size="9" font-weight="700">COLUMNA EXCEL</text>
      <text x="150" y="16" fill="#94a3b8" font-size="9" font-weight="700">CAMPO EN RACK DESIGNER</text>
      <text x="290" y="16" fill="#94a3b8" font-size="9" font-weight="700">ESTADO</text>

      <!-- Fila 1 -->
      <g transform="translate(0, 26)">
        <rect width="332" height="24" fill="#090d16" stroke="#1e293b" stroke-width="0.5"/>
        <text x="10" y="16" fill="#f8fafc" font-size="9.5" class="mono">Hostname</text>
        <text x="150" y="16" fill="#38bdf8" font-size="9.5" class="mono">device.name</text>
        <text x="295" y="16" fill="#10b981" font-size="9.5">✓ OK</text>
      </g>

      <!-- Fila 2 -->
      <g transform="translate(0, 52)">
        <rect width="332" height="24" fill="#090d16" stroke="#1e293b" stroke-width="0.5"/>
        <text x="10" y="16" fill="#f8fafc" font-size="9.5" class="mono">Rack_ID / Sala</text>
        <text x="150" y="16" fill="#38bdf8" font-size="9.5" class="mono">device.rackId</text>
        <text x="295" y="16" fill="#10b981" font-size="9.5">✓ OK</text>
      </g>

      <!-- Fila 3 -->
      <g transform="translate(0, 78)">
        <rect width="332" height="24" fill="#090d16" stroke="#1e293b" stroke-width="0.5"/>
        <text x="10" y="16" fill="#f8fafc" font-size="9.5" class="mono">Slot_Inicio</text>
        <text x="150" y="16" fill="#38bdf8" font-size="9.5" class="mono">device.slotStart</text>
        <text x="295" y="16" fill="#10b981" font-size="9.5">✓ OK</text>
      </g>

      <!-- Fila 4 -->
      <g transform="translate(0, 104)">
        <rect width="332" height="24" fill="#090d16" stroke="#1e293b" stroke-width="0.5"/>
        <text x="10" y="16" fill="#f8fafc" font-size="9.5" class="mono">IP_Address</text>
        <text x="150" y="16" fill="#38bdf8" font-size="9.5" class="mono">device.ip</text>
        <text x="295" y="16" fill="#10b981" font-size="9.5">✓ OK</text>
      </g>

      <!-- Fila 5 -->
      <g transform="translate(0, 130)">
        <rect width="332" height="24" fill="#090d16" stroke="#1e293b" stroke-width="0.5"/>
        <text x="10" y="16" fill="#f8fafc" font-size="9.5" class="mono">Consumo_Watts</text>
        <text x="150" y="16" fill="#38bdf8" font-size="9.5" class="mono">device.power</text>
        <text x="295" y="16" fill="#10b981" font-size="9.5">✓ OK</text>
      </g>
    </g>

    <text x="14" y="235" fill="#10b981" font-size="9.5" class="mono">✓ 100% de columnas requeridas mapeadas con éxito</text>
  </g>

  <!-- Flecha Conectora 2 -->
  <path d="M 700 220 L 715 220" stroke="#10b981" stroke-width="2"/>

  <!-- PASO 3: Validación y Resolución de Conflictos -->
  <g transform="translate(720, 95)">
    <rect width="210" height="250" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="34" rx="8" fill="#1e293b"/>
    <text x="12" y="22" fill="#ffffff" font-size="12" font-weight="700">3. Auditoría y Carga</text>

    <g transform="translate(12, 45)">
      <rect width="186" height="36" rx="4" fill="#064e3b" opacity="0.3"/>
      <text x="10" y="18" fill="#10b981" font-size="11" font-weight="700">46 Equipos Válidos</text>
      <text x="10" y="30" fill="#94a3b8" font-size="8.5">Sin colisiones ni errores</text>
    </g>

    <g transform="translate(12, 90)">
      <rect width="186" height="50" rx="4" fill="#7f1d1d" opacity="0.3" stroke="#ef4444" stroke-width="0.8"/>
      <text x="10" y="16" fill="#f87171" font-size="10" font-weight="700">⚠️ 2 Colisiones Detectadas</text>
      <text x="10" y="28" fill="#94a3b8" font-size="8">Slot U10 ya ocupado en Rack 102</text>
      <text x="10" y="42" fill="#f59e0b" font-size="8" font-weight="600">Acción: [Auto-buscar slot libre]</text>
    </g>

    <!-- Opciones de Conflicto -->
    <text x="12" y="158" fill="#94a3b8" font-size="8.5" font-weight="600">REGLA ANTE DUPLICADOS:</text>
    <rect x="12" y="166" width="186" height="22" rx="3" fill="#1e293b"/>
    <text x="20" y="180" fill="#f8fafc" font-size="8.5">Renombrar sufijo (-01) ▼</text>

    <!-- Botón Ejecutar -->
    <rect x="12" y="202" width="186" height="34" rx="6" fill="#059669" stroke="#10b981" stroke-width="1.2"/>
    <text x="105" y="223" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">⚡ Aprovisionar 48 Equipos</text>
  </g>

  <!-- Panel Inferior de Beneficios -->
  <g transform="translate(30, 365)">
    <rect x="0" y="0" width="280" height="160" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="30" fill="#ffffff" font-size="13" font-weight="700">⏱️ Reducción del 95% en Tiempo</text>
    <text x="20" y="55" fill="#94a3b8" font-size="10.5">
      Dar de alta 100 servidores manualmente toma horas. Con la importación masiva mediante SheetJS (<tspan class="mono" fill="#10b981">XLSX.read</tspan>), el centro de datos completo se genera en menos de 2 segundos.
    </text>

    <rect x="310" y="0" width="290" height="160" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="330" y="30" fill="#ffffff" font-size="13" font-weight="700">🛡️ Verificación Atómica de Slots</text>
    <text x="330" y="55" fill="#94a3b8" font-size="10.5">
      El motor valida las alturas (U), lados de montaje (Frontal/Trasera/Dual) y los límites del gabinete antes de inyectar datos al <tspan class="mono" fill="#38bdf8">store</tspan>, evitando corrupción de estados o solapamientos.
    </text>

    <rect x="630" y="0" width="270" height="160" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="650" y="30" fill="#ffffff" font-size="13" font-weight="700">🔌 Soporte 100% Offline</text>
    <text x="650" y="55" fill="#94a3b8" font-size="10.5">
      No requiere servicios en la nube ni conexión a internet. La lectura del archivo Excel/CSV se realiza íntegramente en el motor JavaScript local del navegador.
    </text>
  </g>
</svg>
