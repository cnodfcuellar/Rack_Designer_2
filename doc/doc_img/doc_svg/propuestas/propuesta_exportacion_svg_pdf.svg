<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>

    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1e293b" opacity="0.6"/>
    </pattern>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="blueprint-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#091b30"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="960" height="560" fill="url(#bg-grad)" rx="12"/>
  <rect width="960" height="560" fill="url(#grid-dots)" rx="12"/>
  <rect width="960" height="560" fill="none" stroke="#1e293b" stroke-width="1.5" rx="12"/>

  <!-- Cabecera -->
  <rect x="24" y="20" width="912" height="54" rx="8" fill="url(#header-grad)" stroke="#334155" stroke-width="1"/>
  <rect x="36" y="28" width="6" height="38" rx="3" fill="#38bdf8"/>
  <text x="52" y="44" fill="#f8fafc" font-size="16" font-weight="700">PROPUESTA 5: EXPORTACIÓN VECTORIAL PURA A SVG Y PDF (PLANOS TÉCNICOS 1:1)</text>
  <text x="52" y="61" fill="#94a3b8" font-size="11.5">Generación de planos ejecutivos infinitamente escalables para impresión industrial y reportes corporativos</text>
  
  <rect x="790" y="32" width="134" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="857" y="50" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">📐 VECTORIAL 1:1</text>

  <!-- Comparativa Visual: PNG vs SVG (Zoom 500%) -->
  <g transform="translate(40, 95)">
    <!-- Bloque PNG Raster -->
    <rect width="260" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="30" rx="8" fill="#1e293b"/>
    <text x="14" y="20" fill="#ef4444" font-size="11" font-weight="700">MAPA DE BITS (PNG / JPEG) · ZOOM 500%</text>

    <!-- Simulación de Pixelado -->
    <g transform="translate(20, 48)">
      <rect width="220" height="120" rx="4" fill="#141c2e" stroke="#334155"/>
      <!-- Letras pixeladas cuadradas -->
      <g fill="#94a3b8" opacity="0.8">
        <rect x="30" y="30" width="8" height="8"/><rect x="38" y="30" width="8" height="8"/><rect x="46" y="30" width="8" height="8"/>
        <rect x="30" y="38" width="8" height="8"/><rect x="30" y="46" width="8" height="8"/>
        <rect x="30" y="54" width="8" height="8"/><rect x="38" y="54" width="8" height="8"/><rect x="46" y="54" width="8" height="8"/>
        <rect x="46" y="62" width="8" height="8"/><rect x="46" y="70" width="8" height="8"/>
        <rect x="30" y="78" width="8" height="8"/><rect x="38" y="78" width="8" height="8"/><rect x="46" y="78" width="8" height="8"/>
      </g>
      <!-- Texto explicativo de pixelado -->
      <text x="120" y="55" fill="#f87171" font-size="12" font-weight="700">Pixelado borroso</text>
      <text x="120" y="72" fill="#64748b" font-size="9.5">Pérdida de nitidez al</text>
      <text x="120" y="86" fill="#64748b" font-size="9.5">hacer zoom o imprimir</text>
    </g>

    <text x="20" y="195" fill="#f87171" font-size="10" font-weight="600">❌ Texto no seleccionable</text>
    <text x="20" y="212" fill="#f87171" font-size="10" font-weight="600">❌ Inadecuado para plotters o planos A1/A0</text>
  </g>

  <!-- Bloque SVG / PDF Vectorial Puro -->
  <g transform="translate(330, 95)">
    <rect width="280" height="230" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="30" rx="8" fill="#0369a1"/>
    <text x="14" y="20" fill="#ffffff" font-size="11" font-weight="700">VECTOR PURA (SVG / PDF) · ZOOM 500%</text>

    <!-- Simulación de Nitidez Vectorial -->
    <g transform="translate(20, 48)">
      <rect width="240" height="120" rx="4" fill="#0c1d33" stroke="#0284c7"/>
      <!-- Curva matemática perfecta -->
      <path d="M 30 90 C 30 30, 90 30, 90 90" stroke="#38bdf8" stroke-width="3" fill="none"/>
      <circle cx="90" cy="90" r="4" fill="#10b981"/>
      
      <text x="110" y="55" fill="#38bdf8" font-size="13" font-weight="800">100% Nítido</text>
      <text x="110" y="72" fill="#94a3b8" font-size="9.5">Resolución matemática</text>
      <text x="110" y="86" fill="#94a3b8" font-size="9.5">infinita sin pérdida</text>
      <text x="110" y="100" fill="#10b981" font-size="9" class="mono">Scale: ∞x Vector</text>
    </g>

    <text x="20" y="195" fill="#10b981" font-size="10" font-weight="600">✓ Texto real buscable y seleccionable</text>
    <text x="20" y="212" fill="#10b981" font-size="10" font-weight="600">✓ Peso ligero (~80 KB vs 4 MB en PNG)</text>
  </g>

  <!-- Simulación del Plano Técnico PDF / Blueprint -->
  <g transform="translate(640, 95)">
    <rect width="280" height="230" rx="8" fill="url(#blueprint-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="28" rx="8" fill="#071b30"/>
    <text x="14" y="18" fill="#38bdf8" font-size="10.5" font-weight="700">PLANO DE INGENIERÍA · FORMATO A3/A4</text>

    <!-- Cuadro de Rotulación Técnica -->
    <g transform="translate(16, 40)">
      <rect width="248" height="110" fill="#051426" stroke="#0284c7" stroke-width="1"/>
      
      <!-- Mini racks en plano -->
      <rect x="20" y="15" width="40" height="80" fill="#08203d" stroke="#38bdf8" stroke-width="1"/>
      <rect x="25" y="22" width="30" height="6" fill="#0284c7"/>
      <rect x="25" y="32" width="30" height="12" fill="#0284c7"/>
      <text x="40" y="85" fill="#ffffff" font-size="6" text-anchor="middle">RACK 101</text>

      <rect x="75" y="15" width="40" height="80" fill="#08203d" stroke="#38bdf8" stroke-width="1"/>
      <rect x="80" y="22" width="30" height="18" fill="#0284c7"/>
      <text x="95" y="85" fill="#ffffff" font-size="6" text-anchor="middle">RACK 102</text>

      <!-- Cableado vectorial en plano -->
      <path d="M 55 25 C 65 10, 70 10, 80 25" stroke="#f59e0b" stroke-width="1.2" fill="none"/>

      <!-- Cajetín Técnico Oficial (Title Block) -->
      <rect x="130" y="15" width="108" height="80" fill="#091b30" stroke="#0284c7"/>
      <text x="136" y="28" fill="#ffffff" font-size="7" font-weight="700">DATA CENTER PRINCIPAL</text>
      <text x="136" y="40" fill="#94a3b8" font-size="6">Escala: 1:1 Oficial</text>
      <text x="136" y="52" fill="#94a3b8" font-size="6">Revisión: Rev 3.2</text>
      <text x="136" y="64" fill="#94a3b8" font-size="6">Fecha: 2026-09-23</text>
      <text x="136" y="78" fill="#10b981" font-size="6.5" font-weight="700">✓ APROBADO</text>
    </g>

    <!-- Botones de Descarga Directa -->
    <g transform="translate(16, 160)">
      <rect x="0" y="0" width="118" height="26" rx="4" fill="#0284c7"/>
      <text x="59" y="17" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Descargar .SVG</text>

      <rect x="130" y="0" width="118" height="26" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
      <text x="189" y="17" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Imprimir .PDF</text>
    </g>

    <text x="140" y="210" fill="#94a3b8" font-size="9" text-anchor="middle">Compatible con AutoCAD, Illustrator e Inkscape</text>
  </g>

  <!-- Panel Inferior: Casos de Uso Industriales -->
  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="880" height="170" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="30" fill="#ffffff" font-size="13" font-weight="700">Ventajas de la Exportación Vectorial SVG &amp; PDF en Datacenters Reales:</text>

    <!-- Columna 1 -->
    <g transform="translate(24, 48)">
      <text x="0" y="16" fill="#38bdf8" font-size="11" font-weight="700">1. Fidelidad Vectorial Absoluta (0% Blur)</text>
      <text x="0" y="34" fill="#94a3b8" font-size="9.5">
        Los textos de las etiquetas, números de serie y trazos de cableado no se rasterizan; se exportan como nodos y curvas Bézier puras.
      </text>
      <text x="0" y="65" fill="#38bdf8" font-size="11" font-weight="700">2. Respeto al Tema Activo (Claro / Oscuro)</text>
      <text x="0" y="83" fill="#94a3b8" font-size="9.5">
        Permite exportar planos con fondo blanco para impresoras de tinta o con fondo oscuro de ingeniería para dashboards ejecutivos.
      </text>
    </g>

    <!-- Columna 2 -->
    <g transform="translate(460, 48)">
      <text x="0" y="16" fill="#10b981" font-size="11" font-weight="700">3. Cajetín Técnico y Metadatos Profesionales</text>
      <text x="0" y="34" fill="#94a3b8" font-size="9.5">
        El PDF incluye el encabezado estándar de planos de ingeniería: nombre de sala, potencia kW total, autor, fecha y leyenda de cables.
      </text>
      <text x="0" y="65" fill="#10b981" font-size="11" font-weight="700">4. Edición Abierta en Herramientas CAD</text>
      <text x="0" y="83" fill="#94a3b8" font-size="9.5">
        El archivo `.svg` generado puede importarse directamente en AutoCAD, Microsoft Visio, Inkscape o Adobe Illustrator sin pérdida de datos.
      </text>
    </g>
  </g>
</svg>
