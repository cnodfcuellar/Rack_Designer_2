<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Outfit', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <filter id="shadowPanel" x="-2%" y="-5%" width="104%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1100" height="370" fill="#0b0f19" rx="8"/>
  <text x="550" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">Bottom Panel Layout — #bottom (220px height, 5 pestañas modulares, selector de columnas, importación masiva e inversión de cables)</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- CONTENEDOR DEL PANEL INFERIOR -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="10" y="32" width="1080" height="295" fill="#151c2e" stroke="#25304b" stroke-width="1" rx="6" filter="url(#shadowPanel)"/>

  <!-- A. BARRA SUPERIOR (.bottom-header, 38px) -->
  <rect x="10" y="32" width="1080" height="38" rx="6" fill="#0f172a"/>
  <rect x="10" y="60" width="1080" height="10" fill="#0f172a"/>
  <line x1="10" y1="70" x2="1090" y2="70" stroke="#25304b" stroke-width="1"/>

  <!-- Pestañas Modulares (.tab-pills) -->
  <g transform="translate(20, 39)">
    <!-- Tab 1: Inventario (Activa) -->
    <rect width="90" height="24" rx="5" fill="#0ea5e9" fill-opacity="0.18" stroke="#0ea5e9" stroke-width="1"/>
    <text x="12" y="16" fill="#38bdf8" font-size="11" font-weight="600">📦 Inventario</text>

    <!-- Tab 2: Conexiones -->
    <rect x="96" width="94" height="24" rx="5" fill="transparent" stroke="#25304b" stroke-width="0.8"/>
    <text x="106" y="16" fill="#8b9ab8" font-size="11" font-weight="500">🔌 Conexiones</text>
  </g>

  <!-- Boton Contextual + Equipo -->
  <g transform="translate(225, 39)">
    <rect width="78" height="24" rx="5" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="0.8"/>
    <text x="39" y="16" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="600">+ Equipo</text>
  </g>

  <!-- Filtro Rapido #table-search -->
  <g transform="translate(460, 39)">
    <rect width="140" height="24" rx="5" fill="#1a2235" stroke="#25304b" stroke-width="0.8"/>
    <text x="10" y="16" fill="#475569" font-size="9.5" class="mono">🔍 Filtrar tabla…</text>
  </g>

  <!-- Selector de Columnas Visibles #btn-columns-menu (Propuesta 3) -->
  <g transform="translate(608, 39)">
    <rect width="112" height="24" rx="5" fill="#1a2235" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="10" y="16" fill="#f0f6ff" font-size="10.5" font-weight="500">⚙ Columnas</text>
    <rect x="75" y="4" width="18" height="15" rx="3" fill="#0ea5e9" fill-opacity="0.3"/>
    <text x="84" y="15" text-anchor="middle" fill="#38bdf8" font-size="9" class="mono" font-weight="700">12</text>
    <text x="102" y="16" fill="#64748b" font-size="8">▼</text>
  </g>

  <!-- Boton de Importacion Masiva #btn-table-import-modal (M-21/M-22) -->
  <g transform="translate(728, 39)">
    <rect width="90" height="24" rx="5" fill="#1a2235" stroke="#22c55e" stroke-width="0.8"/>
    <text x="45" y="16" text-anchor="middle" fill="#4ade80" font-size="10.5" font-weight="600">⬆ Importar</text>
  </g>

  <!-- Menu de Exportacion #btn-export-menu (CSV/Excel/Plantillas) -->
  <g transform="translate(826, 39)">
    <rect width="94" height="24" rx="5" fill="#1a2235" stroke="#25304b" stroke-width="0.8"/>
    <text x="47" y="16" text-anchor="middle" fill="#8b9ab8" font-size="10.5">⬇ Exportar ▼</text>
  </g>

  <!-- Expandir / Contraer -->
  <g transform="translate(930, 39)">
    <rect width="66" height="24" rx="5" fill="#1a2235" stroke="#25304b" stroke-width="0.8"/>
    <text x="33" y="16" text-anchor="middle" fill="#8b9ab8" font-size="10">Expandir</text>
  </g>
  <g transform="translate(1004, 39)">
    <rect width="24" height="24" rx="5" fill="#1a2235" stroke="#25304b" stroke-width="0.8"/>
    <text x="12" y="16" text-anchor="middle" fill="#64748b" font-size="10">▼</text>
  </g>

  <!-- B. CABECERA DE TABLA DE DATOS (Sticky Thead) -->
  <rect x="10" y="70" width="1080" height="26" fill="#0b0f19"/>
  <line x1="10" y1="96" x2="1090" y2="96" stroke="#25304b" stroke-width="0.8"/>

  <!-- Columnas Cabecera -->
  <g font-size="9.5" font-weight="700" fill="#94a3b8" class="mono">
    <text x="24" y="87">RACK / U</text>
    <text x="120" y="87">EQUIPO / NOMBRE</text>
    <text x="270" y="87">TIPO</text>
    <text x="350" y="87">IP</text>
    <text x="480" y="87">VLAN</text>
    <text x="600" y="87">CANALETA (M-41)</text>
    <text x="730" y="87">DESTINO / PUERTO</text>
    <text x="890" y="87">CONSUMO</text>
    <text x="980" y="87">ACCIONES (SWAP ⇄)</text>
  </g>

  <!-- ═══════════════════════════════════════ -->
  <!-- FILAS DE DATOS EN LA TABLA -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Fila 1: Servidor Rackeado -->
  <rect x="10" y="96" width="1080" height="30" fill="#0f172a"/>
  <line x1="10" y1="126" x2="1090" y2="126" stroke="#25304b" stroke-width="0.5"/>
  <text x="24" y="115" fill="#38bdf8" font-size="10" class="mono" font-weight="600">Rack-01 / U02</text>
  <text x="120" y="115" fill="#f0f6ff" font-size="10.5" font-weight="600">SRV-PROD-01</text>
  <!-- Badge Tipo -->
  <rect x="270" y="102" width="50" height="18" rx="3" fill="#0ea5e9" fill-opacity="0.15"/>
  <text x="295" y="115" text-anchor="middle" fill="#38bdf8" font-size="9" class="mono" font-weight="700">server</text>
  <text x="350" y="115" fill="#94a3b8" font-size="10" class="mono">192.168.10.15</text>
  <!-- VLAN -->
  <rect x="480" y="103" width="94" height="16" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.6"/>
  <text x="527" y="115" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="600">VLAN 10 · SRV</text>
  <!-- Canaleta Techo (M-41) -->
  <g transform="translate(600, 102)">
    <rect width="82" height="18" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="0.6"/>
    <text x="41" y="13" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600">⬆️ Techo</text>
  </g>
  <text x="730" y="115" fill="#f0f6ff" font-size="10" class="mono">SW-CORE-01 [P01]</text>
  <text x="890" y="115" fill="#94a3b8" font-size="10" class="mono">450 W</text>
  <!-- Acciones: Swap ⇄ + Edit + Trash -->
  <g transform="translate(980, 101)">
    <rect width="22" height="20" rx="4" fill="#1a2235" stroke="#38bdf8" stroke-width="0.6"/>
    <text x="11" y="14" text-anchor="middle" fill="#38bdf8" font-size="10">⇄</text>
    <rect x="26" width="22" height="20" rx="4" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
    <text x="37" y="14" text-anchor="middle" fill="#94a3b8" font-size="9">✎</text>
    <rect x="52" width="22" height="20" rx="4" fill="#1a2235" stroke="#ef4444" stroke-width="0.6"/>
    <text x="63" y="14" text-anchor="middle" fill="#f87171" font-size="9">🗑</text>
  </g>

  <!-- Fila 2: Switch Troncal con Canaleta Piso -->
  <rect x="10" y="126" width="1080" height="30" fill="#151c2e"/>
  <line x1="10" y1="156" x2="1090" y2="156" stroke="#25304b" stroke-width="0.5"/>
  <text x="24" y="145" fill="#38bdf8" font-size="10" class="mono" font-weight="600">Rack-01 / U24</text>
  <text x="120" y="145" fill="#f0f6ff" font-size="10.5" font-weight="600">SW-ACCESS-02</text>
  <rect x="270" y="132" width="48" height="18" rx="3" fill="#10b981" fill-opacity="0.15"/>
  <text x="294" y="145" text-anchor="middle" fill="#34d399" font-size="9" class="mono" font-weight="700">switch</text>
  <text x="350" y="145" fill="#94a3b8" font-size="10" class="mono">192.168.1.2</text>
  <rect x="480" y="133" width="94" height="16" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.6"/>
  <text x="527" y="145" text-anchor="middle" fill="#34d399" font-size="9" font-weight="600">VLAN 20 · MGT</text>
  <!-- Canaleta Piso (M-41) -->
  <g transform="translate(600, 132)">
    <rect width="82" height="18" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="0.6"/>
    <text x="41" y="13" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">⬇️ Piso</text>
  </g>
  <text x="730" y="145" fill="#f0f6ff" font-size="10" class="mono">RTR-BORDER [G0/1]</text>
  <text x="890" y="145" fill="#94a3b8" font-size="10" class="mono">120 W</text>
  <g transform="translate(980, 131)">
    <rect width="22" height="20" rx="4" fill="#1a2235" stroke="#38bdf8" stroke-width="0.6"/>
    <text x="11" y="14" text-anchor="middle" fill="#38bdf8" font-size="10">⇄</text>
    <rect x="26" width="22" height="20" rx="4" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
    <text x="37" y="14" text-anchor="middle" fill="#94a3b8" font-size="9">✎</text>
    <rect x="52" width="22" height="20" rx="4" fill="#1a2235" stroke="#ef4444" stroke-width="0.6"/>
    <text x="63" y="14" text-anchor="middle" fill="#f87171" font-size="9">🗑</text>
  </g>

  <!-- Fila 3: Router de Borde -->
  <rect x="10" y="156" width="1080" height="30" fill="#0f172a"/>
  <line x1="10" y1="186" x2="1090" y2="186" stroke="#25304b" stroke-width="0.5"/>
  <text x="24" y="175" fill="#38bdf8" font-size="10" class="mono" font-weight="600">Rack-02 / U40</text>
  <text x="120" y="175" fill="#f0f6ff" font-size="10.5" font-weight="600">RTR-BORDER-01</text>
  <rect x="270" y="162" width="48" height="18" rx="3" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="294" y="175" text-anchor="middle" fill="#fbbf24" font-size="9" class="mono" font-weight="700">router</text>
  <text x="350" y="175" fill="#94a3b8" font-size="10" class="mono">200.10.45.1</text>
  <rect x="480" y="163" width="94" height="16" rx="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="0.6"/>
  <text x="527" y="175" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">VLAN 99 · WAN</text>
  <g transform="translate(600, 162)">
    <rect width="82" height="18" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="0.6"/>
    <text x="41" y="13" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600">⬆️ Techo</text>
  </g>
  <text x="730" y="175" fill="#f0f6ff" font-size="10" class="mono">ISP-OPTICAL [SFP1]</text>
  <text x="890" y="175" fill="#94a3b8" font-size="10" class="mono">95 W</text>
  <g transform="translate(980, 161)">
    <rect width="22" height="20" rx="4" fill="#1a2235" stroke="#38bdf8" stroke-width="0.6"/>
    <text x="11" y="14" text-anchor="middle" fill="#38bdf8" font-size="10">⇄</text>
    <rect x="26" width="22" height="20" rx="4" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
    <text x="37" y="14" text-anchor="middle" fill="#94a3b8" font-size="9">✎</text>
    <rect x="52" width="22" height="20" rx="4" fill="#1a2235" stroke="#ef4444" stroke-width="0.6"/>
    <text x="63" y="14" text-anchor="middle" fill="#f87171" font-size="9">🗑</text>
  </g>

  <!-- Fila 4: Equipo de Piso (Category floor M-39) -->
  <rect x="10" y="186" width="1080" height="30" fill="#151c2e"/>
  <line x1="10" y1="216" x2="1090" y2="216" stroke="#25304b" stroke-width="0.5"/>
  <text x="24" y="205" fill="#f59e0b" font-size="10" class="mono" font-weight="600">Piso / Sala A</text>
  <text x="120" y="205" fill="#f0f6ff" font-size="10.5" font-weight="600">CONSOLE-PC-01</text>
  <rect x="270" y="192" width="40" height="18" rx="3" fill="#64748b" fill-opacity="0.2"/>
  <text x="290" y="205" text-anchor="middle" fill="#94a3b8" font-size="9" class="mono" font-weight="700">floor</text>
  <text x="350" y="205" fill="#94a3b8" font-size="10" class="mono">192.168.10.88</text>
  <rect x="480" y="193" width="94" height="16" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.6"/>
  <text x="527" y="205" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="600">VLAN 10 · SRV</text>
  <g transform="translate(600, 192)">
    <rect width="82" height="18" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="0.6"/>
    <text x="41" y="13" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">⬇️ Piso</text>
  </g>
  <text x="730" y="205" fill="#f0f6ff" font-size="10" class="mono">SW-ACCESS-02 [P12]</text>
  <text x="890" y="205" fill="#94a3b8" font-size="10" class="mono">250 W</text>
  <g transform="translate(980, 191)">
    <rect width="22" height="20" rx="4" fill="#1a2235" stroke="#38bdf8" stroke-width="0.6"/>
    <text x="11" y="14" text-anchor="middle" fill="#38bdf8" font-size="10">⇄</text>
    <rect x="26" width="22" height="20" rx="4" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
    <text x="37" y="14" text-anchor="middle" fill="#94a3b8" font-size="9">✎</text>
    <rect x="52" width="22" height="20" rx="4" fill="#1a2235" stroke="#ef4444" stroke-width="0.6"/>
    <text x="63" y="14" text-anchor="middle" fill="#f87171" font-size="9">🗑</text>
  </g>

  <!-- POPOVER ILUSTRATIVO DE SELECTOR DE COLUMNAS (Desplegado a la derecha) -->
  <g transform="translate(660, 72)" filter="url(#shadowPanel)">
    <rect width="250" height="175" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <!-- Cabecera del Popover -->
    <rect width="250" height="26" rx="6" fill="#151c2e"/>
    <text x="10" y="17" fill="#f0f6ff" font-size="10" font-weight="700">Columnas Visibles (Inventario)</text>
    <text x="236" y="17" fill="#64748b" font-size="11" cursor="pointer">✕</text>
    <!-- Checks ilustrativos -->
    <g transform="translate(12, 36)" font-size="9.5" fill="#94a3b8">
      <text x="0" y="10">☑ Rack / U</text>
      <text x="120" y="10">☑ Nombre *</text>
      <text x="0" y="26">☑ Tipo</text>
      <text x="120" y="26">☑ IP / MAC</text>
      <text x="0" y="42">☑ Marca/Modelo</text>
      <text x="120" y="42">☑ VLAN</text>
      <text x="0" y="58">☑ Canaleta (M-41)</text>
      <text x="120" y="58">☑ Consumo (W)</text>
      <text x="0" y="74">☑ Tomas In/Out</text>
      <text x="120" y="74">☐ Contraseña</text>
      <text x="0" y="90">☐ Nro Serie</text>
      <text x="120" y="90">☑ Acciones *</text>
    </g>
    <!-- Botones de accion -->
    <line x1="0" y1="145" x2="250" y2="145" stroke="#25304b" stroke-width="0.8"/>
    <rect x="10" y="151" width="105" height="18" rx="3" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
    <text x="62" y="163" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="600">Mostrar Todo</text>
    <rect x="135" y="151" width="105" height="18" rx="3" fill="#1a2235" stroke="#25304b" stroke-width="0.6"/>
    <text x="187" y="163" text-anchor="middle" fill="#94a3b8" font-size="8.5">Por Defecto</text>
  </g>

  <!-- ═══════════════════════════════════════ -->
  <!-- ANOTACIONES Y VARIABLES -->
  <!-- ═══════════════════════════════════════ -->
  <line x1="1092" y1="32" x2="1092" y2="327" stroke="#475569" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="1084" y="180" fill="#475569" font-size="8.5" class="mono" text-anchor="end" transform="rotate(90 1084 180)">220px (var(--bottom-h))</text>

  <rect x="10" y="338" width="1080" height="22" rx="4" fill="#1e293b" opacity="0.6"/>
  <text x="20" y="353" fill="#94a3b8" font-size="8.5" font-weight="700">CARACTERÍSTICAS:</text>
  <text x="110" y="353" fill="#64748b" font-size="8.5" class="mono">--bottom-h: 220px (38px colapsado)</text>
  <text x="310" y="353" fill="#64748b" font-size="8.5" class="mono">M-41: Alternancia de canaleta ⬆️ Techo / ⬇️ Piso y Swap de cables ⇄</text>
  <text x="750" y="353" fill="#64748b" font-size="8.5" class="mono">M-21/M-22: Importación y Exportación XLSX/CSV</text>

</svg>