  <text x="130" y="202" font-family="'Segoe UI', monospace" font-size="11" fill="#64748b">├──</text>
  <text x="170" y="202" font-family="'Segoe UI', monospace" font-size="11" fill="#e2e8f0">📄 service-worker.js</text>
