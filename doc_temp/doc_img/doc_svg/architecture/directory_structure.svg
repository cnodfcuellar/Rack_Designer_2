  <text x="170" y="664" font-family="'Segoe UI', monospace" font-size="11" fill="#60a5fa" font-weight="700">📁 doc/</text>
  <text x="380" y="664" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">Project documentation</text>
