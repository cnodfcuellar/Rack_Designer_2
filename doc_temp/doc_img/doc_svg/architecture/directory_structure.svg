  <text x="60" y="49" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" letter-spacing="3" font-weight="600">RACK DESIGNER NEXT  ·  PROJECT STRUCTURE</text>
  <text x="60" y="68" font-family="'Segoe UI', sans-serif" font-size="20" fill="#f0f6ff" font-weight="700">DIRECTORY STRUCTURE  ·  FULL PROJECT MAP</text>

