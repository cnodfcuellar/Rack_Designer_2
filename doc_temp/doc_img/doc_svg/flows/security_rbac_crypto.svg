<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a"/>
      <stop offset="100%" style="stop-color:#0a1520"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/></filter>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1100" height="820" fill="url(#bg)"/>
  <rect width="1100" height="820" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="40" y="28" width="500" height="52" rx="6" fill="#0d1f30" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.7"/>
  <line x1="40" y1="28" x2="40" y2="80" stroke="#ef4444" stroke-width="3"/>
  <text x="60" y="49" font-family="'Segoe UI', sans-serif" font-size="9" fill="#ef4444" letter-spacing="3" font-weight="600">RACK DESIGNER 2  ·  SECURITY CRYPTOGRAPHY</text>
  <text x="60" y="68" font-family="'Segoe UI', sans-serif" font-size="20" fill="#f0f6ff" font-weight="700">SHA-256  ·  WEB CRYPTO API  ·  ANTI-TAMPER</text>

  <!-- Left: Login flow -->
  <rect x="60" y="110" width="460" height="590" rx="14" fill="#0a0608" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="110" width="460" height="7" rx="4" fill="#ef4444"/>
  <text x="290" y="136" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5" font-weight="700" letter-spacing="2">AUTHENTICATION FLOW</text>

  <!-- Login modal sim -->
  <rect x="100" y="150" width="380" height="160" rx="8" fill="#0d0810" stroke="#4a1520" stroke-width="1"/>
  <rect x="100" y="150" width="380" height="28" rx="8" fill="#1a0a18" stroke="none"/>
  <text x="290" y="169" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5">🔐 Administrator Login</text>
  <rect x="120" y="190" width="340" height="30" rx="4" fill="#0d0810" stroke="#4a1520" stroke-width="1"/>
  <text x="140" y="210" font-family="'Segoe UI', sans-serif" font-size="12" fill="#334155">● ● ● ● ● ● ●</text>
  <text x="430" y="210" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">PIN input</text>
  <rect x="120" y="234" width="340" height="30" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="290" y="254" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#fca5a5" font-weight="600">Login →</text>
  <text x="290" y="296" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">pin = document.querySelector('#pin').value</text>

  <!-- Arrow: submit -->
  <line x1="290" y1="314" x2="290" y2="348" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- SHA-256 block -->
  <rect x="100" y="352" width="380" height="100" rx="8" fill="#1a0508" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="100" y="352" width="380" height="5" rx="3" fill="#ef4444" fill-opacity="0.6"/>
  <text x="290" y="375" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fca5a5" font-weight="700" letter-spacing="2">WEB CRYPTO API  ·  SHA-256</text>
  <text x="120" y="398" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">const encoder = new TextEncoder()</text>
  <text x="120" y="416" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">const data = encoder.encode(pin)</text>
  <text x="120" y="434" font-family="'Segoe UI', monospace" font-size="10" fill="#e2e8f0">const hash = await crypto.subtle.digest('SHA-256', data)</text>

  <!-- Arrow: compare -->
  <line x1="290" y1="454" x2="290" y2="488" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- Compare block -->
  <rect x="100" y="492" width="380" height="80" rx="8" fill="#0d0810" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="290" y="516" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c4b5fd" font-weight="700" letter-spacing="2">HASH COMPARISON</text>
  <text x="290" y="538" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">computedHash === storedHash</text>
  <text x="290" y="558" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">No plain text ever stored or transmitted</text>

  <!-- Result branch -->
  <line x1="230" y1="572" x2="160" y2="616" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="350" y1="572" x2="420" y2="616" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="290" cy="572" r="5" fill="#94a3b8"/>

  <rect x="100" y="620" width="160" height="54" rx="8" fill="#051510" stroke="#4ade80" stroke-width="1.5"/>
  <text x="180" y="644" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4ade80" font-weight="700">✓ GRANTED</text>
  <text x="180" y="662" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#94a3b8">Inject RAM token</text>

  <rect x="380" y="620" width="140" height="54" rx="8" fill="#150505" stroke="#ef4444" stroke-width="1.5"/>
  <text x="450" y="644" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f87171" font-weight="700">✗ DENIED</text>
  <text x="450" y="662" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="9" fill="#94a3b8">Increment fail count</text>

  <!-- Right: Anti-tamper -->
  <rect x="580" y="110" width="480" height="590" rx="14" fill="#060a0a" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="580" y="110" width="480" height="7" rx="4" fill="#00d4ff"/>
  <text x="820" y="136" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#7dd3fc" font-weight="700" letter-spacing="2">ANTI-TAMPERING  ·  INTEGRITY SYSTEM</text>

  <!-- RAM token lifecycle -->
  <rect x="620" y="152" width="400" height="90" rx="8" fill="#0d1a2a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="820" y="176" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7dd3fc" font-weight="700" letter-spacing="1">STEP 1  ·  TOKEN GENERATION</text>
  <text x="820" y="198" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#e2e8f0">const _integrityToken = crypto.randomUUID()</text>
  <text x="820" y="218" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Stored ONLY in JavaScript closure (RAM)</text>
  <text x="820" y="234" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">NEVER written to localStorage or DOM</text>

  <!-- Token diagram -->
  <rect x="620" y="258" width="400" height="120" rx="8" fill="#0d1a2a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="820" y="282" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7dd3fc" font-weight="700" letter-spacing="1">STEP 2  ·  TOKEN GUARDING</text>
  <text x="820" y="304" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#e2e8f0">On protected action → RackAuth.can("edit")</text>
  <text x="820" y="324" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Compares sessionStorage role to RAM token</text>
  <text x="820" y="344" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Any deviation → forces immediate logout</text>
  <text x="820" y="362" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Clears session + shows login modal</text>

  <!-- Attack scenario -->
  <rect x="620" y="396" width="400" height="160" rx="8" fill="#150508" stroke="#ef4444" stroke-width="1"/>
  <text x="820" y="420" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fca5a5" font-weight="700" letter-spacing="1">⚠ ATTACK SCENARIO  ·  BLOCKED</text>

  <rect x="640" y="432" width="360" height="30" rx="4" fill="#1a0508" stroke="#4a1520" stroke-width="0.8"/>
  <text x="820" y="452" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Attacker edits sessionStorage via DevTools</text>

  <rect x="640" y="468" width="360" height="30" rx="4" fill="#1a0508" stroke="#4a1520" stroke-width="0.8"/>
  <text x="820" y="488" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Sets: { role: "admin" } manually</text>

  <rect x="640" y="504" width="360" height="36" rx="4" fill="#051510" stroke="#4ade80" stroke-width="1"/>
  <text x="820" y="524" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#4ade80">System detects token mismatch → logout()</text>

  <!-- Password censoring -->
  <rect x="620" y="572" width="400" height="100" rx="8" fill="#0d1a2a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="820" y="596" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7dd3fc" font-weight="700" letter-spacing="1">VISUAL  ·  PASSWORD CENSORING (GOD MODE)</text>
  <text x="820" y="618" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Admin only → window.SHOW_PASSWORDS = true</text>
  <text x="820" y="638" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#94a3b8">Viewer/Editor → always renders ••••••••</text>
  <text x="820" y="658" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="10" fill="#64748b">Applied in: Tooltips, Tables, Modals, HUD</text>

  <!-- Footer -->
  <line x1="40" y1="786" x2="1060" y2="786" stroke="#fff" stroke-width="0.3" stroke-opacity="0.1"/>
  <text x="48" y="802" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">RACK Designer 2  ·  Security &amp; Crypto Architecture</text>
  <text x="1052" y="802" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569">doc_img/doc_svg/security_rbac_crypto.svg</text>
</svg>
